  /* Layout idea: single centered phone column, one screen at a time, cards elevated on a moonlit charcoal field. */
  :root {

  .flip-scene { perspective: 1200px; border-radius: 20px; transition: transform 0.3s ease-out, box-shadow 0.3s ease-out; }

  .flip-card {

  .flip-card.is-flipped { transform: rotateY(180deg); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 20px;
    overflow: hidden;
  }
  .face-front { transform: rotateY(180deg); }
  .pcard { container-type: size; }
  .atmos-drift { animation: atmos-drift 20s ease-in-out infinite; transform-origin: 50% 40%; will-change: transform; }

  .blood-moon-glow { transform: translate(-50%, -50%); border-radius: 50%; mix-blend-mode: screen; background: radial-gradient(circle, rgba(239,68,68,0.55) 0%, rgba(220,38,38,0.28) 32%, rgba(220,38,38,0) 66%); animation: moon-pulse 6s ease-in-out infinite; }

  .mist { position: absolute; left: 0; width: 200%; background-repeat: repeat-x; background-size: 50% 100%; will-change: transform; }
  .mist-a { bottom: 20%; height: 26%; animation: mist-drift 70s linear infinite;
    background-image: radial-gradient(ellipse 24% 55% at 25% 55%, rgba(210,218,235,0.15), transparent 70%), radial-gradient(ellipse 22% 45% at 62% 45%, rgba(210,218,235,0.12), transparent 70%), radial-gradient(ellipse 16% 50% at 86% 60%, rgba(210,218,235,0.1), transparent 70%); }
  .mist-b { bottom: 6%; height: 22%; animation: mist-drift 46s linear infinite reverse;
    background-image: radial-gradient(ellipse 26% 50% at 30% 55%, rgba(200,208,228,0.13), transparent 70%), radial-gradient(ellipse 18% 55% at 70% 50%, rgba(200,208,228,0.11), transparent 70%); }
  @keyframes mist-drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .leaf { animation: leaf-fall linear infinite; will-change: transform, opacity; }
  .leaf-shape { border-radius: 0 100% 0 100%; animation: leaf-sway ease-in-out infinite alternate; }
  @keyframes leaf-fall { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 0.85; } 92% { opacity: 0.85; } 100% { transform: translate(var(--dx), 108vh); opacity: 0; } }

/* ------------------------------------------------------------------ */
/* Custom card art: full pre-designed card images. A role shows its    */
/* uploaded image (localStorage), else ROLES_DATA[id].imageUrl, else   */
/* the built-in SVG card.                                              */
/* ------------------------------------------------------------------ */
/* Decoded-image cache: keeps decoded images referenced so mobile browsers don't drop them. */
const imageCache = new Map();
function preloadImage(src) {
  const hit = imageCache.get(src);
  if (hit) return Promise.resolve(hit);
  return new Promise((resolve) => {
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
    const done = () => {
      if (img.naturalWidth > 0) imageCache.set(src, img);
      resolve(img);
    };
    if (typeof img.decode === 'function') img.decode().then(done, done);
    else { img.onload = done; img.onerror = done; }
  });
}

const ART_KEY = 'nightfall.cardart.v1';
let customArt = (() => {
  try { const v = JSON.parse(localStorage.getItem(ART_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; }
  catch (e) { return {}; }
})();
const artListeners = new Set();
const subscribeArt = (fn) => { artListeners.add(fn); return () => artListeners.delete(fn); };
const getArt = () => customArt;
function setCustomArt(id, dataUrl) {
  const next = { ...customArt };
  const old = customArt[id];
  if (old && old !== dataUrl) imageCache.delete(old);
  if (dataUrl) { next[id] = dataUrl; preloadImage(dataUrl); } else delete next[id];
  customArt = next;
  artListeners.forEach((fn) => fn());
  try { localStorage.setItem(ART_KEY, JSON.stringify(next)); return true; } catch (e) { return false; }
}
function useCustomArt() { return React.useSyncExternalStore(subscribeArt, getArt); }
function useCardImage(role) {
  const art = useCustomArt();
  return art[role] || ROLES_DATA[role].imageUrl || '';
}
// Downscale to max 600px wide (and 900px tall), WebP where the browser can encode it, else JPEG.
function processImage(file, maxW = 600, maxH = 900) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        const w = Math.max(1, Math.round(img.naturalWidth * k));
        const h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let out = c.toDataURL('image/webp', 0.85);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', 0.85);
        resolve(out);
      } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
    img.src = url;
  });
}

/* ------------------------------------------------------------------ */
/* Pure helpers                                                        */
/* ------------------------------------------------------------------ */
function emptyDeck() {
  return Object.fromEntries(ROLE_IDS.map((id) => [id, 0]));
}
function deckTotal(deck) {
  return ROLE_IDS.reduce((n, id) => n + (deck[id] || 0), 0);
}
// Balanced preset. Every role has a `balance` value (Werewolf -6 each, Village roles positive).
// Aims for a deck total inside -1..+3, closest to +1. Uses 1 Werewolf whenever that can land in the
// window, and 2 only when it cannot. Ties prefer more special roles.
const BALANCE_MIN = -1, BALANCE_MAX = 3, BALANCE_TARGET = 1;
const FILL_PRIORITY = ['seer', 'witch', 'bodyguard', 'hunter', 'spellcaster', 'villager'];
function deckBalance(deck) {
  return ROLE_IDS.reduce((n, id) => n + (deck[id] || 0) * (ROLES_DATA[id].balance || 0), 0);
}
function bestVillageFill(count, wolves) {
  const wolfScore = wolves * ROLES_DATA.werewolf.balance;
  const need = count - wolves;
  const pool = FILL_PRIORITY.filter((id) => ROLES_DATA[id] && ROLES_DATA[id].team === 'village');
  let best = null;
  const counts = {};
  const consider = () => {
    let score = wolfScore, fun = 0;
    pool.forEach((id, i) => { const n = counts[id] || 0; score += n * ROLES_DATA[id].balance; fun += n * (pool.length - i); });
    const dist = score < BALANCE_MIN ? BALANCE_MIN - score : score > BALANCE_MAX ? score - BALANCE_MAX : 0;
    const off = Math.abs(score - BALANCE_TARGET);
    if (!best || dist < best.dist || (dist === best.dist && (off < best.off || (off === best.off && fun > best.fun)))) {
      best = { dist, fun, off, score, wolves, counts: { ...counts } };
    }
  };
  const walk = (i, left) => {
    if (left === 0) { consider(); return; }
    if (i >= pool.length) return;
    const id = pool[i];
    for (let n = Math.min(ROLES_DATA[id].max, left); n >= 0; n--) { counts[id] = n; walk(i + 1, left - n); }
    counts[id] = 0;
  };
  walk(0, need);
  return best;
}
function autoFill(count) {
  // Try 1 Werewolf first; use 2 only when 1 cannot land inside the balance window.
  const options = [1, 2].map((w) => bestVillageFill(count, w)).filter(Boolean);
  const best = options.reduce((a, b) => (b.dist < a.dist ? b : a));
  const deck = emptyDeck();
  deck.werewolf = best.wolves;
  Object.keys(best.counts).forEach((id) => { deck[id] = best.counts[id]; });
  return deck;
}

// Fisher-Yates
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function deal(deck, names, count) {
  const cards = [];
  ROLE_IDS.forEach((id) => { for (let i = 0; i < deck[id]; i++) cards.push(id); });
  const shuffled = shuffle(cards);
  return names.slice(0, count).map((n, i) => ({
    id: i,
    name: n.trim() || `Player ${i + 1}`,
    role: shuffled[i],
    alive: true,
    protectedTag: false,
    silencedTag: false
  }));
}

/* ------------------------------------------------------------------ */
/* Ambience: procedural night-forest soundscape (Web Audio, no files)  */
/* ------------------------------------------------------------------ */
const Ambience = (() => {
  let ctx = null, master = null, bus = null, echoIn = null, noiseBuf = null, whiteBuf = null;
  let running = false, timers = [], suspendT = null;
  const rand = (a, b) => a + Math.random() * (b - a);
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

  function lfo(param, hz, depth) {
    const o = ctx.createOscillator(), d = ctx.createGain();
    o.frequency.value = hz; d.gain.value = depth;
    o.connect(d); d.connect(param); o.start();
  }
  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 7000;
    bus = ctx.createGain();
    bus.connect(tone); tone.connect(master); master.connect(ctx.destination);
    // distant echo for howls, hoots and snaps
    echoIn = ctx.createGain(); echoIn.gain.value = 0.55;
    const delay = ctx.createDelay(1.5); delay.delayTime.value = 0.55;
    const fb = ctx.createGain(); fb.gain.value = 0.42;
    const elp = ctx.createBiquadFilter(); elp.type = 'lowpass'; elp.frequency.value = 1400;
    echoIn.connect(delay); delay.connect(elp); elp.connect(fb); fb.connect(delay); elp.connect(tone);
    // noise sources
    const n = ctx.sampleRate * 4, nb = ctx.createBuffer(1, n, ctx.sampleRate), nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; nd[i] = last * 3.5; }
    noiseBuf = nb;
    const w = ctx.sampleRate * 0.25; whiteBuf = ctx.createBuffer(1, w, ctx.sampleRate);
    const wd = whiteBuf.getChannelData(0); for (let i = 0; i < w; i++) wd[i] = Math.random() * 2 - 1;
    // wind: slow-moving band of noise
    const wsrc = ctx.createBufferSource(); wsrc.buffer = noiseBuf; wsrc.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.7;
    const wg = ctx.createGain(); wg.gain.value = 1.3;
    wsrc.connect(bp); bp.connect(wg); wg.connect(bus);
    lfo(wg.gain, 0.07, 0.45); lfo(bp.frequency, 0.045, 200);
    wsrc.start(0, rand(0, 3));
    // low rumble under it
    const rsrc = ctx.createBufferSource(); rsrc.buffer = noiseBuf; rsrc.loop = true;
    const rl = ctx.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 140;
    const rg = ctx.createGain(); rg.gain.value = 0.9;
    rsrc.connect(rl); rl.connect(rg); rg.connect(bus);
    lfo(rg.gain, 0.05, 0.3);
    rsrc.start(0, rand(0, 3));
    return true;
  }

  function chirp(freq, vol) {
    const t0 = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(bus);
    const pulses = 3 + Math.floor(Math.random() * 3);
    g.gain.setValueAtTime(0, t0);
    for (let i = 0; i < pulses; i++) {
      const s = t0 + i * 0.07;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(vol, s + 0.015);
      g.gain.linearRampToValueAtTime(0, s + 0.05);
    }
    o.start(t0); o.stop(t0 + pulses * 0.07 + 0.1);
  }
  function crickets() {
    [4300, 4750, 5200].forEach((f, i) => {
      const loop = () => { if (!running) return; chirp(f * rand(0.98, 1.02), 0.03); later(loop, rand(350, 1500)); };
      later(loop, 300 + i * 450);
    });
  }

  function hoot(t0, f0, dur, vol) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = 'sine'; o2.type = 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f0 * 0.9, t0 + dur);
    o2.frequency.setValueAtTime(f0 * 2, t0); o2.frequency.exponentialRampToValueAtTime(f0 * 1.8, t0 + dur);
    g2.gain.value = 0.2;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.06); g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus); g.connect(echoIn);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
  }
  function owl() {
    if (!running) return;
    const f = rand(330, 400), t = ctx.currentTime + 0.05;
    hoot(t, f, 0.28, 0.09); hoot(t + 0.42, f * 0.95, 0.22, 0.08);
    if (Math.random() < 0.6) hoot(t + 0.85, f * 0.95, 0.55, 0.09);
    later(owl, rand(14000, 28000));
  }

  function howl() {
    if (!running) return;
    const t0 = ctx.currentTime + 0.05, dur = rand(3.8, 5.2), base = rand(300, 380);
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    const f = o.frequency;
    f.setValueAtTime(base * 0.8, t0);
    f.linearRampToValueAtTime(base * 1.6, t0 + dur * 0.35);
    f.linearRampToValueAtTime(base * 1.5, t0 + dur * 0.65);
    f.exponentialRampToValueAtTime(base * 0.9, t0 + dur);
    const vib = ctx.createOscillator(), vd = ctx.createGain();
    vib.frequency.value = 5.5; vd.gain.value = 7; vib.connect(vd); vd.connect(f);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000; lp.Q.value = 2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.11, t0 + 0.9);
    g.gain.setValueAtTime(0.11, t0 + dur * 0.6); g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(bus); g.connect(echoIn);
    o.start(t0); vib.start(t0); o.stop(t0 + dur + 0.1); vib.stop(t0 + dur + 0.1);
    later(howl, rand(26000, 50000));
  }

  function snap() {
    if (!running) return;
    const t = ctx.currentTime;
    const hits = Math.random() < 0.5 ? 1 : 2;
    for (let i = 0; i < hits; i++) {
      const s = ctx.createBufferSource(); s.buffer = whiteBuf;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
      const g = ctx.createGain(), ts = t + i * rand(0.08, 0.18);
      g.gain.setValueAtTime(0.14, ts); g.gain.exponentialRampToValueAtTime(0.001, ts + 0.05);
      s.connect(hp); hp.connect(g); g.connect(bus); g.connect(echoIn);
      s.start(ts, rand(0, 0.15), 0.06);
    }
    later(snap, rand(20000, 45000));
  }

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function start() {
    if (running) return;
    if (!ctx && !build()) return;
    running = true;
    clearTimeout(suspendT);
    const p = ctx.resume();
    if (p && p.catch) p.catch(() => { running = false; clearTimers(); });
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.8, ctx.currentTime, 1.2);
    clearTimers();
    crickets();
    later(owl, 4000); later(howl, 7000); later(snap, 16000);
  }
  function stop() {
    if (!running) return;
    running = false; clearTimers();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0, ctx.currentTime, 0.25);
    suspendT = setTimeout(() => { if (!running && ctx) ctx.suspend(); }, 1200);
  }
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (running) ctx.resume();
  });
  return { start, stop, unlocked: () => !!ctx, isRunning: () => running };
})();

                    <button onClick={() => { onClearGames(); setConfirm(false); setNote('Saved games cleared.'); }}
                      className="min-h-[48px] rounded-xl text-sm font-bold text-white" style={{ background: '#B91C1C' }}>Delete</button>
                    <button onClick={() => setConfirm(false)} className="min-h-[48px] rounded-xl text-sm font-semibold text-slate-200" style={{ border: '1px solid var(--line)' }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button disabled={gameCount === 0} onClick={() => { setNote(''); setConfirm(true); }}
                  className="mt-3 min-h-[48px] w-full rounded-xl text-sm font-semibold text-red-300 disabled:opacity-35"
                  style={{ border: '1px solid #DC262666' }}>Clear Saved Games</button>
              )}
              {note && <p role="status" className="mt-2 text-xs text-slate-400">{note}</p>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

      left: r(3, 42), size: r(9, 16), dur: r(10, 17), delay: -r(0, 15), dx: r(30, 90), sway: r(3, 5.5), color: ['#7F1D1D', '#991B1B', '#5B1016'][i % 3]
    }));
    const embers = Array.from({ length: 6 }, () => ({
      left: r(5, 95), size: r(3, 5.5), dur: r(8, 14), delay: -r(0, 12), dx: r(-30, 30), color: ['#F97316', '#FB923C', '#EF4444'][Math.floor(Math.random() * 3)]
    }));
    return { leaves, embers };
  }, []);
  const [imgOk, setImgOk] = useState(true);

  const [lobby, setLobby] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);

    const evs = ['pointerup', 'click', 'touchend', 'keydown'];
    evs.forEach((e) => window.addEventListener(e, go, { passive: true }));
    return () => evs.forEach((e) => window.removeEventListener(e, go));
  }, [st.sound]);
  useEffect(() => () => Ambience.stop(), []);
  const [splats, setSplats] = useState([]);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const spawn = (e) => {

    setSplats((a) => [...a.slice(-15), sp]);
    timers.current.push(setTimeout(() => setSplats((a) => a.filter((x) => x.id !== sp.id)), 2600));

            <div className="blood-moon-glow pointer-events-none absolute" style={{ left: '68.8%', top: '15.7%', width: '62%', aspectRatio: '1 / 1' }} />
          </div>
        </div>
        <div className="absolute inset-0 bg-gradient-to-b from-black/10 via-[#0B0E14]/10 via-40% to-[#0B0E14]/95" />
        <div className="mist mist-a pointer-events-none" />
        <div className="mist mist-b pointer-events-none" />
        <div className="pointer-events-none absolute inset-0 overflow-hidden">
          {atmos.leaves.map((l, i) => (
            <span key={'l' + i} className="leaf absolute" style={{ left: l.left + '%', top: '-4vh', animationDuration: l.dur + 's', animationDelay: l.delay + 's', '--dx': l.dx + 'px' }}>
              <span className="leaf-shape block" style={{ width: l.size, height: l.size * 0.8, background: l.color, animationDuration: l.sway + 's' }} />
            </span>
          ))}
          {atmos.embers.map((e, i) => (
            <span key={'e' + i} className="ember absolute" style={{ left: e.left + '%', bottom: '-2vh', width: e.size, height: e.size, background: e.color, boxShadow: `0 0 8px 2px ${e.color}99`, animationDuration: e.dur + 's', animationDelay: e.delay + 's', '--dx': e.dx + 'px' }} />
          ))}
        </div>
      </div>

      <main className="screen-in relative z-10 mx-auto flex min-h-full w-full max-w-md flex-col px-4 md:max-w-xl md:px-8"
        style={{ paddingTop: 'max(16px, env(safe-area-inset-top))', paddingBottom: 'max(24px, env(safe-area-inset-bottom))' }}>

        <div className="flex-1" style={{ minHeight: '34vh' }} />

        <div className="text-center">

            Multi-Device
          </button>
        </div>
      </main>

      <div className="pointer-events-none fixed inset-0 z-30 overflow-hidden" aria-hidden="true">
        {splats.map((sp) => <DotBurst key={sp.id} b={sp} />)}
      </div>

      {guide && <RoleGuide onClose={() => setGuide(false)} />}
      {lobby && <LobbyModal onClose={() => setLobby(false)} />}
      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} gameCount={gameCount} onClearGames={onClearGames} />}
    </div>
  );
}

function summarizeDeck(deck) {
  return ROLE_IDS.filter((id) => deck[id] > 0).map((id) => {
    if (id === 'werewolf') return `${deck[id]} ${deck[id] === 1 ? 'Wolf' : 'Wolves'}`;
    return deck[id] > 1 ? `${deck[id]} ${ROLES_DATA[id].name}s` : ROLES_DATA[id].name;
  }).join(', ');
}

function GameSheet({ game, onClose, onResume, onRedeal, onEdit }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const active = game.status === 'active' && game.players;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={game.name}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="screen-in relative w-full max-w-md rounded-t-3xl p-5"
        style={{ background: 'var(--card)', border: '1px solid var(--line)', paddingBottom: 'max(20px, env(safe-area-inset-bottom))' }}>
        <h2 className="font-display text-2xl font-bold">{game.name}</h2>
        <p className="mt-1 text-sm text-slate-400">{game.count} Players &middot; {summarizeDeck(game.deck)}</p>
        {active && <p className="mt-2 text-sm text-slate-300">Players: {game.players.map((pl) => pl.name).join(', ')}</p>}
        <div className="mt-5 flex flex-col gap-3">
          {active && <Btn onClick={onResume}>Resume Grimoire</Btn>}
          <Btn variant={active ? 'secondary' : 'primary'} onClick={onRedeal}>Re-deal Same Setup</Btn>
          <Btn variant="secondary" onClick={onEdit}>Edit Setup</Btn>
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

        <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider"
          style={{ color: tag.c, background: tag.c + '1F', border: `1px solid ${tag.c}55` }}>{tag.text}</span>
        <span className="font-display mt-3 line-clamp-2 break-words pr-1 text-lg font-bold leading-tight">{game.name}</span>

function QtyPill({ role, n, canAdd, onChange }) {
  const name = ROLES_DATA[role].name;
  return (
    <div className="absolute left-2 top-2 flex items-center rounded-full"
      style={{ background: 'rgba(8,10,15,0.82)', border: '1px solid rgba(226,232,240,0.35)', backdropFilter: 'blur(4px)' }}>
      <button aria-label={`Remove ${name}`} disabled={n <= 0} onClick={() => onChange(-1)}
        className="flex h-9 w-9 items-center justify-center text-lg text-slate-100 disabled:opacity-30">&minus;</button>
      <span className="min-w-[1ch] px-0.5 text-center text-sm font-bold tabular-nums text-white" aria-live="polite">{n}</span>
      <button aria-label={`Add ${name}`} disabled={!canAdd} onClick={() => onChange(1)}
        className="flex h-9 w-9 items-center justify-center text-lg text-slate-100 disabled:opacity-30">+</button>
    </div>
  );
}

function ChooseCards({ count, deck, setDeck, onBack, onStart }) {
  const [q, setQ] = useState('');
  const total = deckTotal(deck);
  const slotsLeft = count - total;
  const wolves = deck.werewolf;
  const canStart = slotsLeft === 0 && wolves >= 1;

  const change = (id, d) => {
    const next = deck[id] + d;
    if (next < 0 || next > ROLES_DATA[id].max) return;
    if (d > 0 && slotsLeft <= 0) return;
    setDeck({ ...deck, [id]: next });
  };
  const needle = q.trim().toLowerCase();
  const visible = ROLE_IDS.filter((id) => {
    if (!needle) return true;
    const r = ROLES_DATA[id];
    return [r.name, r.ability, r.short, r.blurb, TEAM_LABEL[r.team]].join(' ').toLowerCase().includes(needle);
  });

  const ruleOk = wolves >= 1;
  const ruleColor = ruleOk ? '#34D399' : '#F59E0B';

  return (
    <Screen wide>
      <div className="sticky top-0 z-10 -mx-4 px-4 pb-3 pt-1 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(180deg, var(--bg) 85%, rgba(11,14,20,0))' }}>
        <header className="flex items-center gap-2">
          <button onClick={onBack} aria-label="Back to game setup" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
          </button>
          <h1 className="font-display text-lg font-bold tracking-wide">Choose Cards</h1>
        </header>
        <div className="mt-2 flex items-end justify-between gap-3">
          <div aria-live="polite">
            <div className="font-display text-2xl font-black leading-none tabular-nums text-white">{slotsLeft} {slotsLeft === 1 ? 'slot' : 'slots'} left</div>
            <div className="mt-1 text-sm tabular-nums text-slate-400">{total} / {count} selected</div>
          </div>
          <div className="flex gap-1.5">
            <button onClick={() => setDeck(autoFill(count))} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>Auto-fill</button>
            <button onClick={() => setDeck(emptyDeck())} disabled={total === 0} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-400 hover:bg-white/5 disabled:opacity-30" style={{ border: '1px solid var(--line)' }}>Clear</button>
          </div>
        </div>
        <div role="status" className="mt-2.5 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold"
          style={{ color: ruleColor, background: ruleColor + (ruleOk ? '14' : '1F'), border: `1px solid ${ruleColor}${ruleOk ? '40' : '88'}` }}>
          <span aria-hidden="true">{ruleOk ? '✓' : '!'}</span>
          At least 1 Werewolf required
        </div>
      </div>

      <div className="relative mt-1">
        <svg className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20 L16 16" /></svg>
        <input id="role-search" type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search roles..." aria-label="Search roles"
          className="h-12 w-full rounded-xl pl-10 pr-3 text-[15px] text-slate-100 placeholder-slate-500"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }} />
      </div>

      <div className="mt-4 grid grid-cols-2 gap-3.5 md:grid-cols-3 md:gap-5 lg:grid-cols-4">
        {visible.map((id) => {
          const r = ROLES_DATA[id];
          const n = deck[id];
          const ring = n > 0
            ? (r.team === 'werewolf'
              ? '0 0 0 2px #EF4444, 0 0 26px 3px rgba(220,38,38,0.55)'
              : '0 0 0 2px #E2E8F0, 0 0 24px 3px rgba(226,232,240,0.4)')
            : '0 0 0 1px rgba(203,213,225,0.2)';
          return (
            <div key={id} className="relative aspect-[3/4] overflow-hidden rounded-2xl transition-shadow" style={{ boxShadow: ring, opacity: n === 0 && slotsLeft === 0 ? 0.6 : 1 }}>
              <PlayingCard role={id} />
              <QtyPill role={id} n={n} canAdd={slotsLeft > 0 && n < r.max} onChange={(d) => change(id, d)} />
            </div>
          );
        })}
      </div>
      {visible.length === 0 && <p className="mt-6 text-center text-sm text-slate-400">No roles match &ldquo;{q.trim()}&rdquo;.</p>}

      <div className="sticky bottom-0 z-10 -mx-4 mt-auto px-4 pb-1 pt-6 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(0deg, var(--bg) 70%, rgba(11,14,20,0))' }}>
        {!canStart && (
          <p className="mb-2 text-center text-xs text-slate-400">
            {slotsLeft > 0 ? `Fill ${slotsLeft} more ${slotsLeft === 1 ? 'slot' : 'slots'}` : ''}{slotsLeft > 0 && !ruleOk ? ' and add ' : ''}{!ruleOk ? (slotsLeft > 0 ? 'a Werewolf' : 'Add a Werewolf') : ''} to continue.
          </p>
        )}
        <Btn disabled={!canStart} onClick={onStart}>Start &amp; Deal Cards</Btn>
      </div>
    </Screen>
  );
}

function RoleCard({ role, phase }) {
  const r = ROLES_DATA[role];
  const hasImg = !!useCardImage(role);
  const flipped = phase === 'flipping' || phase === 'open';
  const lifted = phase === 'lift' || phase === 'flipping';
  const edge = r.team === 'werewolf' ? '#EF4444' : '#E2E8F0';
  const glow = `0 0 44px -8px ${r.team === 'werewolf' ? 'rgba(220,38,38,0.8)' : 'rgba(226,232,240,0.45)'}`;
  return (
    <div className={`flip-scene aspect-[3/4] ${lifted ? 'is-lifted' : ''}`}>
      <div className={`flip-card ${flipped ? 'is-flipped' : ''}`}>
        <div className="face" style={{ background: 'linear-gradient(160deg, #1B2230, #10141D)', border: '1px solid rgba(203,213,225,0.28)' }}>
          <div className="absolute inset-3 rounded-2xl" style={{ border: '1px solid rgba(203,213,225,0.16)' }} />
          <div className="flex h-full flex-col items-center justify-center gap-5">
            <div className="relative flex h-28 w-28 items-center justify-center">
              <div className="absolute inset-0 rounded-full" style={{ background: 'radial-gradient(circle, rgba(203,213,225,0.22), transparent 70%)' }} />
              <MoonIcon width="96" height="96" className="relative text-slate-300" />
            </div>
            <span className="font-display text-sm font-bold tracking-[0.4em] text-slate-400">WEREWOLF</span>
          </div>
        </div>
        <div className="face face-front" style={hasImg ? { boxShadow: glow } : { border: `2px solid ${edge}`, boxShadow: glow }}>
          <PlayingCard role={role} />
        </div>
      </div>
    </div>
  );
}

function Reveal({ players, onName, onDone }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const flipped = phase !== 'idle';
  const [busy, setBusy] = useState(false);
  const [input, setInput] = useState('');
  const [entered, setEntered] = useState([]);
  const timer = useRef(null);
  const timers = useRef([]);
  useEffect(() => () => { clearTimeout(timer.current); timers.current.forEach(clearTimeout); }, []);

  const p = players[idx];
  const last = idx === players.length - 1;
  const hasImg = !!useCardImage(p.role);
  const name = input.trim();
  const taken = name !== '' && entered.some((n) => n.toLowerCase() === name.toLowerCase());
  const canReveal = name !== '' && !taken && !busy;

  const reveal = () => {
    if (!canReveal || phase !== 'idle') return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    setPhase('lift'); // 0.3s anticipation lift and glow
    timers.current.push(setTimeout(() => setPhase('flipping'), 300)); // 1.2s turn
    timers.current.push(setTimeout(() => setPhase('open'), 1500)); // flip finished
  };
  const hideAndPass = () => {
    if (busy || phase !== 'open') return;
    setBusy(true);
    setPhase('idle');
    onName(idx, name);
    setEntered((e) => [...e, name]);
    setInput('');
    timer.current = setTimeout(() => {
      setBusy(false);
      if (last) onDone();
      else setIdx((i) => i + 1);
    }, 700);
  };

  return (
    <Screen className="items-center">
      <div className="flex w-full flex-col items-center gap-2.5">
        <span className="rounded-full px-3 py-1 text-xs font-semibold uppercase tabular-nums tracking-[0.18em] text-slate-300"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
          Player {idx + 1} of {players.length}
        </span>
        <div className="flex w-full gap-1" aria-hidden="true">
          {players.map((_, i) => (
            <div key={i} className="h-1 flex-1 rounded-full" style={{ background: i <= idx ? '#CBD5E1' : 'rgba(203,213,225,0.15)' }} />
          ))}
        </div>
      </div>

      <div className="mt-5 min-h-[84px] w-full" aria-live="polite">
        {flipped ? (
          <div className="pt-1 text-center">
            <p className="text-sm text-slate-400">This card belongs to</p>
            <p className="font-display mt-1 break-words text-3xl font-bold leading-tight">{name}</p>
          </div>
        ) : (
          <div role="note" className="flex items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
            style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
            <svg className="mt-0.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z" /><path d="M12 10 V14 M12 17 V17.5" /></svg>
            <span><strong className="font-bold text-amber-200">Eyes only!</strong> Shield your screen and make sure no other players are looking before you reveal your card.</span>
          </div>
        )}
      </div>

      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <RoleCard role={p.role} phase={phase} />
        <div className={`min-h-[84px] text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`}
          style={{ width: 'min(19rem, 86vw)' }} aria-hidden={phase !== 'open'}>
          <TeamBadge team={ROLES_DATA[p.role].team} />
          {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[p.role].ability}</p>}
        </div>
      </div>

      <div className="w-full pt-2">
        {flipped ? (
          <div className={phase === 'open' ? '' : 'invisible'} aria-hidden={phase !== 'open'}>
            <Btn variant="secondary" disabled={busy || phase !== 'open'} onClick={hideAndPass}>
              {last ? 'Hide & Finish' : 'Hide & Pass to Next Player'}
            </Btn>
          </div>
        ) : (
          <>
            <label htmlFor="player-name" className="sr-only">Your name</label>
            <input id="player-name" type="text" value={input} maxLength={18} autoComplete="off" placeholder="Enter your name..."
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
              className="h-14 w-full rounded-xl px-4 text-center text-lg text-slate-100 placeholder-slate-500"
              style={{ background: 'var(--card)', border: `1px solid ${taken ? '#F59E0B' : 'rgba(203,213,225,0.3)'}` }} />
            <p role="alert" className="mb-2 mt-2 min-h-[18px] text-center text-xs text-amber-300">
              {taken ? 'An earlier player already used that name. Add an initial.' : ''}
            </p>
            <Btn disabled={!canReveal} onClick={reveal}>Tap to Reveal Your Card</Btn>
          </>
        )}
      </div>
    </Screen>
  );
}

function HoldButton({ onComplete, ms = 1500, children }) {
  const [p, setP] = useState(0);
  const raf = useRef(0);
  const start = useRef(0);
  const done = useRef(false);

  const tick = useCallback(() => {
    const v = Math.min(1, (performance.now() - start.current) / ms);
    setP(v);
    if (v >= 1) {
      if (!done.current) { done.current = true; onComplete(); }
      return;
    }
    raf.current = requestAnimationFrame(tick);
  }, [ms, onComplete]);

  const begin = () => {
    cancelAnimationFrame(raf.current);
    done.current = false;
    start.current = performance.now();
    raf.current = requestAnimationFrame(tick);
  };
  const cancel = () => {
    cancelAnimationFrame(raf.current);
    if (!done.current) setP(0);
  };
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  return (
    <button
      className="no-select relative min-h-[72px] w-full overflow-hidden rounded-2xl text-base font-semibold text-white"
      style={{ background: 'var(--card-2)', border: '1px solid rgba(203,213,225,0.3)' }}
      onPointerDown={begin} onPointerUp={cancel} onPointerLeave={cancel} onPointerCancel={cancel}
      onContextMenu={(e) => e.preventDefault()}
      onKeyDown={(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } }}
      onKeyUp={(e) => { if (e.key === ' ' || e.key === 'Enter') cancel(); }}
      aria-label="Press and hold for one and a half seconds to unlock the Moderator view">
      <span className="absolute inset-y-0 left-0" style={{ width: `${p * 100}%`, background: 'linear-gradient(90deg, #991B1B, #DC2626)' }} />
      <span className="relative">{p > 0 && p < 1 ? 'Keep holding…' : children}</span>
    </button>
  );
}

function Moderator({ players, setPlayers, onAgain, onNew, onHome }) {
  const [checked, setChecked] = useState({});
  const [confirm, setConfirm] = useState(null); // 'again' | 'new' | null

  useEffect(() => {
    if (!confirm) return;
    const t = setTimeout(() => setConfirm(null), 3500);
    return () => clearTimeout(t);
  }, [confirm]);

  const update = (id, patch) => setPlayers(players.map((p) => (p.id === id ? { ...p, ...patch } : p)));

  const wolvesAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'werewolf').length;
  const villageAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'village').length;

  const nightRoles = useMemo(() => {
    const present = ROLE_IDS.filter((id) => ROLES_DATA[id].nightOrder && players.some((p) => p.role === id));
    return present.sort((a, b) => ROLES_DATA[a].nightOrder - ROLES_DATA[b].nightOrder);
  }, [players]);
  const hasHunter = players.some((p) => p.role === 'hunter');

  let status = null;
  if (wolvesAlive === 0) status = { text: 'No Werewolves left. The Village wins.', color: '#34D399' };
  else if (wolvesAlive >= villageAlive) status = { text: 'Werewolves match or outnumber the Village.', color: '#F87171' };

  return (
    <Screen wide>
      <header className="flex items-start justify-between gap-3 pb-4">
        <div>
          <h1 className="font-display text-3xl font-bold tracking-wide">Grimoire</h1>
          <p className="text-sm text-slate-400">Moderator view. Keep the screen turned away from players.</p>
        </div>
        <button onClick={onHome} className="min-h-[44px] shrink-0 rounded-xl px-3.5 text-sm font-semibold text-slate-200 hover:bg-white/5"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>All games</button>
      </header>

      {/* Tally */}
      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-xl p-3" style={{ background: '#DC262614', border: '1px solid #DC262655' }}>
          <div className="text-[11px] font-semibold uppercase tracking-wider text-red-300">Werewolves alive</div>
          <div className="font-display text-3xl font-bold tabular-nums text-red-400">{wolvesAlive}</div>
        </div>
        <div className="rounded-xl p-3" style={{ background: '#34D39912', border: '1px solid #34D39955' }}>
          <div className="text-[11px] font-semibold uppercase tracking-wider text-emerald-300">Village alive</div>
          <div className="font-display text-3xl font-bold tabular-nums text-emerald-400">{villageAlive}</div>
        </div>
      </div>
      {status && (
        <p role="status" className="mt-3 rounded-xl px-4 py-3 text-sm font-medium" style={{ color: status.color, background: status.color + '18', border: `1px solid ${status.color}55` }}>
          {status.text}

      {/* Roster */}
      <section className="mt-5">
        <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Player Roster</h2>
        <ul className="flex flex-col gap-2 md:grid md:grid-cols-2 md:items-start md:gap-3">
          {players.map((p) => {
            const r = ROLES_DATA[p.role];
            return (
              <li key={p.id} className="rounded-xl p-3 transition-opacity"
                style={{ background: 'var(--card)', border: `1px solid ${p.alive ? r.color + '55' : 'var(--line)'}`, opacity: p.alive ? 1 : 0.55 }}>
                <div className="flex items-center gap-3">
                  <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg" style={{ background: r.color + '1A' }}>
                    <RoleEmblem role={p.role} size={26} />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className={`truncate text-[15px] font-semibold ${p.alive ? '' : 'line-through'}`}>{p.name}</div>
                    <div className="flex items-center gap-2">

                      <TeamBadge team={r.team} />
                    </div>
                  </div>
                  <button onClick={() => update(p.id, p.alive ? { alive: false, protectedTag: false, silencedTag: false } : { alive: true })}
                    aria-pressed={!p.alive}
                    aria-label={`${p.name} is ${p.alive ? 'alive. Mark as eliminated' : 'eliminated. Mark as alive'}`}
                    className="min-h-[44px] shrink-0 rounded-lg px-3 text-xs font-bold uppercase tracking-wider"
                    style={p.alive

                {p.alive && (
                  <div className="mt-2.5 flex gap-2 pl-14">
                    <StatusChip color="#34D399" active={p.protectedTag} onClick={() => update(p.id, { protectedTag: !p.protectedTag })}>Protected</StatusChip>
                    <StatusChip color="#818CF8" active={p.silencedTag} onClick={() => update(p.id, { silencedTag: !p.silencedTag })}>Silenced</StatusChip>

                  className="flex w-full items-start gap-3 rounded-xl p-3 text-left"
                  style={{ background: done ? 'transparent' : 'var(--card-2)', border: `1px solid ${done ? 'var(--line)' : r.color + '55'}`, opacity: done ? 0.55 : 1 }}>

                    <span className="mt-1 block text-xs text-slate-500">

      <div className="mt-6 flex flex-col gap-3">

        </Btn>
        <Btn variant="ghost" onClick={() => (confirm === 'new' ? onNew() : setConfirm('new'))}>
          {confirm === 'new' ? 'Tap again to start over' : 'New Game'}
        </Btn>
      </div>
    </Screen>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */
const STORE_KEY = 'nightfall.games.v1';
function loadGames() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveGames(g) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(g)); } catch (e) { /* storage unavailable */ }
}

function AppInner() {
  const [screen, setScreen] = useState('start'); // start | home | setup | cards | reveal | shield | moderator
  const [games, setGames] = useState(loadGames);
  const [count, setCount] = useState(6);
  const [names, setNames] = useState(Array(MAX_PLAYERS).fill(''));
  const [deck, setDeck] = useState(emptyDeck);
  const [gameName, setGameName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [curId, setCurId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [round, setRound] = useState(0);

  useEffect(() => { saveGames(games); }, [games]);

  const defaultName = useMemo(() => {
    if (editingId) { const g = games.find((x) => x.id === editingId); if (g) return g.name; }
    let n = games.length + 1;
    while (games.some((g) => g.name === `Game #${n}`)) n++;
    return `Game #${n}`;
  }, [games, editingId]);

  const updateGame = (id, patch) => setGames((gs) => gs.map((g) => (g.id === id ? { ...g, ...patch } : g)));

  const openNewSetup = () => {
    setEditingId(null);
    setGameName('');
    setCount(6);
    setNames(Array(MAX_PLAYERS).fill(''));
    setDeck(emptyDeck());
    setScreen('setup');
  };
  const openEditSetup = (g) => {
    setEditingId(g.id);
    setGameName(g.name);
    setCount(g.count);
    setNames(g.names);
    setDeck(g.deck);
    setScreen('setup');
  };
  const toCards = () => {
    if (deckTotal(deck) > count) setDeck(emptyDeck());
    setScreen('cards');
  };

  const begin = (id, dealt) => {
    setCurId(id);
    setPlayers(dealt);
    setRound((r) => r + 1);
    setScreen('reveal');
  };

  const start = () => {
    const dealt = deal(deck, names, count);
    const name = gameName.trim() || defaultName;
    if (editingId) {
      updateGame(editingId, { name, count, names, deck, players: dealt, status: 'active' });
      begin(editingId, dealt);
    } else {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      setGames((gs) => [{ id, name, count, names, deck, players: dealt, status: 'active', createdAt: Date.now() }, ...gs]);
      begin(id, dealt);
    }
  };

  const redeal = (g) => {
    const dealt = deal(g.deck, g.names, g.count);
    updateGame(g.id, { players: dealt, status: 'active' });
    begin(g.id, dealt);
  };
  const resume = (g) => {
    setCurId(g.id);
    setPlayers(g.players);
    setRound((r) => r + 1);
    setScreen('shield');
  };
  const savePlayers = (p) => {
    setPlayers(p);
    updateGame(curId, { players: p });
  };
  const nameAt = (idx, name) => {
    const next = players.map((pl) => (pl.id === idx ? { ...pl, name } : pl));
    setPlayers(next);
    updateGame(curId, { players: next });
  };
  const finishGame = () => updateGame(curId, { players: null, status: 'saved' });

  if (screen === 'start') {
    return <StartScreen onPlay={() => setScreen('home')} gameCount={games.length} onClearGames={() => setGames([])} />;
  }
  if (screen === 'home') {
    return (
      <Home games={games} onBack={() => setScreen('start')} onCreate={openNewSetup} onResume={resume} onRedeal={redeal}
        onEdit={openEditSetup} onDelete={(id) => setGames((gs) => gs.filter((g) => g.id !== id))} />
    );
  }
  if (screen === 'setup') {
    return (
      <Setup count={count} setCount={setCount} gameName={gameName} setGameName={setGameName}
        defaultName={defaultName} onBack={() => setScreen('home')} onNext={toCards} />
    );
  }
  if (screen === 'cards') {
    return <ChooseCards count={count} deck={deck} setDeck={setDeck} onBack={() => setScreen('setup')} onStart={start} />;
  }
  if (screen === 'reveal') return <Reveal key={round} players={players} onName={nameAt} onDone={() => setScreen('shield')} />;
  if (screen === 'shield') return <Shield onUnlock={() => setScreen('moderator')} />;
  return (
    <Moderator key={round} players={players} setPlayers={savePlayers}
      onAgain={() => redeal(games.find((g) => g.id === curId))}
      onNew={() => { finishGame(); openNewSetup(); }}
      onHome={() => setScreen('home')} />
  );
}

/* ------------------------------------------------------------------ */
/* Startup: preload and decode images, then fade into the start screen */
/* ------------------------------------------------------------------ */
function activeImageSources() {
  const list = [DEFAULT_BG, LOADING_BG];
  ROLE_IDS.forEach((id) => {
    const src = customArt[id] || ROLES_DATA[id].imageUrl;
    if (src) list.push(src);
  });
  return Array.from(new Set(list));
}
function preloadAll(onProgress) {
  const sources = activeImageSources();
  const total = sources.length;
  let loaded = 0;
  onProgress(0, total);
  return Promise.all(sources.map((src) => preloadImage(src).then(() => { loaded += 1; onProgress(loaded, total); })));
}

function useBoot() {
  const [phase, setPhase] = useState('loading'); // loading | fading | done
  const [progress, setProgress] = useState({ loaded: 0, total: 1 });
  useEffect(() => {
    let finished = false;
    const timers = [];
    const finish = () => {
      if (finished) return;
      finished = true;
      setProgress((p) => ({ ...p, loaded: p.total }));
      timers.push(setTimeout(() => setPhase('fading'), 250));
      timers.push(setTimeout(() => setPhase('done'), 850));
    };
    timers.push(setTimeout(finish, 3000)); // safety: always unlock after 3 seconds
    preloadAll((loaded, total) => { if (!finished) setProgress({ loaded, total }); }).then(finish, finish);
    return () => { finished = true; timers.forEach(clearTimeout); };
  }, []);
  return { phase, progress };
}

function LoadingScreen({ loaded, total, fading }) {
  const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 100;
  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8" role="status" aria-live="polite"
      style={{ background: '#0B0E14', opacity: fading ? 0 : 1, transition: 'opacity 600ms ease-in-out', pointerEvents: fading ? 'none' : 'auto' }}>
      <img src={LOADING_BG} alt="" className="absolute inset-0 h-full w-full object-cover" />
      <div className="pointer-events-none absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(11,14,20,0.25), rgba(11,14,20,0.7))' }} />
      <h1 className="load-pulse font-display relative text-4xl font-black tracking-[0.14em] text-slate-100">WEREWOLF</h1>
      <div className="relative mt-10 w-full max-w-[240px]">
        <div className="h-1 w-full overflow-hidden rounded-full" style={{ background: 'rgba(203,213,225,0.12)' }}
          role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={pct}>
          <div className="h-full rounded-full" style={{ width: pct + '%', background: '#DC2626', boxShadow: '0 0 12px rgba(220,38,38,0.7)', transition: 'width 350ms ease-out' }} />
        </div>
        <div className="mt-3 flex items-center justify-between text-xs text-slate-400">
          <span>Preparing the deck...</span>
          <span className="tabular-nums">{pct}%</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const { phase, progress } = useBoot();
  return (
    <>
      <AppInner />
      {phase !== 'done' && <LoadingScreen loaded={progress.loaded} total={progress.total} fading={phase === 'fading'} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
