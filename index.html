          </li>
        );
      })}
    </ul>
  );

  if (ph === 'over') {
    return (
      <div className="flex flex-1 flex-col gap-4">
        <MpOver room={room} players={players} meId={me && me.id} />
        <Btn onClick={playAgain}>Play Again With This Room</Btn>
      </div>
    );
  }
  return (
    <div className="flex flex-1 flex-col gap-4">
      <div>
        <h2 className="font-display text-2xl font-bold">Grimoire</h2>
        <p className="text-sm text-slate-400">Moderator view. Keep this screen turned away from the players.</p>
      </div>
      {ph === 'reveal' && (
        <Panel className="text-sm text-slate-300">{players.filter((p) => p.d === 1).length} of {players.length} players have seen their card.</Panel>
      )}
      {ph === 'night' && (
        <>
          <Panel>
            <div className="flex items-center justify-between"><span className="text-xs font-semibold uppercase tracking-widest text-slate-400">Night {room.k}</span>
              <span className="text-xs tabular-nums text-slate-400">{actors.length - pending.length} of {actors.length} acted</span></div>
            <p className="mt-2 text-sm text-slate-300">{victims.length ? `Wolves are targeting ${victims.map((v) => nm(v)).join(' & ')}.` : 'The wolves have not chosen yet.'}</p>
          </Panel>
          <Panel>
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold uppercase tracking-widest text-slate-400">Narrator</span>
              <span className="text-xs text-slate-500">{director.dir.on ? 'Speaking' : 'Idle'}</span>
            </div>
            <p className="mt-2 min-h-[2.5rem] text-sm italic text-slate-300" aria-live="polite">{director.dir.on ? director.dir.label : 'The narrator is not running. Resume it to continue the night by voice.'}</p>
            <div className="mt-3 flex gap-2">
              {director.dir.on
                ? <>
                    <Btn variant="secondary" onClick={director.skipRole}>Skip waiting</Btn>
                    <Btn variant="ghost" onClick={director.stop}>Stop narrator</Btn>
                  </>
                : <Btn variant="secondary" onClick={() => director.start({ again: true })}>Restart narrated night</Btn>}
            </div>
          </Panel>
        </>
      )}
      {ph === 'day' && <AnnounceCard room={room} players={players} />}
      {ph === 'day' && (
        <Panel>
          <div className="flex items-center justify-between">
            <span className="text-xs font-semibold uppercase tracking-widest text-slate-400">Trial vote</span>
            <span className="text-xs tabular-nums text-slate-400">{room.vd === 1 ? 'Vote closed' : `${voted} of ${voters.length} voted`}</span>
          </div>
          {ranked.length === 0
            ? <p className="mt-2 text-sm text-slate-400">No votes yet. Players vote on their own phones.</p>
            : <ul className="mt-2 flex flex-col gap-1 text-sm text-slate-200">{ranked.map((id) => <li key={id} className="flex justify-between"><span>{nm(id)}</span><span className="tabular-nums text-slate-400">{tally[id]}</span></li>)}</ul>}
          <div className="mt-3 flex flex-col gap-2">
            {top && !tie && room.vd !== 1 && <Btn onClick={() => closeVote(top)}>Eliminate {nm(top)}</Btn>}
            {tie && <p className="text-xs text-amber-300">It is a tie. Clear the votes and revote, or use Eliminate on a player below.</p>}
            {ranked.length > 0 && room.vd !== 1 && <Btn variant="ghost" onClick={() => closeVote('', { revote: true })}>Clear votes and revote</Btn>}
          </div>
        </Panel>
      )}
      {ph === 'day' && room.an && room.an.sv === 1 && <p className="-mt-2 text-xs text-slate-400">Grimoire note: the wolves&rsquo; victim was saved overnight.</p>}
      {winBanner}
      {grimoire}
      <div className="mt-auto flex flex-col gap-2.5 pt-2">
        {ph === 'reveal' && <Btn onClick={startNight}>{allReady ? 'Begin Night 1' : 'Begin Night 1 Anyway'}</Btn>}
        {ph === 'night' && <Btn variant={director.dir.on ? 'secondary' : 'primary'} onClick={dawn}>{pending.length ? `Break Dawn Now (${pending.length} still waiting)` : 'Break Dawn Now'}</Btn>}
        {ph === 'day' && <Btn onClick={startNight}>Start Night {(room.k || 0) + 1}</Btn>}
        {(ph === 'night' || ph === 'day') && (
          confirmEnd
            ? <div className="flex gap-2"><Btn variant="secondary" onClick={() => endGame('village')}>Village wins</Btn><Btn variant="secondary" onClick={() => endGame('werewolf')}>Wolves win</Btn><Btn variant="secondary" onClick={() => endGame('lovers')}>Lovers win</Btn>{getGameMode() === 'outbreak' && <Btn variant="secondary" onClick={() => endGame('zombie')}>Zombies win</Btn>}<Btn variant="ghost" onClick={() => setConfirmEnd(false)}>Cancel</Btn></div>
            : <Btn variant="ghost" onClick={() => setConfirmEnd(true)}>End Game Early</Btn>
        )}
      </div>
    </div>
  );
}

/* ---------- host who is also playing: spoiler-free controls only ---------- */
// Who is still to act in the current Eyes Open wave (mirrors what the host director waits for).
function mpWaveLeft(players, room) {
  const ns = room.ns || '';
  const a = players.filter((p) => p.a === 1);
  if (ns === 'w:1') return a.filter((p) => p.jt === 1 || p.cj === 1 || (mpActive(p.r, room.k) && p.r !== 'shadow' && p.nd !== 1));
  if (ns === 'w:2') return a.filter((p) => p.r === 'witch' && p.nd !== 1);
  if (ns === 'w:3') return a.filter((p) => p.r === 'shadow' && p.nd !== 1);
  if (ns === 'v:seer') return a.filter((p) => p.r === 'seer' && p.rd !== 1);
  return [];
}
const MP_WAVE_SECS = 45;
const soloHuman = (l) => !!l.room && l.room.ai === 1 && l.players.filter((p) => p.bot !== 1).length === 1; // one human against bots: night waits have no time limit
function useWaveClock(room) {
  const [t0, setT0] = useState(Date.now());
  const [, tick] = useState(0);
  useEffect(() => { setT0(Date.now()); }, [room.nk]);
  useEffect(() => { const t = setInterval(() => tick((x) => x + 1), 500); return () => clearInterval(t); }, []);
  return Math.max(0, MP_WAVE_SECS - Math.floor((Date.now() - t0) / 1000));
}
function WaveBadge({ players, room }) {
  const secs = useWaveClock(room);
  if (room.ai === 1 && players.filter((p) => p.bot !== 1).length === 1) return null; // one human against bots: no countdown
  const n = mpWaveLeft(players, room).length;
  return <div aria-live="off" className="pointer-events-none fixed left-1/2 z-[45] -translate-x-1/2 rounded-full px-3 py-1 text-xs font-bold tabular-nums text-slate-100" style={{ top: 'max(16px, env(safe-area-inset-top))', background: 'rgba(10,10,18,0.7)', border: '1px solid rgba(203,213,225,0.35)' }}>{secs}s · {n} left</div>;
}
function WaveWait({ players, room }) {
  const secs = useWaveClock(room);
  const n = mpWaveLeft(players, room).length;
  return <div className="mb-10 text-center"><div className="font-display text-4xl font-black tabular-nums text-slate-100" style={{ textShadow: '0 2px 18px rgba(0,0,0,0.9)' }}>{secs}s</div><p className="mt-1 text-sm text-slate-200" style={{ textShadow: '0 1px 10px rgba(0,0,0,0.9)' }}>{n > 0 ? `Waiting for ${n} player${n === 1 ? '' : 's'}...` : 'Everyone is done...'}</p></div>;
}

function MpAutoNote({ room, players }) {
  const { voters, voted } = mpTally(players);
  const ph = room.ph;
  const text = ph === 'reveal' ? `The night starts by itself when everyone has seen their card (${players.filter((p) => p.d === 1).length} of ${players.length}).`
    : ph === 'night' ? 'The game is running the night for you.'
    : room.vd === 1 ? 'The vote is closed. The next night starts shortly.' : `${voted} of ${voters.length} players have voted. The vote closes when everyone has voted.`;
  return <Panel className="text-center text-xs text-slate-400"><span className="font-semibold uppercase tracking-widest text-slate-500">Auto-moderator</span><div className="mt-1" aria-live="polite">{text}</div></Panel>;
}

function MpHostPanel({ room, players, write, director }) {
  const ph = room.ph;

  return (
    <Panel>
      <h3 className="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Host controls</h3>

        {ph === 'reveal' && (

            <p className="text-sm text-slate-300">{players.filter((p) => p.d === 1).length} of {players.length} players have seen their card.</p>

          </>
        )}
        {ph === 'night' && (
          <>
            <p className="text-sm italic text-slate-300" aria-live="polite">{director.dir.on ? 'The narrator is running the night.' : 'The narrator is not running.'}</p>
            {director.dir.on
              ? <div className="flex gap-2"><Btn variant="secondary" onClick={director.skipRole}>Skip waiting</Btn><Btn variant="ghost" onClick={director.stop}>Stop narrator</Btn></div>
              : <Btn variant="secondary" onClick={() => director.start({ again: true })}>Restart narrated night</Btn>}
            <Btn variant="ghost" onClick={dawn}>Advance to Dawn</Btn>
          </>
        )}
        {ph === 'day' && (
          <>
            <p className="text-sm text-slate-300">{room.vd === 1 ? 'The vote is closed.' : `${voted} of ${voters.length} players have voted. The vote closes by itself when everyone has.`}</p>

            <Btn onClick={() => director.start()}>Start Night {(room.k || 0) + 1}</Btn>

        {winner && (ph === 'night' || ph === 'day') && <Btn onClick={() => write({ ph: 'over', w: winner })}>End Game</Btn>}
      </div>

  );
}

/* ---------- the room (everything after joining) ---------- */
function MpRoom({ session, onExit, onPhase, onRetry, onMap, onNext }) {
  const { code, pid } = session;
  const { room, err, refresh } = useRoom(code);
  const [cardsStep, setCardsStep] = useState(false);
  const [deck, setDeck] = useState(emptyDeck);
  const [confirmLeave, setConfirmLeave] = useState(false);
  const [confirmPublic, setConfirmPublic] = useState(false);
  const [confirmAi, setConfirmAi] = useState(false);
  const [hostInfo, setHostInfo] = useState(false);
  const [busy, setBusy] = useState(false);
  const [wErr, setWErr] = useState('');
  const players = useMemo(() => roomPlayers(room), [room]);
  ADV1 = !!room && room.adv === 1;
  const soloAi = !!room && room.ai === 1 && players.filter((p) => p.bot !== 1).length === 1; // one human against bots (Adventure / Custom AI): the card flips itself and there is no ready wait. Rooms with 2+ people keep tap-to-reveal and the ready count.
  const mx = (room && room.mx) || MP_MAX;
  const me = players.find((p) => p.id === pid);
  const isHost = !!room && room.host === pid;
  const ph = room ? room.ph : '';
  const director = useNightDirector({ room, players, write: (patch) => writeRef.current(patch) });
  const writeRef = useRef(() => Promise.resolve());

  useEffect(() => { onPhase(cardsStep ? 'cards' : ph); }, [ph, cardsStep]);
  // Every phone shows the scene the host rolled for this night and day.
  useEffect(() => { if (room && typeof room.bn === 'number') setBgIdx('night', room.bn); }, [room && room.bn, room && room.k]);
  useEffect(() => { if (room && typeof room.bd === 'number') setBgIdx('day', room.bd); }, [room && room.bd, room && room.k]);
  useEffect(() => () => onPhase(''), []);
  useEffect(() => { if (room && room.md) setGameMode(room.md); }, [room && room.md]); // everyone plays the host's mode
  useEffect(() => { if (cardsStep) setDeck(room && room.dk ? { ...emptyDeck(), ...room.dk } : autoFill(players.length)); }, [cardsStep, !room || !room.dk ? players.length : 0]);
  useEffect(() => { if (ph !== 'lobby' && cardsStep) setCardsStep(false); }, [ph]);

  const write = async (patch) => {
    try { await Mp.patch(`rooms/${code}`, patch); setWErr(''); }
    catch (e) { setWErr(mpErrorText(e)); }
    refresh();
  };
  writeRef.current = write;
  useAiDriver({ enabled: !!room && room.ai === 1 && isHost, room, players, write });
  // A host who is also playing is a regular player: no Grimoire, no roles, only spoiler-free room controls.
  const hostPlays = isHost && !!room && !!room.hp && !!me;
  // Playing + Hosting runs itself: no manual Next buttons. Moderator Only keeps the host controls.
  const allSeen = players.length > 0 && players.every((p) => p.d === 1);
  const autoWinner = ph === 'day' ? mpWinner(players) : '';
  const hunterPending = players.some((p) => p.r === 'hunter' && p.a !== 1 && p.hs !== 1);
  const autoFired = useRef('');
  const [l1Pro, setL1Pro] = useState(false); // Campaign Level 1: the cottage dialogue before Night 1 has finished
  useEffect(() => {
    if (!hostPlays || director.dir.on) return;
    const key = `${ph}:${room.k}:${room.vd}:${autoWinner}`;
    let t = 0;
    if (ph === 'reveal' && allSeen && (room.adv !== 1 || l1Pro)) t = setTimeout(() => { if (autoFired.current !== key) { autoFired.current = key; director.start(); } }, soloAi ? 250 : 1800);
    else if (ph === 'night') t = setTimeout(() => { if (autoFired.current !== key) { autoFired.current = key; director.start({ again: true }); } }, 6000); // only if the director is not running (for example after a refresh)
    else if (ph === 'day' && autoWinner) t = setTimeout(() => { if (autoFired.current !== key) { autoFired.current = key; write({ ph: 'over', w: autoWinner }); } }, hunterPending ? 20000 : 7000);
    else if (ph === 'day' && room.vd === 1) t = setTimeout(() => { if (autoFired.current !== key) { autoFired.current = key; director.start(); } }, hunterPending ? 30000 : room.adv === 1 && VR_SEEN.key === `${code}:${room.dl || 0}:${room.k}` ? 400 : 12000); // time to read who was voted out
    return () => clearTimeout(t);
  }, [hostPlays, ph, room && room.k, room && room.vd, allSeen, autoWinner, hunterPending, director.dir.on, l1Pro]);
  const voteClosed = useRef('');
  useEffect(() => {
    if (!hostPlays || ph !== 'day' || room.vd === 1) return;
    const t = mpTally(players);
    if (t.voters.length > 0 && t.voted >= t.voters.length && voteClosed.current !== String(room.k)) {
      voteClosed.current = String(room.k);
      write(mpVotePatch(players, t.tie ? '' : t.top, { tie: t.tie, skip: t.skip }));
    }
  }, [players, ph]);
  useEffect(() => { if (ph !== 'day') voteClosed.current = ''; }, [ph]);
  const leave = async () => {
    setBusy(true);
    try {
      if (isHost) { await Mp.del(`rooms/${code}`); try { await Mp.del(`publicRooms/${code}`); } catch (e) { /* ignore */ } }
      else if (ph === 'lobby') await Mp.del(`rooms/${code}/pl/${pid}`);
      else await Mp.patch(`rooms/${code}/pl/${pid}`, { a: 0, lf: 1 });
    } catch (e) { /* leaving anyway */ }
    saveSession(null);
    onExit();
  };
  const closeNow = () => { saveSession(null); onExit(); };
  const openCards = () => { setCardsStep(true); write({ lk: 1 }); };
  const closeCards = () => { setCardsStep(false); write({ lk: 0 }); };
  const deal = () => write(mpDealPatch(room, deck));
  const saveDeck = async () => { await write({ dk: deck, lk: 0 }); setCardsStep(false); };
  // Host only: fill the open seats with named AI players, deal to everyone and start now.
  const startWithAi = async () => {
    setConfirmAi(false);
    const need = mx - players.length;
    if (need <= 0 || !room.dk) return;
    const used = new Set(players.map((p) => p.n.toLowerCase()));
    const o0 = players.reduce((m, p) => Math.max(m, p.o || 0), 0);
    const add = {};
    aiPickNames(used, need).forEach((nm, i) => { const id = randId(); add[`pl/${id}/n`] = nm; add[`pl/${id}/o`] = o0 + i + 1; add[`pl/${id}/bot`] = 1; });
    const withBots = { ...room, pl: { ...(room.pl || {}) } };
    Object.keys(add).forEach((k) => { const [, id, f] = k.split('/'); withBots.pl[id] = { ...(withBots.pl[id] || {}), [f]: add[k] }; });
    await write({ ...add, ai: 1, ...mpDealPatch(withBots, { ...emptyDeck(), ...room.dk }) });
  };
  const makePublic = async () => { setConfirmPublic(false); await write({ pub: 1, nightStyle: 'eyes_open' }); try { await Mp.put(`publicRooms/${code}`, { rn: room.rn, hn: room.hn, ts: room.ts || Date.now() }); } catch (e) { /* the room is still marked public */ } };

  if (room === undefined) {
    return <Screen className="items-center justify-center"><p className="hint-pulse text-slate-300">Connecting to the room...</p>{err && <p className="mt-3 max-w-xs text-center text-sm text-amber-300">{err}</p>}<Btn variant="ghost" className="mt-6" onClick={closeNow}>Cancel</Btn></Screen>;
  }
  if (room === null || (!isHost && !me)) {
    return (
      <Screen className="items-center justify-center text-center">
        <h2 className="font-display text-2xl font-bold">{room === null ? 'This room has closed' : 'You are no longer in this room'}</h2>
        <p className="mt-2 max-w-xs text-sm text-slate-300">{room === null ? 'The host ended the session.' : 'The host may have removed you.'}</p>
        <div className="mt-6 w-full max-w-xs"><Btn onClick={closeNow}>Back</Btn></div>
      </Screen>
    );
  }
  if (cardsStep && isHost) {
    return <ChooseCards count={room.dk ? mx : players.length} deck={deck} setDeck={setDeck} onBack={closeCards} onStart={room.dk ? saveDeck : deal} startLabel={room.dk ? 'Save Deck' : 'Deal Cards & Start'} showBalance />;
  }

  const showPlayer = !!me && (!isHost || hostPlays);
  let body = null;
  if (ph === 'lobby') {
    body = (
      <div className="flex flex-1 flex-col gap-4">
        <div className="flex items-center justify-between">
          <h2 className="font-display text-xl font-bold">Lobby</h2>
          <span className="flex items-center gap-2">
            {isHost && !room.pub && players.length < mx && <button onClick={() => setConfirmPublic(true)} className="min-h-[32px] rounded-full px-3 text-xs font-bold text-violet-100 transition active:scale-95" style={{ background: 'rgba(109,40,217,0.35)', border: '1px solid rgba(167,139,250,0.5)' }}>Autofill</button>}
            {!!room.pub && <span className="rounded-full px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest text-emerald-200" style={{ background: 'rgba(16,185,129,0.16)', border: '1px solid rgba(52,211,153,0.4)' }}>Public</span>}
            <span className="rounded-full px-3 py-1 text-xs font-semibold tabular-nums text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>{players.length} / {mx} players</span>
          </span>
        </div>
        {players.length === 0 && <Panel className="text-center text-sm text-slate-400">No players yet. Share the room code.</Panel>}
        <PlayerList players={players} meId={pid} hostId={room.host} modRow={!room.hp} onRemove={isHost ? (id) => write({ [`pl/${id}`]: null }) : null} />
        {isHost ? (
          <div className="mt-auto flex flex-col gap-2">
            {players.length < (room.dk ? mx : MP_MIN) && <p className="text-center text-xs text-slate-400">{room.dk ? `The deck is built for ${mx} players. Ask friends to join with the code above.` : `Need at least ${MP_MIN} players to start. Ask friends to join with the code above.`}</p>}
            {room.dk
              ? <>
                <Btn disabled={players.length !== mx} onClick={() => write(mpDealPatch(room, { ...emptyDeck(), ...room.dk }))}>{players.length === mx ? 'Start Game' : `Waiting for players (${players.length} / ${mx})`}</Btn>
                {players.length >= 1 && players.length < mx && <Btn variant="secondary" onClick={() => setConfirmAi(true)}>{`Start with AI (+${mx - players.length} Bot${mx - players.length === 1 ? '' : 's'})`}</Btn>}
                <Btn variant="secondary" onClick={openCards}>Edit Deck</Btn>
              </>
              : <Btn disabled={players.length < MP_MIN} onClick={openCards}>Choose Cards</Btn>}
            <p className="text-center text-xs text-slate-500">{room.hp ? 'You are playing and hosting.' : 'You are moderating only.'}</p>
          </div>
        ) : (
          <p className="hint-pulse mt-auto pb-2 text-center text-sm text-slate-300">Waiting for the host to start the game...</p>
        )}
      </div>
    );
  } else if (showPlayer) {
    if (ph === 'reveal') body = <MpReveal me={me} ready={me.d === 1} readyCount={players.filter((p) => p.d === 1).length} total={players.length} onReady={() => write({ [`pl/${pid}/d`]: 1 })} onLeave={() => setConfirmLeave(true)} instant={soloAi} prologue={soloAi && room.adv === 1 ? { done: l1Pro, finish: () => setL1Pro(true) } : null} />;
    else if (ph === 'night') body = <MpNight key={`n${room.k}`} me={me} players={players} room={room} write={write} immersive={!isHost || hostPlays} onLeave={() => setConfirmLeave(true)} />;
    else if (ph === 'day') body = <MpDay key={`d${room.k}`} me={me} players={players} room={room} write={write} onTimeUp={isHost && hostPlays ? () => { if (room.vd === 1) return; const t = mpTally(players); write(mpVotePatch(players, t.tie ? '' : t.top, { tie: t.tie, skip: t.skip, none: t.voted === 0 })); } : undefined} />;
    else body = <MpOver room={room} players={players} meId={pid} onRetry={onRetry} />;
    if (hostPlays && ph !== 'lobby') body = <div className="flex flex-1 flex-col gap-4">{body}{ph === 'over' && (room.adv === 1
      ? <>{room.w === 'village' ? <Btn onClick={onNext}>{`Continue to Level ${2}`}</Btn> : <Btn onClick={onRetry}>{`Retry Level ${1}`}</Btn>}<Btn variant="secondary" onClick={onMap}>Back to Map</Btn></>
      : <><Btn variant="secondary" disabled={busy} onClick={leave}>Exit to Home</Btn><MpHostPanel room={room} players={players} write={write} director={director} /></>)}</div>;
  } else {
    body = <MpMod room={room} players={players} me={me} write={write} director={director} />;
  }

  const fullHost = hostPlays && (ph === 'reveal' || ph === 'night' || ph === 'day'); // the playing host gets the same edge-to-edge screen as everyone else
  return (
    <>
    {ph === 'day' && <DayBackdrop />}
    {ph === 'reveal' && <RevealBackdrop />}
    {showPlayer && me && room.adv === 1 && room.k === 1 && ((ph === 'night' && room.ns === 'i') || ph === 'day') && <AdvTip key={ph} text={ph === 'night' ? "Tip: Remember everyone's alibi before the lantern went out..." : 'Tip: Read the Village Chat, work out who the Werewolf is, and vote together!'} />}
    {showPlayer && me && ph === 'day' && <VoteResultGate room={room} code={code} onContinue={room.adv === 1 && hostPlays && !autoWinner && !hunterPending ? () => { if (director.dir.on || autoFired.current === `${ph}:${room.k}:${room.vd}:${autoWinner}`) return; autoFired.current = `${ph}:${room.k}:${room.vd}:${autoWinner}`; director.start(); } : undefined} />}
    {showPlayer && me && ph === 'day' && <ElimGate me={me} room={room} code={code} />}
    {fullHost && session.ai && (ph === 'day' || (ph === 'reveal' && !(me && me.d === 1))) && (
      <ExitButton onClick={() => setConfirmLeave(true)} className="fixed left-3 z-50" style={{ top: 'max(10px, env(safe-area-inset-top))' }} />
    )}
    {fullHost && !session.ai && (
      <div className="fixed right-3 z-50 flex flex-col items-end gap-2" style={{ top: 'max(10px, env(safe-area-inset-top))' }}>
        <button type="button" onClick={() => setHostInfo((v) => !v)} aria-expanded={hostInfo} aria-label="Room info" className="flex h-8 items-center gap-1.5 rounded-full px-3 text-[11px] font-bold tracking-widest text-violet-100" style={{ background: 'rgba(10,10,18,0.72)', border: '1px solid rgba(167,139,250,0.5)' }}>
          {code}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ transform: hostInfo ? 'rotate(180deg)' : 'none' }}><path d="M6 9l6 6 6-6" /></svg>
        </button>
        {hostInfo && (
          <div className="w-64 rounded-2xl p-3" style={{ background: 'rgba(10,10,18,0.92)', border: '1px solid rgba(167,139,250,0.4)' }}>
            <MpHeader code={code} roomName={room.rn} onLeave={() => { setHostInfo(false); setConfirmLeave(true); }} leaveLabel="Leave room" />
            <MpAutoNote room={room} players={players} />
          </div>
        )}
      </div>
    )}
    <Screen className={ph === 'day' ? 'relative z-10' : ''}>
      {fullHost ? (ph !== 'night' && <div className="h-6" />) : ph === 'over' && room.adv === 1 ? <header className="relative flex items-center gap-2 pb-3"><ExitButton onClick={() => setConfirmLeave(true)} aria-label="Leave match" /><div className="mx-auto pr-10 font-display text-sm font-bold uppercase tracking-[0.24em] text-violet-100">{`Campaign \u00B7 Level ${1}`}</div></header> : <MpHeader code={code} roomName={room.rn} onLeave={() => setConfirmLeave(true)} leaveLabel="Leave room" />}
      {session.local && !session.ai && <p className="mb-3 text-center text-[11px] font-semibold tracking-wide text-slate-500">Preview Mode &mdash; deploy to Vercel for live multi-phone sync</p>}
      {(err || wErr) && <p role="alert" className="mb-3 rounded-xl px-3 py-2 text-center text-xs font-semibold text-amber-200" style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.4)' }}>{wErr || `${err} Retrying...`}</p>}
      {body}
      {confirmPublic && (
        <div role="dialog" aria-modal="true" aria-label="Make room public" className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(5,7,12,0.86)' }}>
          <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: 'var(--card)', border: '1px solid rgba(139,92,246,0.55)' }}>
            <p className="text-base font-semibold text-slate-100">Make this room Public so anyone can join and fill the remaining seats?</p>
            <div className="mt-4 flex gap-2.5"><Btn variant="secondary" onClick={() => setConfirmPublic(false)}>Cancel</Btn><Btn onClick={makePublic}>Confirm</Btn></div>
          </div>
        </div>
      )}
      {confirmAi && (
        <div role="dialog" aria-modal="true" aria-label="Start with AI" className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(5,7,12,0.86)' }}>
          <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: 'var(--card)', border: '1px solid rgba(139,92,246,0.55)' }}>
            <p className="text-base font-semibold text-slate-100">{`Fill the remaining ${mx - players.length} open slot${mx - players.length === 1 ? '' : 's'} with AI players and start the match now?`}</p>
            <div className="mt-4 flex gap-2.5"><Btn variant="secondary" onClick={() => setConfirmAi(false)}>Cancel</Btn><Btn onClick={startWithAi}>Confirm &amp; Start</Btn></div>
          </div>
        </div>
      )}
      {confirmLeave && (
        <ConfirmExit confirmLabel={soloAi ? 'Leave match' : isHost ? 'Close room' : 'Leave room'}
          body={soloAi ? 'You will leave this match against the bots. Your progress in this match will be lost.' : isHost ? 'This closes the room for everyone. Players will be sent back out.' : 'You will leave this room. You can rejoin with the code only while the game has not started.'}
          onCancel={() => setConfirmLeave(false)} onConfirm={leave} />
      )}
    </Screen>
    </>
  );
}

/* ------------------------------------------------------------------ */
/* Play with AI: a solo match against local bots (no network, no keys).  */
/* It reuses the Multi-Device room engine in its on-device store: the    */
/* bots are ordinary players whose choices are written by the host       */
/* device, so every night still goes through the one resolution engine.  */
/* ------------------------------------------------------------------ */
// Adventure progress lives on this device only.
const loadAdv = () => { try { const v = JSON.parse(localStorage.getItem('adventureProgress') || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } };
const saveAdv = (o) => { try { localStorage.setItem('adventureProgress', JSON.stringify(o)); } catch (e) { /* storage unavailable */ } };
const ADV_L1_DECK = { werewolf: 1, bodyguard: 1, villager: 2 }; // Pooh (Bodyguard), Charlie (Werewolf), Stacy and Jenna (Villagers)
const AI_NAMES = ['Darren', 'Jenna', 'Charlie', 'James', 'Ava', 'Stacy', 'Mira', 'Bram', 'Ivy', 'Corvin', 'Sable', 'Thorn', 'Wren', 'Dax', 'Lysa', 'Odin', 'Pia', 'Rook', 'Nyx', 'Hale', 'Juno', 'Kade', 'Vera', 'Finn'];

// The six house names come first (in random order), then the rest at random; never a name already in the room.
function aiPickNames(used, n) {
  const free = AI_NAMES.filter((x) => !used.has(x.toLowerCase()));
  const front = shuffle(free.filter((x) => AI_NAMES.indexOf(x) < 6)); // house names first, in random order
  return [...front, ...shuffle(free.filter((x) => !front.includes(x)))].slice(0, n);
}

async function aiCreateRoom(name, cfg) {
  Mp.local = true;
  const pid = randId();
  const words = shuffle(CODE_WORDS);
  let code = '';
  for (let i = 0; i < words.length; i++) { if (!(await Mp.get(`rooms/${words[i]}`))) { code = words[i]; break; } }
  if (!code) code = randLetters();
  const pl = { [pid]: { n: name, o: 1, a: 1, d: 0 } };
  (cfg.adv ? ['Stacy', 'Jenna', 'Charlie'].filter((x) => x.toLowerCase() !== name.toLowerCase()).concat(aiPickNames(new Set([name.toLowerCase(), 'stacy', 'jenna', 'charlie']), 3)).slice(0, cfg.n - 1) : aiPickNames(new Set([name.toLowerCase()]), cfg.n - 1)).forEach((nm, i) => { pl[randId()] = { n: nm, o: i + 2, a: 1, d: 0, bot: 1 }; }); // Level 1 cast: Stacy, Jenna and Charlie
  const room = { v: 1, host: pid, hp: 1, rn: 'AI Village', hn: name, md: getGameMode(), ph: 'lobby', k: 0, lk: 0, w: '', ts: Date.now(), pub: 0, st: 'waiting', mx: cfg.n, dk: cfg.deck, nightStyle: 'eyes_open', ai: 1, ...(cfg.adv ? { adv: 1 } : {}), pl };
  await Mp.put(`rooms/${code}`, room);
  await Mp.patch(`rooms/${code}`, mpDealPatch(room, { ...emptyDeck(), ...cfg.deck })); // the human's secret card is dealt with everyone else's
  return { code, pid, host: true, local: true, ai: true };
}

const aiPick = (a) => a[Math.floor(Math.random() * a.length)];
const aiSus = (M, id) => M.sus[id] || 0;
function aiTop(M, cands, bonus) { // the most suspected candidate, with a little noise so bots are not identical
  let best = null; let bs = -1;
  cands.forEach((c) => { const s = aiSus(M, c.id) + (bonus ? bonus(c) : 0) + Math.random() * 0.9; if (s > bs) { bs = s; best = c; } });
  return best;
}

// What one bot submits for its night turn, in the same short fields a phone writes.
const aiZ = (p) => p.r === 'zombie' || p.r === 'infector' || p.r === 'plaguedoctor'; // the Zombie team
const aiPack = (p) => p.r === 'werewolf' || p.r === 'shadow'; // the wolf team: a Shadow Figure is never a target for the pack
function aiNightWrites(b, role, ns, ctx, M) {
  const { room, players } = ctx;
  const k = room.k || 1;
  const alive = players.filter((p) => p.a === 1);
  const others = alive.filter((p) => p.id !== b.id);
  const grp = alive.filter((p) => p.r === b.r && p.sd !== k);
  const wr = (fn) => { const o = {}; (grp.length ? grp : [b]).forEach((g) => Object.assign(o, fn(g.id))); return o; };
  const done = (id, t, extra) => ({ [`pl/${id}/t`]: t || '', [`pl/${id}/nd`]: 1, ...(extra || {}) });
  const isInfectedLike = (p) => !!p.bt || !!p.ic || p.r === 'zombie' || p.r === 'infector';
  if (ns === 'v:seer') return { [`pl/${b.id}/rd`]: 1 };
  if (role === 'infected') return { [`pl/${b.id}/jt`]: 2 };
  if (role === 'cured') return { [`pl/${b.id}/cj`]: 2 };
  if (b.sd === k) return { [`pl/${b.id}/nd`]: 1 }; // sedated: sleeps through it
  if (role === 'werewolf') { // prefers non-wolves, and anyone who claimed to be the Seer
    const c = others.filter((p) => !aiPack(p));
    const byN = (n) => c.find((p) => p.n === n); const pooh = c.find((p) => p.bot !== 1);
    const scripted = room.adv === 1 ? (k === 1 ? byN('Stacy') : k === 2 ? pooh : (byN('Stacy') || pooh || byN('Jenna'))) : null; // Level 1: Night 1 Stacy, Night 2 the Bodyguard, then Stacy first, else the Bodyguard, else Jenna
    const t1 = scripted || aiTop(M, c, (p) => (M.claims[p.id] === 'seer' ? 3 : 0));
    const t2 = room.bm ? aiTop(M, c.filter((p) => !t1 || p.id !== t1.id)) : null;
    return wr((id) => done(id, t1 ? t1.id : '', { [`pl/${id}/t2`]: t2 ? t2.id : '' }));
  }
  if (role === 'seer') { // scans someone not yet inspected and remembers the answer
    const seen = M.seen[b.id] || (M.seen[b.id] = {});
    const fresh = others.filter((p) => !(p.id in seen));
    const t = aiTop(M, fresh.length ? fresh : others);
    if (t) seen[t.id] = t.r === 'werewolf';
    return wr((id) => done(id, t ? t.id : ''));
  }
  if (role === 'cupid') {
    const two = shuffle(others).slice(0, 2);
    if (two.length < 2) return done(b.id, '');
    return { ...done(b.id, two[0].id, { [`pl/${b.id}/t2`]: two[1].id }), [`pl/${two[0].id}/lv`]: two[1].id, [`pl/${two[1].id}/lv`]: two[0].id };
  }
  if (role === 'medusa') { const t = Math.random() < 0.75 ? aiTop(M, others) : null; return wr((id) => done(id, t ? t.id : '')); }
  if (role === 'bodyguard') { const c = others.filter((p) => p.id !== b.lp); const t = aiTop(M, c.length ? c : others, (p) => (M.claims[p.id] === 'seer' ? 2 : 0) - aiSus(M, p.id)); return wr((id) => done(id, t ? t.id : '')); }
  if (role === 'witch') {
    const victim = mpWolfVictims(players)[0];
    const save = !b.wsu && victim && (k <= 2 || Math.random() < 0.35);
    const poisonT = !b.wpu && k >= 2 && Math.random() < 0.45 ? aiTop(M, others.filter((p) => aiSus(M, p.id) >= 1)) : null;
    return wr((id) => done(id, poisonT ? poisonT.id : '', { [`pl/${id}/ws`]: save ? 1 : 0 }));
  }
  if (role === 'sniper') {
    const t = room.md === 'outbreak' && k >= 2 ? aiTop(M, others.filter((p) => aiSus(M, p.id) >= 2)) : null;
    const any = t || aiTop(M, others);
    return wr((id) => done(id, any ? any.id : '', { [`pl/${id}/ws`]: t ? 1 : 0 }));
  }
  if (role === 'doctor') { const t = aiTop(M, others, (p) => (isInfectedLike(p) && aiSus(M, p.id) >= 1 ? 2 : 0)); return wr((id) => done(id, t ? t.id : '')); }
  if (role === 'plaguedoctor') {
    const fresh = others.filter((p) => !isInfectedLike(p) && p.r !== 'plaguedoctor');
    const infect = Math.random() < 0.5 && fresh.length;
    const t = infect ? aiTop(M, fresh) : aiTop(M, others, (p) => (aiSus(M, p.id) >= 1 ? 1 : 0));
    return wr((id) => done(id, t ? t.id : '', { [`pl/${id}/ws`]: t ? (infect ? 2 : 1) : 0 }));
  }
  if (role === 'spellcaster') { const t = aiTop(M, others); return wr((id) => done(id, t ? t.id : '')); }
  if (role === 'zombie' || role === 'infector') {
    const fresh = others.filter((p) => !isInfectedLike(p) && p.r !== 'plaguedoctor');
    const t = aiTop(M, fresh.length ? fresh : others);
    return wr((id) => done(id, t ? t.id : ''));
  }
  if (role === 'shadow') { // works for the wolves: never touches the pack's hunt, shields wolves from the stone, then sabotages Village powers
    const c0 = mpChoices(players);
    const acts = nightActions(c0);
    const byId = Object.fromEntries(players.map((p) => [p.id, p]));

function useAiDriver({ enabled, room, players, write }) {
  const latest = useRef({});
  latest.current = { room, players, write };
  const mem = useRef({ gameTs: '', sus: {}, claims: {}, seen: {}, due: {}, done: {}, proc: {}, defend: [], said: {}, defended: {}, myClaim: {}, inbox: [], dayK: -1 });
  useEffect(() => {
    if (!enabled) return;

  }, [enabled]);
}

function AiScreen({ onBack, onPhase, startView }) {
  const [unlock, setUnlock] = useState(false); // coming back from a Level 1 victory: play the Level 2 unlock on the map
  const [view, setView] = useState(startView === 'mode' ? 'mode' : 'hub'); // hub | mode | count | deck | name | lvlname | room
  const [cfg, setCfg] = useState({ n: 8, deck: null });
  const [sandbox, setSandboxS] = useState(() => !!loadAdv().sandbox);
  const setSandbox = (on) => { setSandboxS(on); saveAdv({ ...loadAdv(), sandbox: on }); };
  const cleared = !!loadAdv().classicLevel1Cleared;
  const advProps = { locked: !cleared && !sandbox, sandbox, setSandbox, cleared };
  const noRare = (n) => { let d = autoFill(n); for (let i = 0; i < 25 && advProps.locked && d.medusa; i++) d = autoFill(n); return advProps.locked && d.medusa ? { ...d, medusa: 0 } : d; };
  const [session, setSession] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [checking, setChecking] = useState(() => { const s = loadSession(); return !!(s && s.ai); });
  useEffect(() => { if (view !== 'room') onPhase(view === 'deck' ? 'cards' : ''); }, [view]);
  useEffect(() => { // pick up a match that was running before a refresh
    const s = loadSession();
    if (!s || !s.ai) { setChecking(false); return; }
    let live = true;
    Mp.local = true;
    Mp.get(`rooms/${s.code}`).then((r) => { if (!live) return; if (r && r.ai) { setSession(s); setView('room'); } else { Mp.local = false; saveSession(null); } setChecking(false); }, () => { if (live) { Mp.local = false; setChecking(false); } });
    return () => { live = false; };
  }, []);
  const toMap = (un) => { Mp.local = false; saveSession(null); setSession(null); setUnlock(!!un); setView('hub'); };
  const resetProgress = () => { saveAdv({}); setSandboxS(false); try { localStorage.removeItem('nightfall.guideY'); } catch (e) { /* ignore */ } };
  const exitRoom = () => { Mp.local = false; saveSession(null); setSession(null); onBack(); };
  const start = async (name, c) => {
    setBusy(true); setErr('');
    try { const s = await aiCreateRoom(name, c || cfg); saveSession(s); setSession(s); setView('room'); }
    catch (e) { Mp.local = false; setErr('Could not start the match. Try again.'); }
    setBusy(false);
  };
  if (view === 'room' && session) return <MpRoom key={session.code} session={session} onExit={exitRoom} onPhase={onPhase} onRetry={session.ai ? () => playLevel1() : undefined} onMap={() => toMap(false)} onNext={() => toMap(true)} />;
  const playLevel1 = () => { // fixed training match: no deck builder, the human is the Bodyguard
    setGameMode('classic');
    const c = { n: 4, deck: { ...emptyDeck(), ...ADV_L1_DECK }, adv: 1 };
    setCfg(c);
    if (loadName().trim()) start(loadName().trim(), c); else setView('lvlname');
  };
  if (view === 'hub' && !checking) return <AdvHub onBack={onBack} onReset={resetProgress} unlock={unlock} onPlay1={playLevel1} />;
  if (view === 'deck' && cfg.deck) return <ChooseCards count={cfg.n} deck={cfg.deck} setDeck={(d) => setCfg((c) => ({ ...c, deck: d }))} onBack={() => setView('count')} onStart={() => setView('name')} startLabel="Lock Deck" showBalance adv={advProps} />;
  return (
    <Screen>
      <header className="flex items-center gap-1 pb-5">
        <button onClick={onBack} aria-label="Back to start" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
        </button>
        <h1 className="font-display text-lg font-bold tracking-wide">{checking ? 'ADVENTURE' : 'CUSTOM AI'}</h1>
      </header>
      {checking
        ? <p className="hint-pulse mt-16 text-center text-slate-300">Looking for your match...</p>
        : view === 'lvlname'
          ? <AiNameStep onBack={() => setView('hub')} onStart={(n) => start(n)} busy={busy} err={err} />
        : view === 'name'
          ? <AiNameStep onBack={() => setView('deck')} onStart={(n) => start(n, { ...cfg, adv: 0 })} busy={busy} err={err} />
          : view === 'count'
            ? <MpCountStep n={cfg.n} setN={(n) => setCfg((c) => ({ ...c, n }))} onBack={() => setView('mode')} onNext={() => { setCfg((c) => ({ ...c, deck: noRare(c.n), adv: 0 })); setView('deck'); }} />
            : <MpModeStep onBack={() => (startView === 'mode' ? onBack() : setView('hub'))} onPick={(m) => { setGameMode(m); setView('count'); }} />}
    </Screen>
  );
}

          ? <MpConfigCard onBack={onBack} onOpenSettings={() => setSettingsOpen(true)} />
          : view === 'mode'
            ? <MpModeStep onBack={() => setView('join')} onPick={(m) => { setGameMode(m); setView('count'); }} />
          : view === 'count'
            ? <MpCountStep n={cfg.n} setN={(n) => setCfg((c) => ({ ...c, n }))} onBack={() => setView('mode')} onNext={() => { setCfg((c) => ({ ...c, deck: autoFill(c.n) })); setView('deck'); }} />
          : view === 'host' && cfg.deck
            ? <MpHostForm cfg={cfg} onBack={() => setView('deck')} onCreated={enter} />
            : <MpJoinForm onBack={onBack} onJoined={enter} onHost={() => setView('mode')} />}
      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} gameCount={gameCount} onClearGames={onClearGames} />}
    </Screen>
  );
}


function loadGames() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveGames(g) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(g)); } catch (e) { /* storage unavailable */ }
}

function AppInner() {
  const [aiStart, setAiStart] = useState('');
  const [screen, setScreen] = useState('start'); // start | home | setup | cards | reveal | shield | moderator
  const [games, setGames] = useState(loadGames);
  const [count, setCount] = useState(6);
  const [names, setNames] = useState(Array(MAX_PLAYERS).fill(''));
  const [deck, setDeck] = useState(emptyDeck);
  const [narrator, setNarrator] = useState(true);
  const [gameName, setGameName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [curId, setCurId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [round, setRound] = useState(0);
  const [mpPhase, setMpPhase] = useState('');
  const [autoNight, setAutoNight] = useState(false);
  const narratorOn = (games.find((g) => g.id === curId) || {}).narrator !== false;

  useEffect(() => { saveGames(games); }, [games]);

  const defaultName = useMemo(() => {
    if (editingId) { const g = games.find((x) => x.id === editingId); if (g) return g.name; }
    let n = games.length + 1;
    while (games.some((g) => g.name === `Game #${n}`)) n++;
    return `Game #${n}`;
  }, [games, editingId]);

  const updateGame = (id, patch) => setGames((gs) => gs.map((g) => (g.id === id ? { ...g, ...patch } : g)));

  const openNewSetup = () => {
    setEditingId(null);
    setGameName('');
    setCount(6);
    setNames(Array(MAX_PLAYERS).fill(''));
    setDeck(emptyDeck());
    setNarrator(true);
    setScreen('setup');
  };
  const openPreset = (c, d) => {
    setEditingId(null);
    setGameName('');
    setCount(c);
    setNames(Array(MAX_PLAYERS).fill(''));
    setDeck(d);
    setNarrator(true);
    setScreen('setup');
  };
  const openEditSetup = (g) => {
    setEditingId(g.id);
    setGameName(g.name);
    setCount(g.count);
    setNames(g.names);
    setDeck(g.deck);
    setNarrator(g.narrator !== false);
    setScreen('setup');
  };
  const toCards = () => {
    if (deckTotal(deck) > count) setDeck(emptyDeck());
    setScreen('cards');
  };

  const begin = (id, dealt) => {
    setCurId(id);
    setPlayers(dealt);
    setRound((r) => r + 1);
    setScreen('reveal');
  };

  const start = () => {
    const dealt = deal(deck, names, count);
    const name = gameName.trim() || defaultName;
    if (editingId) {
      updateGame(editingId, { name, count, names, deck, narrator, players: dealt, status: 'active' });
      begin(editingId, dealt);
    } else {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      setGames((gs) => [{ id, name, count, names, deck, narrator, players: dealt, status: 'active', createdAt: Date.now() }, ...gs]);
      begin(id, dealt);
    }
  };

  const redeal = (g) => {
    const dealt = deal(g.deck, g.names, g.count);
    updateGame(g.id, { players: dealt, status: 'active' });
    begin(g.id, dealt);
  };
  const resume = (g) => {
    setCurId(g.id);
    setPlayers(g.players);
    setRound((r) => r + 1);
    setScreen('shield');
  };
  const savePlayers = (p) => {
    setPlayers(p);
    updateGame(curId, { players: p });
  };
  const nameAt = (idx, name) => {
    const next = players.map((pl) => (pl.id === idx ? { ...pl, name } : pl));
    setPlayers(next);
    updateGame(curId, { players: next });
  };
  const finishGame = () => updateGame(curId, { players: null, status: 'saved' });

  const { sound: soundOn, music: musicOn } = useSettings();
  useEffect(() => {
    const isTense = screen === 'setup' || screen === 'cards' || screen === 'reveal' || ((screen === 'multi' || screen === 'ai') && (mpPhase === 'lobby' || mpPhase === 'cards' || mpPhase === 'reveal'));
    const tense = isTense && musicOn;
    tensionScreen = isTense;
    if (tense) { Ambience.stop(true); Tension.start(); return; }   // music does not depend on the Sound switch
    Tension.stop();
    if (!soundOn) { Ambience.stop(); return; }
    if (screen !== 'start' && Ambience.unlocked()) Ambience.start();
  }, [screen, soundOn, musicOn, mpPhase]);
  if (screen === 'start') {
    return <StartScreen onPlay={() => setScreen('home')} onMulti={() => setScreen('multi')} onAi={() => { setAiStart(''); setScreen('ai'); }} onCustomAi={() => { setAiStart('mode'); setScreen('ai'); }} gameCount={games.length} onClearGames={() => setGames([])} />;
  }
  if (screen === 'ai') {
    return <AiScreen startView={aiStart} onBack={() => setScreen('start')} onPhase={setMpPhase} />;
  }
  if (screen === 'multi') {
    return <MultiScreen onBack={() => setScreen('start')} onPhase={setMpPhase} gameCount={games.length} onClearGames={() => setGames([])} />;
  }
  if (screen === 'home') {
    return (
      <Home games={games} onBack={() => setScreen('start')} onCreate={openNewSetup} onPreset={openPreset} onResume={resume} onRedeal={redeal}
        onEdit={openEditSetup} onDelete={(id) => setGames((gs) => gs.filter((g) => g.id !== id))} />
    );
  }
  if (screen === 'setup') {
    return (
      <Setup count={count} setCount={setCount} gameName={gameName} setGameName={setGameName} narrator={narrator} setNarrator={setNarrator}
        defaultName={defaultName} onBack={() => setScreen('home')} onNext={toCards} />
    );
  }
  if (screen === 'cards') {
    return <ChooseCards count={count} deck={deck} setDeck={setDeck} onBack={() => setScreen('setup')} onStart={start} />;
  }
  if (screen === 'reveal') return <Reveal key={round} players={players} onName={nameAt} onDone={() => setScreen('shield')} onExit={() => { finishGame(); setScreen('home'); }} />;
  if (screen === 'shield') return <Shield narrator={narratorOn} onUnlock={() => { setAutoNight(false); setScreen('moderator'); }} onStartNight={() => { setAutoNight(true); setScreen('moderator'); }} onExit={() => setScreen('home')} />;
  return (
    <Moderator key={round} players={players} setPlayers={savePlayers}
      narrator={narratorOn} autoNight={autoNight}
      onAgain={() => redeal(games.find((g) => g.id === curId))}
      onNew={() => { finishGame(); openNewSetup(); }}
      onHome={() => { saveSession(null); finishGame(); setAutoNight(false); setScreen('home'); }} />
  );
}

/* ------------------------------------------------------------------ */
/* Startup: preload and decode images, then fade into the start screen */
/* ------------------------------------------------------------------ */
function activeImageSources() {
  const list = [DEFAULT_BG, LOADING_BG, DEFAULT_BACK, nightPool.get()[0], dayPool.get()[0]];
  list.push(LOBBY_BG.classic.src, LOBBY_BG.outbreak.src); // Step 2 mode backgrounds: cached before Classic / Outbreak is tapped
  list.push(mayorArtStore.get(), medusaArtStore.get(), shadowArtStore.get());
  ROLE_IDS.forEach((id) => {
    const src = ROLES_DATA[id].imageUrl;
    if (src) list.push(src);
  });
  return Array.from(new Set(list));
}
function preloadAll(onProgress) {
  const sources = activeImageSources();
  const total = sources.length;
  let loaded = 0;
  onProgress(0, total);
  return Promise.all(sources.map((src) => preloadImage(src).then(() => { loaded += 1; onProgress(loaded, total); })));
}

function useBoot() {
  const [phase, setPhase] = useState('loading'); // loading | fading | done
  const [progress, setProgress] = useState({ loaded: 0, total: 1 });
  useEffect(() => {
    let finished = false;
    const timers = [];
    const finish = () => {
      if (finished) return;
      finished = true;
      setProgress((p) => ({ ...p, loaded: p.total }));
      timers.push(setTimeout(() => setPhase('fading'), 250));
      timers.push(setTimeout(() => setPhase('done'), 850));
    };
    timers.push(setTimeout(() => { [...nightPool.get(), ...dayPool.get()].forEach((u) => preloadImage(u)); }, 2500));
    timers.push(setTimeout(finish, 3000)); // safety: always unlock after 3 seconds
    preloadAll((loaded, total) => { if (!finished) setProgress({ loaded, total }); }).then(finish, finish);
    return () => { finished = true; timers.forEach(clearTimeout); };
  }, []);
  return { phase, progress };
}

function LoadingScreen({ loaded, total, fading }) {
  const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 100;
  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8" role="status" aria-live="polite"
      style={{ background: '#0B0E14', opacity: fading ? 0 : 1, transition: 'opacity 600ms ease-in-out', pointerEvents: fading ? 'none' : 'auto' }}>
      <img src={LOADING_BG} alt="" className="absolute inset-0 h-full w-full object-cover" />
      <div className="pointer-events-none absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(11,14,20,0.25), rgba(11,14,20,0.7))' }} />
      <h1 className="load-pulse font-display relative text-4xl font-black tracking-[0.14em] text-slate-100">WEREWOLF</h1>
      <div className="relative mt-10 w-full max-w-[240px]">
        <div className="h-1 w-full overflow-hidden rounded-full" style={{ background: 'rgba(203,213,225,0.12)' }}
          role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={pct}>
          <div className="h-full rounded-full" style={{ width: pct + '%', background: '#DC2626', boxShadow: '0 0 12px rgba(220,38,38,0.7)', transition: 'width 350ms ease-out' }} />
        </div>
        <div className="mt-3 flex items-center justify-between text-xs text-slate-400">
          <span>Preparing the deck...</span>
          <span className="tabular-nums">{pct}%</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const { phase, progress } = useBoot();
  return (
    <>
      <AppInner />
      {phase !== 'done' && <LoadingScreen loaded={progress.loaded} total={progress.total} fading={phase === 'fading'} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
