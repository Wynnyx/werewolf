/* Decoded-image cache: keeps decoded images referenced so mobile browsers don't drop them. */
const imageCache = new Map();
function preloadImage(src) {
  const hit = imageCache.get(src);
  if (hit) return Promise.resolve(hit);
  return new Promise((resolve) => {
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
    const done = () => {
      if (img.naturalWidth > 0) imageCache.set(src, img);
      resolve(img);
    };
    if (typeof img.decode === 'function') img.decode().then(done, done);
    else { img.onload = done; img.onerror = done; }
  });
}

/* Phase backgrounds: the player's own photo (kept in localStorage) or a built-in default. */
function makeBgStore(key, fallback) {
  let custom = (() => { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } })();
  const listeners = new Set();
  return {
    fallback,
    get: () => custom || fallback,
    isCustom: () => !!custom,
    set: (dataUrl) => {
      custom = dataUrl || '';
      if (custom) preloadImage(custom);
      listeners.forEach((fn) => fn());

    },
    use: function () { return React.useSyncExternalStore((fn) => { listeners.add(fn); return () => listeners.delete(fn); }, this.get); }
  };
}

// Downscale a chosen photo (max 1080 x 1920) to JPEG so it fits comfortably in localStorage.
function fileToBg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 1080 / img.naturalWidth, 1920 / img.naturalHeight);
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

function bestVillageFill(count, wolves) {

  let best = null;

    pool.forEach((id, i) => { const n = counts[id] || 0; score += n * ROLES_DATA[id].balance; fun += n * (pool.length - i); });

    const off = Math.abs(score - BALANCE_TARGET);

      best = { dist, fun, off, score, wolves, counts: { ...counts } };

    if (left === 0) { consider(); return; }
    if (i >= pool.length) return;
    const id = pool[i];
    for (let n = Math.min(ROLES_DATA[id].max, left); n >= 0; n--) { counts[id] = n; walk(i + 1, left - n); }

  const wolves = count - 1 <= village.reduce((n, id) => n + ROLES_DATA[id].max, 0) ? 1 : 2;
  const deck = emptyDeck();
  deck.werewolf = wolves;

  const deck = source.slice();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  return deck;
}
function deal(deck, names, count) {
  const cards = [];
  ROLE_IDS.forEach((id) => { for (let i = 0; i < deck[id]; i++) cards.push(id); });
  const shuffled = shuffle(cards);
  return names.slice(0, count).map((n, i) => ({
    id: i,
    name: n.trim() || `Player ${i + 1}`,
    role: shuffled[i],
    alive: true,
    protectedTag: false,
    silencedTag: false
  }));
}

/* ------------------------------------------------------------------ */
/* Ambience: procedural night-forest soundscape (Web Audio, no files)  */
/* ------------------------------------------------------------------ */

    bus = ctx.createGain();

    const rl = ctx.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 140;
    const rg = ctx.createGain(); rg.gain.value = 2.2;
    rsrc.connect(rl); rl.connect(rg); rg.connect(bus);
    lfo(rg.gain, 0.05, 0.6);
    rsrc.start(0, rand(0, 3));

      const s = t0 + i * 0.07;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(vol, s + 0.015);

      const loop = () => { if (!running) return; chirp(f * rand(0.98, 1.02), 0.07); later(loop, rand(350, 1500)); };
      later(loop, 300 + i * 450);

  function hoot(t0, f0, dur, vol) {

  return { start, stop, prime, preload: () => { getEl(); }, isRunning: () => running };
})();

const Sfx = (() => {
  // Short effects play through Web Audio (decoded once, starts instantly); an <audio> element is the fallback.
  const FILES = ['audio/card-flip.mp3', 'audio/create.mp3', 'audio/select.mp3', 'audio/deselect.mp3'];
  let ctx = null, started = false;
  const bufs = {}, pool = {};
  const getCtx = () => {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    return ctx;
  };
  const load = (f) => {
    const c = getCtx();
    if (!c || bufs[f] !== undefined) return;
    bufs[f] = null;
    fetch(f).then((r) => r.arrayBuffer()).then((ab) => new Promise((ok, no) => { const pr = c.decodeAudioData(ab, ok, no); if (pr && pr.catch) pr.catch(() => {}); }))
      .then((b) => { bufs[f] = b; }).catch(() => { bufs[f] = false; });
  };
  const fallback = (f) => {
    try {
      if (!pool[f]) { pool[f] = new Audio(f); pool[f].preload = 'auto'; pool[f].setAttribute('playsinline', ''); }
      const x = pool[f]; x.currentTime = 0; const p = x.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) { /* ignore */ }
  };
  const play = (f) => {
    if (!getSettings().sound) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* unsupported */ }
    const c = getCtx();
    if (c && bufs[f]) {
      try {
        if (c.state !== 'running') { const r = c.resume(); if (r && r.catch) r.catch(() => {}); }
        const src = c.createBufferSource(); src.buffer = bufs[f]; src.connect(c.destination); src.start(0);
        return;
      } catch (e) { /* fall through */ }
    }
    if (bufs[f] === undefined) load(f);
    fallback(f);
  };
  return {
    preload: () => { try { FILES.forEach(load); } catch (e) { /* ignore */ } },
    unlock: () => { try { const c = getCtx(); if (c && c.state !== 'running') { const r = c.resume(); if (r && r.catch) r.catch(() => {}); } } catch (e) { /* ignore */ } },
    flip: () => play('audio/card-flip.mp3'),
    enter: () => play('audio/create.mp3'),
    select: () => play('audio/select.mp3'),
    deselect: () => play('audio/deselect.mp3')
  };
})();

['pagehide', 'freeze'].forEach((n) => window.addEventListener(n, () => { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }));
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } } });

const Narrator = (() => {
  const ok = () => typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const pickVoice = () => {
    const vs = window.speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
    return vs.find((v) => /daniel|alex|fred|google uk english male|male/i.test(v.name)) || vs[0] || null;
  };
  return {
    ok,
    speak: (text) => {
      if (!ok()) return;
      const synth = window.speechSynthesis;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(); if (v) u.voice = v;
      u.rate = 0.82; u.pitch = 0.65; u.volume = 1;
      synth.speak(u);
    },
    // Speaks a line and resolves when it ends. A timer guards against engines that never fire "end" (or have no voice).
    say: (text) => new Promise((resolve) => {
      let done = false, t = 0;
      const fin = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
      const est = 1300 + text.split(/\s+/).length * 430;
      if (!ok()) { t = setTimeout(fin, est); return; }
      t = setTimeout(fin, est + 5000);
      try {
        const synth = window.speechSynthesis;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = pickVoice(); if (v) u.voice = v;
        u.rate = 0.82; u.pitch = 0.65; u.volume = 1;
        u.onend = fin; u.onerror = fin;
        synth.speak(u);
      } catch (e) { fin(); }
    }),
    stop: () => { if (ok()) window.speechSynthesis.cancel(); }
  };
})();

function summarizeDeck(deck) {
  return ROLE_IDS.filter((id) => deck[id] > 0).map((id) => {
    if (id === 'werewolf') return `${deck[id]} ${deck[id] === 1 ? 'Wolf' : 'Wolves'}`;
    return deck[id] > 1 ? `${deck[id]} ${ROLES_DATA[id].name}s` : ROLES_DATA[id].name;
  }).join(', ');
}

function GameSheet({ game, onClose, onResume, onRedeal, onEdit }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const active = game.status === 'active' && game.players;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={game.name}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="screen-in relative w-full max-w-md rounded-t-3xl p-5"
        style={{ background: 'var(--card)', border: '1px solid var(--line)', paddingBottom: 'max(20px, env(safe-area-inset-bottom))' }}>
        <h2 className="font-display text-2xl font-bold">{game.name}</h2>
        <p className="mt-1 text-sm text-slate-400">{game.count} Players &middot; {summarizeDeck(game.deck)}</p>
        {active && <p className="mt-2 text-sm text-slate-300">Players: {game.players.map((pl) => pl.name).join(', ')}</p>}
        <div className="mt-5 flex flex-col gap-3">
          {active && <Btn onClick={onResume}>Resume Grimoire</Btn>}
          <Btn variant={active ? 'secondary' : 'primary'} onClick={onRedeal}>Re-deal Same Setup</Btn>
          <Btn variant="secondary" onClick={onEdit}>Edit Setup</Btn>
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

function ChooseCards({ count, deck, setDeck, onBack, onStart, startLabel = 'Start & Deal Cards', showBalance = false }) {
  const [q, setQ] = useState('');
  useEffect(() => { Sfx.preload(); }, []);
  const [notice, setNotice] = useState('');
  const noticeT = useRef(null);
  useEffect(() => () => clearTimeout(noticeT.current), []);
  const warn = (msg) => {
    setNotice(msg + '\u200B'.repeat(Math.floor(Math.random() * 3)));
    clearTimeout(noticeT.current);
    noticeT.current = setTimeout(() => setNotice(''), 2600);
  };
  const total = deckTotal(deck);
  const slotsLeft = count - total;
  const wolves = deck.werewolf;
  const canStart = slotsLeft === 0 && wolves >= 1;

  const change = (id, d) => {
    const next = deck[id] + d;
    if (next < 0 || next > ROLES_DATA[id].max) return;
    if (d > 0 && slotsLeft <= 0) return;
    setDeck({ ...deck, [id]: next });
    if (d > 0) Sfx.select(); else Sfx.deselect();
  };
  const needle = q.trim().toLowerCase();
  const visible = ROLE_IDS.filter((id) => {
    if (!needle) return true;
    const r = ROLES_DATA[id];
    return [r.name, r.ability, r.short, r.blurb, TEAM_LABEL[r.team]].join(' ').toLowerCase().includes(needle);
  });

  const ruleOk = wolves >= 1;
  const ruleColor = ruleOk ? '#34D399' : '#F59E0B';

  return (
    <Screen wide>
      <div className="sticky top-0 z-10 -mx-4 px-4 pb-3 pt-1 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(180deg, var(--bg) 85%, rgba(11,14,20,0))' }}>
        <header className="flex items-center gap-2">
          <button onClick={onBack} aria-label="Back to game setup" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
          </button>
          <h1 className="font-display text-lg font-bold tracking-wide">Choose Cards</h1>
        </header>
        <div className="mt-2 flex items-end justify-between gap-3">
          <div aria-live="polite">
            <div className="font-display text-2xl font-black leading-none tabular-nums text-white">{slotsLeft} {slotsLeft === 1 ? 'slot' : 'slots'} left</div>
            <div className="mt-1 text-sm tabular-nums text-slate-400">{total} / {count} selected</div>
          </div>
          <div className="flex gap-1.5">
            <button onClick={() => setDeck(autoFill(count))} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>Auto-fill</button>
            <button onClick={() => setDeck(emptyDeck())} disabled={total === 0} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-400 hover:bg-white/5 disabled:opacity-30" style={{ border: '1px solid var(--line)' }}>Clear</button>
          </div>
        </div>
        <div role="status" className="mt-2.5 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold"
          style={{ color: ruleColor, background: ruleColor + (ruleOk ? '14' : '1F'), border: `1px solid ${ruleColor}${ruleOk ? '40' : '88'}` }}>
          <span aria-hidden="true">{ruleOk ? '✓' : '!'}</span>
          At least 1 Werewolf required
        </div>
        {showBalance && (() => {
          const bal = deckBalance(deck);
          const fair = bal >= BALANCE_MIN && bal <= BALANCE_MAX;
          const c = total < count ? '#94A3B8' : fair ? '#34D399' : '#F59E0B';
          const label = total < count ? 'Balance updates as you pick' : fair ? 'Balanced deck' : bal < BALANCE_MIN ? 'Favors the Werewolves' : 'Favors the Village';
          return (
            <div className="ml-2 mt-2.5 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold tabular-nums"
              style={{ color: c, background: c + '14', border: `1px solid ${c}55` }} aria-live="polite">
              Balance {bal > 0 ? '+' : ''}{bal} · {label}
            </div>
          );
        })()}
      </div>

      <div className="relative mt-1">
        <svg className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20 L16 16" /></svg>
        <input id="role-search" type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search roles..." aria-label="Search roles"
          className="h-12 w-full rounded-xl pl-10 pr-3 text-[15px] text-slate-100 placeholder-slate-500"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }} />
      </div>

      <div className="mt-4 grid grid-cols-2 gap-3.5 md:grid-cols-3 md:gap-5 lg:grid-cols-4">
        {visible.map((id) => {
          const r = ROLES_DATA[id];
          const n = deck[id];
          const ring = n > 0
            ? (r.team === 'werewolf'
              ? '0 0 0 2px #EF4444, 0 0 26px 3px rgba(220,38,38,0.55)'
              : '0 0 0 2px #E2E8F0, 0 0 24px 3px rgba(226,232,240,0.4)')
            : '0 0 0 1px rgba(203,213,225,0.2)';
          return (
            <div key={id} className="relative aspect-[3/4] overflow-hidden rounded-2xl transition-[box-shadow,opacity] duration-300"
              style={{ boxShadow: ring, opacity: n === 0 && slotsLeft === 0 ? 0.6 : 1, cursor: n === 0 && slotsLeft > 0 ? 'pointer' : 'default' }}
              onClick={(e) => {
                if (e.target.closest && e.target.closest('button')) return;
                if (n === 0 && slotsLeft > 0) change(id, 1);
                else if (slotsLeft <= 0 && (n === 0 || n < r.max)) warn(`All ${count} slots are filled. Remove a card with \u2212 to make room for ${r.name}.`);
                else if (n >= r.max) warn(`Only ${r.max} ${r.name} ${r.max === 1 ? 'card is' : 'cards are'} allowed per game.`);
              }}>
              <div className="h-full w-full transition-[filter] duration-300"
                style={{ filter: n === 0 ? 'grayscale(0.5) brightness(0.78)' : 'none' }}>
                <PlayingCard role={id} />
              </div>
              <QtyPill role={id} n={n} canAdd={slotsLeft > 0 && n < r.max} onChange={(d) => change(id, d)} />
            </div>
          );
        })}
      </div>
      {visible.length === 0 && <p className="mt-6 text-center text-sm text-slate-400">No roles match &ldquo;{q.trim()}&rdquo;.</p>}

      {notice && (
        <div className="pointer-events-none fixed inset-x-0 bottom-32 z-30 flex justify-center px-6" role="status">
          <div key={notice} className="nudge max-w-sm rounded-2xl px-4 py-3 text-center text-sm font-semibold"
            style={{ background: 'rgba(30,18,12,0.96)', color: '#FBBF24', border: '1px solid #F59E0B88', boxShadow: '0 8px 30px rgba(0,0,0,0.6)' }}>{notice.replace(/\u200B/g, '')}</div>
        </div>

          <p className="mb-2 text-center text-xs text-slate-400">
            {slotsLeft > 0 ? `Fill ${slotsLeft} more ${slotsLeft === 1 ? 'slot' : 'slots'}` : ''}{slotsLeft > 0 && !ruleOk ? ' and add ' : ''}{!ruleOk ? (slotsLeft > 0 ? 'a Werewolf' : 'Add a Werewolf') : ''} to continue.
          </p>
        )}
        <Btn disabled={!canStart} onClick={onStart}>{startLabel}</Btn>
      </div>
    </Screen>
  );

function RoleCard({ role, phase }) {
  const r = ROLES_DATA[role];
  const hasImg = !!useCardImage(role);
  const flipped = phase === 'flipping' || phase === 'open';
  const lifted = phase === 'lift' || phase === 'flipping';
  const edge = r.team === 'werewolf' ? '#EF4444' : '#E2E8F0';
  const glow = `0 0 44px -8px ${r.team === 'werewolf' ? 'rgba(220,38,38,0.8)' : 'rgba(226,232,240,0.45)'}`;
  return (
    <div className={`flip-scene aspect-[3/4] ${lifted ? 'is-lifted' : ''}`}>
      <div className={`flip-card ${flipped ? 'is-flipped' : ''}`}>
        <div className="face" style={{ background: '#05070B' }}>
          <CardBackFace />
        </div>
        <div className="face face-front" style={hasImg ? { boxShadow: glow } : { border: `2px solid ${edge}`, boxShadow: glow }}>
          <PlayingCard role={role} />
        </div>
      </div>
    </div>
  );
}

function Reveal({ players, onName, onDone, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const flipped = phase !== 'idle';
  const [busy, setBusy] = useState(false);
  const [input, setInput] = useState('');
  const [entered, setEntered] = useState([]);
  const [nudge, setNudge] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const [showAbility, setShowAbility] = useState(false);
  useEffect(() => { Sfx.preload(); }, []);
  const timer = useRef(null);
  const timers = useRef([]);
  useEffect(() => () => { clearTimeout(timer.current); timers.current.forEach(clearTimeout); }, []);

  const p = players[idx];
  const last = idx === players.length - 1;
  const hasImg = !!useCardImage(p.role);
  const name = input.trim();
  const taken = name !== '' && entered.some((n) => n.toLowerCase() === name.toLowerCase());
  const canReveal = name !== '' && !taken && !busy;

  const reveal = () => {
    if (phase !== 'idle' || busy) return;
    if (!canReveal) {
      if (name === '') {
        setNudge(true); timers.current.push(setTimeout(() => setNudge(false), 1800));
        const el = document.getElementById('player-name'); if (el) el.focus();
      }
      return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Sfx.flip();
    setPhase('lift'); // 0.3s anticipation lift and glow
    timers.current.push(setTimeout(() => setPhase('flipping'), 300)); // 1.2s turn
    timers.current.push(setTimeout(() => setPhase('open'), 1500)); // flip finished
  };
  const hideAndPass = () => {
    if (busy || phase !== 'open') return;
    setBusy(true);
    setShowAbility(false);
    setPhase('idle');
    onName(idx, name);
    setEntered((e) => [...e, name]);
    setInput('');
    timer.current = setTimeout(() => {
      setBusy(false);
      if (last) onDone();
      else setIdx((i) => i + 1);
    }, 700);
  };

  return (
    <Screen className="items-center">
      <div className="relative flex w-full flex-col items-center gap-2.5">
        <ExitButton onClick={() => setConfirmExit(true)} className="absolute -top-1.5 left-0" />
        <span className="rounded-full px-3 py-1 text-xs font-semibold uppercase tabular-nums tracking-[0.18em] text-slate-300"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
          Player {idx + 1} of {players.length}
        </span>
        <div className="flex w-full gap-1" aria-hidden="true">
          {players.map((_, i) => (
            <div key={i} className="h-1 flex-1 rounded-full" style={{ background: i <= idx ? '#CBD5E1' : 'rgba(203,213,225,0.15)' }} />
          ))}
        </div>
      </div>

      <div className="mt-5 min-h-[84px] w-full" aria-live="polite">
        {flipped ? (
          <div className="pt-1 text-center">
            <p className="text-sm text-slate-400">This card belongs to</p>
            <p className="font-display mt-1 break-words text-3xl font-bold leading-tight">{name}</p>
          </div>
        ) : (
          <div role="note" className="flex items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
            style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
            <svg className="mt-0.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z" /><path d="M12 10 V14 M12 17 V17.5" /></svg>
            <span><strong className="font-bold text-amber-200">Eyes only!</strong> Shield your screen and make sure no other players are looking before you reveal your card.</span>
          </div>
        )}
      </div>

      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <div role="button" tabIndex={phase === 'idle' ? 0 : -1} onClick={reveal}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } }}
          aria-label="Tap the card to reveal your role" aria-disabled={phase !== 'idle'}
          className={`${phase === 'idle' ? 'cursor-pointer' : ''} ${nudge ? 'nudge' : ''}`}>
          <RoleCard role={p.role} phase={phase} />
        </div>
        <div className="relative w-full text-center" style={{ minHeight: '5.5rem' }}>
          {phase === 'idle' && (
            <p className={`hint-pulse pt-1 text-sm font-semibold tracking-wide ${nudge ? 'text-amber-300' : 'text-slate-300'}`}>
              {name === '' ? 'Enter your name, then tap the card' : 'Tap the card to reveal'}
            </p>
          )}
          <div className={`absolute inset-x-0 top-0 mx-auto text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`}
            style={{ width: 'min(19rem, 86vw)' }} aria-hidden={phase !== 'open'}>
            <TeamBadge team={ROLES_DATA[p.role].team} />
            {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[p.role].ability}</p>}
          </div>
        </div>
      </div>

      <div className="flex w-full flex-col justify-end pt-2" style={{ minHeight: '10rem', paddingBottom: '2rem' }}>
        {phase === 'idle' ? (
          <div className="w-full">
            <label htmlFor="player-name" className="sr-only">Your name</label>
            <input id="player-name" type="text" value={input} maxLength={18} autoComplete="off" placeholder="Enter your name..."
              onChange={(e) => { setInput(e.target.value); setNudge(false); }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
              className="h-14 w-full rounded-xl px-4 text-center text-lg text-slate-100 placeholder-slate-500"
              style={{ background: 'var(--card)', border: `1px solid ${taken || nudge ? '#F59E0B' : 'rgba(203,213,225,0.3)'}` }} />
            <p role="alert" className="mt-2 min-h-[18px] text-center text-xs text-amber-300">
              {taken ? 'An earlier player already used that name. Add an initial.' : ''}
            </p>
          </div>
        ) : (
          <div className={`flex flex-col gap-3 ${phase === 'open' ? '' : 'invisible'}`} aria-hidden={phase !== 'open'}>
            <button onClick={() => setShowAbility(true)} disabled={phase !== 'open'}
              className="flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl text-sm font-semibold text-slate-200 hover:bg-white/5"
              style={{ background: 'transparent', border: '1px solid var(--line)' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11 V16 M12 7.5 V7.6" /></svg>
              View Ability
            </button>
            <Btn variant="secondary" disabled={busy || phase !== 'open'} onClick={hideAndPass}>
              {last ? 'Hide & Finish' : 'Hide & Pass to Next Player'}
            </Btn>
          </div>
        )}
      </div>
      {showAbility && <AbilityModal role={p.role} onClose={() => setShowAbility(false)} />}
      {confirmExit && (
        <ConfirmExit body="The cards dealt so far will be discarded. You can deal again any time from My Games."
          onCancel={() => setConfirmExit(false)} onConfirm={onExit} />
      )}
    </Screen>
  );
}

function HoldButton({ onComplete, ms = 1500, aria = 'Press and hold for one and a half seconds to unlock the Moderator view', children }) {
  const [p, setP] = useState(0);
  const raf = useRef(0);
  const start = useRef(0);
  const done = useRef(false);

  const tick = useCallback(() => {
    const v = Math.min(1, (performance.now() - start.current) / ms);
    setP(v);
    if (v >= 1) {
      if (!done.current) { done.current = true; onComplete(); }
      return;
    }
    raf.current = requestAnimationFrame(tick);
  }, [ms, onComplete]);

  const begin = () => {
    cancelAnimationFrame(raf.current);
    done.current = false;
    start.current = performance.now();
    raf.current = requestAnimationFrame(tick);
  };
  const cancel = () => {
    cancelAnimationFrame(raf.current);
    if (!done.current) setP(0);
  };
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  return (
    <button
      className="no-select relative min-h-[72px] w-full overflow-hidden rounded-2xl text-base font-semibold text-white"
      style={{ background: 'var(--card-2)', border: '1px solid rgba(203,213,225,0.3)' }}
      onPointerDown={begin} onPointerUp={cancel} onPointerLeave={cancel} onPointerCancel={cancel}
      onContextMenu={(e) => e.preventDefault()}
      onKeyDown={(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } }}
      onKeyUp={(e) => { if (e.key === ' ' || e.key === 'Enter') cancel(); }}
      aria-label={aria}>
      <span className="absolute inset-y-0 left-0" style={{ width: `${p * 100}%`, background: 'linear-gradient(90deg, #991B1B, #DC2626)' }} />
      <span className="relative">{p > 0 && p < 1 ? 'Keep holding…' : children}</span>
    </button>
  );
}

const NIGHT_ORDER = ['werewolf', 'seer', 'bodyguard', 'witch', 'spellcaster'];
const NIGHT_WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
const nightWord = (n) => NIGHT_WORDS[n] || String(n);
const roleLabel = (id) => (id === 'werewolf' ? 'Werewolves' : ROLES_DATA[id].name);
const NIGHT_PROMPT = {
  werewolf: 'Werewolves, choose who to hunt.',
  seer: 'Seer, choose who to inspect.',
  bodyguard: 'Bodyguard, choose someone to protect.',
  witch: 'Witch, you hold one save and one poison. Who do you wish to save or kill?',
  spellcaster: 'Spellcaster, choose who to silence.'
};
const PROTECTED_LINE = 'The Werewolves attacked overnight, but the victim was protected!';
function dawnLines(saved, deadNames, silencedName) {
  const out = [];
  if (saved) out.push(deadNames.length ? PROTECTED_LINE : PROTECTED_LINE + ' No one was eliminated.');
  deadNames.forEach((n) => out.push(`${n} was found dead this morning.`));
  if (!out.length) out.push('The night passed quietly. No one was eliminated.');
  if (silencedName) out.push(`${silencedName} has been silenced for the day. They cannot speak or vote.`);
  return out;
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Day artwork (or the dawn gradient) with the 0.65 readability overlay. Sits behind content.
function DayArt() {

function DayBackdrop() {

function DayStage({ children }) {

      </div>

// Local discussion timer: tap to start or pause, add a minute, reset.
function DayTimer({ minutes = 3 }) {
  const [left, setLeft] = useState(minutes * 60);
  const [on, setOn] = useState(false);
  useEffect(() => {
    if (!on) return;
    const t = setInterval(() => setLeft((v) => Math.max(0, v - 1)), 1000);
    return () => clearInterval(t);
  }, [on]);
  useEffect(() => { if (left === 0) setOn(false); }, [left]);
  const mm = String(Math.floor(left / 60)).padStart(1, '0'), ss = String(left % 60).padStart(2, '0');
  return (
    <Panel className="text-center">
      <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-300">Discussion</div>
      <div className={`font-display mt-1 text-5xl font-black tabular-nums ${left === 0 ? 'hint-pulse text-red-300' : 'text-slate-50'}`} role="timer" aria-live="off">{mm}:{ss}</div>
      {left === 0 && <p className="mt-1 text-sm font-semibold text-red-200">Time is up. Time to vote.</p>}
      <div className="mt-3 flex gap-2">
        <button onClick={() => setOn(!on)} disabled={left === 0} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-100 disabled:opacity-40" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>{on ? 'Pause' : left === minutes * 60 ? 'Start' : 'Resume'}</button>
        <button onClick={() => setLeft((v) => v + 60)} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-100" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>+1 min</button>
        <button onClick={() => { setOn(false); setLeft(minutes * 60); }} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-300" style={{ border: '1px solid var(--line)' }}>Reset</button>
      </div>
    </Panel>
  );
}

  return (
    <div className={`${fixed ? 'fixed inset-0 z-40' : 'relative min-h-[70vh] rounded-3xl'} overflow-hidden ${shake ? 'dawn-shake' : ''}`} style={{ background: pitch ? '#000' : '#03050A' }}>

function NightActPP({ role, players, actor, choices, onDone }) {

    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub="Agree silently, then one of you taps the name." />
        <PickList players={opts(alive.filter((p) => p.role !== 'werewolf'))} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ werewolf: pick })}>{pick === null ? 'Select a target' : 'Confirm Target'}</Btn>
      </div>

        {target && <GhostFlip key={target.id} name={target.name} wolf={target.role === 'werewolf'} />}
        {target
          ? <Btn className="mt-5" onClick={() => onDone({ seer: seen })}>Done</Btn>
          : <Btn className="mt-5" disabled={pick === null} onClick={() => setSeen(pick)}>{pick === null ? 'Select a player' : 'Confirm Inspection'}</Btn>}
      </div>
    );
  }
  if (role === 'bodyguard') {
    const last = actor.lastGuard;
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub={last !== undefined && last !== null ? `You cannot protect ${nm(last)} two nights in a row.` : 'They cannot be eliminated tonight.'} />
        <PickList players={opts(alive)} value={val} onChange={choose} disabled={last !== undefined && last !== null ? [last] : []} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ bodyguard: pick })}>{pick === null ? 'Select a player' : 'Confirm Protection'}</Btn>
      </div>
    );
  }
  if (role === 'spellcaster') {
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub="They may not speak during tomorrow’s discussion." />
        <PickList players={opts(alive.filter((p) => p.id !== actor.id))} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ spellcaster: pick })}>{pick === null ? 'Select a player' : 'Confirm Silence'}</Btn>
      </div>
    );
  }
  // witch
  const victim = choices.werewolf !== undefined && choices.werewolf !== null ? choices.werewolf : null;
  const canSave = !actor.saveUsed && victim !== null;
  return (
    <div className="flex flex-1 flex-col">
      <ActHeader role={role} />
      <Panel className="text-center" style={{ border: '1px solid rgba(239,68,68,0.6)', background: 'rgba(127,29,29,0.22)', boxShadow: '0 0 30px -8px rgba(239,68,68,0.7)' }}>
        <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-red-300">The Werewolves chose</div>
        <div className="font-display mt-1 text-2xl font-black text-slate-50">{victim !== null ? nm(victim) : 'No one'}</div>
        {actor.saveUsed
          ? <p className="mt-2 text-xs text-slate-500">Your save potion is already used.</p>
          : <button disabled={!canSave} onClick={() => setSave(!save)} aria-pressed={save}
              className="mt-3 flex min-h-[52px] w-full items-center justify-center rounded-xl text-[15px] font-bold transition disabled:opacity-40"
              style={{ background: save ? 'rgba(16,185,129,0.28)' : 'var(--card-2)', border: `1px solid ${save ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>
              {save ? `Saving ${nm(victim)} ✓` : 'Save Target'}
            </button>}
      </Panel>
      {actor.poisonUsed
        ? <p className="mt-4 text-center text-xs text-slate-500">Your poison is already used.</p>
        : <>
            <div className="mb-2 mt-4 text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Poison a player (optional)</div>
            <PickList players={opts(alive.filter((p) => p.id !== actor.id))} value={val} onChange={choose} />
          </>}
      <Btn className="mt-5" onClick={() => onDone({ witchSave: save && canSave, witchPoison: pick })}>{pick !== null ? 'Confirm Poison' : save && canSave ? 'Confirm Save' : 'Do Nothing Tonight'}</Btn>
    </div>
  );
}

function resolveNightPP(players, c, night) {
  const has = (v) => v !== null && v !== undefined;
  const byId = new Map(players.map((p) => [p.id, p]));
  const victim = has(c.werewolf) ? c.werewolf : null;
  const guarded = has(c.bodyguard) ? c.bodyguard : null;
  const poison = has(c.witchPoison) ? c.witchPoison : null;
  const silenced = has(c.spellcaster) ? c.spellcaster : null;
  const saved = victim !== null && (victim === guarded || !!c.witchSave);
  const dead = [];
  if (victim !== null && !saved) dead.push(victim);
  if (poison !== null && poison !== guarded && !dead.includes(poison)) dead.push(poison);
  const next = players.map((p) => {
    const q = { ...p, nn: night, protectedTag: p.id === guarded, silencedTag: p.alive && p.id === silenced };
    if (dead.includes(p.id)) { q.alive = false; q.protectedTag = false; q.silencedTag = false; }
    if (p.role === 'bodyguard' && p.alive && guarded !== null) q.lastGuard = guarded;
    if (p.role === 'witch') { if (c.witchSave && victim !== null) q.saveUsed = true; if (poison !== null) q.poisonUsed = true; }
    return q;
  });
  const silencedName = silenced !== null && byId.get(silenced) && !dead.includes(silenced) ? byId.get(silenced).name : '';
  return { next, dead, saved, victim, silenced, silencedName, lines: dawnLines(saved, dead.map((id) => byId.get(id).name), silencedName) };
}

// Pass & Play: the narrator runs the whole night by voice. One device, passed to each role in turn.
function NightLoopPP({ players, night, onFinish, onExit }) {
  const roles = useMemo(() => NIGHT_ORDER.filter((r) => players.some((p) => p.alive && p.role === r)), []);
  const [st, setSt] = useState({ k: 'title' });
  const [count, setCount] = useState(5);
  const [res, setRes] = useState(null);
  const [spoken, setSpoken] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const ch = useRef({});
  const reveal = useSettings().revealDead;

  useEffect(() => () => Narrator.stop(), []);
  const after = (i) => (i + 1 < roles.length ? { k: 'call', i: i + 1 } : { k: 'dawnSay' });

  useEffect(() => {
    let off = false;
    (async () => {
      if (st.k === 'title') {
        await Narrator.say('Night begins. Everyone, close your eyes.');
        if (!off) setSt({ k: 'close' });
      } else if (st.k === 'close') {
        for (let n = 5; n > 0; n--) { setCount(n); await wait(1000); if (off) return; }
        setSt(roles.length ? { k: 'call', i: 0 } : { k: 'dawnSay' });
      } else if (st.k === 'call') {
        await Narrator.say(`${roleLabel(roles[st.i])}, open your eyes.`);
        if (!off) setSt({ k: 'unlock', i: st.i });
      } else if (st.k === 'sleep') {
        await Narrator.say(`${roleLabel(roles[st.i])}, close your eyes.`);
        if (off) return;
        setSt({ k: 'dark', i: st.i });
      } else if (st.k === 'dark') {
        await wait(2600);
        if (!off) setSt(after(st.i));
      } else if (st.k === 'dawnSay') {
        await Narrator.say('Everyone, open your eyes. Morning has broken.');
        if (off) return;
        const r = resolveNightPP(players, ch.current, night);
        setRes(r); setSpoken(false); setSt({ k: 'dawn' });
      } else if (st.k === 'dawn') {
        await wait(900);
        for (const line of res.lines) { if (off) return; await Narrator.say(line); }
        if (!off) setSpoken(true);
      }
    })();
    return () => { off = true; };
  }, [st]);

  const actorOf = (role) => players.find((p) => p.alive && p.role === role);
  let body = null, dawn = false, shake = false, flash = false;
  if (st.k === 'title') body = <LockView key="t" title={`Night ${nightWord(night)} Begins...`} sub="The village falls silent." />;
  else if (st.k === 'close') body = <LockView key="c" eye title="Close Your Eyes" sub="Keep them closed until the narrator says otherwise." count={count} />;
  else if (st.k === 'call') body = <LockView key={'call' + st.i} title="Eyes closed" sub="Listen to the narrator." />;
  else if (st.k === 'unlock') {
    body = (
      <div className="flex flex-1 flex-col items-center justify-center gap-6 text-center">
        <LockView key={'u' + st.i} title={roleLabel(roles[st.i])} sub="Only this role may look. Everyone else, eyes closed." />
        <Btn className="max-w-xs" onClick={() => setSt({ k: 'act', i: st.i })}>Tap to Unlock Secretly</Btn>
      </div>
    );
  } else if (st.k === 'act') {
    const role = roles[st.i];
    body = <NightActPP key={'a' + st.i} role={role} players={players} actor={actorOf(role)} choices={ch.current}
      onDone={(c) => { Object.assign(ch.current, c); setSt({ k: 'sleep', i: st.i }); }} />;
  } else if (st.k === 'sleep' || st.k === 'dark') body = <LockView key={'s' + st.i} title="Keep your eyes closed..." sub="The night is not over." />;
  else if (st.k === 'dawnSay') { body = <LockView key="ds" fadeMoon title="Morning has broken" />; dawn = true; shake = true; flash = true; }
  else if (st.k === 'dawn' && res) {
    dawn = true;
    body = (
      <div className="flex flex-1 flex-col items-center justify-center gap-5 py-6 text-center">
        <p className="cap-in text-[11px] font-bold uppercase tracking-[0.3em] text-amber-300">Morning of day {night}</p>
        {res.lines.map((t, i) => <p key={i} className="font-display cap-in text-2xl font-bold leading-snug text-slate-50" style={{ animationDelay: `${0.2 + i * 1.1}s` }}>{t}</p>)}
        {res.dead.length > 0 && reveal && (
          <div className="flex flex-wrap items-start justify-center gap-4">
            {res.dead.map((id) => { const p = players.find((x) => x.id === id); return <NightCard key={id} player={p} line={`${p.name} was the ${ROLES_DATA[p.role].name}`} />; })}
          </div>
        )}
        <Btn className="mt-2 max-w-xs" disabled={!spoken} onClick={() => onFinish(res)}>{spoken ? 'Continue to the Day' : 'The narrator speaks...'}</Btn>
      </div>
    );
  }
  return (
    <NightStage dawn={dawn} day={st.k === 'dawn'} shake={shake} flash={flash} onExit={() => setConfirmExit(true)}>
      {body}
      {confirmExit && (
        <ConfirmExit confirmLabel="Leave night" body="The night's choices so far are discarded. You can start the night again from the Grimoire."
          onCancel={() => setConfirmExit(false)} onConfirm={() => { Narrator.stop(); onExit(); }} />
      )}
    </NightStage>
  );
}

const SilencedBadge = () => <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-violet-100" style={{ background: 'rgba(109,40,217,0.45)', border: '1px solid rgba(167,139,250,0.7)' }}>SILENCED</span>;

// Pass & Play day: recap the dawn, talk, then each voter takes the phone and casts a secret ballot. Silenced players cannot vote.
function DayTrial({ players, setPlayers, night, info, onNight, onAgain }) {
  const reveal = useSettings().revealDead;
  const [phase, setPhase] = useState('talk'); // talk | vote | result
  const [pick, setPick] = useState(null);
  const [roles, setRoles] = useState(false);
  const [res, setRes] = useState(null);
  const [out, setOut] = useState(null);
  const [hunter, setHunter] = useState(null);
  const [shot, setShot] = useState(null);
  const alive = players.filter((p) => p.alive);
  const voters = alive.filter((p) => !p.silencedTag);
  const silenced = alive.filter((p) => p.silencedTag);
  const wolves = alive.filter((p) => ROLES_DATA[p.role].team === 'werewolf').length;
  const village = alive.length - wolves;
  const over = wolves === 0 ? { text: 'No Werewolves are left. The Village wins!', color: '#34D399' } : wolves >= village ? { text: 'The Werewolves match or outnumber the Village. The Werewolves win!', color: '#F87171' } : null;
  const kill = (ids) => setPlayers(players.map((p) => (ids.includes(p.id) ? { ...p, alive: false, protectedTag: false, silencedTag: false } : p)));
  const opts = (list) => list.map((p) => ({ id: p.id, n: p.name }));
  const nm = (id) => (players.find((p) => p.id === id) || {}).name || '?';
  const startVote = () => { setPick(null); setOut(null); setRes(null); setPhase('vote'); };
  const eliminate = () => {
    const p = players.find((x) => x.id === pick); if (!p) return;
    kill([p.id]); setOut(p); setRes({ tally: {}, ranked: [], top: p.id, tie: false, skipped: false });
    if (p.role === 'hunter') setHunter(p);
    setPhase('result');
  };
  const skipVote = () => { setOut(null); setRes({ tally: {}, ranked: [], top: null, tie: false, skipped: true }); setPhase('result'); };
  const fire = () => { const t = players.find((x) => x.id === shot); if (!t) return; kill([t.id]); setOut(t); setHunter(null); setShot(null); };

  return (
    <DayStage>
      <header className="pb-3">
        <p className="text-[11px] font-bold uppercase tracking-[0.28em] text-amber-300">Day {night}</p>
        <h1 className="font-display text-3xl font-bold tracking-wide text-slate-50">{phase === 'vote' ? 'The Vote' : 'The Village Wakes'}</h1>
      </header>
      {phase === 'talk' && (
        <>
          {info && (
            <Panel className="text-center" style={{ border: '1px solid rgba(251,191,36,0.4)', background: 'rgba(21,26,36,0.82)' }}>
              {info.lines.map((t, i) => <p key={i} className="font-display text-lg font-bold leading-snug text-slate-50">{t}</p>)}
              {reveal && info.dead.length > 0 && <p className="mt-2 text-sm text-slate-300">{info.dead.map((id) => `${nm(id)}: ${ROLES_DATA[players.find((x) => x.id === id).role].name}`).join(' · ')}</p>}
            </Panel>
          )}
          {silenced.length > 0 && (
            <p role="alert" className="mt-3 rounded-xl px-4 py-2.5 text-center text-sm font-semibold text-violet-100" style={{ background: 'rgba(109,40,217,0.3)', border: '1px solid rgba(167,139,250,0.6)' }}>
              {silenced.map((p) => p.name).join(', ')} {silenced.length > 1 ? 'have' : 'has'} been silenced by the Spellcaster and cannot speak or vote today.
            </p>
          )}
          {over && <p role="status" className="mt-3 rounded-xl px-4 py-3 text-center text-sm font-bold" style={{ color: over.color, background: 'rgba(10,10,18,0.8)', border: `1px solid ${over.color}66` }}>{over.text}</p>}
          <div className="mt-3"><DayTimer /></div>
          <Panel className="mt-3" style={{ background: 'rgba(21,26,36,0.82)' }}>
            <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Players still alive</h2>
            <ul className="flex flex-col gap-1.5">
              {alive.map((p) => <li key={p.id} className="flex items-center justify-between gap-2 text-[15px] font-semibold text-slate-100"><span>{p.name}</span>{p.silencedTag && <SilencedBadge />}</li>)}
            </ul>
          </Panel>
        </>
      )}
      {phase === 'vote' && (
        <div className="flex flex-1 flex-col">
          <p className="rounded-xl px-4 py-3 text-center text-sm leading-relaxed text-slate-100" style={{ background: 'rgba(21,26,36,0.85)', border: '1px solid rgba(251,191,36,0.4)' }}>
            Discuss and vote out loud together. Select the player with the most votes, or tap Skip Vote if the vote is tied.
          </p>
          <ul className="mt-3 flex flex-col gap-2" role="listbox" aria-label="Players still alive">
            {alive.map((p) => {
              const sel = pick === p.id;
              return (
                <li key={p.id}>
                  <button role="option" aria-selected={sel} onClick={() => setPick(sel ? null : p.id)}
                    className="flex min-h-[52px] w-full items-center justify-between gap-2 rounded-xl px-4 text-left text-[15px] font-semibold text-slate-50 transition active:scale-[0.99]"
                    style={{ background: sel ? 'rgba(109,40,217,0.45)' : 'rgba(21,26,36,0.85)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none' }}>
                    <span>{p.name}</span>
                    <span className="flex items-center gap-2">{p.silencedTag && <SilencedBadge />}{sel && <span aria-hidden="true" className="text-lg">✓</span>}</span>
                  </button>
                </li>
              );
            })}
          </ul>
          <Btn className="mt-4" disabled={pick === null} onClick={eliminate}>{pick === null ? 'Select a player' : `Confirm Elimination: ${nm(pick)}`}</Btn>

const STORE_KEY = 'nightfall.games.v1';
/* ------------------------------------------------------------------ */
/* Multi-Device: Firebase Realtime Database over plain REST + room logic */
/* ------------------------------------------------------------------ */
// Room shape (kept tiny so it syncs fast on mobile data):
//  { v, host, hp, rn room name, hn host label, ph, k, lk, w, an, pl }
//  ph: lobby | reveal | night | day | over     k: night number     lk: 1 while the host picks cards
//  w: winner ('village' | 'werewolf')          hp: 1 when the host also plays
//  an: { k, l:{0:'text'}, sv, si, x:{ts:'text'} }   morning announcement
//  pl[pid]: { n name, o join order, r roleId, a alive 1/0, d ready 1/0, t night target pid, nd night action done,
//             ws witch save this night, wsu / wpu potion used, lp bodyguard last target, hs hunter shot used, s silenced, lf left }
const SESSION_KEY = 'nightfall.mp.v1';
const MP_ACTIVE = ['werewolf', 'seer', 'bodyguard', 'witch', 'spellcaster'];
const MP_MIN = 4;
const MP_MAX = 8;
const CODE_WORDS = ['WOLF', 'MOON', 'FANG', 'HOWL', 'PACK', 'CLAW', 'DARK', 'BONE', 'MIST', 'GRIM', 'CROW', 'BATS', 'DUSK', 'DAWN', 'HUNT', 'PREY', 'FEAR', 'GORE', 'MAUL', 'OMEN'];

function normalizeDbUrl(u) {
  let s = String(u || '').trim();
  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  return s.replace(/\/+$/, '').replace(/\.json$/i, '').replace(/\/+$/, '');
}
function getDbUrl() {
  return normalizeDbUrl(getSettings().fbUrl) || normalizeDbUrl(DEFAULT_FIREBASE_URL);
}

// Local stand-in for Firebase, used when the browser blocks the network (for example the Claude preview sandbox).
// It keeps the same path / PATCH / null-deletes rules, and lives in localStorage so tabs on one device can talk.
const LOCAL_KEY = 'nightfall.mp.local.v1';
let memDb = {};
const localRead = () => { try { const v = localStorage.getItem(LOCAL_KEY); if (v !== null) return JSON.parse(v) || {}; } catch (e) { /* fall back to memory */ } return memDb; };
const localWrite = (db) => { memDb = db; try { localStorage.setItem(LOCAL_KEY, JSON.stringify(db)); } catch (e) { /* memory only */ } };
const localPrune = (o) => {
  if (o && typeof o === 'object') {
    Object.keys(o).forEach((k) => { o[k] = localPrune(o[k]); if (o[k] === null || o[k] === undefined) delete o[k]; });
    if (!Object.keys(o).length) return null;
  }
  return o;
};
function localReq(method, path, body) {
  const parts = path.split('/').filter(Boolean);
  const db = localRead();
  const setAt = (ps, val) => {
    let n = db;
    ps.slice(0, -1).forEach((x) => { if (n[x] == null || typeof n[x] !== 'object') n[x] = {}; n = n[x]; });
    if (val === undefined) delete n[ps[ps.length - 1]]; else n[ps[ps.length - 1]] = val;
  };
  if (method === 'GET') {
    let n = db;
    for (const x of parts) { if (n == null || typeof n !== 'object') return null; n = n[x]; }
    return n === undefined ? null : JSON.parse(JSON.stringify(n));
  }
  const clone = (v) => (v === null || v === undefined ? undefined : localPrune(JSON.parse(JSON.stringify(v))));
  if (method === 'PUT') setAt(parts, clone(body));
  else if (method === 'PATCH') Object.keys(body).forEach((k) => setAt(parts.concat(k.split('/').filter(Boolean)), clone(body[k])));
  else if (method === 'DELETE') setAt(parts, undefined);
  localPrune(db);
  localWrite(db);
  return method === 'DELETE' ? null : body;
}

const Mp = {
  local: false,
  async req(method, path, body) {
    if (Mp.local) return localReq(method, path, body);
    const base = getDbUrl();
    if (!base) throw new Error('no-url');
    // No custom headers: a plain request avoids a CORS preflight and Firebase reads the JSON body anyway.
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 10000) : 0;
    let res;
    try { res = await fetch(`${base}/${path}.json`, { method, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store', signal: ctl ? ctl.signal : undefined }); }
    catch (e) { throw new Error('network'); } // Failed to fetch / Load failed / blocked by the page's CSP
    finally { clearTimeout(timer); }
    if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'denied' : `http-${res.status}`);
    return res.status === 204 ? null : res.json();
  },
  get: (p) => Mp.req('GET', p),
  put: (p, b) => Mp.req('PUT', p, b),
  patch: (p, b) => Mp.req('PATCH', p, b),
  del: (p) => Mp.req('DELETE', p)
};
function mpErrorText(e) {
  const m = e && e.message;
  if (m === 'no-url') return 'No multiplayer server is set up yet.';
  if (m === 'denied') return 'The database refused access. In Firebase, set the Realtime Database rules to allow read and write.';
  if (/^http-/.test(m || '')) return `The server answered with an error (${m.slice(5)}). Check the database URL in Settings.`;
  return 'Could not reach the server. Check your connection and the database URL in Settings.';
}

const randId = () => 'p' + Math.random().toString(36).slice(2, 8);
const randLetters = () => Array.from({ length: 4 }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');
const cleanCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

// Try the real server first; if the browser blocks the network, redo the same step against the local stand-in.
async function mpWithFallback(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.message === 'network' && !Mp.local) { Mp.local = true; return fn(); }
    throw e;
  }
}
const mpCreateRoom = (name, hostPlays, roomName) => mpWithFallback(() => mpCreateRoomImpl(name, hostPlays, roomName));
const mpJoinRoom = (codeIn, name) => mpWithFallback(() => mpJoinRoomImpl(codeIn, name));

async function mpCreateRoomImpl(name, hostPlays, roomName) {
  const pid = randId();
  let code = '';
  const words = shuffle(CODE_WORDS);
  for (let i = 0; i < 12; i++) {
    const c = i < words.length ? words[i] : randLetters();
    const existing = await Mp.get(`rooms/${c}`);
    if (!existing) { code = c; break; }
  }
  if (!code) throw new Error('no-code');
  const room = { v: 1, host: pid, hp: hostPlays ? 1 : 0, rn: (roomName || '').trim() || 'Nightfall Village', hn: hostPlays ? name : 'Moderator', ph: 'lobby', k: 0, lk: 0, w: '', ts: Date.now() };
  if (hostPlays) room.pl = { [pid]: { n: name, o: 1, a: 1, d: 0 } };
  await Mp.put(`rooms/${code}`, room);
  return { code, pid, host: true, local: Mp.local };
}

async function mpJoinRoomImpl(codeIn, name) {
  const code = cleanCode(codeIn);
  if (code.length !== 4) throw new Error('bad-code');
  const room = await Mp.get(`rooms/${code}`);
  if (!room) throw new Error('not-found');
  if (room.ph !== 'lobby') throw new Error('started');
  if (room.lk) throw new Error('locked');
  const pl = roomPlayers(room);
  if (pl.length >= MP_MAX) throw new Error('full');
  if (pl.some((p) => p.n.toLowerCase() === name.toLowerCase())) throw new Error('name-taken');
  const pid = randId();
  const o = pl.reduce((m, p) => Math.max(m, p.o || 0), 0) + 1;
  await Mp.patch(`rooms/${code}/pl/${pid}`, { n: name, o, a: 1, d: 0 });
  return { code, pid, host: false, local: Mp.local };
}
function mpJoinErrorText(e) {
  const m = e && e.message;
  return ({
    'bad-code': 'Enter the 4-letter room code.',
    'not-found': 'No room with that code. Check the letters and try again.',
    started: 'That game has already started.',
    locked: 'The host is choosing cards, so the room is closed to new players.',
    full: `That room is full (${MP_MAX} players).`,
    'name-taken': 'Someone in that room already uses this name. Add an initial.'
  })[m] || mpErrorText(e);
}

/* ---- pure helpers on a room snapshot ---- */
const roomPlayers = (room) => Object.entries((room && room.pl) || {}).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.o || 0) - (b.o || 0));
const mpNightRoles = (players) => Array.from(new Set(players.map((p) => p.r).filter((r) => MP_ACTIVE.includes(r)))).sort((a, b) => ROLES_DATA[a].nightOrder - ROLES_DATA[b].nightOrder);
function mpWinner(players) {
  const live = players.filter((p) => p.a === 1 && p.r);
  if (!players.some((p) => p.r)) return '';
  const wolves = live.filter((p) => p.r === 'werewolf').length;
  const others = live.length - wolves;
  if (wolves === 0) return 'village';
  if (wolves >= others) return 'werewolf';
  return '';
}
// What the wolf pack has chosen so far (most votes wins; ties go to the earliest joined target).
function mpWolfVictim(players) {
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));
  const tally = {};
  players.filter((p) => p.a === 1 && p.r === 'werewolf' && p.t && byId[p.t]).forEach((p) => { tally[p.t] = (tally[p.t] || 0) + 1; });
  const ids = Object.keys(tally).sort((x, y) => tally[y] - tally[x] || (byId[x].o || 0) - (byId[y].o || 0));
  return ids[0] || '';
}

function mpDealPatch(room, deck) {
  const players = roomPlayers(room);
  const cards = [];
  ROLE_IDS.forEach((id) => { for (let i = 0; i < (deck[id] || 0); i++) cards.push(id); });
  const mix = shuffle(cards);
  const patch = { ph: 'reveal', lk: 0, w: '', an: null, k: 0 };
  players.forEach((p, i) => {
    const b = `pl/${p.id}/`;
    Object.assign(patch, { [b + 'r']: mix[i], [b + 'a']: 1, [b + 'd']: 0, [b + 't']: '', [b + 'nd']: 0, [b + 'ws']: 0, [b + 'wsu']: 0, [b + 'wpu']: 0, [b + 'lp']: '', [b + 'hs']: 0, [b + 's']: 0, [b + 'v']: '' });
  });
  return patch;
}
function mpLobbyPatch(room) {
  const patch = { ph: 'lobby', lk: 0, w: '', an: null, k: 0, ns: null, nk: null, vd: null };
  roomPlayers(room).forEach((p) => {
    const b = `pl/${p.id}/`;
    ['r', 't', 'nd', 'ws', 'wsu', 'wpu', 'lp', 'hs', 's', 'lf', 'v'].forEach((f) => { patch[b + f] = null; });
    patch[b + 'a'] = 1; patch[b + 'd'] = 0;
  });
  return patch;
}
function mpNightPatch(room) {
  const patch = { ph: 'night', k: (room.k || 0) + 1, ns: 'i', nk: 1, vd: null };
  roomPlayers(room).forEach((p) => {
    const b = `pl/${p.id}/`;
    patch[b + 't'] = ''; patch[b + 'nd'] = 0; patch[b + 'ws'] = 0; patch[b + 'v'] = ''; patch[b + 's'] = 0;
  });
  return patch;
}

// Works out the night from everyone's secret choices and returns the patch that opens the day.
function mpResolveNight(room) {
  const ps = roomPlayers(room);
  const byId = Object.fromEntries(ps.map((p) => [p.id, p]));
  const alive = ps.filter((p) => p.a === 1);
  const victim = mpWolfVictim(ps);
  const bg = alive.find((p) => p.r === 'bodyguard' && p.t && byId[p.t]);
  const guarded = bg ? bg.t : '';
  const witch = alive.find((p) => p.r === 'witch');
  const witchSaves = !!(witch && witch.ws === 1 && !witch.wsu && victim);
  const poison = witch && witch.t && !witch.wpu && byId[witch.t] ? witch.t : '';
  const sc = alive.find((p) => p.r === 'spellcaster' && p.t && byId[p.t]);
  const silenced = sc ? sc.t : '';

  const dead = [];
  let saved = false;
  if (victim) { if (victim === guarded || witchSaves) saved = true; else dead.push(victim); }
  if (poison && poison !== guarded && !dead.includes(poison)) dead.push(poison);

  const lines = dawnLines(saved, dead.map((id) => byId[id].n));
  const silencedAlive = silenced && !dead.includes(silenced) ? silenced : '';
  const an = { k: room.k || 0, t: Date.now(), l: Object.fromEntries(lines.map((t, i) => [i, t])), sv: saved ? 1 : 0, si: silencedAlive };
  if (dead.length && getSettings().revealDead) an.rv = Object.fromEntries(dead.map((id) => [id, byId[id].r]));
  const patch = { ph: 'day', an, ns: null, nk: null };
  ps.forEach((p) => { patch[`pl/${p.id}/s`] = silencedAlive && p.id === silencedAlive ? 1 : 0; });
  dead.forEach((id) => { patch[`pl/${id}/a`] = 0; });
  if (witch && witch.ws === 1 && victim && !witch.wsu) patch[`pl/${witch.id}/wsu`] = 1;
  if (poison) patch[`pl/${witch.id}/wpu`] = 1;
  if (bg) patch[`pl/${bg.id}/lp`] = guarded;
  return { patch, dead, saved, victim, guarded, silenced: silencedAlive, lines, silencedLine: silencedAlive ? `${byId[silencedAlive].n} has been silenced for the day. They cannot speak or vote.` : '' };
}

function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text); } catch (e) { /* fall through */ }
  return new Promise((ok, no) => {
    try {
      const t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      const done = document.execCommand('copy'); document.body.removeChild(t);
      done ? ok() : no(new Error('copy'));
    } catch (e) { no(e); }
  });
}

// Polls the room every 1.5 seconds and cleans up when the screen goes away.
function useRoom(code) {
  const [room, setRoom] = useState(undefined); // undefined = loading, null = room is gone
  const [err, setErr] = useState('');
  const busy = useRef(false);
  const again = useRef(false);
  const live = useRef(true);
  const refresh = useCallback(async () => {
    if (busy.current) { again.current = true; return; }
    busy.current = true;
    try {
      const r = await Mp.get(`rooms/${code}`);
      if (live.current) { setRoom(r); setErr(''); }
    } catch (e) { if (live.current) setErr(mpErrorText(e)); }
    busy.current = false;
    if (again.current && live.current) { again.current = false; refresh(); }
  }, [code]);
  useEffect(() => {
    live.current = true;
    refresh();
    const t = setInterval(() => { if (!document.hidden) refresh(); }, 1500);
    const vis = () => { if (!document.hidden) refresh(); };
    document.addEventListener('visibilitychange', vis);
    return () => { live.current = false; clearInterval(t); document.removeEventListener('visibilitychange', vis); };
  }, [refresh]);
  return { room, err, refresh };
}

          className={phase === 'idle' ? 'cursor-pointer' : ''}>
          <RoleCard role={me.r} phase={phase} />
        </div>
        <div className="relative w-full text-center" style={{ minHeight: '3.5rem' }}>
          {phase === 'idle' && <p className="hint-pulse pt-1 text-sm font-semibold tracking-wide text-slate-300">Tap the card to reveal</p>}
          <div className={`absolute inset-x-0 top-0 mx-auto text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`} style={{ width: 'min(19rem, 86vw)' }}>
            <TeamBadge team={ROLES_DATA[me.r].team} />
            {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[me.r].ability}</p>}
          </div>
        </div>
      </div>
      <div className={`flex w-full flex-col gap-3 pb-2 ${phase === 'open' ? '' : 'invisible'}`}>

        <Btn disabled={phase !== 'open'} onClick={() => { setSent(true); onReady(); }}>I&rsquo;m Ready</Btn>
      </div>
      {showAbility && <AbilityModal role={me.r} onClose={() => setShowAbility(false)} />}
    </div>
  );
}

function PickList({ players, value, onChange, disabled = [], locked }) {
  return (
    <ul className="flex flex-col gap-2" role="listbox">
      {players.map((p) => {
        const off = locked || disabled.includes(p.id);
        const sel = value === p.id;
        return (
          <li key={p.id}>
            <button role="option" aria-selected={sel} disabled={off} onClick={() => onChange(sel ? '' : p.id)}
              className="flex min-h-[52px] w-full items-center justify-between rounded-xl px-4 text-left text-[15px] font-semibold transition active:scale-[0.99] disabled:opacity-40"
              style={{ background: sel ? 'rgba(109,40,217,0.4)' : 'var(--card-2)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none', color: '#E6EAF2' }}>
              {p.n}{sel && <span aria-hidden="true" className="text-lg">✓</span>}
            </button>
          </li>
        );
      })}
    </ul>
  );
}

function SleepPanel({ me, text }) {
