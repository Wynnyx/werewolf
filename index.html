/* ------------------------------------------------------------------ */
/* Custom card art: full pre-designed card images. A role shows its    */
/* uploaded image (localStorage), else ROLES_DATA[id].imageUrl, else   */
/* the built-in SVG card.                                              */
/* ------------------------------------------------------------------ */
/* Decoded-image cache: keeps decoded images referenced so mobile browsers don't drop them. */
const imageCache = new Map();
function preloadImage(src) {
  const hit = imageCache.get(src);
  if (hit) return Promise.resolve(hit);
  return new Promise((resolve) => {
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
    const done = () => {
      if (img.naturalWidth > 0) imageCache.set(src, img);
      resolve(img);
    };
    if (typeof img.decode === 'function') img.decode().then(done, done);
    else { img.onload = done; img.onerror = done; }
  });
}

/* Phase backgrounds: the player's own photo (kept in localStorage) or a built-in default. */
function makeBgStore(key, fallback) {
  let custom = (() => { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } })();
  const listeners = new Set();
  return {
    fallback,
    get: () => custom || fallback,
    isCustom: () => !!custom,
    set: (dataUrl) => {
      custom = dataUrl || '';
      if (custom) preloadImage(custom);
      listeners.forEach((fn) => fn());
      try { if (custom) localStorage.setItem(key, custom); else localStorage.removeItem(key); return true; } catch (e) { return false; }
    },
    use: function () { return React.useSyncExternalStore((fn) => { listeners.add(fn); return () => listeners.delete(fn); }, this.get); }
  };
}
const SHADOW_ART_DEFAULT = 'images/shadow-card.jpg';
const shadowArtStore = makeBgStore('nightfall.shadowart.v1', SHADOW_ART_DEFAULT);
const MEDUSA_ART_DEFAULT = 'images/medusa-card.jpg';

const DAY_BG_DEFAULTS = ['images/day-bg.jpg', 'images/day-1.jpg', 'images/day-2.jpg', 'images/day-3.jpg', 'images/day-4.jpg'];
const POOL_MAX = 12;
// A pool of background images (data URLs or file paths). Custom pools live in localStorage; with none saved, the built-in defaults are used.
function makePool(key, legacyKey, defaults) {
  let custom = null;
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const a = JSON.parse(raw); if (Array.isArray(a) && a.length) custom = a.filter((x) => typeof x === 'string'); }
    else if (legacyKey) {
      const old = localStorage.getItem(legacyKey);
      if (old) { custom = [old, ...defaults]; localStorage.setItem(key, JSON.stringify(custom)); localStorage.removeItem(legacyKey); }
    }
  } catch (e) { custom = null; }
  if (custom && !custom.length) custom = null;
  let cur = custom || defaults;
  const listeners = new Set();
  const commit = (arr) => {
    try { if (arr) localStorage.setItem(key, JSON.stringify(arr)); else localStorage.removeItem(key); } catch (e) { return false; }
    custom = arr; cur = arr || defaults; listeners.forEach((fn) => fn()); return true;
  };

    defaults,
    get: () => cur,
    isCustom: () => !!custom,
    add: (url) => { if (cur.length >= POOL_MAX) return 'full'; const ok = commit([...cur, url]); if (ok) preloadImage(url); return ok; },
    remove: (i) => cur.length > 1 && commit(cur.filter((_, k) => k !== i)),
    reset: () => commit(null),
    use: function () { return React.useSyncExternalStore((fn) => { listeners.add(fn); return () => listeners.delete(fn); }, this.get); }
  };

const nightPool = makePool('nightfall.nightpool.v1', 'nightfall.nightbg.v1', NIGHT_BG_DEFAULTS);
const dayPool = makePool('nightfall.daypool.v1', 'nightfall.daybg.v1', DAY_BG_DEFAULTS);

// Downscale a chosen photo (max 1080 x 1920) to JPEG so it fits comfortably in localStorage.
function fileToBg(file, maxW = 1080, maxH = 1920, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

function emptyDeck() {

// Balanced preset. Every role has a `balance` value (Werewolf -6 each, Village roles positive).
// Aims for a deck total inside -1..+3, closest to +1. Uses 1 Werewolf whenever that can land in the
// window, and 2 only when it cannot. Ties prefer more special roles.
const BALANCE_MIN = -1, BALANCE_MAX = 3, BALANCE_TARGET = 1;
const FILL_PRIORITY = ['seer', 'witch', 'bodyguard', 'hunter', 'spellcaster', 'villager'];
function deckBalance(deck) {

function bestVillageFill(count, wolves) {
  const wolfScore = wolves * ROLES_DATA.werewolf.balance;
  const need = count - wolves;
  const pool = FILL_PRIORITY.filter((id) => ROLES_DATA[id] && ROLES_DATA[id].team === 'village');
  let best = null;
  const counts = {};
  const consider = () => {
    let score = wolfScore, fun = 0;
    pool.forEach((id, i) => { const n = counts[id] || 0; score += n * ROLES_DATA[id].balance; fun += n * (pool.length - i); });
    const dist = score < BALANCE_MIN ? BALANCE_MIN - score : score > BALANCE_MAX ? score - BALANCE_MAX : 0;
    const off = Math.abs(score - BALANCE_TARGET);
    if (!best || dist < best.dist || (dist === best.dist && (off < best.off || (off === best.off && fun > best.fun)))) {
      best = { dist, fun, off, score, wolves, counts: { ...counts } };
    }
  };
  const walk = (i, left) => {
    if (left === 0) { consider(); return; }
    if (i >= pool.length) return;
    const id = pool[i];
    for (let n = Math.min(ROLES_DATA[id].max, left); n >= 0; n--) { counts[id] = n; walk(i + 1, left - n); }
    counts[id] = 0;

function autoFill(count, mode = getGameMode()) {
  // 1 Werewolf (2 only when the table is too big to fill with one of each Village role),
  // then Village roles strictly by priority: Seer first, Villager last.
  const village = FILL_PRIORITY.filter((id) => ROLES_DATA[id] && ROLES_DATA[id].team === 'village');
  const wolves = count <= 7 ? 1 : Math.min(ROLES_DATA.werewolf.max, Math.floor((count - 2) / 3)); // 8-10: 2, 11-13: 3, 14-15: 4
  const deck = emptyDeck();
  deck.werewolf = wolves;
  let left = count - wolves;
  village.forEach((id) => { if (id === 'villager') return; const n = Math.min(1, left); deck[id] = n; left -= n; }); // one of each special role first
  const v = Math.min(ROLES_DATA.villager.max, left); deck.villager = v; left -= v;
  village.forEach((id) => { if (id === 'villager') return; const n = Math.min(ROLES_DATA[id].max - deck[id], left); deck[id] += n; left -= n; }); // then second copies
  if (mode === 'outbreak' && count >= 6) { // Outbreak: one Zombie and one Sniper (plus a Doctor from 8 players) take the slots (plain Villagers first)
    let need = count >= 12 ? 5 : count >= 10 ? 4 : count >= 8 ? 3 : 2;
    ['villager', 'spellcaster', 'hunter'].forEach((id) => { const t = Math.min(need, deck[id]); deck[id] -= t; need -= t; });
    deck.zombie = 1; deck.sniper = 1; if (count >= 8) deck.doctor = 1; if (count >= 10) deck.plaguedoctor = 1; if (count >= 12) deck.infector = 1;
  }

}

// Fisher-Yates
// Unbiased random integer in [0, n). Uses the browser's crypto source when available.
function randInt(n) {
  try {
    const c = window.crypto || window.msCrypto;
    if (c && c.getRandomValues) {
      const limit = Math.floor(4294967296 / n) * n;
      const buf = new Uint32Array(1);
      do { c.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
  } catch (e) { /* fall back below */ }
  return Math.floor(Math.random() * n);
}
// Fisher-Yates. Always works on a fresh copy and draws new random numbers on every call, so no deal reuses an earlier order.
function shuffle(source) {
  const deck = source.slice();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  return deck;
}
function deal(deck, names, count) {
  const cards = [];
  ROLE_IDS.forEach((id) => { for (let i = 0; i < deck[id]; i++) cards.push(id); });
  const shuffled = shuffle(cards);
  return names.slice(0, count).map((n, i) => ({
    id: i,
    name: n.trim() || `Player ${i + 1}`,
    role: shuffled[i],
    alive: true,
    protectedTag: false,
    silencedTag: false,
    stoneTag: false

    if (c && bufs[f]) {

// Global UI click sound: one delegated listener covers every current and future button.
// It runs after React's own handlers, so a button that plays its own sound (stamped in Sfx) or carries data-no-ui-sound stays single-voiced.
document.addEventListener('pointerdown', () => Sfx.unlock(), { passive: true, capture: true }); // wake the AudioContext on the first touch (iOS)
document.addEventListener('click', (e) => {
  if (!e.isTrusted || !e.target || !e.target.closest) return;
  const el = e.target.closest('button, [role="button"]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' || el.closest('[data-no-ui-sound]')) return;
  Sfx.click(el.closest('[data-ui-sound="primary"]') ? 'primary' : 'tap');
});

['pagehide', 'freeze'].forEach((n) => window.addEventListener(n, () => { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }));
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } } });

  langNow = l === 'th' ? 'th' : 'en';

  document.documentElement.lang = langNow;

    if (!joined.trim()) return;
    const out = langNow === 'th' ? trTh(joined) : joined;
    note(joined);
    nodes.forEach((n, i) => {
      const want = out === joined ? orig.get(n) : (i === 0 ? out : '');
      if (n.data !== want) n.data = want;
      wrote.set(n, want);
    });
  }
  function runOf(n) {
    let a = n; while (a.previousSibling && a.previousSibling.nodeType === 3) a = a.previousSibling;
    const run = []; while (a && a.nodeType === 3) { run.push(a); a = a.nextSibling; }
    return run;
  }
  function attrs(el) {
    let st = attrState.get(el);
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const cur = el.getAttribute(a);
      if (!st) { st = {}; attrState.set(el, st); }
      if (!st[a] || st[a].wrote !== cur) st[a] = { orig: cur, wrote: cur };
      const out = langNow === 'th' ? trTh(st[a].orig) : st[a].orig;
      if (out !== cur) el.setAttribute(a, out);
      st[a].wrote = out;
      note(st[a].orig);
    }
  }
  function walk(root) {
    if (root.nodeType === 3) { runText(runOf(root)); return; }
    if (root.nodeType !== 1) return;
    const tag = root.tagName; if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'svg') return;
    attrs(root);
    let run = [];
    root.childNodes.forEach((c) => {
      if (c.nodeType === 3) run.push(c);
      else { if (run.length) { runText(run); run = []; } walk(c); }
    });
    if (run.length) runText(run);
  }
  let started = false;
  function start() {
    if (started || !document.body) return; started = true;
    const mo = new MutationObserver((recs) => {
      for (const r of recs) {
        if (r.type === 'characterData') runText(runOf(r.target));
        else if (r.type === 'attributes') attrs(r.target);
        else r.addedNodes.forEach((n) => walk(n));
      }
    });
    mo.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
    langListeners.add(() => walk(document.body));
    walk(document.body);
  }
  return { start, walk };
})();
if (document.body) I18N.start(); else document.addEventListener('DOMContentLoaded', () => I18N.start());

const Narrator = (() => {
  const supported = () => typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  // In Thai mode, speech needs a Thai voice. If the device lists voices and none is Thai, narration falls back to the on-screen text with timed pauses.
  const hasVoice = () => {
    return true;
    try { const vs = window.speechSynthesis.getVoices(); return vs.length === 0 || vs.some((v) => /^th/i.test(v.lang)); } catch (e) { return false; }
  };
  const ok = () => supported() && hasVoice();
  const pickVoice = () => {
    const th = false;
    const vs = window.speechSynthesis.getVoices().filter((v) => (th ? /^th/i.test(v.lang) : /^en/i.test(v.lang)));
    if (th) return vs[0] || null;
    return vs.find((v) => /daniel|alex|fred|google uk english male|male/i.test(v.name)) || vs[0] || null;
  };
  const tune = (u) => {
    u.lang = 'en-US'; u.rate = 0.82; u.pitch = 0.65; // narrator audio is English only
    u.volume = 1;
  };
  return {
    ok,
    speak: (text) => {
      if (!ok()) return;
      const synth = window.speechSynthesis;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(); if (v) { try { u.voice = v; } catch (e) { /* engine picks by lang */ } }
      tune(u);
      synth.speak(u);
    },
    // Speaks a line and resolves when it ends. A timer guards against engines that never fire "end" (or have no voice).
    say: (raw) => new Promise((resolve) => {
      let done = false, t = 0;
      const text = raw;
      const fin = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
      const est = 1300 + text.split(/\s+/).length * 430;
      if (!ok()) { t = setTimeout(fin, est); return; }
      t = setTimeout(fin, est + 5000);
      try {
        const synth = window.speechSynthesis;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = pickVoice(); if (v) { try { u.voice = v; } catch (e) { /* engine picks by lang */ } }
        tune(u);
        u.onend = fin; u.onerror = fin;
        synth.speak(u);
      } catch (e) { fin(); }
    }),
    stop: () => { if (ok()) window.speechSynthesis.cancel(); }
  };
})();

// Browsers only allow sound after a tap: the first tap anywhere on the home screen starts it,
// and the speaker button mutes / unmutes.
// Screens where the tension music plays instead of the forest ambience (set by AppInner).
let tensionScreen = false;
// Ambient forest sound starts on the very first tap, click or key press anywhere (loading screen, Classic / Outbreak, any button).
// Browsers refuse audio before a gesture, so this one-time starter runs in the capture phase and stays armed until the sound really plays.
(() => {
  const arm = (e) => {
    if (e && e.target && e.target.closest && e.target.closest('[data-sound-toggle]')) return; // the speaker button handles itself
    Sfx.unlock();
    const st = getSettings();
    if (st.sound && !Ambience.unlocked() && !Ambience.isRunning() && !(tensionScreen && st.music)) Ambience.start();
    if (st.music) Tension.prime();
  };
  ['touchend', 'pointerup', 'click', 'keydown'].forEach((n) => window.addEventListener(n, arm, { capture: true, passive: true }));
  if (getSettings().sound) { try { Ambience.start(); } catch (e) { /* needs a tap first */ } } // desktop browsers may allow this straight away
})();
function toggleSound() {
  const cur = getSettings().sound;
  if (cur && !Ambience.isRunning() && !Tension.isRunning()) { if (tensionScreen && getSettings().music) Tension.start(); else Ambience.start(); return; }
  updateSettings({ sound: !cur });
  // Sound covers the forest ambience and effects. Game Music is its own switch and keeps playing.
  if (!cur) { Sfx.chime(); if (!(tensionScreen && getSettings().music)) Ambience.start(); } else Ambience.stop();
}

            <BgRow rowStyle={rowStyle} store={shadowArtStore} thumb="aspect-[3/4] w-[60px]" title="Shadow Figure Card Art" desc="Your own picture for the Shadow Figure card. A portrait 3:4 image fits best." savedMsg="Shadow Figure card art updated." resetMsg="Back to the default Shadow Figure card." />
            <BgRow rowStyle={rowStyle} store={medusaArtStore} thumb="aspect-[3/4] w-[60px]" title="Medusa Card Art" desc="Your own picture for the Medusa card. A portrait 3:4 image fits best." savedMsg="Medusa card art updated." resetMsg="Back to the default Medusa card." />
            <BgRow rowStyle={rowStyle} store={mayorArtStore} thumb="aspect-[3/4] w-[60px]" title="Mayor Card Art" desc="Your own picture for the Mayor card. A portrait 3:4 image fits best." savedMsg="Mayor card art updated." resetMsg="Back to the default Mayor card." />
            <ServerUrlRow rowStyle={rowStyle} />

            <div className="rounded-2xl p-4" style={rowStyle}>
              <div className="text-[15px] font-semibold">Saved Games</div>
              <p className="mt-0.5 text-xs text-slate-400">{gameCount === 0 ? 'No saved games on this device.' : `${gameCount} saved ${gameCount === 1 ? 'game' : 'games'} on this device.`}</p>
              {confirm ? (
                <div className="mt-3">
                  <p className="text-sm text-red-300">Delete {gameCount === 1 ? 'this game' : `all ${gameCount} games`}? This cannot be undone.</p>
                  <div className="mt-2 grid grid-cols-2 gap-2">
                    <button onClick={() => { onClearGames(); setConfirm(false); setNote('Saved games cleared.'); }}
                      className="min-h-[48px] rounded-xl text-sm font-bold text-white" style={{ background: '#B91C1C' }}>Delete</button>
                    <button onClick={() => setConfirm(false)} className="min-h-[48px] rounded-xl text-sm font-semibold text-slate-200" style={{ border: '1px solid var(--line)' }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button disabled={gameCount === 0} onClick={() => { setNote(''); setConfirm(true); }}
                  className="mt-3 min-h-[48px] w-full rounded-xl text-sm font-semibold text-red-300 disabled:opacity-35"
                  style={{ border: '1px solid #DC262666' }}>Clear Saved Games</button>
              )}
              {note && <p role="status" className="mt-2 text-xs text-slate-400">{note}</p>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// Step 2 (mode lobby) background: its own art per mode, with a gradient that shows until the image loads (or if it is missing).
const LOBBY_BG = {
  classic: { src: 'images/classic-bg.png', fallback: 'linear-gradient(180deg,#070B1E 0%,#16204F 48%,#0B0E14 100%)' },
  outbreak: { src: 'images/outbreak-bg.png', fallback: 'linear-gradient(180deg,#03100D 0%,#0B3B2E 48%,#050B09 100%)' }
};
// Falling leaves and embers/spores for the Step 2 screens, tinted per mode (same motion as the Step 1 Home Screen).
const LOBBY_TINT = {
  classic: { leaves: ['#94A3B8', '#A5B4FC', '#6366F1', '#CBD5E1'], embers: ['#FBBF24', '#F59E0B', '#FB923C'] },
  outbreak: { leaves: ['#6EE7B7', '#34D399', '#86EFAC', '#4D7C0F'], embers: ['#A7F3D0', '#4ADE80', '#BEF264'] }
};
function LobbyParticles({ mode }) {
  const atmos = useMemo(() => {
    const t = LOBBY_TINT[mode] || LOBBY_TINT.classic;
    const r = (a, b) => a + Math.random() * (b - a);
    const leaves = Array.from({ length: 8 }, (_, i) => ({
      left: r(3, 95), size: r(9, 16), dur: r(10, 17), delay: -r(0, 15), dx: r(30, 90), sway: r(3, 5.5), color: t.leaves[i % t.leaves.length]
    }));
    const embers = Array.from({ length: 8 }, () => ({
      left: r(5, 95), size: r(3, 5.5), dur: r(8, 14), delay: -r(0, 12), dx: r(-30, 30), color: t.embers[Math.floor(Math.random() * t.embers.length)]
    }));
    return { leaves, embers };
  }, [mode]);
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden">
      {atmos.leaves.map((l, i) => (
        <span key={'l' + i} className="leaf absolute" style={{ left: l.left + '%', top: '-4vh', animationDuration: l.dur + 's', animationDelay: l.delay + 's', '--dx': l.dx + 'px', opacity: 0.8 }}>
          <span className="leaf-shape block" style={{ width: l.size, height: l.size * 0.8, background: l.color, animationDuration: l.sway + 's' }} />
        </span>
      ))}
      {atmos.embers.map((e, i) => (
        <span key={'e' + i} className="ember absolute" style={{ left: e.left + '%', bottom: '-2vh', width: e.size, height: e.size, background: e.color, boxShadow: `0 0 8px 2px ${e.color}99`, animationDuration: e.dur + 's', animationDelay: e.delay + 's', '--dx': e.dx + 'px' }} />
      ))}
    </div>
  );
}
function LobbyBackdrop({ mode }) {
  const bg = LOBBY_BG[mode] || LOBBY_BG.classic;
  const [ok, setOk] = useState(true);
  useEffect(() => setOk(true), [bg.src]);
  return (
    <div className="fixed inset-0 z-0 overflow-hidden" style={{ background: bg.fallback }} aria-hidden="true">
      {ok && <img src={bg.src} alt="" draggable={false} onError={() => setOk(false)} className="absolute inset-0 h-full w-full object-cover" />}
      <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(5,8,16,0.35) 0%, rgba(5,8,16,0) 24%, rgba(5,8,16,0) 52%, rgba(5,8,16,0.88) 100%)' }} />
      <div className="mist mist-a pointer-events-none" />
      <div className="mist mist-b pointer-events-none" />
      <LobbyParticles mode={mode} />
    </div>
  );
}

function StartScreen({ onPlay, onMulti, gameCount, onClearGames }) {
  const [step, setStep] = useState('mode'); // mode -> play
  const [pv, setPv] = useState('classic'); // which mode art the selector backdrop previews
  const src = DEFAULT_BG;
  const st = useSettings();
  const atmos = useMemo(() => {
    const r = (a, b) => a + Math.random() * (b - a);
    const leaves = Array.from({ length: 7 }, (_, i) => ({
      left: r(3, 42), size: r(9, 16), dur: r(10, 17), delay: -r(0, 15), dx: r(30, 90), sway: r(3, 5.5), color: ['#7F1D1D', '#991B1B', '#5B1016'][i % 3]
    }));
    const embers = Array.from({ length: 6 }, () => ({
      left: r(5, 95), size: r(3, 5.5), dur: r(8, 14), delay: -r(0, 12), dx: r(-30, 30), color: ['#F97316', '#FB923C', '#EF4444'][Math.floor(Math.random() * 3)]
    }));
    return { leaves, embers };
  }, []);
  const [imgOk, setImgOk] = useState(true);
  const [guide, setGuide] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  useEffect(() => setImgOk(true), [src]);
  useEffect(() => { Ambience.preload(); Tension.preload(); Sfx.preload(); }, []);
  useEffect(() => {
    if (!st.sound) Ambience.stop();
    else if (Ambience.unlocked()) Ambience.start();
    const go = (e) => {
      if (e.target && e.target.closest && e.target.closest('[data-sound-toggle]')) return;
      Sfx.unlock();
      if (getSettings().sound) Ambience.start();
      if (getSettings().music) Tension.prime();
    };
    const evs = ['touchend', 'click', 'keydown'];
    evs.forEach((n) => window.addEventListener(n, go, { passive: true }));
    return () => evs.forEach((n) => window.removeEventListener(n, go));
  }, [st.sound, st.music]);
  useEffect(() => {
    document.body.classList.add('lock');
    return () => document.body.classList.remove('lock');
  }, []);
  const [splats, setSplats] = useState([]);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const spawn = (e) => {
    if (!st.blood || guide || settingsOpen) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const sp = makeBurst(e.clientX, e.clientY);
    setSplats((a) => [...a.slice(-15), sp]);
    timers.current.push(setTimeout(() => setSplats((a) => a.filter((x) => x.id !== sp.id)), 2600));
  };
  return (
    <div className="relative min-h-full w-full" onPointerDown={spawn}>
      {step === 'play' ? <LobbyBackdrop mode={pv} /> : (
      <div className="fixed inset-0 z-0 overflow-hidden" style={{ background: '#0B0E14' }} aria-hidden="true">
        <DefaultBackdrop />
        <div className="atmos-wrap absolute inset-0 flex justify-center">
          <div className="atmos-drift atmos-box relative shrink-0" style={{ width: 'max(100vw, calc(100vh * 0.5628))', height: 'max(100vh, calc(100vw * 1.7768))' }}>
            {imgOk && <img src={src} alt="" onError={() => setImgOk(false)} className="absolute inset-0 h-full w-full object-cover" style={{ filter: 'brightness(1.2) saturate(1.1)' }} />}
            <div className="blood-moon-glow pointer-events-none absolute" style={{ left: '68.8%', top: '15.7%', width: '62%', aspectRatio: '1 / 1' }} />
          </div>
        </div>
        <div className="absolute inset-0 bg-gradient-to-b from-black/10 via-[#0B0E14]/10 via-40% to-[#0B0E14]/95" />
        <div className="mist mist-a pointer-events-none" />
        <div className="mist mist-b pointer-events-none" />
        <div className="pointer-events-none absolute inset-0 overflow-hidden">
          {atmos.leaves.map((l, i) => (
            <span key={'l' + i} className="leaf absolute" style={{ left: l.left + '%', top: '-4vh', animationDuration: l.dur + 's', animationDelay: l.delay + 's', '--dx': l.dx + 'px' }}>
              <span className="leaf-shape block" style={{ width: l.size, height: l.size * 0.8, background: l.color, animationDuration: l.sway + 's' }} />
            </span>
          ))}
          {atmos.embers.map((e, i) => (
            <span key={'e' + i} className="ember absolute" style={{ left: e.left + '%', bottom: '-2vh', width: e.size, height: e.size, background: e.color, boxShadow: `0 0 8px 2px ${e.color}99`, animationDuration: e.dur + 's', animationDelay: e.delay + 's', '--dx': e.dx + 'px' }} />
          ))}
        </div>
      </div>
      )}

      <main className="screen-in relative z-10 mx-auto flex min-h-full w-full max-w-md flex-col px-4 md:max-w-xl md:px-8"
        style={{ paddingTop: 'max(16px, env(safe-area-inset-top))', paddingBottom: 'max(24px, env(safe-area-inset-bottom))' }}>
        <header className="flex items-center justify-between">
          {step === 'play' ? (
            <button onClick={() => setStep('mode')} aria-label="Back to mode choice"
              className="flex h-11 items-center justify-center gap-1.5 rounded-xl px-4 text-sm font-semibold text-slate-100 hover:bg-white/10" style={glassBtn}>
              <span aria-hidden="true">&larr;</span> Back
            </button>
          ) : (
            <button onClick={() => setSettingsOpen(true)} aria-label="Settings"
              className="flex h-11 w-11 items-center justify-center rounded-xl text-slate-200 hover:bg-white/10" style={glassBtn}>
              <GearIcon />
            </button>
          )}
          <div className="flex items-center gap-2">
            <button onClick={toggleSound} data-sound-toggle="1" aria-label={st.sound ? 'Mute ambient sound' : 'Turn on ambient sound'} aria-pressed={st.sound}
              className="flex h-11 w-11 items-center justify-center rounded-xl text-slate-200 hover:bg-white/10" style={glassBtn}>
              <SpeakerIcon on={st.sound} />
            </button>
            <button onClick={() => setGuide(true)} aria-label="Role guide" className="flex h-11 w-11 items-center justify-center rounded-xl text-slate-100 hover:bg-white/10" style={glassBtn}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5" /><path d="M9.2 9.3 C9.4 7.8 10.5 7 12 7 C13.6 7 14.8 8 14.8 9.4 C14.8 11.4 12 11.5 12 13.6" /><path d="M12 16.9 V17" /></svg>
            </button>
          </div>
        </header>

        {step === 'play' ? (
          <>
            <div className="mt-[11vh] text-center">
              <h1 className="font-display text-4xl font-black tracking-[0.1em] md:text-6xl" style={{ color: '#F1F5F9', textShadow: '0 2px 22px rgba(0,0,0,0.9), 0 0 34px rgba(148,163,255,0.35)' }}>CHOOSE A MODE</h1>
              <p className="mx-auto mt-3 max-w-xs text-sm font-semibold tracking-wide md:text-base" style={{ color: '#CBD5E1', textShadow: '0 1px 10px rgba(0,0,0,0.95)' }}>Pass &amp; Play on one phone</p>
            </div>

            <div className="flex-1" style={{ minHeight: '18vh' }} />

            <div className="grid grid-cols-2 gap-3 md:gap-4">
              {[['classic', 'Classic', 'Villagers vs. Werewolves', 'linear-gradient(170deg,rgba(67,56,202,0.5),rgba(110,16,16,0.7))', 'rgba(165,180,252,0.6)'], ['outbreak', 'Outbreak', 'Villagers vs. Werewolves vs. Zombies', 'linear-gradient(170deg,rgba(15,118,110,0.45),rgba(6,78,59,0.8))', 'rgba(45,212,191,0.6)']].map(([m, t, sub, grad, edge]) => (
                <button key={m} data-ui-sound="primary" onClick={() => { setGameMode(m); onPlay(); }} onPointerEnter={() => setPv(m)} onFocus={() => setPv(m)} aria-label={t}
                  className="relative flex min-h-[170px] flex-col items-start justify-end overflow-hidden rounded-2xl p-4 text-left text-white transition hover:brightness-110 active:scale-[0.98]"
                  style={{ backgroundImage: `${grad}, url(${LOBBY_BG[m].src})`, backgroundSize: 'cover', backgroundPosition: 'center', border: `1px solid ${edge}`, boxShadow: '0 10px 30px -10px rgba(0,0,0,0.8)' }}>
                  <span className="block text-xl font-bold leading-tight tracking-wide md:text-2xl" style={{ textShadow: '0 2px 10px rgba(0,0,0,0.9)' }}>{t}</span>
                  <span className="mt-1 block text-xs font-semibold leading-snug text-white/90" style={{ textShadow: '0 1px 8px rgba(0,0,0,0.9)' }}>{sub}</span>
                </button>
              ))}
            </div>
          </>
        ) : (
          <>
            <div className="flex-1" style={{ minHeight: '34vh' }} />

            <div className="text-center">
              <h1 className="font-display text-5xl font-black tracking-[0.12em] text-slate-50 md:text-7xl" style={{ textShadow: '0 2px 24px rgba(0,0,0,0.8), 0 0 40px rgba(203,213,225,0.2)' }}>WEREWOLF</h1>
              <p className="mt-3 text-sm italic tracking-[0.2em] text-slate-300 md:mt-4 md:text-lg" style={{ textShadow: '0 1px 8px rgba(0,0,0,0.9)' }}>At Nightfall</p>
            </div>

            <div className="mt-8 flex flex-col items-center gap-3.5">

                <span className="text-xl font-bold tracking-wide md:text-2xl">Multi-Device</span>
                <span className="mt-0.5 px-2 text-center text-xs font-semibold opacity-85">Everyone joins on their own phone</span>
              </button>
            </div>
          </>
        )}
      </main>

      <div className="pointer-events-none fixed inset-0 z-30 overflow-hidden" aria-hidden="true">
        {splats.map((sp) => <DotBurst key={sp.id} b={sp} />)}

      {guide && <RoleGuide onClose={() => setGuide(false)} />}
      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} gameCount={gameCount} onClearGames={onClearGames} />}
    </div>
  );
}

function summarizeDeck(deck) {
  return ROLE_IDS.filter((id) => deck[id] > 0).map((id) => {
    if (id === 'werewolf') return `${deck[id]} ${deck[id] === 1 ? 'Wolf' : 'Wolves'}`;
    return deck[id] > 1 ? `${deck[id]} ${ROLES_DATA[id].name}s` : ROLES_DATA[id].name;
  }).join(', ');
}

function GameSheet({ game, onClose, onResume, onRedeal, onEdit }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const active = game.status === 'active' && game.players;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={game.name}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="screen-in relative w-full max-w-md rounded-t-3xl p-5"
        style={{ background: 'var(--card)', border: '1px solid var(--line)', paddingBottom: 'max(20px, env(safe-area-inset-bottom))' }}>
        <h2 className="font-display text-2xl font-bold">{game.name}</h2>
        <p className="mt-1 text-sm text-slate-400">{game.count} Players &middot; {summarizeDeck(game.deck)}</p>
        {active && <p className="mt-2 text-sm text-slate-300">Players: {game.players.map((pl) => pl.name).join(', ')}</p>}
        <div className="mt-5 flex flex-col gap-3">
          {active && <Btn onClick={onResume}>Resume Grimoire</Btn>}
          <Btn variant={active ? 'secondary' : 'primary'} onClick={onRedeal}>Re-deal Same Setup</Btn>
          <Btn variant="secondary" onClick={onEdit}>Edit Setup</Btn>
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

}

function ChooseCards({ count, deck, setDeck, onBack, onStart, startLabel = 'Start & Deal Cards', showBalance = false }) {
  const [q, setQ] = useState('');
  useEffect(() => { Sfx.preload(); }, []);
  const [notice, setNotice] = useState('');
  const noticeT = useRef(null);
  useEffect(() => () => clearTimeout(noticeT.current), []);
  const warn = (msg) => {
    setNotice(msg + '\u200B'.repeat(Math.floor(Math.random() * 3)));
    clearTimeout(noticeT.current);
    noticeT.current = setTimeout(() => setNotice(''), 2600);
  };
  const total = deckTotal(deck);
  const slotsLeft = count - total;
  const wolves = deck.werewolf;
  const canStart = slotsLeft === 0 && wolves >= 1;

  const change = (id, d) => {
    const next = deck[id] + d;
    if (next < 0 || next > ROLES_DATA[id].max) return;
    if (d > 0 && slotsLeft <= 0) return;
    setDeck({ ...deck, [id]: next });
    if (d > 0) Sfx.select(); else Sfx.deselect();
  };
  const gmode = useGameMode();
  const needle = q.trim().toLowerCase();
  const visible = ROLE_IDS.filter((id) => {
    if (!roleInMode(id, gmode)) return false; // Classic hides the Outbreak roles
    if (!needle) return true;
    const r = ROLES_DATA[id];
    return [r.name, r.ability, r.short, r.blurb, TEAM_LABEL[r.team]].join(' ').toLowerCase().includes(needle);
  });

  const ruleOk = wolves >= 1;
  const ruleColor = ruleOk ? '#34D399' : '#F59E0B';

  return (
    <Screen wide>
      <div className="sticky top-0 z-10 -mx-4 px-4 pb-3 pt-1 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(180deg, var(--bg) 85%, rgba(11,14,20,0))' }}>
        <header className="flex items-center gap-2">
          <button onClick={onBack} aria-label="Back to game setup" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
          </button>
          <h1 className="font-display text-lg font-bold tracking-wide">Choose Cards</h1>
        </header>
        <div className="mt-2 flex items-end justify-between gap-3">
          <div aria-live="polite">
            <div className="font-display text-2xl font-black leading-none tabular-nums text-white">{slotsLeft} {slotsLeft === 1 ? 'slot' : 'slots'} left</div>
            <div className="mt-1 text-sm tabular-nums text-slate-400">{total} / {count} selected</div>
          </div>
          <div className="flex gap-1.5">
            <button onClick={() => setDeck(autoFill(count))} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>Auto-fill</button>
            <button onClick={() => setDeck(emptyDeck())} disabled={total === 0} className="min-h-[40px] rounded-lg px-3 text-xs font-semibold text-slate-400 hover:bg-white/5 disabled:opacity-30" style={{ border: '1px solid var(--line)' }}>Clear</button>
          </div>
        </div>
        <div role="status" className="mt-2.5 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold"
          style={{ color: ruleColor, background: ruleColor + (ruleOk ? '14' : '1F'), border: `1px solid ${ruleColor}${ruleOk ? '40' : '88'}` }}>
          <span aria-hidden="true">{ruleOk ? '✓' : '!'}</span>
          At least 1 Werewolf required
        </div>
        {showBalance && (() => {
          const bal = deckBalance(deck);
          const fair = bal >= BALANCE_MIN && bal <= BALANCE_MAX;
          const c = total < count ? '#94A3B8' : fair ? '#34D399' : '#F59E0B';
          const label = total < count ? 'Balance updates as you pick' : fair ? 'Balanced deck' : bal < BALANCE_MIN ? 'Favors the Werewolves' : 'Favors the Village';
          return (
            <div className="ml-2 mt-2.5 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold tabular-nums"
              style={{ color: c, background: c + '14', border: `1px solid ${c}55` }} aria-live="polite">
              Balance {bal > 0 ? '+' : ''}{bal} · {label}
            </div>
          );
        })()}
      </div>

      <div className="relative mt-1">
        <svg className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20 L16 16" /></svg>
        <input id="role-search" type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search roles..." aria-label="Search roles"
          className="h-12 w-full rounded-xl pl-10 pr-3 text-[15px] text-slate-100 placeholder-slate-500"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }} />
      </div>

      <div className="mt-4 grid grid-cols-2 gap-3.5 md:grid-cols-3 md:gap-5 lg:grid-cols-4">
        {visible.map((id) => {
          const r = ROLES_DATA[id];
          const n = deck[id];
          const ring = n > 0
            ? (r.team === 'werewolf'
              ? '0 0 0 2px #EF4444, 0 0 26px 3px rgba(220,38,38,0.55)'
              : '0 0 0 2px #E2E8F0, 0 0 24px 3px rgba(226,232,240,0.4)')
            : '0 0 0 1px rgba(203,213,225,0.2)';
          return (
            <div key={id} className="relative aspect-[3/4] overflow-hidden rounded-2xl transition-[box-shadow,opacity] duration-300"
              style={{ boxShadow: ring, opacity: n === 0 && slotsLeft === 0 ? 0.6 : 1, cursor: n === 0 && slotsLeft > 0 ? 'pointer' : 'default' }}
              onClick={(e) => {
                if (e.target.closest && e.target.closest('button')) return;
                if (n === 0 && slotsLeft > 0) change(id, 1);
                else if (slotsLeft <= 0 && (n === 0 || n < r.max)) warn(`All ${count} slots are filled. Remove a card with \u2212 to make room for ${r.name}.`);
                else if (n >= r.max) warn(`Only ${r.max} ${r.name} ${r.max === 1 ? 'card is' : 'cards are'} allowed per game.`);
              }}>
              <div className="h-full w-full transition-[filter] duration-300"
                style={{ filter: n === 0 ? 'grayscale(0.5) brightness(0.78)' : 'none' }}>
                <PlayingCard role={id} />
              </div>
              <QtyPill role={id} n={n} canAdd={slotsLeft > 0 && n < r.max} onChange={(d) => change(id, d)} />
            </div>
          );
        })}
      </div>
      {visible.length === 0 && <p className="mt-6 text-center text-sm text-slate-400">No roles match &ldquo;{q.trim()}&rdquo;.</p>}

      {notice && (
        <div className="pointer-events-none fixed inset-x-0 bottom-32 z-30 flex justify-center px-6" role="status">
          <div key={notice} className="nudge max-w-sm rounded-2xl px-4 py-3 text-center text-sm font-semibold"
            style={{ background: 'rgba(30,18,12,0.96)', color: '#FBBF24', border: '1px solid #F59E0B88', boxShadow: '0 8px 30px rgba(0,0,0,0.6)' }}>{notice.replace(/\u200B/g, '')}</div>
        </div>
      )}
      <div className="sticky bottom-0 z-10 -mx-4 mt-auto px-4 pb-1 pt-6 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(0deg, var(--bg) 70%, rgba(11,14,20,0))' }}>
        {!canStart && (
          <p className="mb-2 text-center text-xs text-slate-400">
            {slotsLeft > 0 ? `Fill ${slotsLeft} more ${slotsLeft === 1 ? 'slot' : 'slots'}` : ''}{slotsLeft > 0 && !ruleOk ? ' and add ' : ''}{!ruleOk ? (slotsLeft > 0 ? 'a Werewolf' : 'Add a Werewolf') : ''} to continue.
          </p>
        )}
        <Btn disabled={!canStart} onClick={onStart}>{startLabel}</Btn>
      </div>
    </Screen>
  );
}

/* Screen 3: Pass-and-play card reveal                                 */
/* ------------------------------------------------------------------ */
function RoleCard({ role, phase }) {
  const r = ROLES_DATA[role];
  const hasImg = !!useCardImage(role);
  const flipped = phase === 'flipping' || phase === 'open';
  const lifted = phase === 'lift' || phase === 'flipping';
  const edge = r.team === 'werewolf' ? '#EF4444' : '#E2E8F0';
  const glow = `0 0 44px -8px ${r.team === 'werewolf' ? 'rgba(220,38,38,0.8)' : 'rgba(226,232,240,0.45)'}`;
  return (
    <div className={`flip-scene aspect-[3/4] ${lifted ? 'is-lifted' : ''}`}>
      <div className={`flip-card ${flipped ? 'is-flipped' : ''}`}>
        <div className="face" style={{ background: '#05070B' }}>
          <CardBackFace />
        </div>
        <div className="face face-front" style={hasImg ? { boxShadow: glow } : { border: `2px solid ${edge}`, boxShadow: glow }}>
          <PlayingCard role={role} />
        </div>
      </div>
    </div>
  );
}

function Reveal({ players, onName, onDone, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const flipped = phase !== 'idle';
  const [busy, setBusy] = useState(false);
  const [input, setInput] = useState('');
  const [entered, setEntered] = useState([]);
  const [nudge, setNudge] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const [showAbility, setShowAbility] = useState(false);
  useEffect(() => { Sfx.preload(); }, []);
  const timer = useRef(null);
  const timers = useRef([]);
  useEffect(() => () => { clearTimeout(timer.current); timers.current.forEach(clearTimeout); }, []);

  const p = players[idx];
  const last = idx === players.length - 1;
  const hasImg = !!useCardImage(p.role);
  const name = input.trim();
  const taken = name !== '' && entered.some((n) => n.toLowerCase() === name.toLowerCase());
  const canReveal = name !== '' && !taken && !busy;

  const reveal = () => {
    if (phase !== 'idle' || busy) return;
    if (!canReveal) {
      if (name === '') {
        setNudge(true); timers.current.push(setTimeout(() => setNudge(false), 1800));
        const el = document.getElementById('player-name'); if (el) el.focus();
      }
      return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Sfx.flip();
    setPhase('lift'); // 0.3s anticipation lift and glow
    timers.current.push(setTimeout(() => setPhase('flipping'), 300)); // 1.2s turn
    timers.current.push(setTimeout(() => setPhase('open'), 1500)); // flip finished
  };
  const hideAndPass = () => {
    if (busy || phase !== 'open') return;
    setBusy(true);
    setShowAbility(false);
    setPhase('idle');
    onName(idx, name);
    setEntered((e) => [...e, name]);
    setInput('');
    timer.current = setTimeout(() => {
      setBusy(false);
      if (last) onDone();
      else setIdx((i) => i + 1);
    }, 700);
  };

  return (
    <Screen className="items-center">
      <div className="relative flex w-full flex-col items-center gap-2.5">
        <ExitButton onClick={() => setConfirmExit(true)} className="absolute -top-1.5 left-0" />
        <span className="rounded-full px-3 py-1 text-xs font-semibold uppercase tabular-nums tracking-[0.18em] text-slate-300"
          style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
          Player {idx + 1} of {players.length}
        </span>
        <div className="flex w-full gap-1" aria-hidden="true">
          {players.map((_, i) => (
            <div key={i} className="h-1 flex-1 rounded-full" style={{ background: i <= idx ? '#CBD5E1' : 'rgba(203,213,225,0.15)' }} />
          ))}
        </div>
      </div>

      <div className="mt-5 min-h-[84px] w-full" aria-live="polite">
        {flipped ? (
          <div className="pt-1 text-center">
            <p className="text-sm text-slate-400">This card belongs to</p>
            <p className="font-display mt-1 break-words text-3xl font-bold leading-tight">{name}</p>
          </div>
        ) : (
          <div role="note" className="flex items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
            style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
            <svg className="mt-0.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z" /><path d="M12 10 V14 M12 17 V17.5" /></svg>
            <span><strong className="font-bold text-amber-200">Eyes only!</strong> Shield your screen and make sure no other players are looking before you reveal your card.</span>
          </div>
        )}
      </div>

      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <div role="button" tabIndex={phase === 'idle' ? 0 : -1} onClick={reveal}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } }}
          aria-label="Tap the card to reveal your role" aria-disabled={phase !== 'idle'}

function HoldButton({ onComplete, ms = 1500, aria = 'Press and hold for one and a half seconds to unlock the Moderator view', children }) {
  const [p, setP] = useState(0);
  const raf = useRef(0);
  const start = useRef(0);
  const done = useRef(false);

  const tick = useCallback(() => {
    const v = Math.min(1, (performance.now() - start.current) / ms);
    setP(v);
    if (v >= 1) {
      if (!done.current) { done.current = true; onComplete(); }
      return;
    }
    raf.current = requestAnimationFrame(tick);
  }, [ms, onComplete]);

  const begin = () => {
    cancelAnimationFrame(raf.current);
    done.current = false;
    start.current = performance.now();
    raf.current = requestAnimationFrame(tick);
  };
  const cancel = () => {
    cancelAnimationFrame(raf.current);
    if (!done.current) setP(0);
  };
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  return (
    <button
      className="no-select relative min-h-[72px] w-full overflow-hidden rounded-2xl text-base font-semibold text-white"
      style={{ background: 'var(--card-2)', border: '1px solid rgba(203,213,225,0.3)' }}
      onPointerDown={begin} onPointerUp={cancel} onPointerLeave={cancel} onPointerCancel={cancel}
      onContextMenu={(e) => e.preventDefault()}
      onKeyDown={(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } }}
      onKeyUp={(e) => { if (e.key === ' ' || e.key === 'Enter') cancel(); }}
      aria-label={aria}>
      <span className="absolute inset-y-0 left-0" style={{ width: `${p * 100}%`, background: 'linear-gradient(90deg, #991B1B, #DC2626)' }} />
      <span className="relative">{p > 0 && p < 1 ? 'Keep holding…' : children}</span>
    </button>
  );
}

/* Shadow Figure helpers (shared by Pass & Play and Multi-Device) */
const hasV = (v) => v !== null && v !== undefined && v !== '';
// The night's pending non-wolf actions as { key, target }. `c` = { medusa, werewolf, seer, bodyguard, witchSave, witchPoison, spellcaster }.
function nightActions(c) {
  const out = [];
  if (hasV(c.medusa)) out.push({ key: 'medusa', target: c.medusa });
  if (hasV(c.bodyguard)) out.push({ key: 'bodyguard', target: c.bodyguard });
  if (hasV(c.seer)) out.push({ key: 'seer', target: c.seer });
  if (hasV(c.werewolf) && hasV(c.werewolf2)) { out.push({ key: 'wolf1', target: c.werewolf }); out.push({ key: 'wolf2', target: c.werewolf2 }); } // Blood Moon: both hunt targets can be redirected
  if (c.witchSave && hasV(c.werewolf)) out.push({ key: 'witchSave', target: hasV(c.witchSaveTo) ? c.witchSaveTo : c.werewolf });
  if (hasV(c.witchPoison)) out.push({ key: 'witchPoison', target: c.witchPoison });
  if (hasV(c.spellcaster)) out.push({ key: 'spellcaster', target: c.spellcaster });
  if (hasV(c.sniper)) out.push({ key: 'sniper', target: c.sniper });
  if (hasV(c.doctor)) out.push({ key: 'doctor', target: c.doctor });
  if (hasV(c.plaguedoctor)) out.push({ key: 'plaguedoctor', target: c.plaguedoctor, harm: c.plagueAct === 'infect' });
  if (hasV(c.zombie)) out.push({ key: 'zombie', target: c.zombie });
  if (hasV(c.infector)) out.push({ key: 'infector', target: c.infector });
  return out;
}
const wolfTargetName = (c, nm) => (hasV(c.werewolf) ? (hasV(c.werewolf2) ? `${nm(c.werewolf)} & ${nm(c.werewolf2)}` : nm(c.werewolf)) : 'No one');
// Applies the Shadow Figure's redirect { key, to } to the choices. Medusa's stone never stops the Shadow Figure from acting:
// redirecting the stone moves it to the new target; redirecting any other action leaves the stone on the Shadow Figure.
function applyShadow(c, sh, shadowId) {
  if (!sh || !hasV(sh.to) || !sh.key || !hasV(shadowId)) return c;
  if (!nightActions(c).some((a) => a.key === sh.key)) return c;
  const out = { ...c };
  if (sh.key === 'witchSave') out.witchSaveTo = sh.to; else if (sh.key === 'wolf1') out.werewolf = sh.to; else if (sh.key === 'wolf2') out.werewolf2 = sh.to; else out[sh.key] = sh.to;
  return out;
}
// What the Seer finally learns once the Shadow Figure has redirected: { target, stoned }.
function seerVision(c, sh, shadowId, seerId, players) {
  const c2 = applyShadow(c, sh, shadowId);
  let stoned = hasV(c2.medusa) && c2.medusa === seerId;
  if (players && hasV(c2.medusa)) { const t = players.find((x) => x.id === c2.medusa); stoned = !!t && t.role === 'seer' && !players.some((x) => x.alive && x.role === 'seer' && x.id !== t.id); } // with two Seers, the other one still sees
  return { target: hasV(c2.seer) ? c2.seer : null, stoned, from: hasV(c.seer) && hasV(c2.seer) && c2.seer !== c.seer ? c.seer : null };
}

/* Cupid helpers. Items look like { id, role, alive, lover } (Pass & Play) */
// Lovers on opposite teams form a secret faction. It wins when only the pair remains (or the pair plus Cupid).
function loversFaction(items) {
  const alive = items.filter((i) => i.alive);
  const a = alive.find((i) => hasV(i.lover) && alive.some((x) => x.id === i.lover));
  if (!a) return false;
  const b = alive.find((x) => x.id === a.lover);
  if ((ROLES_DATA[a.role].team === 'werewolf') === (ROLES_DATA[b.role].team === 'werewolf')) return false;
  if (alive.length === 2) return true;
  if (alive.length === 3) { const o = alive.find((x) => x.id !== a.id && x.id !== b.id); return !!o && o.role === 'cupid'; }
  return false;
}

// Local discussion timer: tap to start or pause, add a minute, reset.
// Starts by itself. At 0:00 it rings a bell and calls onEnd (which opens the vote). startAt (ms) syncs devices to one clock.
function DayTimer({ minutes = 3, startAt = 0, onEnd, disabled = false }) {
  const [left, setLeft] = useState(() => (startAt ? Math.max(0, minutes * 60 - Math.floor((Date.now() - startAt) / 1000)) : minutes * 60));
  const [on, setOn] = useState(!disabled);
  const prev = useRef(left);
  const endRef = useRef(onEnd); endRef.current = onEnd;
  useEffect(() => {
    if (!on) return;
    const t = setInterval(() => setLeft((v) => Math.max(0, v - 1)), 1000);
    return () => clearInterval(t);
  }, [on]);
  useEffect(() => {
    if (prev.current > 0 && left === 0) { Sfx.bell(); if (endRef.current) endRef.current(); }
    prev.current = left;
    if (left === 0) setOn(false);
  }, [left]);
  const mm = String(Math.floor(left / 60)).padStart(1, '0'), ss = String(left % 60).padStart(2, '0');
  return (
    <Panel className="text-center">
      <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-300">Discussion</div>
      <div className={`font-display mt-1 text-5xl font-black tabular-nums ${left === 0 ? 'hint-pulse text-red-300' : 'text-slate-50'}`} role="timer" aria-live="off">{mm}:{ss}</div>
      {left === 0 && <p className="mt-1 text-sm font-semibold text-red-200">Time is up. Time to vote.</p>}
      <div className="mt-3 flex gap-2">
        <button onClick={() => setOn(!on)} disabled={left === 0} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-100 disabled:opacity-40" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>{on ? 'Pause' : 'Resume'}</button>
        <button onClick={() => setLeft((v) => v + 60)} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-100" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>+1 min</button>
        <button onClick={() => { setOn(false); setLeft(minutes * 60); }} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-300" style={{ border: '1px solid var(--line)' }}>Reset</button>
      </div>
    </Panel>
  );
}

// The Sniper's two steps. `value` is null/'' while choosing, then 'L:<id>' once locked (shared by teammates in Multi-Device).
function SniperScope({ header, alive, isInfected, value, setValue, onDone }) {
  const locked = typeof value === 'string' && value.indexOf('L:') === 0;
  const tgt = locked ? value.slice(2) : (value || '');
  if (!locked) {
    return (
      <div className="flex flex-1 flex-col">
        {header}
        <PickList players={alive} value={tgt} onChange={(v) => setValue(v === '' ? null : v)} />
        <Btn className="mt-5" disabled={!tgt} onClick={() => setValue('L:' + tgt)}>{tgt ? 'Lock & Scope Target' : 'Select a player'}</Btn>
      </div>
    );
  }
  const t = alive.find((x) => x.id === tgt);
  const inf = isInfected(tgt);
  return (
    <div className="flex flex-1 flex-col">
      {header}
      <Panel className="text-center" style={{ border: `1px solid ${inf ? 'rgba(251,191,36,0.8)' : 'rgba(148,163,184,0.45)'}`, background: inf ? 'rgba(16,185,129,0.2)' : 'rgba(30,41,59,0.55)' }}>
        <div className="font-display text-xl font-bold text-slate-50">{t ? t.n : '?'}</div>
        <div className="mt-2 text-sm font-black uppercase tracking-[0.18em]" style={{ color: inf ? '#6EE7B7' : '#CBD5E1' }}>{inf ? 'SCOPE RESULT: INFECTED' : 'SCOPE RESULT: NOT INFECTED'}</div>
        {inf && <div className="mt-1 text-xs font-semibold text-amber-300">Zombie or incubating</div>}
      </Panel>
      {inf && <Btn className="mt-5" onClick={() => onDone(tgt, true)}>Take the Shot (Eliminate)</Btn>}
      <Btn className="mt-3" variant="secondary" onClick={() => onDone(tgt, false)}>{inf ? 'Hold Fire' : 'Hold Fire / Done'}</Btn>
    </div>
  );
}

// Plague Doctor: step 1 locks one target (no switching), step 2 reveals their status and offers the matching serum.
function PlagueScan({ header, alive, isInfected, value, setValue, onDone }) {
  const locked = typeof value === 'string' && value.indexOf('L:') === 0;
  const tgt = locked ? value.slice(2) : (value || '');
  if (!locked) {
    return (
      <div className="flex flex-1 flex-col">
        {header}
        <PickList players={alive} value={tgt} onChange={(v) => setValue(v === '' ? null : v)} />
        <Btn className="mt-5" disabled={!tgt} onClick={() => setValue('L:' + tgt)}>{tgt ? 'Lock Target & Inspect' : 'Select a player'}</Btn>
      </div>
    );
  }
  const t = alive.find((x) => x.id === tgt);
  const inf = isInfected(tgt);
  return (
    <div className="flex flex-1 flex-col">
      {header}
      <Panel className="text-center" style={{ border: `1px solid ${inf ? 'rgba(52,211,153,0.8)' : 'rgba(167,139,250,0.7)'}`, background: inf ? 'rgba(16,185,129,0.2)' : 'rgba(109,40,217,0.2)' }}>
        <div className="font-display text-xl font-bold text-slate-50">{t ? t.n : '?'}</div>

      </Panel>
      {inf ? <Btn className="mt-5" onClick={() => onDone(tgt, 'cure')}>Administer Cure</Btn> : <Btn className="mt-5" onClick={() => onDone(tgt, 'infect')}>Inject Plague</Btn>}

}

// The Shadow Figure's screen: anonymous action list, then a new target. Used by Pass & Play, Multi-Device auto and manual.
const SHADOW_VERB = { medusa: 'Medusa turns {} to stone', bodyguard: 'Bodyguard protects {}', seer: 'Seer inspects {}', witchSave: 'Witch heals {}', witchPoison: 'Witch poisons {}', spellcaster: 'Spellcaster silences {}', sniper: 'Sniper Action \u2192 {}', doctor: 'Doctor Action \u2192 {}', plaguedoctor: 'Plague Doctor Action \u2192 {}', wolf1: 'Werewolf Target 1 \u2192 {}', wolf2: 'Werewolf Target 2 \u2192 {}', zombie: 'Zombie Infect \u2192 {}', infector: 'Infected Bite \u2192 {}' };
const shadowActionLabel = (key, name) => (SHADOW_VERB[key] || '{}').replace('{}', name);
function ShadowAct({ actions: allActions, victimName, alive, wolves = [], selfId = null, nm, stoned, onDone, header }) {
  const actions = allActions.filter((a) => hasV(a.target) && nm(a.target) !== '?'); // only actions that really happened tonight, with a known target
  const order = useMemo(() => shuffle(actions.map((_, i) => i)), []);
  const [act, setAct] = useState(null);
  const [skip, setSkip] = useState(false);
  const [pick, setPick] = useState(null);
  const chosen = act === null ? null : actions[act];
  const ready = skip || (act !== null && pick !== null);
  const finish = () => onDone(skip || act === null ? null : { key: chosen.key, to: pick });
  const HARM = ['wolf1', 'wolf2', 'zombie', 'infector', 'witchPoison', 'medusa', 'sniper', 'spellcaster'];
  const harmful = (a) => !!a && (HARM.includes(a.key) || (a.key === 'plaguedoctor' && a.harm));
  const stoneIx = actions.findIndex((a) => a.key === 'medusa');
  const others = alive.filter((p) => p.id !== selfId);
  return (
    <div className="flex flex-1 flex-col">
      {header}
      {stoned && (
        <Panel className="mb-3 text-center text-sm leading-snug text-teal-50" style={{ border: '2px solid rgba(45,212,191,0.9)', background: 'rgba(13,148,136,0.3)' }}>
          <div className="font-display text-base font-black uppercase tracking-wide text-teal-200">Medusa is attempting to turn you to stone</div>
          <p className="mt-1">Redirect that stone onto another valid target to speak and vote normally tomorrow, or pick a different action and stay Stoned in the morning.</p>
          {stoneIx >= 0 && <Btn className="mt-3" onClick={() => { setAct(stoneIx); setSkip(false); setPick(null); }}>Redirect the stone</Btn>}
        </Panel>
      )}
      <Panel className="text-center" style={{ border: '1px solid rgba(239,68,68,0.6)', background: 'rgba(127,29,29,0.22)' }}>
        <div className="font-display text-lg font-bold text-slate-50">{`Werewolf Target: ${victimName}`}</div>
      </Panel>
      {actions.length === 0 ? (
        <>
          <p className="mt-4 text-center text-sm text-slate-300">No other night actions to redirect tonight</p>
          <Btn className="mt-5" onClick={() => onDone(null)}>Continue</Btn>
        </>
      ) : (
        <>
          <div className="mb-2 mt-4 text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Pick one action to redirect</div>
          <ul className="flex flex-col gap-2" role="radiogroup" aria-label="Pending night actions">
            {order.map((ai, n) => {
              const sel = act === ai;
              return (
                <li key={ai}>
                  <button role="radio" aria-checked={sel} onClick={() => { setAct(sel ? null : ai); setSkip(false); setPick(null); }}
                    className="flex min-h-[52px] w-full items-center justify-between gap-2 rounded-xl px-4 text-left text-[15px] font-semibold text-slate-50 transition active:scale-[0.99]"
                    style={{ background: sel ? 'rgba(109,40,217,0.45)' : 'rgba(21,26,36,0.85)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}` }}>
                    <span>{shadowActionLabel(actions[ai].key, nm(actions[ai].target))}</span>{sel && <span aria-hidden="true" className="text-lg">✓</span>}
                  </button>
                </li>
              );
            })}
          </ul>
          {chosen && !skip && (
            <>
              <div className="mb-2 mt-4 text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Choose a new target for that action</div>
              {harmful(chosen) && <p className="mb-2 text-center text-xs text-slate-400">Harmful actions cannot be redirected onto Werewolves.</p>}
              <PickList players={others} badges={wolves} value={pick === null ? '' : pick} onChange={(v) => setPick(v === '' ? null : v)} disabled={[chosen.target, ...(harmful(chosen) ? wolves : []), ...actions.filter((a) => a !== chosen && (a.key === 'wolf1' || a.key === 'wolf2') && (chosen.key === 'wolf1' || chosen.key === 'wolf2')).map((a) => a.target)]} />
            </>
          )}
          <Btn className="mt-3" variant="secondary" onClick={() => { setSkip(!skip); setAct(null); setPick(null); }}>{skip ? 'Skip selected ✓' : 'Skip / Leave Actions Unchanged'}</Btn>
          <Btn className="mt-3" disabled={!ready} onClick={finish}>{skip ? 'Confirm Skip' : ready ? 'Confirm Redirect' : 'Select an action and a new target'}</Btn>
        </>
      )}
    </div>
  );
}

// One role's secret choice screen on a single shared device. Names only, never anyone's role.
function NightActPP({ role, players, actor, choices, onDone, deferSeer, seerOverride, hideSelf, ext, bloodMoon }) {
  const alive = players.filter((p) => p.alive);
  const opts = (list) => list.map((p) => ({ id: p.id, n: p.name }));
  const nm = (id) => (players.find((p) => p.id === id) || {}).name || '?';
  const [pickL, setPickL] = useState(null);
  // ext (Multi-Device teammates): the pick is shared, so any teammate's tap updates everyone's selection
  const pick = ext ? (ext.pick === '' || ext.pick === undefined ? null : ext.pick) : pickL;
  const setPick = ext ? ext.set : setPickL;
  const [pair, setPair] = useState([]);
  const [save, setSave] = useState(false);
  const [seen, setSeen] = useState(null);
  const val = pick === null ? '' : pick;
  const choose = (v) => setPick(v === '' ? null : v);

  if (actor && actor.sedatedTag && role !== 'infected' && role !== 'cured') {
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} prompt="You have been sedated." />
        <Panel className="text-center" style={{ border: '1px solid rgba(34,211,238,0.6)', background: 'rgba(8,145,178,0.2)' }}>
          <DoctorIcon width="44" height="44" className="mx-auto text-cyan-300" />
          <p className="mt-2 text-sm text-slate-200">The Doctor&rsquo;s treatment put you to sleep. You sleep through tonight and cannot act.</p>
        </Panel>
        <Btn className="mt-5" onClick={() => onDone({})}>Continue</Btn>
      </div>
    );
  }
  if (role === 'doctor') {
    const ids = pick === 'skip' ? '' : val;
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub="A Zombie or Infected player is cured. Anyone uninfected sleeps through the next night." />
        <PickList players={opts(alive.filter((p) => (!actor || p.id !== actor.id) && !(ext && ext.group.includes(p.id))))} value={ids} onChange={choose} />
        <Btn className="mt-3" variant="secondary" onClick={() => setPick(pick === 'skip' ? null : 'skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip'}</Btn>
        <Btn className="mt-3" disabled={pick === null} onClick={() => onDone({ doctor: pick === 'skip' ? null : pick })}>{pick === null ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Skip' : 'Confirm Treatment'}</Btn>
      </div>
    );
  }
  if (role === 'cured') {
    const back = actor && ROLES_DATA[actor.role] ? ROLES_DATA[actor.role].name : 'Villager';
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} chip={actor ? actor.role : 'villager'} />
        <Panel className="text-center" style={{ border: '1px solid rgba(34,211,238,0.65)', background: 'rgba(8,145,178,0.2)' }}>
          <DoctorIcon width="48" height="48" className="mx-auto text-cyan-300" />
          <div className="font-display mt-2 text-xl font-bold text-slate-50">You are human again</div>
          <p className="mt-2 text-sm text-slate-300">The Doctor cured you. You are a {back} once more, with your old powers back, and you no longer wake with the Zombie Horde.</p>
        </Panel>
        <Btn className="mt-5" onClick={() => onDone({})}>I Understand</Btn>
      </div>
    );
  }
  if (role === 'werewolf') {
    const solo = alive.filter((p) => p.role === 'werewolf').length === 1; // a lone Werewolf has no pack: hide their own name
    const teamIds = alive.filter((p) => p.role === 'werewolf' || p.role === 'shadow').map((p) => p.id);
    const cand = alive.filter((p) => !(solo || hideSelf) || !actor || p.id !== actor.id);
    if (bloodMoon && Math.min(2, cand.filter((p) => !teamIds.includes(p.id)).length) === 2) { // Blood Moon: two distinct targets
      const sel = typeof pick === 'string' && pick ? pick.split('|').map((x) => (cand.find((q) => String(q.id) === x) || {}).id).filter((v) => v !== undefined) : [];
      return (
        <div className="flex flex-1 flex-col">
          <ActHeader role={role} prompt="BLOOD MOON: CHOOSE TWO TARGETS TO HUNT." sub={solo ? 'Choose silently, then tap the two names.' : 'Agree silently, then one of you taps the two names.'} />
          <MultiPickList players={opts(cand)} team={teamIds} value={sel} onChange={(a) => setPick(a.length ? a.join('|') : null)} />
          <p className="mt-3 text-center text-sm font-bold tabular-nums text-red-300">{sel.length}/2 Selected</p>
          <Btn className="mt-3" disabled={sel.length < 2} onClick={() => onDone({ werewolf: sel[0], werewolf2: sel[1] })}>{sel.length < 2 ? 'Select two targets' : 'Confirm Targets'}</Btn>
        </div>
      );
    }
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} prompt={solo ? 'Werewolf, choose who to hunt.' : undefined} sub={solo ? 'Choose silently, then tap the name.' : 'Agree silently, then one of you taps the name.'} />
        <PickList players={opts(alive.filter((p) => !(solo || hideSelf) || !actor || p.id !== actor.id))} team={alive.filter((p) => p.role === 'werewolf' || p.role === 'shadow').map((p) => p.id)} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ werewolf: pick })}>{pick === null ? 'Select a target' : 'Confirm Target'}</Btn>
      </div>
    );
  }
  if (role === 'zombie') {
    const zs = alive.filter((p) => p.role === 'zombie');
    const solo = zs.length <= 1;
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} prompt={solo ? 'Zombie, choose who to infect.' : undefined} sub={solo ? 'The bite turns them the following night.' : 'Agree silently. One bite per night for the whole horde.'} />
        <PickList players={opts(alive.filter((p) => !(solo || hideSelf) || !actor || p.id !== actor.id))} team={alive.filter((p) => p.role === 'zombie' || p.role === 'infector').map((p) => p.id)} teamLabel="Zombie team" TeamIcon={ZombieIcon} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ zombie: pick })}>{pick === null ? 'Select a target' : 'Confirm Infection'}</Btn>
      </div>
    );
  }
  if (role === 'infector') {
    const fs = alive.filter((p) => p.role === 'infector');
    const solo = fs.length <= 1;
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} prompt={solo ? 'Infected, choose who to bite.' : undefined} sub={solo ? 'The victim stays human tonight and turns the night after.' : 'Agree silently. One slow bite per night for all of you.'} />
        <PickList players={opts(alive.filter((p) => !(solo || hideSelf) || !actor || p.id !== actor.id))} team={alive.filter((p) => p.role === 'zombie' || p.role === 'infector').map((p) => p.id)} teamLabel="Zombie team" TeamIcon={ZombieIcon} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ infector: pick })}>{pick === null ? 'Select a target' : 'Confirm Bite'}</Btn>
      </div>
    );
  }
  if (role === 'sniper') {
    return <SniperScope header={<ActHeader role={role} sub="Lock onto one player to scope them. If they are infected, you may take the shot." />}
      alive={opts(alive.filter((p) => p.id !== actor.id))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.role === 'zombie' || !!q.bitten); }}
      value={pick} setValue={setPick} onDone={(t, shot) => onDone({ sniper: t, sniperShot: shot })} />;
  }
  if (role === 'plaguedoctor') {
    return <PlagueScan header={<ActHeader role={role} sub="Lock onto one player to inspect them, then choose a serum." />}
      alive={opts(alive.filter((p) => p.id !== actor.id))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.role === 'zombie' || q.role === 'infector' || !!q.bitten || !!q.incub); }}
      value={pick} setValue={setPick} onDone={(t, a) => onDone({ plaguedoctor: t, plagueAct: a })} />;
  }
  if (role === 'infected') {
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} />
        <Panel className="text-center" style={{ border: '1px solid rgba(45,212,191,0.65)', background: 'rgba(13,148,136,0.22)' }}>
          <ZombieIcon width="48" height="48" className="mx-auto text-emerald-300" />
          <div className="font-display mt-2 text-xl font-bold text-slate-50">You are now a Zombie</div>
          <p className="mt-2 text-sm text-slate-300">Your old powers are gone. From now on you wake with the Zombie Horde and win with them.</p>
        </Panel>
        <Btn className="mt-5" onClick={() => onDone({})}>I Understand</Btn>
      </div>
    );
  }
  if (role === 'cupid') {
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub="Tap two players. You may include yourself." />
        <PairList players={opts(alive)} value={pair} onChange={setPair} />
        <Btn className="mt-5" disabled={pair.length < 2} onClick={() => onDone({ cupid: pair })}>{pair.length < 2 ? 'Select two players' : 'Confirm Lovers'}</Btn>
      </div>
    );
  }
  if (role === 'shadow') {
    const stoned = hasV(choices.medusa) && choices.medusa === actor.id;
    return <ShadowAct header={<ActHeader role="shadow" />} actions={nightActions(choices)} victimName={wolfTargetName(choices, nm)}
      alive={opts(alive.filter((p) => !hideSelf || !actor || p.id !== actor.id))} wolves={alive.filter((p) => p.role === 'werewolf').map((p) => p.id)} selfId={hideSelf || !actor ? null : actor.id} nm={nm} stoned={stoned} onDone={(r) => onDone({ shadow: r })} />;
  }
  if (role === 'seerResult') {
    const sv = seerOverride || seerVision(choices, choices.shadow, (players.find((p) => p.alive && p.role === 'shadow') || {}).id, actor.id, players);
    const tp = sv.target === null ? null : players.find((p) => p.id === sv.target);
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role="seerResult" />
        {sv.stoned || !tp ? <StoneVision /> : <GhostFlip key={tp.id} name={tp.name} wolf={tp.role === 'werewolf'} odd={tp.role === 'shadow' || tp.role === 'spellcaster'} />}
        {!sv.stoned && tp && sv.from !== null && sv.from !== undefined && <p role="note" className="mt-3 rounded-xl px-3 py-2 text-center text-sm font-semibold text-amber-100" style={{ background: 'rgba(245,158,11,0.15)', border: '1px solid rgba(245,158,11,0.55)' }}>Your inspection was redirected from {nm(sv.from)} to {tp.name}.</p>}
        <Btn className="mt-5" onClick={() => onDone({})}>Done</Btn>
      </div>
