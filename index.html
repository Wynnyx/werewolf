function MpNightManual({ me, players, room, write }) {
  const [pick, setPick] = useState('');
  const [pair, setPair] = useState([]);
  const [save, setSave] = useState(false);
  const role = me.r;
  const alive = players.filter((p) => p.a === 1);
  const done = me.nd === 1;
  const name = (id) => (players.find((p) => p.id === id) || {}).n || '?';
  const lock = (extra) => write({ [`pl/${me.id}/t`]: pick || '', [`pl/${me.id}/nd`]: 1, ...(extra || {}) });

  if (me.a !== 1) return <SleepPanel me={me} text="You have been eliminated. Keep quiet and keep your eyes closed." />;
  if (!mpActive(role, room.k)) return <SleepPanel me={me} text="Close your eyes and stay silent. The night roles are at work." />;

  const header = (title, sub) => (
    <div className="mb-4 text-center">
      <RoleChip role={role} />
      <h2 className="font-display mt-3 text-2xl font-bold">{title}</h2>
      <p className="mt-1 text-sm text-slate-300">{sub}</p>
    </div>
  );
  const lockedNote = (
    <div className="mt-4 rounded-xl px-4 py-3 text-center text-sm font-semibold text-emerald-200" style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.4)' }}>
      Choice locked in. Wait for dawn.
    </div>
  );

  if (me.sd === room.k) {
    return done ? <div className="flex flex-1 flex-col">{header('You are sedated', 'You sleep through tonight.')}{lockedNote}</div>
      : <div className="flex flex-1 flex-col">{header('You are sedated', 'The Doctor’s treatment put you to sleep. You cannot act tonight.')}<Btn className="mt-4" onClick={() => write({ [`pl/${me.id}/nd`]: 1 })}>Continue</Btn></div>;
  }
  if (role === 'cupid') {
    const [la, lb] = done ? [me.t, me.t2] : pair;
    return (
      <div className="flex flex-1 flex-col">
        {header('Bind two Lovers', 'Tap two players. You may include yourself.')}
        <PairList players={alive.map((p) => ({ id: p.id, n: p.n }))} value={done ? [me.t, me.t2] : pair} onChange={setPair} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={pair.length < 2} onClick={() => write({ [`pl/${me.id}/t`]: la, [`pl/${me.id}/t2`]: lb, [`pl/${me.id}/nd`]: 1, [`pl/${la}/lv`]: lb, [`pl/${lb}/lv`]: la })}>{pair.length < 2 ? 'Select two players' : 'Confirm Lovers'}</Btn>}
      </div>
    );
  }
  if (role === 'werewolf') {
    const pack = players.filter((p) => p.r === 'werewolf' && p.id !== me.id);
    const teamIds = alive.filter((p) => p.r === 'werewolf' || p.r === 'shadow').map((p) => p.id);
    if (room.bm && Math.min(2, alive.filter((p) => p.id !== me.id && !teamIds.includes(p.id)).length) === 2) { // Blood Moon: two targets
      const sel = done ? [me.t, me.t2].filter(Boolean) : (pick ? String(pick).split('|').filter((x) => alive.some((q) => String(q.id) === x)) : []);
      return (
        <div className="flex flex-1 flex-col">
          {header('BLOOD MOON: CHOOSE TWO TARGETS TO HUNT.', 'Agree silently with your pack. The most votes win.')}
          <MultiPickList players={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} team={teamIds} value={sel} onChange={(a) => setPick(a.join('|'))} locked={done} />
          {!done && <p className="mt-3 text-center text-sm font-bold tabular-nums text-red-300">{sel.length}/2 Selected</p>}
          {pack.length > 0 && (
            <div className="mt-3 rounded-xl p-3 text-xs text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
              <div className="mb-1 font-semibold uppercase tracking-widest text-slate-400">Your pack</div>
              {pack.map((p) => <div key={p.id}>{p.n}: {p.t ? `votes ${name(p.t)}${p.t2 ? ' & ' + name(p.t2) : ''}` : 'deciding...'}</div>)}
            </div>
          )}
          {done ? lockedNote : <Btn className="mt-4" disabled={sel.length < 2} onClick={() => lock({ [`pl/${me.id}/t`]: sel[0], [`pl/${me.id}/t2`]: sel[1] })}>{sel.length < 2 ? 'Select two targets' : 'Confirm Targets'}</Btn>}
        </div>
      );
    }
    return (
      <div className="flex flex-1 flex-col">
        {header('Choose your victim', 'Agree silently with your pack. The most votes wins.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} team={alive.filter((p) => p.r === 'werewolf' || p.r === 'shadow').map((p) => p.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {pack.length > 0 && (
          <div className="mt-3 rounded-xl p-3 text-xs text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
            <div className="mb-1 font-semibold uppercase tracking-widest text-slate-400">Your pack</div>
            {pack.map((p) => <div key={p.id}>{p.n}: {p.t ? `votes ${name(p.t)}` : 'deciding...'}</div>)}
          </div>
        )}
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Lock In Victim</Btn>}
      </div>
    );
  }
  if (role === 'shadow') {
    const others = players.filter((p) => p.a === 1 && p.r !== 'shadow' && mpActive(p.r, room.k));
    const waiting = others.some((p) => p.nd !== 1);
    const c = mpChoices(players);
    const mineSa = me.sa ? (nightActions(c).find((a) => a.key === me.sa) || null) : null;
    if (done) return <div className="flex flex-1 flex-col">{header('Redirect an action', me.sa ? 'Your redirect is set.' : 'You left every action unchanged.')}{lockedNote}</div>;
    if (waiting) return <div className="flex flex-1 flex-col">{header('Redirect an action', 'You act last, once everyone else has chosen.')}<p className="mt-4 text-center text-sm text-slate-300">Waiting for the other night roles to finish&hellip;</p></div>;
    return <ShadowAct header={header('Redirect an action', 'Choose one action and a new target, or skip.')} actions={nightActions(c)} victimName={wolfTargetName(c, name)}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} wolves={alive.filter((p) => p.r === 'werewolf').map((p) => p.id)} nm={name} stoned={mpStoneTarget(players) === me.id}
      onDone={(r) => lock({ [`pl/${me.id}/t`]: r ? r.to : '', [`pl/${me.id}/sa`]: r ? r.key : '' })} />;
  }
  if (role === 'medusa') {
    const skipped = done && !me.t;
    return (
      <div className="flex flex-1 flex-col">
        {header('Turn a player to stone', me.lp ? `You cannot petrify ${name(me.lp)} two nights in a row.` : 'They cannot act tonight, and cannot speak or vote tomorrow.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} disabled={me.lp ? [me.lp] : []} locked={done} />
        {!done && <Btn className="mt-3" variant="secondary" onClick={() => setPick('skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip / Don\u2019t Use Gaze Tonight'}</Btn>}
        {done ? <>{skipped && <p className="mt-3 text-center text-sm text-slate-300">You skipped your gaze tonight.</p>}{lockedNote}</>
          : <Btn className="mt-3" disabled={!pick} onClick={() => lock(pick === 'skip' ? { [`pl/${me.id}/t`]: '' } : undefined)}>{!pick ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Skip' : 'Confirm Petrify'}</Btn>}
      </div>
    );
  }
  if (role === 'seer') {
    const medusaPending = players.some((p) => p.a === 1 && p.r === 'medusa' && p.nd !== 1);
    const shadowPending = players.some((p) => p.a === 1 && p.r === 'shadow' && p.nd !== 1);
    const pendingWho = medusaPending ? 'Medusa' : 'the Shadow Figure';
    const sv = done && !medusaPending && !shadowPending ? mpSeerView(players, me.id) : null;
    const seerStoned = !!(sv && sv.stoned);
    const target = sv && !sv.stoned && sv.target ? players.find((p) => p.id === sv.target) : null;
    return (
      <div className="flex flex-1 flex-col">
        {header('Inspect a player', 'Learn whether one player is a werewolf.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? (
          <>
            {done && medusaPending && <p className="mt-4 text-center text-sm text-slate-300">Your vision is clouding. Waiting for Medusa&hellip;</p>}
            {done && !medusaPending && shadowPending && <p className="mt-4 text-center text-sm text-slate-300">Your vision is clouding. Waiting for the Shadow Figure&hellip;</p>}
            {seerStoned && <StoneVision />}
            {target && (
              <div className="mt-4 rounded-xl px-4 py-4 text-center" style={{ background: target.r === 'werewolf' ? 'rgba(220,38,38,0.18)' : 'rgba(16,185,129,0.14)', border: `1px solid ${target.r === 'werewolf' ? '#EF4444' : '#34D399'}` }}>
                <div className="font-display text-xl font-bold">{target.n}</div>
                <div className="mt-1 text-sm font-semibold" style={{ color: target.r === 'werewolf' ? '#FCA5A5' : '#6EE7B7' }}>{target.r === 'werewolf' ? 'is a Werewolf' : 'is not a Werewolf'}</div>
              </div>
            )}
            {lockedNote}
          </>
        ) : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Inspect</Btn>}
      </div>
    );
  }
  if (role === 'bodyguard') {
    return (
      <div className="flex flex-1 flex-col">
        {header('Protect a player', me.lp ? `You cannot guard ${name(me.lp)} again tonight.` : 'They cannot be eliminated tonight.')}
        <PickList players={alive} value={done ? me.t : pick} onChange={setPick} disabled={me.lp ? [me.lp] : []} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Protect</Btn>}
      </div>
    );
  }
  if (role === 'sniper') {
    if (done) return <div className="flex flex-1 flex-col">{header('Scope a player', me.ws === 1 ? 'You took the shot.' : 'You held fire.')}{lockedNote}</div>;
    return <SniperScope header={header('Scope a player', 'Lock onto one player to scope them. If they are infected, you may take the shot.')}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.r === 'zombie' || !!q.bt); }}
      value={pick} setValue={setPick} onDone={(t, shot) => write({ [`pl/${me.id}/t`]: t, [`pl/${me.id}/ws`]: shot ? 1 : 0, [`pl/${me.id}/nd`]: 1 })} />;
  }
  if (role === 'doctor') {
    const skipped = done && !me.t;
    return (
      <div className="flex flex-1 flex-col">
        {header('Treat a player', 'A Zombie or Infected player is cured. Anyone uninfected sleeps through tomorrow night.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : (pick === 'skip' ? '' : pick)} onChange={setPick} locked={done} />
        {!done && <Btn className="mt-3" variant="secondary" onClick={() => setPick(pick === 'skip' ? '' : 'skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip'}</Btn>}
        {done ? <>{skipped && <p className="mt-3 text-center text-sm text-slate-300">You skipped tonight.</p>}{lockedNote}</>
          : <Btn className="mt-3" disabled={!pick} onClick={() => lock(pick === 'skip' ? { [`pl/${me.id}/t`]: '' } : undefined)}>{!pick ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Skip' : 'Confirm Treatment'}</Btn>}
      </div>
    );
  }
  if (role === 'zombie' || role === 'infector') {
    const fz = alive.filter((p) => p.r === 'zombie' || p.r === 'infector').map((p) => p.id);
    return (
      <div className="flex flex-1 flex-col">
        {header(role === 'infector' ? 'Bite a player' : 'Infect a player', role === 'infector' ? 'The victim stays human tonight and turns the night after.' : 'The bite turns them the following night.')}
        <PickList players={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} team={fz} teamLabel="Zombie team" TeamIcon={ZombieIcon} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Confirm Bite</Btn>}
      </div>
    );
  }
  if (role === 'plaguedoctor') {
    if (done) return <div className="flex flex-1 flex-col">{header('Inspect a player', me.ws === 1 ? 'You administered the cure.' : me.ws === 2 ? 'You injected the plague.' : 'You left them alone.')}{lockedNote}</div>;
    return <PlagueScan header={header('Inspect a player', 'Lock onto one player to inspect them, then choose a serum.')}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.r === 'zombie' || q.r === 'infector' || !!q.bt || !!q.ic); }}
      value={pick} setValue={setPick} onDone={(t, a) => write({ [`pl/${me.id}/t`]: t, [`pl/${me.id}/ws`]: a === 'cure' ? 1 : a === 'infect' ? 2 : 0, [`pl/${me.id}/nd`]: 1 })} />;
  }
  if (role === 'spellcaster') {
    return (
      <div className="flex flex-1 flex-col">
        {header('Silence a player', 'They may not speak during tomorrow’s discussion.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Cast Silence</Btn>}
      </div>
    );
  }
  // witch
  const vs = mpWolfVictims(players);
  const victimId = vs[0] || '';
  const two = vs.length > 1;
  const canSave = !me.wsu && !!victimId;
  return (
    <div className="flex flex-1 flex-col">
      {header('Brew your potions', 'Each potion can only be used once in the whole game.')}
      <Panel className="text-sm">
        <div className="text-xs font-semibold uppercase tracking-widest text-slate-400">Tonight&rsquo;s victim</div>
        <div className="mt-1 font-display text-lg font-bold">{vs.length ? vs.map((v) => name(v)).join(' & ') : 'The wolves have not chosen yet'}</div>
        {me.wsu === 1
          ? <p className="mt-2 text-xs text-slate-500">Healing potion already used.</p>
          : two
            ? <div className="mt-3 flex flex-col gap-2">{vs.map((v, i) => { const on = done ? me.ws === i + 1 : save === v; return (
                <button key={v} disabled={done} onClick={() => setSave(save === v ? false : v)} aria-pressed={on}
                  className="flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-bold transition disabled:opacity-40"
                  style={{ background: on ? 'rgba(16,185,129,0.25)' : 'var(--card-2)', border: `1px solid ${on ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>{on ? `Saving ${name(v)} ✓` : `Save ${name(v)}`}</button>); })}</div>
            : <button disabled={!canSave || done} onClick={() => setSave(!save)} aria-pressed={save}
              className="mt-3 flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-bold transition disabled:opacity-40"
              style={{ background: (done ? me.ws === 1 : save) ? 'rgba(16,185,129,0.25)' : 'var(--card-2)', border: `1px solid ${(done ? me.ws === 1 : save) ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>
              {(done ? me.ws === 1 : save) ? `Saving ${victimId ? name(victimId) : ''} ✓` : 'Use healing potion'}
            </button>}
      </Panel>
      {me.wpu === 1
        ? <p className="mt-3 text-center text-xs text-slate-500">Poison already used.</p>
        : <>
            <div className="mb-2 mt-4 text-xs font-semibold uppercase tracking-widest text-slate-400">Poison a player (optional)</div>
            <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
          </>}
      {done ? lockedNote : <Btn className="mt-4" onClick={() => lock({ [`pl/${me.id}/ws`]: save && canSave ? (two && save === vs[1] ? 2 : 1) : 0 })}>{pick || (save && canSave) ? 'Confirm' : 'Do Nothing Tonight'}</Btn>}
    </div>
  );
}

// Multi-Device automated night, phone side. The host's narrator sets room.ns; each phone shows only what its role may see.
function MpNight(props) {
  if (props.room.ns) return <MpNightAuto {...props} />;
  const pt = props.me.lv && props.me.a === 1 ? props.players.find((x) => x.id === props.me.lv) : null;
  return <>{pt && <LoverBadge name={pt.n} className="mb-3" />}<MpNightManual me={props.me} players={props.players} room={props.room} write={props.write} /></>;
}

// Private chat for the players who are awake together on the same night turn. Only the group sees it, and it clears when the turn ends.
const CHAT_QUICK = ['Agree', 'Not that one', 'Skip', 'Your call'];
function TeamChat({ me, group, room, write, tag }) {
  const [text, setText] = useState('');
  const ids = group.map((g) => g.id);
  const msgs = Object.entries(room.cm || {}).filter(([k, m]) => m && m.g === tag && ids.includes(m.i)).sort((a, b) => (a[0] < b[0] ? -1 : 1)).slice(-4);
  const send = (x) => {
    const t = String(x).trim().slice(0, 80);
    if (!t) return;
    setText('');
    write({ [`cm/${Date.now()}_${me.id}`]: { g: tag, i: me.id, f: me.n, x: t } });
  };
  return (
    <div data-testid="team-chat" className="mt-4 rounded-2xl p-3" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <div className="mb-1 text-[10px] font-bold uppercase tracking-[0.22em] text-slate-400">Team chat {'\u00b7'} {group.map((g) => g.n).join(', ')}</div>
      <div className="mb-2 max-h-24 min-h-[20px] space-y-1 overflow-y-auto text-[13px]">
        {msgs.length === 0 && <div className="text-slate-500">Whisper to your team. Only you can see this.</div>}
        {msgs.map(([k, m]) => <div key={k}><span className="font-bold" style={{ color: m.i === me.id ? '#A5B4FC' : '#FCA5A5' }}>{m.i === me.id ? 'You' : m.f}</span> <span className="text-slate-200">{m.x}</span></div>)}
      </div>
      <div className="mb-2 flex flex-wrap gap-1.5">
        {CHAT_QUICK.map((q) => <button key={q} onClick={() => send(q)} className="rounded-full px-2.5 py-1 text-[11px] font-semibold text-slate-200" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>{q}</button>)}
      </div>
      <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); send(text); }}>
        <input value={text} onChange={(e) => setText(e.target.value)} maxLength={80} placeholder="Message your team" aria-label="Team chat message"
          className="min-w-0 flex-1 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }} />
        <button type="submit" className="rounded-xl px-4 py-2 text-sm font-bold text-white" style={{ background: 'var(--accent, #6366F1)' }}>Send</button>
      </form>
    </div>
  );
}

function MpNightAuto({ me, players, room, write, immersive, onLeave }) {
  const ns = room.ns || '';
  const role = ns.indexOf('r:') === 0 ? ns.slice(2) : '';
  const viewing = ns === 'v:seer'; // the Seer's final vision, after the Shadow Figure has acted
  const tag = `${ns}:${room.nk}`;
  const [n, setN] = useState(5);
  const [opened, setOpened] = useState('');
  const [sent, setSent] = useState('');
  useEffect(() => { if (ns === 'i' && room.bm) Sfx.rumble(); }, [ns, room.nk]);
  useEffect(() => {
    if (ns !== 'c') return;
    let k = 5; setN(5);
    const t = setInterval(() => { k -= 1; setN(Math.max(0, k)); if (k <= 0) clearInterval(t); }, 1000);
    return () => clearInterval(t);
  }, [ns, room.nk]);

  const partner = me.lv && me.a === 1 ? players.find((x) => x.id === me.lv) : null;
  const group = role && role !== 'cupid' ? players.filter((x) => x.a === 1 && x.r === role && x.sd !== room.k) : []; // everyone awake on this turn shares one action
  const chatGroup = group.length > 1 && me.a === 1 && me.r === role && me.nd !== 1;
  const [spL, setSpL] = useState(null);
  const wrap = (body, pitch) => <NightStage fixed={!!immersive} pitch={pitch} blood={!!room.bm} onExit={immersive ? onLeave : undefined}>{!pitch && partner && <LoverBadge name={partner.n} className="mb-3" />}{body}{!pitch && chatGroup && <TeamChat me={me} group={group} room={room} write={write} tag={tag} />}</NightStage>;
  const mine = me.a === 1 && ((!!role && me.r === role && me.nd !== 1) || (viewing && me.r === 'seer' && me.rd !== 1) || (role === 'infected' && me.jt === 1) || (role === 'cured' && me.cj === 1)) && sent !== tag;

  if (ns === 'i') return wrap(<><LockView key="i" title={`Night ${nightWord(room.k)} Begins...`} sub="The village falls silent." />{room.bm ? <BloodMoonBanner className="mb-6" /> : null}</>);
  if (ns === 'c') return wrap(<><LockView key="c" eye title="Close Your Eyes" sub="Keep them closed until the narrator says otherwise." count={n} />{room.bm ? <BloodMoonBanner className="mb-6" /> : null}</>);
  if (mine && opened !== tag) {
    return wrap(
      <div className="flex flex-1 flex-col items-center justify-center gap-6 text-center">
        <LockView key={'u' + tag} title={roleLabel(viewing ? 'seer' : role)} sub="Only your role may look now. Everyone else has their eyes closed." />
        <Btn className="max-w-xs" onClick={() => setOpened(tag)}>Tap to Unlock Secretly</Btn>
      </div>
    );
  }
  if (mine) {
    const adapted = players.map((p) => ({ id: p.id, name: p.n, role: p.r, alive: p.a === 1, saveUsed: p.wsu === 1, poisonUsed: p.wpu === 1, lastGuard: p.lp || null, lastStone: p.lp || null, bitten: p.bt || 0, incub: p.ic || 0, sedatedTag: p.sd === room.k }));
    const actor = adapted.find((p) => p.id === me.id);
    const victim = mpWolfVictim(players);
    const shadowAlive = players.some((p) => p.a === 1 && (p.r === 'shadow' || p.r === 'medusa' || (p.r === 'seer' && group.length > 1 && role === 'seer')));
    const srv = room.sp && room.sp.g === tag ? room.sp.v : null;
    const ext = group.length > 1 ? { group: group.map((g) => g.id), pick: spL && spL.g === tag && Date.now() - spL.at < 2500 ? spL.v : srv, set: (v) => { setSpL({ g: tag, v, at: Date.now() }); write({ sp: { g: tag, v } }); } } : undefined;
    const submit = (c) => {
      setSent(tag);
      const gp = (fn) => { const o = {}; (group.length ? group : [me]).forEach((g) => Object.assign(o, fn(g))); return o; }; // one confirmed action covers the whole wake-up group
      if (viewing) write({ [`pl/${me.id}/rd`]: 1 });
      else if (role === 'infected') write({ [`pl/${me.id}/jt`]: 2 });
      else if (role === 'cured') write({ [`pl/${me.id}/cj`]: 2 });
      else if (me.sd === room.k) write({ [`pl/${me.id}/nd`]: 1 }); // sedated: only they sleep through it, teammates act as normal
      else if (role === 'cupid') write({ [`pl/${me.id}/t`]: c.cupid[0], [`pl/${me.id}/t2`]: c.cupid[1], [`pl/${me.id}/nd`]: 1, [`pl/${c.cupid[0]}/lv`]: c.cupid[1], [`pl/${c.cupid[1]}/lv`]: c.cupid[0] });
      else if (role === 'shadow') write({ [`pl/${me.id}/t`]: c.shadow ? c.shadow.to : '', [`pl/${me.id}/sa`]: c.shadow ? c.shadow.key : '', [`pl/${me.id}/nd`]: 1 });
      else if (role === 'werewolf') write(gp((g) => ({ [`pl/${g.id}/t`]: c.werewolf || '', [`pl/${g.id}/t2`]: c.werewolf2 || '', [`pl/${g.id}/nd`]: 1 })));
      else if (role === 'witch') { const vs = mpWolfVictims(players); write(gp((g) => ({ [`pl/${g.id}/t`]: c.witchPoison === null || c.witchPoison === undefined ? '' : c.witchPoison, [`pl/${g.id}/ws`]: c.witchSave ? (vs[1] && c.witchSaveTo === vs[1] ? 2 : 1) : 0, [`pl/${g.id}/nd`]: 1 }))); } // ws 2 = healing the second Blood Moon victim
      else if (role === 'plaguedoctor') write(gp((g) => ({ [`pl/${g.id}/t`]: c.plaguedoctor || '', [`pl/${g.id}/ws`]: c.plagueAct === 'cure' ? 1 : c.plagueAct === 'infect' ? 2 : 0, [`pl/${g.id}/nd`]: 1 })));
      else if (role === 'sniper') write(gp((g) => ({ [`pl/${g.id}/t`]: c.sniper || '', [`pl/${g.id}/ws`]: c.sniperShot ? 1 : 0, [`pl/${g.id}/nd`]: 1 }))); // ws doubles as the Sniper's "shot taken" flag
      else write(gp((g) => ({ [`pl/${g.id}/t`]: c[role] || '', [`pl/${g.id}/nd`]: 1 })));
    };
    if (viewing) {
      const sv = mpSeerView(players, me.id);
      return wrap(<NightActPP key={tag} role="seerResult" players={adapted} actor={actor} choices={mpChoices(players)} onDone={submit} seerOverride={sv} />);
    }
    return wrap(<NightActPP key={tag} role={role} players={adapted} actor={actor} choices={mpChoices(players)} deferSeer={shadowAlive} ext={ext} hideSelf bloodMoon={!!room.bm} onDone={submit} />);
  }
  const text = me.a !== 1 ? 'You have been eliminated. Stay silent and keep your eyes closed.' : 'The night is not over.';
  return wrap(<LockView key={'z' + tag} title="Keep your eyes closed..." sub={text} />, true);
}

// Runs on the host's device: speaks each cue, wakes each role in order, waits for their choices, then breaks dawn.
function useNightDirector({ room, players, write }) {
  const latest = useRef({ room, players });
  latest.current = { room, players };
  const runId = useRef(0);
  const skip = useRef(false);
  const [dir, setDir] = useState({ on: false, label: '' });
  useEffect(() => () => { runId.current += 1; Narrator.stop(); }, []);

  const stop = () => { runId.current += 1; Narrator.stop(); setDir({ on: false, label: '' }); };
  const skipRole = () => { skip.current = true; };
  const start = async (opts) => {
    const my = ++runId.current;
    const live = () => runId.current === my;
    const room0 = latest.current.room;
    const nightNo = opts && opts.again ? (room0.k || 1) : (room0.k || 0) + 1;
    const pred = latest.current.players.map((p) => (p.a === 1 && (p.ic ? p.ic <= 1 : p.bt && p.bt < nightNo) ? { ...p, r: 'zombie', fr: p.r, jt: 1 } : p)); // what dusk will turn into Zombies
    const roles = NIGHT_ORDER.filter((r) => mpActive(r, nightNo) && pred.some((p) => p.a === 1 && p.r === r));
    const turned = pred.find((p) => p.a === 1 && p.jt === 1 && p.fr && p.r === 'zombie' && latest.current.players.find((q) => q.id === p.id).r !== 'zombie');
    if (turned) {
      const key = NIGHT_ORDER.indexOf(turned.fr) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(turned.fr);
      const strict = NIGHT_ORDER.indexOf(turned.fr) >= 0;
      let at = roles.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return strict ? ix > key : ix >= key; });
      if (at < 0) at = roles.length;
      roles.splice(at, 0, 'infected');
    }
    const curedP = latest.current.players.find((p) => p.a === 1 && p.cu && p.cu === nightNo - 1);
    if (curedP) {
      const key = NIGHT_ORDER.indexOf(curedP.r) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(curedP.r);
      let at = roles.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return ix >= key; });
      if (at < 0) at = roles.length;
      roles.splice(at, 0, 'cured');
    }
    let nk = 1;
    const step = async (ns, label) => { nk += 1; setDir({ on: true, label }); await write({ ns, nk, cm: null, sp: null }); }; // each turn starts with a clean team chat
    try {
      const base = mpNightPatch(room0);
      if (opts && opts.again) { base.k = room0.k || 1; base.bm = base.k >= 2 && Math.random() < 0.2 ? 1 : 0; }
      setDir({ on: true, label: 'Night begins' });
      await write(base);
      await Narrator.say('Night begins. Everyone, close your eyes.'); if (!live()) return;
      await step('c', 'Everyone closes their eyes'); await wait(5200); if (!live()) return;
      for (const r of roles) {
        await step('z', `${roleLabel(r)} waking`);
        await Narrator.say(`${roleLabel(r)}, open your eyes.`); if (!live()) return;
        await step('r:' + r, `${roleLabel(r)} choosing`);
        skip.current = false;
        const t0 = Date.now();
        while (live()) {
          const holders = r === 'infected' ? latest.current.players.filter((p) => p.a === 1 && p.jt === 1) : r === 'cured' ? latest.current.players.filter((p) => p.a === 1 && p.cj === 1) : latest.current.players.filter((p) => p.a === 1 && p.r === r);
          if (r === 'infected' || r === 'cured' ? holders.length === 0 : holders.every((p) => p.nd === 1)) break;
          if (skip.current || Date.now() - t0 > 90000) break;
          await wait(500);
        }
        if (!live()) return;
        await step('z', `${roleLabel(r)} sleeping`);
        await Narrator.say(`${roleLabel(r)}, close your eyes.`); if (!live()) return;
        await wait(2200); if (!live()) return;
      }
      if (roles.includes('seer') && (roles.includes('shadow') || roles.includes('medusa') || latest.current.players.filter((p) => p.a === 1 && p.r === 'seer').length > 1)) {
        await step('z', 'Seer waking for the final vision');
        await Narrator.say('Seer, open your eyes.'); if (!live()) return;
        await step('v:seer', 'Seer viewing');
        skip.current = false;
        const t1 = Date.now();
        while (live()) {
          const seers = latest.current.players.filter((p) => p.a === 1 && p.r === 'seer');
          if (seers.every((p) => p.rd === 1) || skip.current || Date.now() - t1 > 90000) break;
          await wait(500);
        }
        if (!live()) return;
        await step('z', 'Seer sleeping');
        await Narrator.say('Seer, close your eyes.'); if (!live()) return;
        await wait(2200); if (!live()) return;
      }
      setDir({ on: true, label: 'Dawn' });
      await Narrator.say('Everyone, open your eyes. Morning has broken.'); if (!live()) return;
      const result = mpResolveNight(latest.current.room);
      await write(result.patch);
      setDir({ on: false, label: '' }); // the casualty screen is silent: players read it themselves
    } catch (e) { setDir({ on: false, label: '' }); }
  };
  return { dir, start, stop, skipRole };
}

// Votes in a room snapshot. Silenced players cannot vote, so they are left out of the voter count and their ballots are ignored.
function mpTally(players) {
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));
  const alive = players.filter((p) => p.a === 1);
  const voters = alive.filter((p) => p.s !== 1 && p.x !== 1 && p.sn !== 1);
  const tally = {};
  voters.forEach((p) => { if (p.v && byId[p.v] && byId[p.v].a === 1) tally[p.v] = (tally[p.v] || 0) + (p.r === 'mayor' ? 2 : 1); });
  const ranked = Object.keys(tally).sort((x, y) => tally[y] - tally[x]);
  const top = ranked[0] || '';
  const tie = ranked.length > 1 && tally[ranked[1]] === tally[top];
  return { tally, ranked, top, tie, voters, voted: voters.filter((p) => p.v).length };
}
function mpVotePatch(players, id, opts) {
  const o = opts || {};
  const patch = {};
  const ts = String(Date.now());
  players.forEach((p) => { patch[`pl/${p.id}/v`] = ''; });
  if (!o.revote) patch.vd = 1;
  const t = id ? players.find((p) => p.id === id) : null;
  if (t) {
    patch[`pl/${id}/a`] = 0;
    patch[`an/x/${ts}a`] = `${t.n} was voted out by the village.`;
    if (getSettings().revealDead && ROLES_DATA[t.r]) patch[`an/x/${ts}b`] = `${t.n} was the ${ROLES_DATA[t.r].name}.`;
    const pt = t.lv ? players.find((x) => x.id === t.lv && x.a === 1) : null;
    if (pt) { patch[`pl/${pt.id}/a`] = 0; patch[`an/x/${ts}c`] = `${pt.n} died of heartbreak.`; }
  } else if (o.tie) patch[`an/x/${ts}a`] = 'The vote was tied. No one was eliminated.';
  return patch;
}

function MpVote({ me, players, room, write }) {
  const alive = players.filter((p) => p.a === 1);
  const { voters, voted } = mpTally(players);
  const [pick, setPick] = useState(me.v || '');
  const stonedMe = me.x === 1;
  const silenced = me.s === 1 || stonedMe || me.sn === 1;
  const nm = (id) => (players.find((p) => p.id === id) || {}).n || '?';
  if (room.vd === 1) return <Panel className="text-center text-sm text-slate-300">The village has decided.</Panel>;
  if (me.a !== 1) return <Panel className="text-center text-sm text-slate-400">The village is voting. {voted} of {voters.length} votes are in.</Panel>;
  return (
    <Panel id="mp-vote">
      <h3 className="font-display text-lg font-bold">Trial vote</h3>
      {me.r === 'mayor' && !silenced && <MayorNote className="mt-2" />}
      <p className="mb-3 mt-1 text-xs text-slate-300">{stonedMe ? 'You are turned to stone and cannot vote today.' : me.sn === 1 ? 'The Sniper shot you. You cannot vote today.' : silenced ? 'You cannot vote today.' : 'Discuss, then vote for the player you want eliminated.'} {voted} of {voters.length} votes are in.</p>
      <PickList players={alive.filter((p) => p.id !== me.id)} value={silenced ? '' : pick} onChange={setPick} locked={silenced} />
      <Btn className="mt-3" disabled={silenced || !pick || pick === me.v} onClick={() => write({ [`pl/${me.id}/v`]: pick })}>{silenced ? 'Voting disabled' : me.v ? 'Change Vote' : 'Cast Vote'}</Btn>
      {!silenced && me.v && <p className="mt-2 text-center text-xs text-emerald-300">Your vote: {nm(me.v)}</p>}
    </Panel>
  );
}

function AnnounceCard({ room, players }) {
  const an = room.an;
  if (!an) return null;
  const lines = Object.values(an.l || {});
  const extra = Object.entries(an.x || {}).sort((a, b) => a[0].localeCompare(b[0])).map((e) => e[1]);
  const si = an.si && players.find((p) => p.id === an.si);
  const st = an.st && players.find((p) => p.id === an.st);
  return (
    <Panel className="text-center" style={{ background: 'linear-gradient(160deg, rgba(251,191,36,0.1), rgba(21,26,36,0.95))', border: '1px solid rgba(251,191,36,0.4)' }}>
      <div className="text-[11px] font-bold uppercase tracking-[0.28em] text-amber-300">Morning of day {an.k}</div>
      <div className="mt-2 flex flex-col gap-1.5">
        {lines.map((t, i) => <p key={i} className="font-display text-lg font-bold leading-snug text-slate-50">{t}</p>)}
        {an.rv && (
          <div className="mt-1 flex flex-wrap items-start justify-center gap-3">
            {Object.entries(an.rv).map(([id, role]) => { const dp = players.find((x) => x.id === id); return dp && ROLES_DATA[role] ? <NightCard key={id} player={{ role }} line={`${dp.n} was the ${ROLES_DATA[role].name}`} /> : null; })}
          </div>
        )}
        {si && <p className="text-sm text-violet-200">{si.n} has been silenced for the day. They cannot speak or vote.</p>}
        {st && <p className="text-sm text-teal-200">{stoneLine(st.n)}</p>}
        {extra.map((t, i) => <p key={'x' + i} className="text-sm text-slate-300">{t}</p>)}

function StatusBadges({ players, meId }) {

          {p.n}{p.id === meId ? ' (you)' : ''}{p.s === 1 && p.a === 1 ? ' 🤐' : ''}{p.x === 1 && p.a === 1 ? ' 🗿 STONED' : ''}{p.sn === 1 && p.a === 1 ? ' 🎯 NO VOTE' : ''}
        </span>
      ))}
    </div>

}

const DAWN_SEEN = { key: '' };
function MpDay({ me, players, room, write }) {
  const fxKey = room.an && room.an.k === room.k && room.an.t ? String(room.an.t) : '';
  const [fx, setFx] = useState(!!fxKey && fxKey !== DAWN_SEEN.key && Date.now() - Number(fxKey) < 20000);
  useEffect(() => { if (!fx) return; DAWN_SEEN.key = fxKey; const t = setTimeout(() => setFx(false), 2700); return () => clearTimeout(t); }, [fx]);
  const alive = players.filter((p) => p.a === 1);
  const hunterShot = me.r === 'hunter' && me.a !== 1 && me.hs !== 1;
  const [target, setTarget] = useState('');
  const shoot = () => {
    const t = players.find((p) => p.id === target);
    if (!t) return;
    const pt = t.lv ? players.find((x) => x.id === t.lv && x.a === 1) : null;
    const ts = String(Date.now());
    write({ [`pl/${t.id}/a`]: 0, [`pl/${me.id}/hs`]: 1, [`an/x/${ts}`]: `${me.n} fired a last shot and took ${t.n} down.`, ...(pt ? { [`pl/${pt.id}/a`]: 0, [`an/x/${ts}h`]: `${pt.n} died of heartbreak.` } : {}) });
  };
  return (
    <div className={`flex flex-1 flex-col gap-4 ${fx ? 'dawn-shake' : ''}`}>
      {me.lv && me.a === 1 && players.some((x) => x.id === me.lv) && <LoverBadge name={players.find((x) => x.id === me.lv).n} />}
      {fx && (
        <div className="pointer-events-none fixed inset-0 z-40 flex items-start justify-center overflow-hidden" aria-hidden="true">
          <div className="dawn-flash absolute inset-0" />
          <MoonIcon width="120" height="120" className="moon-fade mt-24 text-slate-100" />
        </div>
      )}
      <AnnounceCard room={room} players={players} />
      <DayTimer startAt={fxKey ? Number(fxKey) : 0} onEnd={() => { try { const el = document.getElementById('mp-vote'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* ignore */ } }} />
      {me.a !== 1
        ? <Panel className="text-center text-sm text-slate-300">You are eliminated. You can still watch, but keep quiet.</Panel>
        : me.x === 1
          ? <Panel className="text-center text-sm font-semibold text-teal-100" style={{ border: '1px solid rgba(45,212,191,0.7)', background: 'rgba(13,148,136,0.25)' }} role="alert">You have been turned to stone by Medusa until dusk &mdash; you cannot speak or vote today.</Panel>
        : me.s === 1
          ? <Panel className="text-center text-sm font-semibold text-violet-100" style={{ border: '1px solid rgba(167,139,250,0.7)', background: 'rgba(109,40,217,0.25)' }} role="alert">You have been silenced by the Spellcaster &mdash; you cannot speak or vote today.</Panel>
          : me.sn === 1
            ? <Panel className="text-center text-sm font-semibold text-sky-100" style={{ border: '1px solid rgba(96,165,250,0.7)', background: 'rgba(37,99,235,0.25)' }} role="alert">The Sniper shot you &mdash; your vote is disabled for today.</Panel>
          : <Panel className="text-center text-sm text-slate-300">You are alive. Discuss and find the werewolves.</Panel>}
      {hunterShot && (
        <Panel style={{ border: '1px solid rgba(245,158,11,0.6)' }}>
          <h3 className="font-display text-lg font-bold text-amber-300">Take your last shot</h3>
          <p className="mb-3 mt-1 text-xs text-slate-300">You were eliminated. Choose one player to take down with you.</p>
          <PickList players={alive} value={target} onChange={setTarget} />
          <Btn className="mt-3" disabled={!target} onClick={shoot}>Fire</Btn>
        </Panel>
      )}
      {!hunterShot && <MpVote me={me} players={players} room={room} write={write} />}
      <div>
        <div className="mb-2 text-xs font-semibold uppercase tracking-widest text-slate-400">Players</div>
        <StatusBadges players={players} meId={me.id} />
      </div>
    </div>
  );
}

function MpOver({ room, players, meId }) {

        {players.some((p) => p.r === 'plaguedoctor') && <p className="mt-2 text-sm text-slate-300">{plagueLine(players.map((p) => ({ role: p.r, alive: p.a === 1, side: pdSide(p.pdc, p.pdi, p.pdl) })), room.w).trim()}</p>}
      </Panel>

}

/* ---------- host / moderator view ---------- */

  const ph = room.ph;
  const [confirmEnd, setConfirmEnd] = useState(false);
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));
  const nm = (id) => (byId[id] || {}).n || '?';
  const nightRoles = useMemo(() => mpNightRoles(players), [players]);
  const alive = players.filter((p) => p.a === 1);
  const winner = mpWinner(players);
  const actors = alive.filter((p) => mpActive(p.r, room.k));
  const pending = actors.filter((p) => p.nd !== 1);
  const allReady = players.length > 0 && players.every((p) => p.d === 1);
  const victims = mpWolfVictims(players);

  const startNight = () => director.start();
  const dawn = () => { director.stop(); const r = mpResolveNight(room); write(r.patch); };
  const { tally, ranked, top, tie, voters, voted } = mpTally(players);
  const closeVote = (id, opts) => write(mpVotePatch(players, id, opts));
  const toggleAlive = (p) => {
    const patch = { [`pl/${p.id}/a`]: p.a === 1 ? 0 : 1 };
    if (p.a === 1) patch[`an/x/${String(Date.now())}`] = `${p.n} was eliminated by the village.`;
    const pt = p.a === 1 && p.lv ? players.find((x) => x.id === p.lv && x.a === 1) : null;
    if (pt) { patch[`pl/${pt.id}/a`] = 0; patch[`an/x/${String(Date.now())}h`] = `${pt.n} died of heartbreak.`; }
    write(patch);
  };
  const endGame = (w) => write({ ph: 'over', w });

  const winBanner = winner && (ph === 'night' || ph === 'day') && (

  const grimoire = (
    <ul className="flex flex-col gap-2">
      {players.map((p) => {

        let detail = '';
        if (ph === 'night' && p.a === 1 && actor && p.r === 'cupid') detail = p.nd === 1 ? `binds ${nm(p.t)} and ${nm(p.t2)}` : 'waiting...';
        else if (ph === 'night' && p.a === 1 && actor && p.r === 'shadow') detail = p.nd === 1 ? (p.sa ? `redirects an action → ${nm(p.t)}` : 'no redirect') : 'waiting...';

        const tags = [];

        </Panel>
      )}
      {ph === 'day' && room.an && room.an.sv === 1 && <p className="-mt-2 text-xs text-slate-400">Grimoire note: the wolves&rsquo; victim was saved overnight.</p>}
      {winBanner}
      {grimoire}
      <div className="mt-auto flex flex-col gap-2.5 pt-2">
        {ph === 'reveal' && <Btn onClick={startNight}>{allReady ? 'Begin Night 1' : 'Begin Night 1 Anyway'}</Btn>}
        {ph === 'night' && <Btn variant={director.dir.on ? 'secondary' : 'primary'} onClick={dawn}>{pending.length ? `Break Dawn Now (${pending.length} still waiting)` : 'Break Dawn Now'}</Btn>}
        {ph === 'day' && <Btn onClick={startNight}>Start Night {(room.k || 0) + 1}</Btn>}
        {(ph === 'night' || ph === 'day') && (
          confirmEnd
            ? <div className="flex gap-2"><Btn variant="secondary" onClick={() => endGame('village')}>Village wins</Btn><Btn variant="secondary" onClick={() => endGame('werewolf')}>Wolves win</Btn><Btn variant="secondary" onClick={() => endGame('lovers')}>Lovers win</Btn>{getGameMode() === 'outbreak' && <Btn variant="secondary" onClick={() => endGame('zombie')}>Zombies win</Btn>}<Btn variant="ghost" onClick={() => setConfirmEnd(false)}>Cancel</Btn></div>
            : <Btn variant="ghost" onClick={() => setConfirmEnd(true)}>End Game Early</Btn>
        )}
      </div>
    </div>
  );
}

/* ---------- host who is also playing: spoiler-free controls only ---------- */
function MpHostPanel({ room, players, write, director }) {
  const ph = room.ph;
  const winner = mpWinner(players);
  const { voters, voted, ranked } = mpTally(players);
  const allReady = players.length > 0 && players.every((p) => p.d === 1);
  const dawn = () => { director.stop(); write(mpResolveNight(room).patch); };
  if (ph === 'over') return <Btn onClick={() => write(mpLobbyPatch(room))}>Play Again With This Room</Btn>;
  return (
    <Panel>
      <h3 className="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Host controls</h3>
      <div className="mt-3 flex flex-col gap-2.5">
        {ph === 'reveal' && (
          <>
            <p className="text-sm text-slate-300">{players.filter((p) => p.d === 1).length} of {players.length} players have seen their card.</p>
            <Btn onClick={() => director.start()}>{allReady ? 'Start Night 1' : 'Start Night 1 Anyway'}</Btn>
          </>
        )}
        {ph === 'night' && (
          <>
            <p className="text-sm italic text-slate-300" aria-live="polite">{director.dir.on ? 'The narrator is running the night.' : 'The narrator is not running.'}</p>
            {director.dir.on
              ? <div className="flex gap-2"><Btn variant="secondary" onClick={director.skipRole}>Skip waiting</Btn><Btn variant="ghost" onClick={director.stop}>Stop narrator</Btn></div>
              : <Btn variant="secondary" onClick={() => director.start({ again: true })}>Restart narrated night</Btn>}
            <Btn variant="ghost" onClick={dawn}>Advance to Dawn</Btn>
          </>
        )}
        {ph === 'day' && (
          <>
            <p className="text-sm text-slate-300">{room.vd === 1 ? 'The vote is closed.' : `${voted} of ${voters.length} players have voted. The vote closes by itself when everyone has.`}</p>
            {room.vd !== 1 && ranked.length > 0 && <Btn variant="secondary" onClick={() => { const t = mpTally(players); write(mpVotePatch(players, t.tie ? '' : t.top, { tie: t.tie })); }}>Close Vote Now</Btn>}
            <Btn onClick={() => director.start()}>Start Night {(room.k || 0) + 1}</Btn>
          </>
        )}
        {winner && (ph === 'night' || ph === 'day') && <Btn onClick={() => write({ ph: 'over', w: winner })}>End Game</Btn>}
      </div>
    </Panel>
  );
}

/* ---------- the room (everything after joining) ---------- */
function MpRoom({ session, onExit, onPhase }) {
  const { code, pid } = session;
  const { room, err, refresh } = useRoom(code);
  const [cardsStep, setCardsStep] = useState(false);
  const [deck, setDeck] = useState(emptyDeck);
  const [confirmLeave, setConfirmLeave] = useState(false);
  const [confirmPublic, setConfirmPublic] = useState(false);
  const [busy, setBusy] = useState(false);
  const [wErr, setWErr] = useState('');
  const players = useMemo(() => roomPlayers(room), [room]);
  const mx = (room && room.mx) || MP_MAX;
  const me = players.find((p) => p.id === pid);
  const isHost = !!room && room.host === pid;
  const ph = room ? room.ph : '';
  const director = useNightDirector({ room, players, write: (patch) => writeRef.current(patch) });
  const writeRef = useRef(() => Promise.resolve());

  useEffect(() => { onPhase(cardsStep ? 'cards' : ph); }, [ph, cardsStep]);
  // Every phone shows the scene the host rolled for this night and day.
  useEffect(() => { if (room && typeof room.bn === 'number') setBgIdx('night', room.bn); }, [room && room.bn, room && room.k]);
  useEffect(() => { if (room && typeof room.bd === 'number') setBgIdx('day', room.bd); }, [room && room.bd, room && room.k]);
  useEffect(() => () => onPhase(''), []);
  useEffect(() => { if (room && room.md) setGameMode(room.md); }, [room && room.md]); // everyone plays the host's mode
  useEffect(() => { if (cardsStep) setDeck(room && room.dk ? { ...emptyDeck(), ...room.dk } : autoFill(players.length)); }, [cardsStep, !room || !room.dk ? players.length : 0]);
  useEffect(() => { if (ph !== 'lobby' && cardsStep) setCardsStep(false); }, [ph]);

  const write = async (patch) => {
    try { await Mp.patch(`rooms/${code}`, patch); setWErr(''); }
    catch (e) { setWErr(mpErrorText(e)); }
    refresh();
  };
  writeRef.current = write;
  // A host who is also playing is a regular player: no Grimoire, no roles, only spoiler-free room controls.
  const hostPlays = isHost && !!room && !!room.hp && !!me;
  const voteClosed = useRef('');
  useEffect(() => {
    if (!hostPlays || ph !== 'day' || room.vd === 1) return;
    const t = mpTally(players);
    if (t.voters.length > 0 && t.voted >= t.voters.length && voteClosed.current !== String(room.k)) {
      voteClosed.current = String(room.k);
      write(mpVotePatch(players, t.tie ? '' : t.top, { tie: t.tie }));
    }
  }, [players, ph]);
  useEffect(() => { if (ph !== 'day') voteClosed.current = ''; }, [ph]);
  const leave = async () => {
    setBusy(true);
    try {
      if (isHost) { await Mp.del(`rooms/${code}`); try { await Mp.del(`publicRooms/${code}`); } catch (e) { /* ignore */ } }
      else if (ph === 'lobby') await Mp.del(`rooms/${code}/pl/${pid}`);
      else await Mp.patch(`rooms/${code}/pl/${pid}`, { a: 0, lf: 1 });
    } catch (e) { /* leaving anyway */ }
    saveSession(null);
    onExit();
  };
  const closeNow = () => { saveSession(null); onExit(); };
  const openCards = () => { setCardsStep(true); write({ lk: 1 }); };
  const closeCards = () => { setCardsStep(false); write({ lk: 0 }); };
  const deal = () => write(mpDealPatch(room, deck));
  const saveDeck = async () => { await write({ dk: deck, lk: 0 }); setCardsStep(false); };
  const makePublic = async () => { setConfirmPublic(false); await write({ pub: 1 }); try { await Mp.put(`publicRooms/${code}`, { rn: room.rn, hn: room.hn, ts: room.ts || Date.now() }); } catch (e) { /* the room is still marked public */ } };

  if (room === undefined) {
    return <Screen className="items-center justify-center"><p className="hint-pulse text-slate-300">Connecting to the room...</p>{err && <p className="mt-3 max-w-xs text-center text-sm text-amber-300">{err}</p>}<Btn variant="ghost" className="mt-6" onClick={closeNow}>Cancel</Btn></Screen>;
  }
  if (room === null || (!isHost && !me)) {
    return (
      <Screen className="items-center justify-center text-center">
        <h2 className="font-display text-2xl font-bold">{room === null ? 'This room has closed' : 'You are no longer in this room'}</h2>
        <p className="mt-2 max-w-xs text-sm text-slate-300">{room === null ? 'The host ended the session.' : 'The host may have removed you.'}</p>
        <div className="mt-6 w-full max-w-xs"><Btn onClick={closeNow}>Back</Btn></div>
      </Screen>
    );
  }
  if (cardsStep && isHost) {
    return <ChooseCards count={room.dk ? mx : players.length} deck={deck} setDeck={setDeck} onBack={closeCards} onStart={room.dk ? saveDeck : deal} startLabel={room.dk ? 'Save Deck' : 'Deal Cards & Start'} showBalance />;
  }

  const showPlayer = !!me && (!isHost || hostPlays);
  let body = null;
  if (ph === 'lobby') {
    body = (
      <div className="flex flex-1 flex-col gap-4">
        <div className="flex items-center justify-between">
          <h2 className="font-display text-xl font-bold">Lobby</h2>
          <span className="flex items-center gap-2">
            {isHost && !room.pub && players.length < mx && <button onClick={() => setConfirmPublic(true)} className="min-h-[32px] rounded-full px-3 text-xs font-bold text-violet-100 transition active:scale-95" style={{ background: 'rgba(109,40,217,0.35)', border: '1px solid rgba(167,139,250,0.5)' }}>Autofill</button>}
            {!!room.pub && <span className="rounded-full px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest text-emerald-200" style={{ background: 'rgba(16,185,129,0.16)', border: '1px solid rgba(52,211,153,0.4)' }}>Public</span>}
            <span className="rounded-full px-3 py-1 text-xs font-semibold tabular-nums text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>{players.length} / {mx} players</span>
          </span>
        </div>
        {players.length === 0 && <Panel className="text-center text-sm text-slate-400">No players yet. Share the room code.</Panel>}
        <PlayerList players={players} meId={pid} hostId={room.host} modRow={!room.hp} onRemove={isHost ? (id) => write({ [`pl/${id}`]: null }) : null} />
        {isHost ? (
          <div className="mt-auto flex flex-col gap-2">
            {players.length < (room.dk ? mx : MP_MIN) && <p className="text-center text-xs text-slate-400">{room.dk ? `The deck is built for ${mx} players. Ask friends to join with the code above.` : `Need at least ${MP_MIN} players to start. Ask friends to join with the code above.`}</p>}
            {room.dk
              ? <>
                <Btn disabled={players.length !== mx} onClick={() => write(mpDealPatch(room, { ...emptyDeck(), ...room.dk }))}>{players.length === mx ? 'Start Game' : `Waiting for players (${players.length} / ${mx})`}</Btn>
                <Btn variant="secondary" onClick={openCards}>Edit Deck</Btn>
              </>
              : <Btn disabled={players.length < MP_MIN} onClick={openCards}>Choose Cards</Btn>}
            <p className="text-center text-xs text-slate-500">{room.hp ? 'You are playing and hosting.' : 'You are moderating only.'}</p>
          </div>
        ) : (
          <p className="hint-pulse mt-auto pb-2 text-center text-sm text-slate-300">Waiting for the host to start the game...</p>
        )}
      </div>
    );
  } else if (showPlayer) {
    if (ph === 'reveal') body = <MpReveal me={me} ready={me.d === 1} readyCount={players.filter((p) => p.d === 1).length} total={players.length} onReady={() => write({ [`pl/${pid}/d`]: 1 })} />;
    else if (ph === 'night') body = <MpNight key={`n${room.k}`} me={me} players={players} room={room} write={write} immersive={!isHost} onLeave={() => setConfirmLeave(true)} />;
    else if (ph === 'day') body = <MpDay key={`d${room.k}`} me={me} players={players} room={room} write={write} />;
    else body = <MpOver room={room} players={players} meId={pid} />;
    if (hostPlays && ph !== 'lobby') body = <div className="flex flex-1 flex-col gap-4">{body}<MpHostPanel room={room} players={players} write={write} director={director} /></div>;
  } else {
    body = <MpMod room={room} players={players} me={me} write={write} director={director} />;
  }

  return (
    <>
    {ph === 'day' && <DayBackdrop />}
    <Screen className={ph === 'day' ? 'relative z-10' : ''}>
      <MpHeader code={code} roomName={room.rn} onLeave={() => setConfirmLeave(true)} leaveLabel="Leave room" />
      {session.local && <p className="mb-3 text-center text-[11px] font-semibold tracking-wide text-slate-500">Preview Mode &mdash; deploy to Vercel for live multi-phone sync</p>}
      {(err || wErr) && <p role="alert" className="mb-3 rounded-xl px-3 py-2 text-center text-xs font-semibold text-amber-200" style={{ background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.4)' }}>{wErr || `${err} Retrying...`}</p>}
      {body}
      {confirmPublic && (
        <div role="dialog" aria-modal="true" aria-label="Make room public" className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(5,7,12,0.86)' }}>
          <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: 'var(--card)', border: '1px solid rgba(139,92,246,0.55)' }}>
            <p className="text-base font-semibold text-slate-100">Make this room Public so anyone can join and fill the remaining seats?</p>
            <div className="mt-4 flex gap-2.5"><Btn variant="secondary" onClick={() => setConfirmPublic(false)}>Cancel</Btn><Btn onClick={makePublic}>Confirm</Btn></div>
          </div>
        </div>
      )}
      {confirmLeave && (
        <ConfirmExit confirmLabel={isHost ? 'Close room' : 'Leave room'}
          body={isHost ? 'This closes the room for everyone. Players will be sent back out.' : 'You will leave this room. You can rejoin with the code only while the game has not started.'}
          onCancel={() => setConfirmLeave(false)} onConfirm={leave} />
      )}
    </Screen>
    </>
  );
}

/* ---------- entry point ---------- */
function MultiScreen({ onBack, onPhase, gameCount, onClearGames }) {
  const st = useSettings();
  const hasUrl = !!(normalizeDbUrl(st.fbUrl) || normalizeDbUrl(DEFAULT_FIREBASE_URL));
  const [view, setView] = useState('entry'); // entry | mode | count | deck | host | join | room
  const [cfg, setCfg] = useState({ n: 8, deck: null });
  useEffect(() => { if (view !== 'room') onPhase(view === 'deck' ? 'cards' : ''); }, [view]);
  const [session, setSession] = useState(loadSession);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [checking, setChecking] = useState(() => !!loadSession());

  // Rejoin after a refresh, if the room is still there.
  useEffect(() => {
    const s = loadSession();
    if (!s || !hasUrl) { setChecking(false); return; }
    let live = true;
    Mp.local = !!s.local;
    Mp.get(`rooms/${s.code}`).then((r) => {
      if (!live) return;
      if (r && (r.host === s.pid || (r.pl && r.pl[s.pid]))) { setSession(s); setView('room'); }
      else saveSession(null);
      setChecking(false);
    }, () => { if (live) setChecking(false); });
    return () => { live = false; };
  }, []);

  const enter = (s) => { saveSession(s); setSession(s); setView('room'); };
  const exitRoom = () => { Mp.local = false; setSession(null); setView('entry'); };

  if (view === 'room' && session) return <MpRoom session={session} onExit={exitRoom} onPhase={onPhase} />;
  if (view === 'deck' && cfg.deck) return <ChooseCards count={cfg.n} deck={cfg.deck} setDeck={(d) => setCfg((c) => ({ ...c, deck: d }))} onBack={() => setView('count')} onStart={() => setView('host')} startLabel="Lock Deck" showBalance />;

  return (
    <Screen>
      <header className="flex items-center gap-1 pb-5">
        <button onClick={onBack} aria-label="Back to start" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
        </button>
        <h1 className="font-display text-lg font-bold tracking-wide">MULTI-DEVICE</h1>
        <span className="ml-auto rounded-full px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest text-violet-200" style={{ background: 'rgba(109,40,217,0.3)' }}>Room code</span>
      </header>
      {checking
        ? <p className="hint-pulse mt-16 text-center text-slate-300">Looking for your room...</p>
        : !hasUrl
          ? <MpConfigCard onBack={onBack} onOpenSettings={() => setSettingsOpen(true)} />
          : view === 'mode'
            ? <MpModeStep onBack={() => setView('entry')} onPick={(m) => { setGameMode(m); setView('count'); }} />
          : view === 'count'
            ? <MpCountStep n={cfg.n} setN={(n) => setCfg((c) => ({ ...c, n }))} onBack={() => setView('mode')} onNext={() => { setCfg((c) => ({ ...c, deck: autoFill(c.n) })); setView('deck'); }} />
          : view === 'host' && cfg.deck
            ? <MpHostForm cfg={cfg} onBack={() => setView('deck')} onCreated={enter} />
            : view === 'join'
              ? <MpJoinForm onBack={() => setView('entry')} onJoined={enter} />
              : <MpEntry onHost={() => setView('mode')} onJoin={() => setView('join')} onBack={onBack} />}
      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} gameCount={gameCount} onClearGames={onClearGames} />}
    </Screen>
  );
}


function loadGames() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function saveGames(g) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(g)); } catch (e) { /* storage unavailable */ }
}

function AppInner() {
  const [screen, setScreen] = useState('start'); // start | home | setup | cards | reveal | shield | moderator
  const [games, setGames] = useState(loadGames);
  const [count, setCount] = useState(6);
  const [names, setNames] = useState(Array(MAX_PLAYERS).fill(''));
  const [deck, setDeck] = useState(emptyDeck);
  const [narrator, setNarrator] = useState(true);
  const [gameName, setGameName] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [curId, setCurId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [round, setRound] = useState(0);
  const [mpPhase, setMpPhase] = useState('');
  const [autoNight, setAutoNight] = useState(false);
  const narratorOn = (games.find((g) => g.id === curId) || {}).narrator !== false;

  useEffect(() => { saveGames(games); }, [games]);

  const defaultName = useMemo(() => {
    if (editingId) { const g = games.find((x) => x.id === editingId); if (g) return g.name; }
    let n = games.length + 1;
    while (games.some((g) => g.name === `Game #${n}`)) n++;
    return `Game #${n}`;
  }, [games, editingId]);

  const updateGame = (id, patch) => setGames((gs) => gs.map((g) => (g.id === id ? { ...g, ...patch } : g)));

  const openNewSetup = () => {
    setEditingId(null);
    setGameName('');
    setCount(6);
    setNames(Array(MAX_PLAYERS).fill(''));
    setDeck(emptyDeck());
    setNarrator(true);
    setScreen('setup');
  };
  const openPreset = (c, d) => {
    setEditingId(null);
    setGameName('');
    setCount(c);
    setNames(Array(MAX_PLAYERS).fill(''));
    setDeck(d);
    setNarrator(true);
    setScreen('setup');
  };
  const openEditSetup = (g) => {
    setEditingId(g.id);
    setGameName(g.name);
    setCount(g.count);
    setNames(g.names);
    setDeck(g.deck);
    setNarrator(g.narrator !== false);
    setScreen('setup');
  };
  const toCards = () => {
    if (deckTotal(deck) > count) setDeck(emptyDeck());
    setScreen('cards');
  };

  const begin = (id, dealt) => {
    setCurId(id);
    setPlayers(dealt);
    setRound((r) => r + 1);
    setScreen('reveal');
  };

  const start = () => {
    const dealt = deal(deck, names, count);
    const name = gameName.trim() || defaultName;
    if (editingId) {
      updateGame(editingId, { name, count, names, deck, narrator, players: dealt, status: 'active' });
      begin(editingId, dealt);
    } else {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      setGames((gs) => [{ id, name, count, names, deck, narrator, players: dealt, status: 'active', createdAt: Date.now() }, ...gs]);
      begin(id, dealt);
    }
  };

  const redeal = (g) => {
    const dealt = deal(g.deck, g.names, g.count);
    updateGame(g.id, { players: dealt, status: 'active' });
    begin(g.id, dealt);
  };
  const resume = (g) => {
    setCurId(g.id);
    setPlayers(g.players);
    setRound((r) => r + 1);
    setScreen('shield');
  };
  const savePlayers = (p) => {
    setPlayers(p);
    updateGame(curId, { players: p });
  };
  const nameAt = (idx, name) => {
    const next = players.map((pl) => (pl.id === idx ? { ...pl, name } : pl));
    setPlayers(next);
    updateGame(curId, { players: next });
  };
  const finishGame = () => updateGame(curId, { players: null, status: 'saved' });

  const { sound: soundOn, music: musicOn } = useSettings();
  useEffect(() => {
    const isTense = screen === 'setup' || screen === 'cards' || screen === 'reveal' || (screen === 'multi' && (mpPhase === 'lobby' || mpPhase === 'cards' || mpPhase === 'reveal'));
    const tense = isTense && musicOn;
    tensionScreen = isTense;
    if (tense) { Ambience.stop(true); Tension.start(); return; }   // music does not depend on the Sound switch
    Tension.stop();
    if (!soundOn) { Ambience.stop(); return; }
    if (screen !== 'start' && Ambience.unlocked()) Ambience.start();
  }, [screen, soundOn, musicOn, mpPhase]);
  if (screen === 'start') {
    return <StartScreen onPlay={() => setScreen('home')} onMulti={() => setScreen('multi')} gameCount={games.length} onClearGames={() => setGames([])} />;
  }
  if (screen === 'multi') {
    return <MultiScreen onBack={() => setScreen('start')} onPhase={setMpPhase} gameCount={games.length} onClearGames={() => setGames([])} />;
  }
  if (screen === 'home') {
    return (
      <Home games={games} onBack={() => setScreen('start')} onCreate={openNewSetup} onPreset={openPreset} onResume={resume} onRedeal={redeal}
        onEdit={openEditSetup} onDelete={(id) => setGames((gs) => gs.filter((g) => g.id !== id))} />
    );
  }
  if (screen === 'setup') {
    return (
      <Setup count={count} setCount={setCount} gameName={gameName} setGameName={setGameName} narrator={narrator} setNarrator={setNarrator}
        defaultName={defaultName} onBack={() => setScreen('home')} onNext={toCards} />
    );
  }
  if (screen === 'cards') {
    return <ChooseCards count={count} deck={deck} setDeck={setDeck} onBack={() => setScreen('setup')} onStart={start} />;
  }
  if (screen === 'reveal') return <Reveal key={round} players={players} onName={nameAt} onDone={() => setScreen('shield')} onExit={() => { finishGame(); setScreen('home'); }} />;
  if (screen === 'shield') return <Shield narrator={narratorOn} onUnlock={() => { setAutoNight(false); setScreen('moderator'); }} onStartNight={() => { setAutoNight(true); setScreen('moderator'); }} onExit={() => setScreen('home')} />;
  return (
    <Moderator key={round} players={players} setPlayers={savePlayers}
      narrator={narratorOn} autoNight={autoNight}
      onAgain={() => redeal(games.find((g) => g.id === curId))}
      onNew={() => { finishGame(); openNewSetup(); }}
      onHome={() => { saveSession(null); finishGame(); setAutoNight(false); setScreen('home'); }} />
  );
}

/* ------------------------------------------------------------------ */
/* Startup: preload and decode images, then fade into the start screen */
/* ------------------------------------------------------------------ */
function activeImageSources() {
  const list = [DEFAULT_BG, LOADING_BG, DEFAULT_BACK, nightPool.get()[0], dayPool.get()[0]];
  list.push(LOBBY_BG.classic.src, LOBBY_BG.outbreak.src); // Step 2 mode backgrounds: cached before Classic / Outbreak is tapped
  list.push(mayorArtStore.get(), medusaArtStore.get(), shadowArtStore.get());
  ROLE_IDS.forEach((id) => {
    const src = ROLES_DATA[id].imageUrl;
    if (src) list.push(src);
  });
  return Array.from(new Set(list));
}
function preloadAll(onProgress) {
  const sources = activeImageSources();
  const total = sources.length;
  let loaded = 0;
  onProgress(0, total);
  return Promise.all(sources.map((src) => preloadImage(src).then(() => { loaded += 1; onProgress(loaded, total); })));
}

function useBoot() {
  const [phase, setPhase] = useState('loading'); // loading | fading | done
  const [progress, setProgress] = useState({ loaded: 0, total: 1 });
  useEffect(() => {
    let finished = false;
    const timers = [];
    const finish = () => {
      if (finished) return;
      finished = true;
      setProgress((p) => ({ ...p, loaded: p.total }));
      timers.push(setTimeout(() => setPhase('fading'), 250));
      timers.push(setTimeout(() => setPhase('done'), 850));
    };
    timers.push(setTimeout(() => { [...nightPool.get(), ...dayPool.get()].forEach((u) => preloadImage(u)); }, 2500));
    timers.push(setTimeout(finish, 3000)); // safety: always unlock after 3 seconds
    preloadAll((loaded, total) => { if (!finished) setProgress({ loaded, total }); }).then(finish, finish);
    return () => { finished = true; timers.forEach(clearTimeout); };
  }, []);
  return { phase, progress };
}

function LoadingScreen({ loaded, total, fading }) {
  const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 100;
  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8" role="status" aria-live="polite"
      style={{ background: '#0B0E14', opacity: fading ? 0 : 1, transition: 'opacity 600ms ease-in-out', pointerEvents: fading ? 'none' : 'auto' }}>
      <img src={LOADING_BG} alt="" className="absolute inset-0 h-full w-full object-cover" />
      <div className="pointer-events-none absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(11,14,20,0.25), rgba(11,14,20,0.7))' }} />
      <h1 className="load-pulse font-display relative text-4xl font-black tracking-[0.14em] text-slate-100">WEREWOLF</h1>
      <div className="relative mt-10 w-full max-w-[240px]">
        <div className="h-1 w-full overflow-hidden rounded-full" style={{ background: 'rgba(203,213,225,0.12)' }}
          role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={pct}>
          <div className="h-full rounded-full" style={{ width: pct + '%', background: '#DC2626', boxShadow: '0 0 12px rgba(220,38,38,0.7)', transition: 'width 350ms ease-out' }} />
        </div>
        <div className="mt-3 flex items-center justify-between text-xs text-slate-400">
          <span>Preparing the deck...</span>
          <span className="tabular-nums">{pct}%</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const { phase, progress } = useBoot();
  return (
    <>
      <AppInner />
      {phase !== 'done' && <LoadingScreen loaded={progress.loaded} total={progress.total} fading={phase === 'fading'} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
