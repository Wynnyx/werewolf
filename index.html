function MpJoinForm({ onBack, onJoined, onHost }) {
  const [code, setCode] = useState('');
  const [target, setTarget] = useState(''); // the room the player chose; the name step opens for it
  const [name, setName] = useState(loadName);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const openName = (c) => { setErr(''); setTarget(c); };
  const tryCode = () => { if (cleanCode(code).length !== 4) { setErr('Enter the 4-letter room code.'); return; } openName(cleanCode(code)); };
  const enterLobby = async () => {
    const n = name.trim();
    if (!n) return;
    setBusy(true); setErr('');
    try { saveName(n); onJoined(await mpJoinRoom(target, n), n); }
    catch (e) { setErr(mpJoinErrorText(e)); setBusy(false); }
  };
  return (
    <div className="flex flex-col gap-4">
      <button onClick={onHost} className="flex min-h-[56px] w-full items-center justify-center rounded-2xl text-base font-bold uppercase tracking-wide text-violet-100 transition hover:brightness-125 active:scale-[0.99]"
        style={{ background: 'linear-gradient(135deg, rgba(109,40,217,0.4), rgba(21,26,36,0.95))', border: '1px solid rgba(167,139,250,0.65)' }}>+ Create Your Own Room</button>
      <MpPublicRooms onPick={openName} />
      <h2 className="font-display mt-2 text-sm font-bold uppercase tracking-[0.2em] text-slate-300">Join a Private Room</h2>
      <MpField label="Room code">
        <input value={code} maxLength={4} onChange={(e) => setCode(cleanCode(e.target.value))} placeholder="WOLF" autoComplete="off" autoCapitalize="characters" spellCheck={false}
          className="font-display h-16 w-full rounded-xl text-center text-3xl font-black uppercase tracking-[0.4em] text-white placeholder-slate-600" style={{ ...mpInputStyle, paddingLeft: '0.4em' }} />
      </MpField>
      {err && !target && <p role="alert" className="text-sm text-amber-300">{err}</p>}
      <Btn onClick={tryCode}>Join Room</Btn>
      <Btn variant="ghost" onClick={onBack}>Back</Btn>
      {target && (
        <div role="dialog" aria-modal="true" aria-label="Write your name" className="fixed inset-0 z-50 flex items-center justify-center p-5" style={{ background: 'rgba(5,7,12,0.86)' }}>
          <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: 'var(--card)', border: '1px solid rgba(139,92,246,0.55)' }}>
            <h3 className="font-display text-xl font-bold">Write Your Name</h3>
            <p className="mt-1 text-sm text-slate-400">Room <span className="font-bold tracking-widest text-violet-300">{target}</span></p>
            <input value={name} maxLength={14} autoFocus onChange={(e) => setName(e.target.value)} placeholder="Enter your name" autoComplete="off"
              className="mt-4 h-14 w-full rounded-xl px-4 text-lg text-slate-100 placeholder-slate-500" style={mpInputStyle} />
            {err && <p role="alert" className="mt-3 text-sm text-amber-300">{err}</p>}
            <Btn className="mt-4" disabled={busy || !name.trim()} onClick={enterLobby}>{busy ? 'Joining...' : 'Continue / Enter Lobby'}</Btn>
            <Btn variant="ghost" className="mt-2" disabled={busy} onClick={() => { setTarget(''); setErr(''); }}>Cancel</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- player-side views ---------- */
function MpReveal({ me, ready, readyCount, total, onReady, onLeave, instant = false, prologue = null }) {
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const [sent, setSent] = useState(false);
  const [showAbility, setShowAbility] = useState(false);
  const timers = useRef([]);
  useEffect(() => { Sfx.preload(); return () => timers.current.forEach(clearTimeout); }, []);
  const hasImg = !!useCardImage(me.r);
  const reveal = () => {
    if (phase !== 'idle') return;
    Sfx.flip();
    setPhase('lift');
    timers.current.push(setTimeout(() => setPhase('flipping'), 300));
    timers.current.push(setTimeout(() => setPhase('open'), 1500));
  };
  useEffect(() => { if (instant) { const t = setTimeout(reveal, 250); return () => clearTimeout(t); } return undefined; }, []); // Solo AI / Adventure: the card flips by itself, no tap to reveal
  const done = ready || sent;
  if (done && instant) {
    if (prologue && !prologue.done) return <Level1Prologue onDone={prologue.finish} onLeave={onLeave} />;
    return (
      <NightStage fixed onExit={onLeave}>
        {prologue
          ? <LockView key="i" title={`Night ${nightWord(1)} Begins...`} sub="The village falls silent." />
          : <div className="flex flex-1 flex-col items-center justify-center text-center"><p className="font-display screen-in text-3xl font-bold tracking-wide">Night begins</p></div>}
      </NightStage>
    );
  }
  if (done) {
    return (
      <NightStage fixed onExit={onLeave}>
      <div className="flex flex-1 flex-col items-center justify-center gap-4 text-center">
        <p className="font-display text-2xl font-bold">You&rsquo;re ready</p>
        <p className="text-sm text-slate-300">Waiting for the others to look at their cards.</p>
        <p className="text-sm font-semibold tabular-nums text-violet-200">{readyCount} of {total} ready</p>
        <button onClick={() => setShowAbility(true)} className="min-h-[44px] rounded-xl px-5 text-sm font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>Reveal Role</button>
        {showAbility && <RoleViewModal role={me.r} onClose={() => setShowAbility(false)} />}
      </div>
      </NightStage>
    );
  }
  return (
    <div className="flex flex-1 flex-col items-center">
      {!instant && <div role="note" className="mt-1 flex w-full items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
        style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
        <span><strong className="font-bold text-amber-200">Eyes only!</strong> Make sure nobody can see your screen before you reveal your card.</span>
      </div>}
      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <div role="button" tabIndex={phase === 'idle' ? 0 : -1} onClick={reveal} aria-label="Tap the card to reveal your role"
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } }}
          className={phase === 'idle' ? 'cursor-pointer' : ''}>
          <RoleCard role={me.r} phase={phase} />
        </div>
        <div className="relative w-full text-center" style={{ minHeight: '3.5rem' }}>
          {phase === 'idle' && !instant && <p className="hint-pulse pt-1 text-sm font-semibold tracking-wide text-slate-300">Tap the card to reveal</p>}
          <div className={`absolute inset-x-0 top-0 mx-auto text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`} style={{ width: 'min(19rem, 86vw)' }}>
            <TeamBadge team={ROLES_DATA[me.r].team} />
            {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[me.r].ability}</p>}
          </div>
        </div>
      </div>
      <div className={`flex w-full flex-col gap-3 pb-2 ${phase === 'open' ? '' : 'invisible'}`}>
        <button onClick={() => setShowAbility(true)} disabled={phase !== 'open'}
          className="flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>View Ability</button>
        <Btn disabled={phase !== 'open'} onClick={() => { setSent(true); onReady(); }}>I&rsquo;m Ready</Btn>
      </div>
      {showAbility && <AbilityModal role={me.r} onClose={() => setShowAbility(false)} />}
    </div>
  );
}

function MultiPickList({ players, value, onChange, max = 2, team = [], teamLabel = 'Werewolf team', TeamIcon = WolfIcon, badges = [], locked }) {
  const has = (id) => value.some((v) => String(v) === String(id));
  return (
    <ul className="flex flex-col gap-2" role="listbox" aria-multiselectable="true">
      {players.map((p) => {
        const mate = team.includes(p.id);
        const sel = !mate && has(p.id);
        const toggle = () => onChange(sel ? value.filter((x) => String(x) !== String(p.id)) : value.length < max ? [...value, p.id] : [value[value.length - 1], p.id]);
        return (
          <li key={p.id}>
            <button role="option" aria-selected={sel} disabled={locked || mate} onClick={toggle}
              className={`flex min-h-[52px] w-full items-center gap-3 rounded-xl px-4 text-left text-[15px] font-semibold transition active:scale-[0.99] ${mate ? '' : 'disabled:opacity-60'}`}
              style={mate ? { background: 'rgba(127,29,29,0.25)', border: '1px solid rgba(239,68,68,0.55)', color: '#FCA5A5' }
                : { background: sel ? 'rgba(185,28,28,0.62)' : 'var(--card-2)', border: `2px solid ${sel ? '#FCA5A5' : 'var(--line)'}`, boxShadow: sel ? '0 0 20px -3px rgba(248,113,113,0.9)' : 'none', color: '#F8FAFC' }}>
              {mate ? <><span className="flex-1">{p.n}</span><span className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider"><TeamIcon width="18" height="18" aria-hidden="true" />{teamLabel}</span></>
                : <>
                  <span aria-hidden="true" className="flex h-6 w-6 shrink-0 items-center justify-center rounded-md text-sm font-black" style={{ background: sel ? '#FCA5A5' : 'transparent', border: `2px solid ${sel ? '#FCA5A5' : '#64748B'}`, color: '#450A0A' }}>{sel ? '✓' : ''}</span>
                  <span className="flex flex-1 items-center gap-2">{p.n}{badges.includes(p.id) && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-200" style={{ background: 'rgba(127,29,29,0.5)', border: '1px solid rgba(239,68,68,0.75)' }}>Werewolf</span>}</span>
                  {sel && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-950" style={{ background: '#FCA5A5' }}>Target</span>}
                </>}
            </button>
          </li>
        );
      })}
    </ul>
  );
}

function BloodMoonBanner({ className = '' }) {

      <div className="font-display text-sm font-black tracking-[0.14em] text-red-100 md:text-base" style={{ textShadow: '0 0 14px rgba(220,38,38,0.9)' }}>BLOOD MOON RISES — THE PACK HUNTS TWICE TONIGHT</div>
    </div>

}

// Zombie faction vision: only the Zombie team (Zombie, Infected, Plague Doctor) sees who is incubating or already turned.
const ZTEAM_VIEW = ['zombie', 'infector', 'plaguedoctor'];
function ZMark({ t }) {
  return <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-teal-100" style={{ background: 'rgba(13,148,136,0.4)', border: '1px solid rgba(45,212,191,0.75)' }}>{t}</span>;
}
function mpZMarks(players, me) {
  const out = {};
  if (!me || !ZTEAM_VIEW.includes(me.r)) return out;
  players.forEach((p) => { if (p.a !== 1 || p.id === me.id) return; if (p.r === 'zombie') out[p.id] = 'ZOMBIE'; else if ((p.bt || p.ic) && p.r !== 'infector') out[p.id] = 'INCUBATING'; });
  return out;
}
function ppZMarks(players, actor) {
  const out = {};
  if (!actor || !ZTEAM_VIEW.includes(actor.role)) return out;
  players.forEach((p) => { if (!p.alive || p.id === actor.id) return; if (p.role === 'zombie') out[p.id] = 'ZOMBIE'; else if ((p.bitten || p.incub) && p.role !== 'infector') out[p.id] = 'INCUBATING'; });
  return out;
}
function PickList({ players, value, onChange, disabled = [], locked, team = [], teamLabel = 'Werewolf team', TeamIcon = WolfIcon, badges = [], marks = {}, tags, cool = [] }) {
  return (
    <ul className="flex flex-col gap-2" role="listbox">
      {players.map((p) => {
        const mate = team.includes(p.id);
        const off = locked || mate || disabled.includes(p.id);
        const sel = value === p.id;
        return (
          <li key={p.id}>
            <button role="option" aria-selected={sel} disabled={off} onClick={() => onChange(sel ? '' : p.id)}
              className={`flex min-h-[52px] w-full items-center justify-between rounded-xl px-4 text-left text-[15px] font-semibold transition active:scale-[0.99] ${mate ? '' : 'disabled:opacity-40'}`}
              style={mate ? { background: 'rgba(127,29,29,0.25)', border: '1px solid rgba(239,68,68,0.55)', color: '#FCA5A5' }
                : { background: sel ? 'rgba(109,40,217,0.4)' : 'var(--card-2)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none', color: '#E6EAF2' }}>
              {mate ? <><span>{p.n}</span><span className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider"><TeamIcon width="18" height="18" aria-hidden="true" />{teamLabel}</span></>
                : <><span className="flex flex-col py-1.5"><span className="flex items-center gap-2">{p.n}{badges.includes(p.id) && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-200" style={{ background: 'rgba(127,29,29,0.5)', border: '1px solid rgba(239,68,68,0.75)' }}>Werewolf</span>}{marks[p.id] && <ZMark t={marks[p.id]} />}</span>{cool.includes(p.id) ? <span className="mt-0.5 text-[11.5px] font-medium text-sky-200">(guarded last night)</span> : tags && tags[p.n] && <span className="mt-0.5 text-[11.5px] font-medium text-slate-400">{tags[p.n]}</span>}</span>{cool.includes(p.id) ? <span className="shrink-0 rounded-full px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-sky-100" style={{ background: 'rgba(30,64,175,0.55)', border: '1px solid rgba(147,197,253,0.7)' }}>🛡️ Cooldown</span> : sel && <span aria-hidden="true" className="text-lg">✓</span>}</>}
            </button>
          </li>
        );
      })}
    </ul>
  );
}

function MpNightManual({ me, players, room, write }) {
  const [pick, setPick] = useState('');
  const [pair, setPair] = useState([]);
  const [save, setSave] = useState(false);
  const role = me.r;
  const alive = players.filter((p) => p.a === 1);
  const done = me.nd === 1;
  const name = (id) => (players.find((p) => p.id === id) || {}).n || '?';
  const lock = (extra) => write({ [`pl/${me.id}/t`]: pick || '', [`pl/${me.id}/nd`]: 1, ...(extra || {}) });

  if (me.a !== 1) return <SleepPanel me={me} text="You have been eliminated. Keep quiet and keep your eyes closed." />;
  if (!mpActive(role, room.k)) return <SleepPanel me={me} text="Close your eyes and stay silent. The night roles are at work." />;

  const header = (title, sub) => (
    <div className="mb-4 text-center">
      <RoleChip role={role} />
      <h2 className="font-display mt-3 text-2xl font-bold">{title}</h2>
      <p className="mt-1 text-sm text-slate-300">{sub}</p>
    </div>
  );
  const lockedNote = (
    <div className="mt-4 rounded-xl px-4 py-3 text-center text-sm font-semibold text-emerald-200" style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.4)' }}>
      Choice locked in. Wait for dawn.
    </div>
  );

  if (me.sd === room.k) {
    return done ? <div className="flex flex-1 flex-col">{header('You are sedated', 'You sleep through tonight.')}{lockedNote}</div>
      : <div className="flex flex-1 flex-col">{header('You are sedated', 'The Doctor’s treatment put you to sleep. You cannot act tonight.')}<Btn className="mt-4" onClick={() => write({ [`pl/${me.id}/nd`]: 1 })}>Continue</Btn></div>;
  }
  if (role === 'cupid') {
    const [la, lb] = done ? [me.t, me.t2] : pair;
    return (
      <div className="flex flex-1 flex-col">
        {header('Bind two Lovers', 'Tap two players. You may include yourself.')}
        <PairList players={alive.map((p) => ({ id: p.id, n: p.n }))} value={done ? [me.t, me.t2] : pair} onChange={setPair} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={pair.length < 2} onClick={() => write({ [`pl/${me.id}/t`]: la, [`pl/${me.id}/t2`]: lb, [`pl/${me.id}/nd`]: 1, [`pl/${la}/lv`]: lb, [`pl/${lb}/lv`]: la })}>{pair.length < 2 ? 'Select two players' : 'Confirm Lovers'}</Btn>}
      </div>
    );
  }
  if (role === 'werewolf') {
    const pack = players.filter((p) => p.r === 'werewolf' && p.id !== me.id);
    const teamIds = alive.filter((p) => p.r === 'werewolf' || p.r === 'shadow').map((p) => p.id);
    if (room.bm && Math.min(2, alive.filter((p) => p.id !== me.id && !teamIds.includes(p.id)).length) === 2) { // Blood Moon: two targets
      const sel = done ? [me.t, me.t2].filter(Boolean) : (pick ? String(pick).split('|').filter((x) => alive.some((q) => String(q.id) === x)) : []);
      return (
        <div className="flex flex-1 flex-col">
          {header('BLOOD MOON: CHOOSE TWO TARGETS TO HUNT.', 'Agree silently with your pack. The most votes win.')}
          <MultiPickList players={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} team={teamIds} value={sel} onChange={(a) => setPick(a.join('|'))} locked={done} />
          {!done && <p className="mt-3 text-center text-sm font-bold tabular-nums text-red-300">{sel.length}/2 Selected</p>}
          {pack.length > 0 && (
            <div className="mt-3 rounded-xl p-3 text-xs text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
              <div className="mb-1 font-semibold uppercase tracking-widest text-slate-400">Your pack</div>
              {pack.map((p) => <div key={p.id}>{p.n}: {p.t ? `votes ${name(p.t)}${p.t2 ? ' & ' + name(p.t2) : ''}` : 'deciding...'}</div>)}
            </div>
          )}
          {done ? lockedNote : <Btn className="mt-4" disabled={sel.length < 2} onClick={() => lock({ [`pl/${me.id}/t`]: sel[0], [`pl/${me.id}/t2`]: sel[1] })}>{sel.length < 2 ? 'Select two targets' : 'Confirm Targets'}</Btn>}
        </div>
      );
    }
    return (
      <div className="flex flex-1 flex-col">
        {header('Choose your victim', 'Agree silently with your pack. The most votes wins.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} team={alive.filter((p) => p.r === 'werewolf' || p.r === 'shadow').map((p) => p.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {pack.length > 0 && (
          <div className="mt-3 rounded-xl p-3 text-xs text-slate-300" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
            <div className="mb-1 font-semibold uppercase tracking-widest text-slate-400">Your pack</div>
            {pack.map((p) => <div key={p.id}>{p.n}: {p.t ? `votes ${name(p.t)}` : 'deciding...'}</div>)}
          </div>
        )}
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Lock In Victim</Btn>}
      </div>
    );
  }
  if (role === 'shadow') {
    const others = players.filter((p) => p.a === 1 && p.r !== 'shadow' && mpActive(p.r, room.k));
    const waiting = others.some((p) => p.nd !== 1);
    const c = mpChoices(players);
    const mineSa = me.sa ? (nightActions(c).find((a) => a.key === me.sa) || null) : null;
    if (done) return <div className="flex flex-1 flex-col">{header('Redirect an action', me.sa ? 'Your redirect is set.' : 'You left every action unchanged.')}{lockedNote}</div>;
    if (waiting) return <div className="flex flex-1 flex-col">{header('Redirect an action', 'You act last, once everyone else has chosen.')}<p className="mt-4 text-center text-sm text-slate-300">Waiting for the other night roles to finish&hellip;</p></div>;
    return <ShadowAct header={header('Redirect an action', 'Choose one action and a new target, or skip.')} actions={nightActions(c)} victimName={wolfTargetName(c, name)}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} wolves={alive.filter((p) => p.r === 'werewolf').map((p) => p.id)} nm={name} stoned={mpStoneTarget(players) === me.id}
      onDone={(r) => lock({ [`pl/${me.id}/t`]: r ? r.to : '', [`pl/${me.id}/sa`]: r ? r.key : '' })} />;
  }
  if (role === 'medusa') {
    const skipped = done && !me.t;
    return (
      <div className="flex flex-1 flex-col">
        {header('Turn a player to stone', me.lp ? `You cannot petrify ${name(me.lp)} two nights in a row.` : 'They cannot act tonight, and cannot speak or vote tomorrow.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} disabled={me.lp ? [me.lp] : []} locked={done} />
        {!done && <Btn className="mt-3" variant="secondary" onClick={() => setPick('skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip / Don\u2019t Use Gaze Tonight'}</Btn>}
        {done ? <>{skipped && <p className="mt-3 text-center text-sm text-slate-300">You skipped your gaze tonight.</p>}{lockedNote}</>
          : <Btn className="mt-3" disabled={!pick} onClick={() => lock(pick === 'skip' ? { [`pl/${me.id}/t`]: '' } : undefined)}>{!pick ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Skip' : 'Confirm Petrify'}</Btn>}
      </div>
    );
  }
  if (role === 'seer') {
    const medusaPending = players.some((p) => p.a === 1 && p.r === 'medusa' && p.nd !== 1);
    const shadowPending = players.some((p) => p.a === 1 && p.r === 'shadow' && p.nd !== 1);
    const pendingWho = medusaPending ? 'Medusa' : 'the Shadow Figure';
    const sv = done && !medusaPending && !shadowPending ? mpSeerView(players, me.id) : null;
    const seerStoned = !!(sv && sv.stoned);
    const target = sv && !sv.stoned && sv.target ? players.find((p) => p.id === sv.target) : null;
    return (
      <div className="flex flex-1 flex-col">
        {header('Inspect a player', 'Learn whether one player is a werewolf.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? (
          <>
            {done && medusaPending && <p className="mt-4 text-center text-sm text-slate-300">Your vision is clouding. Waiting for Medusa&hellip;</p>}
            {done && !medusaPending && shadowPending && <p className="mt-4 text-center text-sm text-slate-300">Your vision is clouding. Waiting for the Shadow Figure&hellip;</p>}
            {seerStoned && <StoneVision />}
            {target && (
              <div className="mt-4 rounded-xl px-4 py-4 text-center" style={{ background: target.r === 'werewolf' ? 'rgba(220,38,38,0.18)' : 'rgba(16,185,129,0.14)', border: `1px solid ${target.r === 'werewolf' ? '#EF4444' : '#34D399'}` }}>
                <div className="font-display text-xl font-bold">{target.n}</div>
                <div className="mt-1 text-sm font-semibold" style={{ color: target.r === 'werewolf' ? '#FCA5A5' : '#6EE7B7' }}>{target.r === 'werewolf' ? 'is a Werewolf' : 'is not a Werewolf'}</div>
              </div>
            )}
            {lockedNote}
          </>
        ) : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Inspect</Btn>}
      </div>
    );
  }
  if (role === 'bodyguard') {
    return (
      <div className="flex flex-1 flex-col">
        {header('Protect a player', me.lp ? `You cannot guard ${name(me.lp)} again tonight.` : 'They cannot be eliminated tonight.')}
        <PickList players={alive} value={done ? me.t : pick} onChange={setPick} disabled={me.lp ? [me.lp] : []} cool={room.ai === 1 && me.lp ? [me.lp] : []} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Protect</Btn>}
      </div>
    );
  }
  if (role === 'sniper') {
    if (done) return <div className="flex flex-1 flex-col">{header('Scope a player', me.ws === 1 ? 'You took the shot.' : 'You held fire.')}{lockedNote}</div>;
    return <SniperScope header={header('Scope a player', 'Lock onto one player to scope them. If they are infected, you may take the shot.')}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.r === 'zombie' || !!q.bt); }}
      value={pick} setValue={setPick} onDone={(t, shot) => write({ [`pl/${me.id}/t`]: t, [`pl/${me.id}/ws`]: shot ? 1 : 0, [`pl/${me.id}/nd`]: 1 })} />;
  }
  if (role === 'doctor') {
    const skipped = done && !me.t;
    return (
      <div className="flex flex-1 flex-col">
        {header('Treat a player', 'A Zombie or Infected player is cured. Anyone uninfected sleeps through tomorrow night.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : (pick === 'skip' ? '' : pick)} onChange={setPick} locked={done} />
        {!done && <Btn className="mt-3" variant="secondary" onClick={() => setPick(pick === 'skip' ? '' : 'skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip'}</Btn>}
        {done ? <>{skipped && <p className="mt-3 text-center text-sm text-slate-300">You skipped tonight.</p>}{lockedNote}</>
          : <Btn className="mt-3" disabled={!pick} onClick={() => lock(pick === 'skip' ? { [`pl/${me.id}/t`]: '' } : undefined)}>{!pick ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Skip' : 'Confirm Treatment'}</Btn>}
      </div>
    );
  }
  if (role === 'zombie' || role === 'infector') {
    const fz = alive.filter((p) => p.r === 'zombie' || p.r === 'infector').map((p) => p.id);
    return (
      <div className="flex flex-1 flex-col">
        {header(role === 'infector' ? 'Bite a player' : 'Infect a player', role === 'infector' ? 'The victim stays human tonight and turns the night after.' : 'The bite turns them the following night.')}
        <PickList players={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} team={fz} teamLabel="Zombie team" TeamIcon={ZombieIcon} marks={mpZMarks(players, me)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Confirm Bite</Btn>}
      </div>
    );
  }
  if (role === 'plaguedoctor') {
    if (done) return <div className="flex flex-1 flex-col">{header('Inspect a player', me.ws === 1 ? 'You administered the cure.' : me.ws === 2 ? 'You injected the plague.' : 'You left them alone.')}{lockedNote}</div>;
    return <PlagueScan header={header('Inspect a player', 'Lock onto one player to inspect them, then choose a serum.')}
      alive={alive.filter((p) => p.id !== me.id).map((p) => ({ id: p.id, n: p.n }))} isInfected={(id) => { const q = players.find((x) => x.id === id); return !!q && (q.r === 'zombie' || q.r === 'infector' || !!q.bt || !!q.ic); }}
      value={pick} setValue={setPick} onDone={(t, a) => write({ [`pl/${me.id}/t`]: t, [`pl/${me.id}/ws`]: a === 'cure' ? 1 : a === 'infect' ? 2 : 0, [`pl/${me.id}/nd`]: 1 })} />;
  }
  if (role === 'spellcaster') {
    return (
      <div className="flex flex-1 flex-col">
        {header('Silence a player', 'They may not speak during tomorrow’s discussion.')}
        <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
        {done ? lockedNote : <Btn className="mt-4" disabled={!pick} onClick={() => lock()}>Cast Silence</Btn>}
      </div>
    );
  }
  // witch
  const vs = mpWolfVictims(players);
  const victimId = vs[0] || '';
  const two = vs.length > 1;
  const canSave = !me.wsu && !!victimId;
  return (
    <div className="flex flex-1 flex-col">
      {header('Brew your potions', 'Each potion can only be used once in the whole game.')}
      <Panel className="text-sm">
        <div className="text-xs font-semibold uppercase tracking-widest text-slate-400">Tonight&rsquo;s victim</div>
        <div className="mt-1 font-display text-lg font-bold">{vs.length ? vs.map((v) => name(v)).join(' & ') : 'The wolves have not chosen yet'}</div>
        {me.wsu === 1
          ? <p className="mt-2 text-xs text-slate-500">Healing potion already used.</p>
          : two
            ? <div className="mt-3 flex flex-col gap-2">{vs.map((v, i) => { const on = done ? me.ws === i + 1 : save === v; return (
                <button key={v} disabled={done} onClick={() => setSave(save === v ? false : v)} aria-pressed={on}
                  className="flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-bold transition disabled:opacity-40"
                  style={{ background: on ? 'rgba(16,185,129,0.25)' : 'var(--card-2)', border: `1px solid ${on ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>{on ? `Saving ${name(v)} ✓` : `Save ${name(v)}`}</button>); })}</div>
            : <button disabled={!canSave || done} onClick={() => setSave(!save)} aria-pressed={save}
              className="mt-3 flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-bold transition disabled:opacity-40"
              style={{ background: (done ? me.ws === 1 : save) ? 'rgba(16,185,129,0.25)' : 'var(--card-2)', border: `1px solid ${(done ? me.ws === 1 : save) ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>
              {(done ? me.ws === 1 : save) ? `Saving ${victimId ? name(victimId) : ''} ✓` : 'Use healing potion'}
            </button>}
      </Panel>
      {me.wpu === 1
        ? <p className="mt-3 text-center text-xs text-slate-500">Poison already used.</p>
        : <>
            <div className="mb-2 mt-4 text-xs font-semibold uppercase tracking-widest text-slate-400">Poison a player (optional)</div>
            <PickList players={alive.filter((p) => p.id !== me.id)} value={done ? me.t : pick} onChange={setPick} locked={done} />
          </>}
      {done ? lockedNote : <Btn className="mt-4" onClick={() => lock({ [`pl/${me.id}/ws`]: save && canSave ? (two && save === vs[1] ? 2 : 1) : 0 })}>{pick || (save && canSave) ? 'Confirm' : 'Do Nothing Tonight'}</Btn>}
    </div>
  );
}

// Multi-Device automated night, phone side. The host's narrator sets room.ns; each phone shows only what its role may see.
function MpNight(props) {
  if (props.room.ns) return <MpNightAuto {...props} />;
  const pt = props.me.lv && props.me.a === 1 ? props.players.find((x) => x.id === props.me.lv) : null;
  return <>{pt && <LoverBadge name={pt.n} className="mb-3" />}<MpNightManual me={props.me} players={props.players} room={props.room} write={props.write} /></>;
}

// Private chat for the players who are awake together on the same night turn. Only the group sees it, and it clears when the turn ends.
const CHAT_QUICK = ['Agree', 'Not that one', 'Skip', 'Your call'];
function TeamChat({ me, group, room, write, tag }) {
  const [text, setText] = useState('');
  const ids = group.map((g) => g.id);
  const msgs = Object.entries(room.cm || {}).filter(([k, m]) => m && m.g === tag && ids.includes(m.i)).sort((a, b) => (a[0] < b[0] ? -1 : 1)).slice(-4);
  const send = (x) => {
    const t = String(x).trim().slice(0, 80);
    if (!t) return;
    setText('');
    write({ [`cm/${Date.now()}_${me.id}`]: { g: tag, i: me.id, f: me.n, x: t } });
  };
  return (
    <div data-testid="team-chat" className="mt-4 rounded-2xl p-3" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <div className="mb-1 text-[10px] font-bold uppercase tracking-[0.22em] text-slate-400">Team chat {'\u00b7'} {group.map((g) => g.n).join(', ')}</div>
      <div className="mb-2 max-h-24 min-h-[20px] space-y-1 overflow-y-auto text-[13px]">
        {msgs.length === 0 && <div className="text-slate-500">Whisper to your team. Only you can see this.</div>}
        {msgs.map(([k, m]) => <div key={k}><span className="font-bold" style={{ color: m.i === me.id ? '#A5B4FC' : '#FCA5A5' }}>{m.i === me.id ? 'You' : m.f}</span> <span className="text-slate-200">{m.x}</span></div>)}
      </div>
      <div className="mb-2 flex flex-wrap gap-1.5">
        {CHAT_QUICK.map((q) => <button key={q} onClick={() => send(q)} className="rounded-full px-2.5 py-1 text-[11px] font-semibold text-slate-200" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>{q}</button>)}
      </div>
      <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); send(text); }}>
        <input value={text} onChange={(e) => setText(e.target.value)} maxLength={80} placeholder="Message your team" aria-label="Team chat message"
          className="min-w-0 flex-1 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }} />
        <button type="submit" className="rounded-xl px-4 py-2 text-sm font-bold text-white" style={{ background: 'var(--accent, #6366F1)' }}>Send</button>
      </form>
    </div>
  );
}

function MpNightAuto({ me, players, room, write, immersive, onLeave }) {
  const ns = room.ns || '';
  const isWave = ns.indexOf('w:') === 0; // Eyes Open night: wave 1 everyone at once, wave 2 the Witch, wave 3 the Shadow Figure
  const waveNo = isWave ? ns.slice(2) : '';
  let role = ns.indexOf('r:') === 0 ? ns.slice(2) : '';
  if (isWave) {
    const wolvesDone = !players.some((p) => p.a === 1 && p.r === 'werewolf' && p.nd !== 1); // the Witch unlocks as soon as the Werewolves have chosen
    if (waveNo === '1') role = me.jt === 1 ? 'infected' : me.cj === 1 ? 'cured' : (mpActive(me.r, room.k) && me.r !== 'shadow' && (me.r !== 'witch' || wolvesDone) ? me.r : '');
    else if (waveNo === '2') role = me.r === 'witch' ? 'witch' : '';
    else role = me.r === 'shadow' ? 'shadow' : '';
  }
  const viewing = ns === 'v:seer'; // the Seer's final vision, after the Shadow Figure has acted
  const tag = `${ns}${isWave ? ':' + role : ''}:${room.nk}`;
  const [n, setN] = useState(5);
  const [opened, setOpened] = useState('');
  const [sent, setSent] = useState('');
  useEffect(() => { if (ns === 'i' && room.bm) Sfx.rumble(); }, [ns, room.nk]);
  useEffect(() => {
    if (ns !== 'c') return;
    let k = 5; setN(5);
    const t = setInterval(() => { k -= 1; setN(Math.max(0, k)); if (k <= 0) clearInterval(t); }, 1000);
    return () => clearInterval(t);
  }, [ns, room.nk]);

  const partner = me.lv && me.a === 1 ? players.find((x) => x.id === me.lv) : null;
  const group = role && role !== 'cupid' ? players.filter((x) => x.a === 1 && x.r === role && x.sd !== room.k) : []; // everyone awake on this turn shares one action
  const chatGroup = group.length > 1 && me.a === 1 && me.r === role && me.nd !== 1;
  const [spL, setSpL] = useState(null);
  const mine0 = isWave && !!role && sent !== tag && me.nd !== 1 && me.cj !== 2 && me.jt !== 2;
  const wrap = (body, pitch) => <NightStage fixed={!!immersive} pitch={pitch} blood={!!room.bm} onExit={immersive ? onLeave : undefined}>{(isWave || (viewing && room.nightStyle === 'eyes_open')) && me.a === 1 && mine0 && <WaveBadge players={players} room={room} />}{isWave && <p role="note" className="mb-3 rounded-xl px-3 py-2 text-center text-xs font-bold uppercase tracking-wider text-amber-100" style={{ background: 'rgba(245,158,11,0.15)', border: '1px solid rgba(245,158,11,0.5)' }}>{room.adv === 1 ? `Solo Campaign \u00B7 Night ${room.k || 1}` : 'Keep your screen hidden from others!'}</p>}{!pitch && partner && <LoverBadge name={partner.n} className="mb-3" />}{body}{!pitch && chatGroup && <TeamChat me={me} group={group} room={room} write={write} tag={tag} />}</NightStage>;
  const mine = me.a === 1 && ((!!role && me.r === role && me.nd !== 1) || (viewing && me.r === 'seer' && me.rd !== 1) || (role === 'infected' && me.jt === 1) || (role === 'cured' && me.cj === 1)) && sent !== tag;

  if (ns === 'i') return wrap(<><LockView key="i" title={`Night ${nightWord(room.k)} Begins...`} sub="The village falls silent." />{room.bm ? <BloodMoonBanner className="mb-6" /> : null}</>);
  if (ns === 'c') return wrap(<><LockView key="c" eye title="Close Your Eyes" sub="Keep them closed until the narrator says otherwise." count={n} />{room.bm ? <BloodMoonBanner className="mb-6" /> : null}</>);
  if (mine && !isWave && opened !== tag) {
    return wrap(
      <div className="flex flex-1 flex-col items-center justify-center gap-6 text-center">
        <LockView key={'u' + tag} title={roleLabel(viewing ? 'seer' : role)} sub="Only your role may look now. Everyone else has their eyes closed." />
        <Btn className="max-w-xs" onClick={() => setOpened(tag)}>Tap to Unlock Secretly</Btn>
      </div>
    );
  }
  if (mine) {
    const adapted = players.map((p) => ({ id: p.id, name: p.n, role: p.r, alive: p.a === 1, saveUsed: p.wsu === 1, poisonUsed: p.wpu === 1, lastGuard: p.lp || null, lastStone: p.lp || null, bitten: p.bt || 0, incub: p.ic || 0, sedatedTag: p.sd === room.k }));
    const actor = adapted.find((p) => p.id === me.id);
    const victim = mpWolfVictim(players);
    const shadowAlive = players.some((p) => p.a === 1 && (p.r === 'shadow' || p.r === 'medusa' || (p.r === 'seer' && group.length > 1 && role === 'seer')));
    const srv = room.sp && room.sp.g === tag ? room.sp.v : null;
    const ext = group.length > 1 ? { group: group.map((g) => g.id), pick: spL && spL.g === tag && Date.now() - spL.at < 2500 ? spL.v : srv, set: (v) => { setSpL({ g: tag, v, at: Date.now() }); write({ sp: { g: tag, v } }); } } : undefined;
    const submit = (c) => {
      setSent(tag);
      const gp = (fn) => { const o = {}; (group.length ? group : [me]).forEach((g) => Object.assign(o, fn(g))); return o; }; // one confirmed action covers the whole wake-up group
      if (viewing) write({ [`pl/${me.id}/rd`]: 1 });
      else if (role === 'infected') write({ [`pl/${me.id}/jt`]: 2 });
      else if (role === 'cured') write({ [`pl/${me.id}/cj`]: 2 });
      else if (me.sd === room.k) write({ [`pl/${me.id}/nd`]: 1 }); // sedated: only they sleep through it, teammates act as normal
      else if (role === 'cupid') write({ [`pl/${me.id}/t`]: c.cupid[0], [`pl/${me.id}/t2`]: c.cupid[1], [`pl/${me.id}/nd`]: 1, [`pl/${c.cupid[0]}/lv`]: c.cupid[1], [`pl/${c.cupid[1]}/lv`]: c.cupid[0] });
      else if (role === 'shadow') write({ [`pl/${me.id}/t`]: c.shadow ? c.shadow.to : '', [`pl/${me.id}/sa`]: c.shadow ? c.shadow.key : '', [`pl/${me.id}/nd`]: 1 });
      else if (role === 'werewolf') write(gp((g) => ({ [`pl/${g.id}/t`]: c.werewolf || '', [`pl/${g.id}/t2`]: c.werewolf2 || '', [`pl/${g.id}/nd`]: 1 })));
      else if (role === 'witch') { const vs = mpWolfVictims(players); write(gp((g) => ({ [`pl/${g.id}/t`]: c.witchPoison === null || c.witchPoison === undefined ? '' : c.witchPoison, [`pl/${g.id}/ws`]: c.witchSave ? (vs[1] && c.witchSaveTo === vs[1] ? 2 : 1) : 0, [`pl/${g.id}/wst`]: c.witchSave ? (c.witchSaveTo || vs[0] || '') : '', [`pl/${g.id}/nd`]: 1 }))); } // ws 2 = healing the second Blood Moon victim
      else if (role === 'plaguedoctor') write(gp((g) => ({ [`pl/${g.id}/t`]: c.plaguedoctor || '', [`pl/${g.id}/ws`]: c.plagueAct === 'cure' ? 1 : c.plagueAct === 'infect' ? 2 : 0, [`pl/${g.id}/nd`]: 1 })));
      else if (role === 'sniper') write(gp((g) => ({ [`pl/${g.id}/t`]: c.sniper || '', [`pl/${g.id}/ws`]: c.sniperShot ? 1 : 0, [`pl/${g.id}/nd`]: 1 }))); // ws doubles as the Sniper's "shot taken" flag
      else write(gp((g) => ({ [`pl/${g.id}/t`]: c[role] || '', [`pl/${g.id}/nd`]: 1 })));
    };
    if (viewing) {
      const sv = mpSeerView(players, me.id);
      return wrap(<NightActPP key={tag} role="seerResult" players={adapted} actor={actor} choices={mpChoices(players)} onDone={submit} seerOverride={sv} />);
    }
    return wrap(<NightActPP key={tag} role={role} players={adapted} actor={actor} choices={mpChoices(players)} deferSeer={shadowAlive} ext={ext} hideSelf bloodMoon={!!room.bm} coolLabel={room.ai === 1} onDone={submit} tags={room.adv === 1 && role === 'bodyguard' ? { ...L1_TAGS, [me.n]: '(yourself)' } : undefined} />);
  }
  if (isWave || (ns === 'v:seer' && room.nightStyle === 'eyes_open')) {
    return wrap(<><LockView key={'z' + tag} title="Night has fallen." sub={me.a !== 1 ? 'You have been eliminated. Stay silent.' : null} />{ns !== 'v:seer' && <WaveWait players={players} room={room} />}</>, false);
  }
  const text = me.a !== 1 ? 'You have been eliminated. Stay silent and keep your eyes closed.' : 'The night is not over.';
  return wrap(<LockView key={'z' + tag} title="Keep your eyes closed..." sub={text} />, true);
}

// Runs on the host's device: speaks each cue, wakes each role in order, waits for their choices, then breaks dawn.
function useNightDirector({ room, players, write }) {
  const latest = useRef({ room, players });
  latest.current = { room, players };
  const runId = useRef(0);
  const skip = useRef(false);
  const [dir, setDir] = useState({ on: false, label: '' });
  useEffect(() => () => { runId.current += 1; Narrator.stop(); }, []);

  const stop = () => { runId.current += 1; Narrator.stop(); setDir({ on: false, label: '' }); };
  const skipRole = () => { skip.current = true; };
  const start = async (opts) => {
    const my = ++runId.current;
    const live = () => runId.current === my;
    const room0 = latest.current.room;
    const nightNo = opts && opts.again ? (room0.k || 1) : (room0.k || 0) + 1;
    const pred = latest.current.players.map((p) => (p.a === 1 && (p.ic ? p.ic <= 1 : p.bt && p.bt < nightNo) ? { ...p, r: 'zombie', fr: p.r, jt: 1 } : p)); // what dusk will turn into Zombies
    const roles = NIGHT_ORDER.filter((r) => mpActive(r, nightNo) && pred.some((p) => p.a === 1 && p.r === r));
    const turned = pred.find((p) => p.a === 1 && p.jt === 1 && p.fr && p.r === 'zombie' && latest.current.players.find((q) => q.id === p.id).r !== 'zombie');
    if (turned) {
      const key = NIGHT_ORDER.indexOf(turned.fr) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(turned.fr);
      const strict = NIGHT_ORDER.indexOf(turned.fr) >= 0;
      let at = roles.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return strict ? ix > key : ix >= key; });
      if (at < 0) at = roles.length;
      roles.splice(at, 0, 'infected');
    }
    const curedP = latest.current.players.find((p) => p.a === 1 && p.cu && p.cu === nightNo - 1);
    if (curedP) {
      const key = NIGHT_ORDER.indexOf(curedP.r) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(curedP.r);
      let at = roles.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return ix >= key; });
      if (at < 0) at = roles.length;
      roles.splice(at, 0, 'cured');
    }
    if (room0.nightStyle === 'eyes_open') { // Eyes Open: no narration, three waves of silent phone actions, then straight to dawn
      let nk0 = 1; let curNs = 'w:1';
      const stepO = async (ns, label) => { curNs = ns; nk0 += 1; setDir({ on: true, label }); await write({ ns, nk: nk0, cm: null, sp: null }); };
      const waitFor = async (idle, ms, seer) => {
        const isDone = () => idle().length === 0; // after the time limit anyone who has not chosen is recorded as a Skip
        skip.current = false; const t0 = Date.now();
        while (live() && latest.current.room.ns !== curNs && Date.now() - t0 < 4000) await wait(100); // wait until this step has reached us, so last night's answers are not mistaken for tonight's
        const soloH = soloHuman(latest.current);
        while (live() && !isDone() && !skip.current && (soloH || Date.now() - t0 < ms)) await wait(500);
        if (live() && !isDone()) { const o = {}; idle().forEach((p) => { if (seer) o[`pl/${p.id}/rd`] = 1; else if (p.jt === 1) o[`pl/${p.id}/jt`] = 2; else if (p.cj === 1) o[`pl/${p.id}/cj`] = 2; else o[`pl/${p.id}/nd`] = 1; }); if (Object.keys(o).length) await write(o); }
      };
      try {
        const base = mpNightPatch(room0);
        if (opts && opts.again) { base.k = room0.k || 1; base.bm = room0.adv !== 1 && base.k >= 2 && Math.random() < 0.2 ? 1 : 0; }
        setDir({ on: true, label: 'Night begins' });
        await write(base); if (!live()) return; // base opens on the intro screen: "Night Two Begins..." (plus the Blood Moon banner when it rises)
        await wait(base.bm ? 5200 : 4200); if (!live()) return;
        await stepO('w:1', 'Night: everyone acts'); if (!live()) return; // then everyone's night screen opens at once
        const w1 = roles.filter((r) => r !== 'shadow' && r !== 'infected' && r !== 'cured');
        { // Wave 1: everyone at once. The Witch joins the moment the Werewolves have chosen and gets her own 45 seconds.
          const idleOthers = () => latest.current.players.filter((p) => p.a === 1 && ((w1.includes(p.r) && p.r !== 'witch' && p.nd !== 1) || p.jt === 1 || p.cj === 1));
          const idleWitch = () => latest.current.players.filter((p) => p.a === 1 && p.r === 'witch' && p.nd !== 1);
          const skipAll = async (list) => { const o = {}; list.forEach((p) => { if (p.jt === 1) o[`pl/${p.id}/jt`] = 2; else if (p.cj === 1) o[`pl/${p.id}/cj`] = 2; else o[`pl/${p.id}/nd`] = 1; }); if (Object.keys(o).length) await write(o); };
          skip.current = false;
          const t0 = Date.now(); let wd = 0;
          while (live() && latest.current.room.ns !== 'w:1' && Date.now() - t0 < 4000) await wait(100);
          const t1 = Date.now();
          while (live() && !skip.current) {
            const o = idleOthers(); const w = idleWitch();
            if (!o.length && !w.length) break;
            const now = Date.now();
            const wolvesDone = !latest.current.players.some((p) => p.a === 1 && p.r === 'werewolf' && p.nd !== 1);
            if (wolvesDone && !wd) wd = now;
            if (o.length && !soloHuman(latest.current) && now - t1 >= MP_WAVE_SECS * 1000) { await skipAll(o); continue; }
            if (w.length && wolvesDone && !soloHuman(latest.current) && now - Math.max(wd, t1) >= MP_WAVE_SECS * 1000) { await skipAll(w); continue; }
            await wait(500);
          }
          if (!live()) return;
        }
        if (roles.includes('shadow')) {
          await stepO('w:3', 'Wave 3: Shadow Figure');
          await waitFor(() => latest.current.players.filter((p) => p.a === 1 && p.r === 'shadow' && p.nd !== 1), MP_WAVE_SECS * 1000); if (!live()) return;
        }
        if (roles.includes('seer') && (roles.includes('shadow') || roles.includes('medusa') || latest.current.players.filter((p) => p.a === 1 && p.r === 'seer').length > 1)) {
          await stepO('v:seer', 'Seer viewing');
          await waitFor(() => latest.current.players.filter((p) => p.a === 1 && p.r === 'seer' && p.rd !== 1), MP_WAVE_SECS * 1000, true); if (!live()) return;
        }
        setDir({ on: true, label: 'Dawn' });
        const resultO = mpResolveNight(latest.current.room);
        await write(resultO.patch);
        setDir({ on: false, label: '' });
      } catch (e) { setDir({ on: false, label: '' }); }
      return;
    }
    let nk = 1;
    const step = async (ns, label) => { nk += 1; setDir({ on: true, label }); await write({ ns, nk, cm: null, sp: null }); }; // each turn starts with a clean team chat
    try {
      const base = mpNightPatch(room0);
      if (opts && opts.again) { base.k = room0.k || 1; base.bm = room0.adv !== 1 && base.k >= 2 && Math.random() < 0.2 ? 1 : 0; }
      setDir({ on: true, label: 'Night begins' });
      await write(base);
      await Narrator.say('Night begins. Everyone, close your eyes.'); if (!live()) return;
      await step('c', 'Everyone closes their eyes'); await wait(5200); if (!live()) return;
      const holdersOf = (r) => (r === 'infected' ? latest.current.players.filter((p) => p.a === 1 && p.jt === 1) : r === 'cured' ? latest.current.players.filter((p) => p.a === 1 && p.cj === 1) : latest.current.players.filter((p) => p.a === 1 && p.r === r));
      const botsOnly = (r) => { const h = holdersOf(r); return h.length > 0 && h.every((p) => p.bot === 1); }; // AI turns run silently, so nobody can tell which roles are bots
      for (const r of roles) {
        const quiet = botsOnly(r);
        await step('z', `${roleLabel(r)} waking`);
        if (!quiet) { await Narrator.say(`${roleLabel(r)}, open your eyes.`); if (!live()) return; }
        await step('r:' + r, `${roleLabel(r)} choosing`);
        skip.current = false;
        const t0 = Date.now();
        while (live()) {
          const holders = r === 'infected' ? latest.current.players.filter((p) => p.a === 1 && p.jt === 1) : r === 'cured' ? latest.current.players.filter((p) => p.a === 1 && p.cj === 1) : latest.current.players.filter((p) => p.a === 1 && p.r === r);
          if (r === 'infected' || r === 'cured' ? holders.length === 0 : holders.every((p) => p.nd === 1)) break;
          if (skip.current || (!soloHuman(latest.current) && Date.now() - t0 > 90000)) break;
          await wait(500);
        }
        if (!live()) return;
        await step('z', `${roleLabel(r)} sleeping`);
        if (!quiet) { await Narrator.say(`${roleLabel(r)}, close your eyes.`); if (!live()) return; }
        await wait(quiet ? 900 : 2200); if (!live()) return;
      }
      if (roles.includes('seer') && (roles.includes('shadow') || roles.includes('medusa') || latest.current.players.filter((p) => p.a === 1 && p.r === 'seer').length > 1)) {
        const seerQuiet = botsOnly('seer');
        await step('z', 'Seer waking for the final vision');
        if (!seerQuiet) { await Narrator.say('Seer, open your eyes.'); if (!live()) return; }
        await step('v:seer', 'Seer viewing');
        skip.current = false;
        const t1 = Date.now();
        while (live()) {
          const seers = latest.current.players.filter((p) => p.a === 1 && p.r === 'seer');
          if (seers.every((p) => p.rd === 1) || skip.current || (!soloHuman(latest.current) && Date.now() - t1 > 90000)) break;
          await wait(500);
        }
        if (!live()) return;
        await step('z', 'Seer sleeping');
        if (!seerQuiet) { await Narrator.say('Seer, close your eyes.'); if (!live()) return; }
        await wait(seerQuiet ? 900 : 2200); if (!live()) return;
      }
      setDir({ on: true, label: 'Dawn' });
      await Narrator.say('Everyone, open your eyes. Morning has broken.'); if (!live()) return;
      const result = mpResolveNight(latest.current.room);
      await write(result.patch);
      setDir({ on: false, label: '' }); // the casualty screen is silent: players read it themselves
    } catch (e) { setDir({ on: false, label: '' }); }
  };
  return { dir, start, stop, skipRole };
}

// Votes in a room snapshot. Silenced players cannot vote, so they are left out of the voter count and their ballots are ignored.
let ADV1 = false; // set by MpRoom: Campaign Level 1 rules (a tied skip does not block a vote; the Bodyguard's death loses the level)
function mpTally(players) {
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));
  const alive = players.filter((p) => p.a === 1);
  const voters = alive.filter((p) => p.s !== 1 && p.x !== 1 && p.sn !== 1);
  const tally = {};
  let skips = 0;
  voters.forEach((p) => { const w = p.r === 'mayor' ? 2 : 1; if (p.v === 'skip') skips += w; else if (p.v && byId[p.v] && byId[p.v].a === 1) tally[p.v] = (tally[p.v] || 0) + w; });
  const ranked = Object.keys(tally).sort((x, y) => tally[y] - tally[x]);
  const lead = ranked[0] || '';
  const skip = skips > 0 && (ADV1 ? skips > (tally[lead] || 0) : skips >= (tally[lead] || 0)); // skipping wins when it matches or beats the top vote (Level 1: only when it beats it)
  const top = skip ? '' : lead;
  const tie = !skip && ranked.length > 1 && tally[ranked[1]] === tally[lead];
  return { tally, ranked, top, tie, skip, skips, voters, voted: voters.filter((p) => p.v).length };
}
function mpVotePatch(players, id, opts) {
  const o = opts || {};
  const patch = {};
  const ts = String(Date.now());
  players.forEach((p) => { patch[`pl/${p.id}/v`] = ''; });
  if (!o.revote) patch.vd = 1;
  const t = id ? players.find((p) => p.id === id) : null;
  if (!o.revote) patch.vr = { t: t ? 'out' : o.skip ? 'skip' : o.tie ? 'tie' : 'none', id: t ? t.id : '', n: t ? t.n : '', r: t && getSettings().revealDead ? t.r : '', ts }; // read by the "village has spoken" screen
  if (t) {
    patch[`pl/${id}/a`] = 0;
    patch[`an/x/${ts}a`] = `${t.n} was voted out by the village.`;
    if (getSettings().revealDead && ROLES_DATA[t.r]) patch[`an/x/${ts}b`] = `${t.n} was the ${ROLES_DATA[t.r].name}.`;
    const pt = t.lv ? players.find((x) => x.id === t.lv && x.a === 1) : null;
    if (pt) { patch[`pl/${pt.id}/a`] = 0; patch[`an/x/${ts}c`] = `${pt.n} died of heartbreak.`; }
  } else if (o.skip) patch[`an/x/${ts}a`] = 'The village chose to skip the vote. No one was eliminated.';
  else if (o.none) patch[`an/x/${ts}a`] = 'Time ran out with no votes. No one was eliminated.';
  else if (o.tie) patch[`an/x/${ts}a`] = 'The vote was tied. No one was eliminated.';
  return patch;
}

function MpVote({ me, players, room, write }) {
  const alive = players.filter((p) => p.a === 1);
  const { voters, voted } = mpTally(players);
  const [pick, setPick] = useState(me.v || '');
  const stonedMe = me.x === 1;
  const silenced = me.s === 1 || stonedMe || me.sn === 1;
  const nm = (id) => id === 'skip' ? 'Skip vote' : (players.find((p) => p.id === id) || {}).n || '?';
  if (room.vd === 1) return <Panel className="text-center text-sm text-slate-300">The village has decided.</Panel>;
  if (me.a !== 1) return <Panel className="text-center text-sm text-slate-400">The village is voting. {voted} of {voters.length} votes are in.</Panel>;
  return (
    <Panel id="mp-vote">
      <h3 className="font-display text-lg font-bold">Trial vote</h3>
      {me.r === 'mayor' && !silenced && <MayorNote className="mt-2" />}
      <p className="mb-3 mt-1 text-xs text-slate-300">{stonedMe ? 'You are turned to stone and cannot vote today.' : me.sn === 1 ? 'The Sniper shot you. You cannot vote today.' : silenced ? 'You cannot vote today.' : 'Discuss, then vote for the player you want eliminated.'} {voted} of {voters.length} votes are in.</p>
      <PickList players={[...alive.filter((p) => p.id !== me.id), { id: 'skip', n: 'Skip Vote (no elimination)' }]} value={silenced ? '' : pick} onChange={setPick} locked={silenced} />
      <Btn className="mt-3" disabled={silenced || !pick || pick === me.v} onClick={() => write({ [`pl/${me.id}/v`]: pick })}>{silenced ? 'Voting disabled' : pick === 'skip' ? (me.v === 'skip' ? 'Vote: Skip' : 'Cast Skip Vote') : me.v ? 'Change Vote' : 'Cast Vote'}</Btn>
      {!silenced && me.v && <p className="mt-2 text-center text-xs text-emerald-300">Your vote: {nm(me.v)}</p>}
    </Panel>
  );
}

// Lines under an.x belong to THIS day only: a vote or last shot that happened after this dawn (small tolerance for phone clocks).
const anFresh = (an, key) => !an || !an.t || parseInt(key, 10) >= an.t - 20000;
const vrFresh = (room) => !room.vr || !room.an || !room.an.t || Number(room.vr.ts) >= room.an.t - 20000;
function AnnounceCard({ room, players }) {

  const lines = Object.values(an.l || {});

}

function StatusBadges({ players, meId, marks = {} }) {

const ELIM_SEEN = { key: '' };
// Full-screen notice for a player who was just eliminated, so nobody is left guessing.
function ElimGate({ me, room, code }) {
  const key = `${code}:${me.id}:${room.dl || 0}`;
  const [, bump] = useState(0);
  if (me.a !== 0 || !me.r || !ROLES_DATA[me.r] || ELIM_SEEN.key === key) return null;
  if (room.vd === 1 && room.vr && vrFresh(room) && VR_SEEN.key !== `${code}:${room.dl || 0}:${room.k}`) return null; // the vote result comes first
  const lines = Object.values((room.an && room.an.l) || {});
  const xs = Object.entries((room.an && room.an.x) || {}).filter((e) => anFresh(room.an, e[0])).map((e) => e[1]);
  const has = (t) => lines.concat(xs).some((l) => String(l).indexOf(t) >= 0);
  const cz = room.an && room.an.cz ? room.an.cz[me.id] : '';
  const why = cz === 'p' ? 'The Witch poisoned you in the night.'
    : cz === 's' ? 'The Sniper shot you in the night.'
    : cz === 'h' ? 'Your Lover died, and you died of heartbreak.'
    : cz === 'w' || has(`${me.n} was found dead`) ? 'The werewolves found you in the night.'
    : has(`${me.n} was voted out`) ? 'The village voted you out.'
    : has(`took ${me.n} down`) ? 'The Hunter took you down with a last shot.'
    : has(`${me.n} died of heartbreak`) ? 'You died of heartbreak.'
    : 'You are out of the game.';
  const r = ROLES_DATA[me.r];

    <div role="dialog" aria-modal="true" aria-label="You have been eliminated" className="fixed inset-0 z-[70] flex flex-col items-center justify-center gap-5 px-6 text-center screen-in" style={{ background: 'radial-gradient(ellipse at 50% 35%, rgba(127,29,29,0.55), rgba(5,7,12,0.97) 70%)' }}>
      <div className="text-[11px] font-bold uppercase tracking-[0.3em] text-red-300">Eliminated</div>
      <h2 className="font-display text-4xl font-black text-slate-50" style={{ textShadow: '0 0 28px rgba(220,38,38,0.7)' }}>You&rsquo;re Eliminated</h2>
      <p className="max-w-xs text-base font-semibold text-red-100">{why}</p>
      <p className="max-w-xs text-sm text-slate-300">You were the <b style={{ color: r.color }}>{r.name}</b>. You can keep watching, but you can no longer speak, vote or use your role. Keep your eyes on the screen and stay quiet.</p>
      <div className="mt-2 w-full max-w-xs"><Btn onClick={() => { ELIM_SEEN.key = key; bump((x) => x + 1); }}>Keep Watching</Btn></div>
    </div>
  );
}

const VR_SEEN = { key: '' };
// Full-screen result once the vote closes (everyone voted, or the discussion timer ran out): who was voted out and what they were.
function VoteResultGate({ room, code, onContinue }) {

  return (

}

const DAWN_SEEN = { key: '' };
function MpDay({ me, players, room, write, onTimeUp }) {
  const fxKey = room.an && room.an.k === room.k && room.an.t ? String(room.an.t) : '';
  const [fx, setFx] = useState(!!fxKey && fxKey !== DAWN_SEEN.key && Date.now() - Number(fxKey) < 20000);
  useEffect(() => { if (!fx) return; DAWN_SEEN.key = fxKey; const t = setTimeout(() => setFx(false), 2700); return () => clearTimeout(t); }, [fx]);
  const alive = players.filter((p) => p.a === 1);
  const hunterShot = me.r === 'hunter' && me.a !== 1 && me.hs !== 1;
  const [target, setTarget] = useState('');

  const [chatOpen, setChatOpen] = useState(false);

    const ts = String(Date.now());
    write({ [`pl/${t.id}/a`]: 0, [`pl/${me.id}/hs`]: 1, [`an/x/${ts}`]: `${me.n} fired a last shot and took ${t.n} down.`, ...(pt ? { [`pl/${pt.id}/a`]: 0, [`an/x/${ts}h`]: `${pt.n} died of heartbreak.` } : {}) });
  };
  if (solo) {
    const note = me.x === 1 ? <Panel className="text-center text-sm font-semibold text-teal-100" style={{ border: '1px solid rgba(45,212,191,0.7)', background: 'rgba(13,148,136,0.25)' }} role="alert">You have been turned to stone by Medusa until dusk &mdash; you cannot speak or vote today.</Panel>
      : me.s === 1 ? <Panel className="text-center text-sm font-semibold text-violet-100" style={{ border: '1px solid rgba(167,139,250,0.7)', background: 'rgba(109,40,217,0.25)' }} role="alert">You have been silenced by the Spellcaster &mdash; you cannot speak or vote today.</Panel>
      : me.sn === 1 ? <Panel className="text-center text-sm font-semibold text-sky-100" style={{ border: '1px solid rgba(96,165,250,0.7)', background: 'rgba(37,99,235,0.25)' }} role="alert">The Sniper shot you &mdash; your vote is disabled for today.</Panel>
      : <p className="text-center text-xs text-slate-400">You are alive. Discuss and find the werewolves.</p>;
    const timer = null; // one human against bots: no day countdown
    return (
      <div className={`flex flex-1 flex-col gap-4 ${fx ? 'dawn-shake' : ''}`}>
        {me.lv && players.some((x) => x.id === me.lv) && <LoverBadge name={players.find((x) => x.id === me.lv).n} />}
        {fx && (
          <div className="pointer-events-none fixed inset-0 z-40 flex items-start justify-center overflow-hidden" aria-hidden="true">
            <div className="dawn-flash absolute inset-0" />
            <MoonIcon width="120" height="120" className="moon-fade mt-24 text-slate-100" />
          </div>
        )}
        {step === 'news' && (
          <>
            <div className="mt-8 flex flex-1 flex-col justify-center gap-4">
              <AnnounceCard room={room} players={players} />
              {note}
              <StatusBadges players={players} meId={me.id} marks={mpZMarks(players, me)} />
            </div>
            <div className="pt-2"><Btn onClick={() => setStep('talk')}>Accept</Btn></div>
          </>
        )}
        {step === 'talk' && <><div className="mt-8" />{timer}<DayTalk key={vnKey} me={me} players={players} room={room} write={write} canSpeak={me.s !== 1 && me.x !== 1} instant={VN_DONE.key === vnKey} onDone={() => { VN_DONE.key = vnKey; }} onVote={() => setStep('vote')} /></>}
        {step === 'vote' && (
          <>
            <div className="mt-8 flex items-center justify-between gap-3"><div className="font-display text-lg font-bold tracking-wide text-slate-100">Trial Voting</div></div>
            {timer}
            <MpVote me={me} players={players} room={room} write={write} />
            <div className="mt-auto pt-4"><Btn variant="ghost" onClick={() => setStep('talk')}>Back to Discussion</Btn></div>
          </>
        )}

}

// Adventure / Solo AI day discussion: the same visual-novel look as the cottage dialogue (portraits, dark-slate bubbles, typing dots, Skip).
const VN_DONE = { key: '' };
const DAY_PAL = ['#FDBA74', '#A5B4FC', '#86EFAC', '#F0ABFC', '#FDE047', '#7DD3FC'];
function DayAv({ name, mine, adv }) {

  return <span className="flex shrink-0 items-center justify-center font-display text-lg font-black text-white" style={{ width: 40, height: 50, borderRadius: '50%', border: `2px solid ${c}`, background: npc ? npc.bg : 'linear-gradient(160deg, #334155, #1E293B)', boxShadow: '0 4px 12px rgba(0,0,0,0.55)' }}>{String(name || '?')[0]}</span>;
}
function DayTalk({ me, players, room, write, canSpeak, instant, onDone, onVote }) {
  const adv = room.adv === 1;
  const nm1 = (n) => (players.find((p) => p.n === n && p.bot === 1) || {}).id;
  const scr = adv && room.k === 1 && ['Charlie', 'Stacy', 'Jenna'].every((n) => players.some((p) => p.n === n && p.bot === 1 && p.a === 1)); // Day 1, Stacy survived: the scripted debate
  const who = (w) => (w === 'me' ? me.id : nm1({ ch: 'Charlie', st: 'Stacy', je: 'Jenna' }[w]));
  const sMsgs = !scr ? [] : L1_D1_OPEN.map((e, i) => ['s' + String(i).padStart(2, '0'), { i: who(e[0]), m: e[1] }]);
  const msgs = scr ? sMsgs : Object.entries(room.dc || {}).filter((e) => e[1] && e[1].m).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const plan = adv && players.some((p) => p.n === 'Charlie' && p.a === 1) ? l1DayPlan(players, room.k || 1).lines : null; // Level 1 is scripted, so we know how many lines are still to come
  const guarded = me.r === 'bodyguard' && me.lp ? players.find((x) => x.id === me.lp) : null; // the Bodyguard's own thought about last night
  const cz = (room.an && room.an.cz) || {};
  const lost = Object.keys(cz).filter((id) => cz[id] === 'w').map((id) => (players.find((x) => x.id === id) || {}).n).filter(Boolean).join(' and ');
  const thought = !guarded ? '' : room.an && room.an.sv === 1 && !lost ? `They struck overnight, and my shield held\u2014the Werewolf came straight after ${guarded.n} last night!` : lost ? `Oh no... I guarded ${guarded.n}, and the beast went after ${lost} instead!` : '';
  const [th, setTh] = useState(!thought || !!instant);
  useEffect(() => { if (th) return undefined; const t = setTimeout(() => { setTh(true); Sfx.msg(); }, 1100); return () => clearTimeout(t); }, [th]);
  const [n, setN] = useState(instant ? msgs.length : 0);
  const [typing, setTyping] = useState(false);
  const [skipped, setSkipped] = useState(!!instant);
  const [idle, setIdle] = useState(!!instant);
  const [silent, setSilent] = useState(false);
  const [used, setUsed] = useState(false);
  const [ask, setAsk] = useState(false);
  const endRef = useRef(null);
  const theirs = msgs.slice(0, n).filter((e) => e[1].i !== me.id).length;
  const waiting = !skipped && th && n >= msgs.length && plan && theirs < plan.length ? plan[theirs][0] : null;
  useEffect(() => {
    if (skipped) { if (n < msgs.length) setN(msgs.length); return undefined; }
    if (!th) return undefined;
    if (n < msgs.length) {
      if (msgs[n][1].i === me.id) { if (!scr) { setN(n + 1); return undefined; } const t3 = setTimeout(() => { setN(n + 1); Sfx.msg(); }, 700); return () => clearTimeout(t3); }
      const t1 = setTimeout(() => setTyping(true), 600);
      const t2 = setTimeout(() => { setTyping(false); setN(n + 1); Sfx.msg(); }, 1900 + Math.min(500, String(msgs[n][1].m).length * 5));
      return () => { clearTimeout(t1); clearTimeout(t2); };
    }
    setTyping(false); return undefined;
  }, [n, msgs.length, skipped, th]);
  useEffect(() => {
    if (scr || idle || skipped || !th || n < msgs.length || (plan && theirs < plan.length)) return undefined;
    const t = setTimeout(() => setIdle(true), plan ? 900 : 7000); // the bubbles have gone quiet
    return () => clearTimeout(t);
  }, [n, msgs.length, skipped, idle, theirs, th]);
  const finished = scr ? n >= msgs.length : idle || skipped;
  useEffect(() => { if (finished) onDone(); }, [finished]);
  useEffect(() => { if (endRef.current && endRef.current.scrollIntoView) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [n, typing, waiting, finished, silent]);
  const nameOf = (id) => { const p = players.find((x) => x.id === id); return p ? p.n : '?'; };
  const say = (text, accuse) => { setUsed(true); setAsk(false); if (text) write({ ['dc/' + Date.now() + String(10 + Math.floor(Math.random() * 90))]: { i: me.id, m: text, a: accuse || '', c: '' } }); else setSilent(true); };
  const row = (mine, name, body, key) => (mine

      {!mine && <div className="mb-1 ml-3 text-left text-[11px] font-bold uppercase tracking-wider" style={{ color: (L1_NPC[String(name).toLowerCase()] || {}).c || '#CBD5E1' }}>{name}</div>}
      <div className={`${mine ? 'guide-bub' : 'guide-bub-l'} inline-block rounded-[22px] px-4 py-2.5 text-left text-[14px] leading-snug text-white ${mine ? 'italic' : 'font-semibold'}`} style={L1_BUB}><p>{text}</p></div>
    </div>, key);
  const dotsFor = n < msgs.length ? nameOf(msgs[n][1].i) : waiting ? waiting.n : '';
  const showDots = !skipped && ((typing && n < msgs.length) || !!waiting);
  const others = players.filter((p) => p.a === 1 && p.id !== me.id);
  const pillCls = 'guide-bub rounded-full px-4 py-2 text-[13px] font-bold text-slate-100';
  const pillSt = { background: 'rgba(30,41,59,0.92)', border: '1px solid rgba(148,163,184,0.55)', boxShadow: '0 4px 14px rgba(2,6,23,0.55)' };
  return (
    <div className="relative flex flex-1 flex-col gap-3">
      <div className="flex items-center justify-between gap-3">
        <div className="font-display text-lg font-bold tracking-wide text-slate-100">Day Discussion</div>
        {!finished && <button type="button" onClick={() => { setTyping(false); setTh(true); setSkipped(true); Sfx.msg(); }} className="flex h-10 items-center rounded-full px-4 text-[13px] font-bold uppercase tracking-wider text-slate-200" style={{ background: 'rgba(12,16,26,0.7)', border: '1px solid rgba(148,163,184,0.5)' }}>Skip</button>}
      </div>
      <div className="flex min-h-[46vh] flex-1 flex-col justify-end gap-3 rounded-2xl px-1 py-3" style={{ background: 'linear-gradient(180deg, rgba(5,7,12,0.55), rgba(5,7,12,0.7))' }}>
        {thought && (th || skipped) && bub(true, me.n, thought, 'thought')}
        {msgs.slice(0, n).map((e) => bub(e[1].i === me.id, nameOf(e[1].i), e[1].m, e[0]))}
        {silent && bub(true, me.n, 'You stay silent.', 'silent')}
        {showDots && row(false, dotsFor, <div className="guide-bub-l guide-dots rounded-[20px] px-3.5 py-2.5" style={L1_BUB} aria-hidden="true"><span /><span /><span /></div>, 'typing')}
        <div ref={endRef} />
      </div>
      {finished && (
        <div className="sticky flex flex-col items-end gap-2 pb-1 pt-1" style={{ bottom: 'max(14px, env(safe-area-inset-bottom))' }}>
          {!scr && canSpeak && !used && (ask
            ? <div className="flex flex-wrap justify-end gap-2">{others.map((p) => <button key={p.id} type="button" className={pillCls} style={pillSt} onClick={() => say(`${p.n}, what are you hiding? Explain yourself.`, p.id)}>{p.n}</button>)}<button type="button" className={pillCls} style={pillSt} onClick={() => setAsk(false)}>Back</button></div>
            : <div className="flex flex-wrap justify-end gap-2"><button type="button" className={pillCls} style={pillSt} onClick={() => say("Let's skip the vote and wait for more clues.")}>Agree to Skip</button><button type="button" className={pillCls} style={pillSt} onClick={() => say('')}>Stay Silent</button><button type="button" className={pillCls} style={pillSt} onClick={() => setAsk(true)}>Question Someone</button></div>)}
          <button type="button" data-ui-sound="primary" onClick={onVote} className="guide-bub flex min-h-[48px] items-center gap-2 rounded-full px-6 text-[15px] font-bold text-white" style={{ background: 'linear-gradient(180deg, #3B82F6, #1D4ED8)', border: '1px solid rgba(191,219,254,0.7)', boxShadow: '0 6px 18px rgba(2,6,23,0.6), 0 0 20px rgba(59,130,246,0.45)' }}>🗳️ Cast Your Vote</button>
        </div>

    </div>
  );
}

function Level1Prologue({ onDone, onLeave }) {
  const total = L1_LINES.length;

  const [leaving, setLeaving] = useState(false);

  const [splats, setSplats] = useState([]);
  const stimers = useRef([]);
  useEffect(() => () => stimers.current.forEach(clearTimeout), []);
  const spawn = (e) => { // a tap anywhere splashes blood, like the home screen (Settings > Tap Blood Effects)
    if (!getSettings().blood || L1_REDUCED()) return;
    const sp = makeBurst(e.clientX, e.clientY);
    setSplats((a) => [...a.slice(-15), sp]);
    stimers.current.push(setTimeout(() => setSplats((a) => a.filter((x) => x.id !== sp.id)), 2600));
  };
  useEffect(() => {
    if (n >= total) { setTyping(false); return undefined; }
    const lead = n === 0 ? 900 : 800; const t1 = setTimeout(() => setTyping(true), lead); // ~2.4-2.8 s per message in all: a beat, then the typing dots, then the bubble
    const t2 = setTimeout(() => { setTyping(false); setN(n + 1); Sfx.msg(); }, 2400 + Math.min(400, L1_LINES[n].t.length * 4));
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [n]);
  useEffect(() => { const go = () => { if (endRef.current && endRef.current.scrollIntoView) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }; go(); const t = setTimeout(go, 380); return () => clearTimeout(t); }, [n, typing]); // second pass once the button space has opened
  const skip = () => { if (n < total && !leaving) { setTyping(false); setN(n + 1); Sfx.msg(); } }; // tap anywhere: show the next line right away
  const skipAll = (e) => { e.stopPropagation(); if (n < total && !leaving) { setTyping(false); setN(total); Sfx.msg(); } }; // reveal every remaining line at once
  const go = (e) => { e.stopPropagation(); if (leaving) return; setLeaving(true); setTimeout(onDone, 500); };
  const IMG = 'images/level1-harbor-pov.webp';

function MpOver({ room, players, meId, onRetry }) {
  const W = WIN_UI[room.w] || WIN_UI.werewolf;

/* ---------- host / moderator view ---------- */
function MpMod({ room, players, me, write, director }) {

  const [confirmEnd, setConfirmEnd] = useState(false);

  const alive = players.filter((p) => p.a === 1);
  const winner = mpWinner(players);
  const actors = alive.filter((p) => mpActive(p.r, room.k));
  const pending = actors.filter((p) => p.nd !== 1);
  const allReady = players.length > 0 && players.every((p) => p.d === 1);
  const victims = mpWolfVictims(players);

  const startNight = () => director.start();
  const dawn = () => { director.stop(); const r = mpResolveNight(room); write(r.patch); };
  const { tally, ranked, top, tie, voters, voted } = mpTally(players);
  const closeVote = (id, opts) => write(mpVotePatch(players, id, opts));
  const toggleAlive = (p) => {
    const patch = { [`pl/${p.id}/a`]: p.a === 1 ? 0 : 1 };
    if (p.a === 1) patch[`an/x/${String(Date.now())}`] = `${p.n} was eliminated by the village.`;

    if (pt) { patch[`pl/${pt.id}/a`] = 0; patch[`an/x/${String(Date.now())}h`] = `${pt.n} died of heartbreak.`; }
    write(patch);
  };
  const endGame = (w) => write({ ph: 'over', w });
  const playAgain = () => write(mpLobbyPatch(room));

  const winBanner = winner && (ph === 'night' || ph === 'day') && (
    <Panel style={{ border: `1px solid ${(WIN_UI[winner] || WIN_UI.werewolf).color}`, background: (WIN_UI[winner] || WIN_UI.werewolf).bg }}>
      <p className="text-sm font-semibold text-slate-100">{(WIN_UI[winner] || WIN_UI.werewolf).banner}</p>
      <Btn className="mt-3" onClick={() => endGame(winner)}>End Game: {(WIN_UI[winner] || WIN_UI.werewolf).btn}</Btn>
    </Panel>
  );

  const grimoire = (
    <ul className="flex flex-col gap-2">
      {players.map((p) => {
        const actor = mpActive(p.r, room.k);
        let detail = '';
        if (ph === 'night' && p.a === 1 && actor && p.r === 'cupid') detail = p.nd === 1 ? `binds ${nm(p.t)} and ${nm(p.t2)}` : 'waiting...';
        else if (ph === 'night' && p.a === 1 && actor && p.r === 'shadow') detail = p.nd === 1 ? (p.sa ? `redirects an action → ${nm(p.t)}` : 'no redirect') : 'waiting...';
        else if (ph === 'night' && p.a === 1 && actor) detail = p.nd === 1 ? (p.t ? `→ ${nm(p.t)}${p.t2 ? ', ' + nm(p.t2) : ''}` : 'no target') + (p.r === 'witch' && p.ws === 1 ? ' · saves victim' : '') : 'waiting...';
        const tags = [];
        if (p.r === 'witch') tags.push(`heal ${p.wsu === 1 ? 'used' : 'ready'}`, `poison ${p.wpu === 1 ? 'used' : 'ready'}`);
        if (p.lv) tags.push(`lover of ${nm(p.lv)}`);
        if (p.s === 1 && ph === 'day') tags.push('silenced');
        if (p.x === 1 && ph === 'day') tags.push('stoned');
        if (p.sn === 1 && ph === 'day') tags.push('no vote (sniped)');
        if (p.fr) tags.push(`was ${ROLES_DATA[p.fr] ? ROLES_DATA[p.fr].name : p.fr}`);
        if (p.bt && p.a === 1) tags.push('infected');
        if (p.r === 'medusa' && p.lp) tags.push(`last stoned ${nm(p.lp)}`);
        if (p.r === 'bodyguard' && p.lp) tags.push(`last guarded ${nm(p.lp)}`);

            <div className="flex items-center justify-between gap-2">
              <span className="min-w-0 truncate text-[15px] font-semibold" style={p.a === 1 ? undefined : { textDecoration: 'line-through' }}>{p.n}{me && p.id === me.id ? ' (you)' : ''}</span>
              <span className="flex shrink-0 items-center gap-2">
                {ph === 'reveal' && <span className={`text-xs font-semibold ${p.d === 1 ? 'text-emerald-300' : 'text-slate-500'}`}>{p.d === 1 ? 'Ready ✓' : 'Viewing…'}</span>}
                <RoleChip role={p.r} />
