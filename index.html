  if (role === 'medusa') {
    const last = actor.lastStone;
    const hasLast = last !== undefined && last !== null && last !== '';
    const skip = pick === 'skip';
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub={hasLast ? `You cannot petrify ${nm(last)} two nights in a row.` : 'They cannot act tonight, and cannot speak or vote tomorrow.'} />
        <PickList players={opts(alive.filter((p) => p.id !== actor.id))} value={skip ? '' : val} onChange={choose} disabled={hasLast ? [last] : []} />
        <Btn className="mt-3" variant="secondary" onClick={() => setPick(skip ? null : 'skip')}>{skip ? 'Skip selected ✓' : 'Skip / Don\u2019t Use Gaze Tonight'}</Btn>
        <Btn className="mt-3" disabled={pick === null} onClick={() => onDone({ medusa: skip ? null : pick })}>{pick === null ? 'Select a player or Skip' : skip ? 'Confirm Skip' : 'Confirm Petrify'}</Btn>
      </div>
    );
  }
  if (role === 'seer') {
    const stoneT = hasV(choices.medusa) ? players.find((p) => p.id === choices.medusa) : null;
    const stoned = !!stoneT && stoneT.role === 'seer' && !players.some((p) => p.alive && p.role === 'seer' && p.id !== stoneT.id); // a free second Seer still sees
    const target = seen === null ? null : players.find((p) => p.id === seen);
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub={target ? '' : 'Tap a name to select. Nothing is revealed until you confirm.'} />
        <PickList players={opts(alive.filter((p) => p.id !== actor.id && !(ext && ext.group.includes(p.id))))} value={val} onChange={choose} locked={seen !== null} />
        {target && deferSeer && <StoneVision text="Your vision will come at the end of the night." />}
        {target && !deferSeer && stoned && <StoneVision />}
        {target && !deferSeer && !stoned && <GhostFlip key={target.id} name={target.name} wolf={target.role === 'werewolf'} odd={target.role === 'shadow' || target.role === 'spellcaster'} />}
        {target
          ? <Btn className="mt-5" onClick={() => onDone({ seer: deferSeer ? seen : stoned ? null : seen })}>Done</Btn>
          : <Btn className="mt-5" disabled={pick === null} onClick={() => setSeen(pick)}>{pick === null ? 'Select a player' : 'Confirm Inspection'}</Btn>}
      </div>
    );
  }
  if (role === 'bodyguard') {
    const last = actor.lastGuard;
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub={last !== undefined && last !== null ? `You cannot protect ${nm(last)} two nights in a row.` : 'They cannot be eliminated tonight.'} />
        <PickList players={opts(alive)} value={val} onChange={choose} disabled={last !== undefined && last !== null ? [last] : []} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ bodyguard: pick })}>{pick === null ? 'Select a player' : 'Confirm Protection'}</Btn>
      </div>
    );
  }
  if (role === 'spellcaster') {
    return (
      <div className="flex flex-1 flex-col">
        <ActHeader role={role} sub="They may not speak during tomorrow’s discussion." />
        <PickList players={opts(alive.filter((p) => p.id !== actor.id && !(ext && ext.group.includes(p.id))))} value={val} onChange={choose} />
        <Btn className="mt-5" disabled={pick === null} onClick={() => onDone({ spellcaster: pick })}>{pick === null ? 'Select a player' : 'Confirm Silence'}</Btn>
      </div>
    );
  }
  // witch
  const victims = [choices.werewolf, choices.werewolf2].filter((v) => v !== undefined && v !== null);
  const two = victims.length > 1; // Blood Moon: the pack hunted two players
  const victim = victims.length ? victims[0] : null;
  const canSave = !actor.saveUsed && victim !== null;
  return (
    <div className="flex flex-1 flex-col">
      <ActHeader role={role} />
      <Panel className="text-center" style={{ border: '1px solid rgba(239,68,68,0.6)', background: 'rgba(127,29,29,0.22)', boxShadow: '0 0 30px -8px rgba(239,68,68,0.7)' }}>
        <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-red-300">The Werewolves chose</div>
        <div className="font-display mt-1 text-2xl font-black text-slate-50">{victims.length ? victims.map((v) => nm(v)).join(' & ') : 'No one'}</div>
        {actor.saveUsed
          ? <p className="mt-2 text-xs text-slate-500">Your save potion is already used.</p>
          : two
            ? <div className="mt-3 flex flex-col gap-2">{victims.map((v) => (
                <button key={v} onClick={() => setSave(save === v ? false : v)} aria-pressed={save === v}
                  className="flex min-h-[52px] w-full items-center justify-center rounded-xl text-[15px] font-bold transition"
                  style={{ background: save === v ? 'rgba(16,185,129,0.28)' : 'var(--card-2)', border: `1px solid ${save === v ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>
                  {save === v ? `Saving ${nm(v)} ✓` : `Save ${nm(v)}`}
                </button>))}</div>
            : <button disabled={!canSave} onClick={() => setSave(!save)} aria-pressed={save}
              className="mt-3 flex min-h-[52px] w-full items-center justify-center rounded-xl text-[15px] font-bold transition disabled:opacity-40"
              style={{ background: save ? 'rgba(16,185,129,0.28)' : 'var(--card-2)', border: `1px solid ${save ? '#34D399' : 'var(--line)'}`, color: '#E6EAF2' }}>
              {save ? `Saving ${nm(victim)} ✓` : 'Save Target'}
            </button>}
      </Panel>
      {actor.poisonUsed
        ? <p className="mt-4 text-center text-xs text-slate-500">Your poison is already used.</p>
        : <>
            <div className="mb-2 mt-4 text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Poison a player (optional)</div>
            <PickList players={opts(alive.filter((p) => p.id !== actor.id && !(ext && ext.group.includes(p.id))))} value={val} onChange={choose} />
          </>}
      <Btn className="mt-5" onClick={() => onDone({ witchSave: !!save && canSave, witchSaveTo: two && save ? save : undefined, witchPoison: pick })}>{pick !== null ? 'Confirm Poison' : save && canSave ? 'Confirm Save' : 'Do Nothing Tonight'}</Btn>
    </div>
  );
}

function resolveNightPP(players, c0, night) {
  const has = hasV;
  const byId = new Map(players.map((p) => [p.id, p]));
  const shadowP = players.find((p) => p.alive && p.role === 'shadow');
  const c = applyShadow(c0, c0.shadow, shadowP ? shadowP.id : null); // the Shadow Figure's swap comes before anything resolves
  // Medusa's gaze lands first: whoever she stones loses their action for the night.
  const stoneId = has(c.medusa) && byId.get(c.medusa) && byId.get(c.medusa).alive ? c.medusa : null;
  const stoned = stoneId !== null ? byId.get(stoneId) : null;
  const blocked = (role) => !!stoned && stoned.role === role && !players.some((p) => p.alive && p.role === role && p.id !== stoneId); // a role with a free teammate still acts
  const victim = has(c.werewolf) && !blocked('werewolf') ? c.werewolf : null;
  const victim2 = has(c.werewolf2) && !blocked('werewolf') && c.werewolf2 !== victim ? c.werewolf2 : null; // Blood Moon: a second hunt target
  const guarded = has(c.bodyguard) && !blocked('bodyguard') ? c.bodyguard : null;
  const poison = has(c.witchPoison) && !blocked('witch') ? c.witchPoison : null;
  const witchSave = !!c.witchSave && !blocked('witch');
  const silenced = has(c.spellcaster) && !blocked('spellcaster') ? c.spellcaster : null;
  const saveTarget = witchSave ? (has(c.witchSaveTo) ? c.witchSaveTo : victim) : null;
  const protectedV = (v) => v === guarded || (saveTarget !== null && v === saveTarget);
  const saved = [victim, victim2].some((v) => v !== null && protectedV(v));
  const dead = [];
  [victim, victim2].forEach((v) => { if (v !== null && !protectedV(v) && !dead.includes(v)) dead.push(v); }); // each hunt is blocked on its own
  if (poison !== null && !dead.includes(poison)) dead.push(poison); // the Bodyguard blocks hunts and bites, never the Witch's poison
  // Sniper: a shot taken at an infected player (Zombie or incubating) eliminates them unless guarded or healed this night.
  const shotP = has(c.sniper) && c.sniperShot && !blocked('sniper') ? byId.get(c.sniper) : null;
  const shotHit = shotP && shotP.alive && shotP.role === 'zombie' && shotP.id !== guarded && !(saveTarget !== null && shotP.id === saveTarget) ? shotP.id : null;
  if (shotHit !== null && !dead.includes(shotHit)) dead.push(shotHit);
  // Cupid's Lovers: when one dies from any cause the other dies of heartbreak (even if the Bodyguard guarded them).
  const pair = Array.isArray(c0.cupid) && c0.cupid.length === 2 ? c0.cupid : null;
  const partnerOf = (id) => { if (pair) { if (pair[0] === id) return pair[1]; if (pair[1] === id) return pair[0]; } const q = byId.get(id); return q && has(q.lover) ? q.lover : null; };
  const brokenIds = [];
  dead.slice().forEach((id) => { const pid = partnerOf(id); if (pid !== null && byId.get(pid) && byId.get(pid).alive && !dead.includes(pid)) { dead.push(pid); brokenIds.push(pid); } });
  // Doctor: cures a Zombie (back to the old role, or Villager if they began as a Zombie); anyone uninfected sleeps through the next night.
  const docT = has(c.doctor) && !blocked('doctor') ? c.doctor : null;
  const docP = docT !== null ? byId.get(docT) : null;
  const docLive = !!docP && docP.alive && !dead.includes(docT);
  const docCure = docLive && (docP.role === 'zombie' || docP.role === 'infector' || !!docP.bitten || !!docP.incub) ? docT : null;
  const sedateId = docLive && docCure === null ? docT : null;
  // Plague Doctor: the serum matches the target's real status (a Shadow redirect can waste it). Cure beats the bite; an infection is stopped by the Bodyguard or a Witch heal.
  const pdT = has(c.plaguedoctor) && !blocked('plaguedoctor') ? c.plaguedoctor : null;
  const pdAct = pdT !== null && (c.plagueAct === 'cure' || c.plagueAct === 'infect') ? c.plagueAct : null;
  const pdP = pdT !== null ? byId.get(pdT) : null;
  const pdLive = !!pdP && pdP.alive && !dead.includes(pdT);
  const pdIsInf = !!pdP && (pdP.role === 'zombie' || pdP.role === 'infector' || !!pdP.bitten || !!pdP.incub);
  const pdCure = pdLive && pdAct === 'cure' && pdIsInf ? pdT : null;
  const pdInfect = pdLive && pdAct === 'infect' && !pdIsInf && !(pdP && (pdP.role === 'infector' || pdP.r === 'infector')) && pdT !== guarded && !(saveTarget !== null && pdT === saveTarget) ? pdT : null;
  const cureId = docCure !== null ? docCure : pdCure;
  const cureP = cureId !== null ? byId.get(cureId) : null;
  const hordeCured = !!cureP && cureP.role === 'zombie' && !players.some((p) => p.alive && p.role === 'zombie' && p.id !== cureId); // the last Zombie, cured, cannot bite tonight
  // Outbreak: the horde's single bite lands unless the target died, was guarded, or was healed; the Sniper hits an active Zombie.
  const biteT = has(c.zombie) && !blocked('zombie') && !hordeCured ? c.zombie : null;
  const biteP = biteT !== null ? byId.get(biteT) : null;
  const bitten = biteP && biteP.alive && !dead.includes(biteT) && biteT !== guarded && !(witchSave && biteT === saveTarget) && biteP.role !== 'zombie' && biteP.role !== 'infector' ? biteT : null;
  // Infected: one slow bite. The victim stays human for two more nights; the Plague Doctor is immune.
  const infT = has(c.infector) && !blocked('infector') ? c.infector : null;
  const infP = infT !== null ? byId.get(infT) : null;
  const infBite = !!infP && infP.alive && !dead.includes(infT) && infT !== guarded && !(saveTarget !== null && infT === saveTarget) && !['zombie', 'infector', 'plaguedoctor'].includes(infP.role) && !infP.bitten ? infT : null;
  const myGuard = has(c0.bodyguard) && !blocked('bodyguard') ? c0.bodyguard : null; // Bodyguard and Medusa remember what they picked themselves
  const next = players.map((p) => {
    const q = { ...p, nn: night, protectedTag: p.id === guarded, silencedTag: p.alive && p.id === silenced, stoneTag: p.alive && p.id === stoneId, shotTag: p.id === shotHit, justTurned: false, justCured: p.id === cureId, sedatedTag: p.id === sedateId };
    if (p.id === cureId) { q.role = p.former && p.former !== 'zombie' && ROLES_DATA[p.former] ? p.former : 'villager'; q.former = ''; q.bitten = 0; q.incub = 0; }
    if (p.id === infBite) { q.bitten = night; q.incub = 2; } // slow burn: human tonight, still human tomorrow, a Zombie the night after
    if (p.id === bitten || p.id === pdInfect) { q.bitten = night; q.incub = 0; } // a fast bite overrides the slow one
    if (p.role === 'plaguedoctor' && pdAct) { if (pdAct === 'cure') q.pdCures = (p.pdCures || 0) + 1; else q.pdInfects = (p.pdInfects || 0) + 1; q.pdLast = pdAct; }
    if (dead.includes(p.id)) { q.alive = false; q.protectedTag = false; q.silencedTag = false; q.stoneTag = false; q.shotTag = false; q.bitten = 0; q.incub = 0; q.justCured = false; q.sedatedTag = false; }
    if (pair && (p.id === pair[0] || p.id === pair[1])) q.lover = partnerOf(p.id);
    if (p.role === 'bodyguard' && p.alive && myGuard !== null) q.lastGuard = myGuard;
    if (p.role === 'medusa' && p.alive) q.lastStone = has(c0.medusa) ? c0.medusa : null;
    if (p.role === 'witch') { if (witchSave && victim !== null) q.saveUsed = true; if (poison !== null) q.poisonUsed = true; }
    return q;
  });
  const silencedName = silenced !== null && byId.get(silenced) && !dead.includes(silenced) ? byId.get(silenced).name : '';
  const stonedName = stoneId !== null && !dead.includes(stoneId) ? stoned.name : '';
  return { next, dead, broken: brokenIds, saved, victim, silenced, silencedName, stoned: stonedName ? stoneId : null, stonedName, lines: dawnLines(saved, dead.filter((id) => !brokenIds.includes(id)).map((id) => byId.get(id).name), silencedName, stonedName, brokenIds.map((id) => byId.get(id).name), shotHit !== null), bitten: bitten !== null ? bitten : pdInfect !== null ? pdInfect : infBite, shotHit };
}

// Pass & Play: the narrator runs the whole night by voice. One device, passed to each role in turn.
function NightLoopPP({ players, night, onFinish, onExit }) {
  const bloodMoon = useMemo(() => night >= 2 && Math.random() < 0.2, []); // Blood Moon: 20% from Night 2 on
  useEffect(() => { if (bloodMoon) Sfx.rumble(); }, []);
  const roles = useMemo(() => {
    const list = NIGHT_ORDER.filter((r) => (r !== 'cupid' || night === 1) && players.some((p) => p.alive && p.role === r));
    if (list.includes('seer') && (list.includes('shadow') || list.includes('medusa'))) list.push('seerResult'); // the Seer's vision waits until Medusa and the Shadow Figure have acted
    const turned = players.find((p) => p.alive && p.justTurned); // a bitten player wakes alone, at their old role's turn, to learn they were infected
    if (turned) {
      const key = NIGHT_ORDER.indexOf(turned.former) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(turned.former);
      const strict = NIGHT_ORDER.indexOf(turned.former) >= 0; // no night power: wake just before the Zombie Horde
      let at = list.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return strict ? ix > key : ix >= key; });
      if (at < 0) at = list.length;
      list.splice(at, 0, 'infected');
    }
    const cured = players.find((p) => p.alive && p.justCured); // a cured player wakes alone, at their restored role's turn, to learn they are human again
    if (cured) {
      const key = NIGHT_ORDER.indexOf(cured.role) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(cured.role);
      let at = list.findIndex((r) => { const ix = NIGHT_ORDER.indexOf(r) < 0 ? 99 : NIGHT_ORDER.indexOf(r); return ix >= key; });
      if (at < 0) at = list.length;
      list.splice(at, 0, 'cured');
    }
    return list;
  }, []);
  const deferSeer = useMemo(() => players.some((p) => p.alive && (p.role === 'shadow' || p.role === 'medusa')), []);
  useState(() => rollBg('night'));
  const [st, setSt] = useState({ k: 'title' });
  const [count, setCount] = useState(5);
  const [res, setRes] = useState(null);
  const [spoken, setSpoken] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const ch = useRef({});
  const reveal = useSettings().revealDead;

  useEffect(() => () => Narrator.stop(), []);
  const after = (i) => (i + 1 < roles.length ? { k: 'call', i: i + 1 } : { k: 'dawnSay' });

  const morningP = useRef(null);
  useEffect(() => {
    let off = false;
    (async () => {
      if (st.k === 'title') {
        await Narrator.say('Night begins. Everyone, close your eyes.');
        if (!off) setSt({ k: 'close' });
      } else if (st.k === 'close') {
        for (let n = 5; n > 0; n--) { setCount(n); await wait(1000); if (off) return; }
        setSt(roles.length ? { k: 'call', i: 0 } : { k: 'dawnSay' });
      } else if (st.k === 'call') {
        await Narrator.say(`${roleLabel(roles[st.i])}, open your eyes.`);
        if (!off) setSt({ k: 'unlock', i: st.i });
      } else if (st.k === 'sleep') {
        await Narrator.say(`${roleLabel(roles[st.i])}, close your eyes.`);
        if (off) return;
        setSt({ k: 'dark', i: st.i });
      } else if (st.k === 'dark') {
        await wait(2600);
        if (!off) setSt(after(st.i));
      } else if (st.k === 'dawnSay') {
        const r = resolveNightPP(players, ch.current, night);
        await Narrator.say('Everyone, open your eyes. Morning has broken.');
        if (off) return;
        rollBg('day');
        setRes(r); setSpoken(true); setSt({ k: 'dawn' });
      } else if (st.k === 'dawn') {
        // the casualty screen is silent: players can read it themselves
      }
    })();
    return () => { off = true; };
  }, [st]);

  const actorOf = (role) => (role === 'infected' ? players.find((p) => p.alive && p.justTurned) : role === 'cured' ? players.find((p) => p.alive && p.justCured) : (players.find((p) => p.alive && !p.sedatedTag && p.role === (role === 'seerResult' ? 'seer' : role)) || players.find((p) => p.alive && p.role === (role === 'seerResult' ? 'seer' : role))));
  let body = null, dawn = false, shake = false, flash = false;
  if (st.k === 'title') body = <><LockView key="t" title={`Night ${nightWord(night)} Begins...`} sub="The village falls silent." />{bloodMoon && <BloodMoonBanner className="mb-6" />}</>;
  else if (st.k === 'close') body = <><LockView key="c" eye title="Close Your Eyes" sub="Keep them closed until the narrator says otherwise." count={count} />{bloodMoon && <BloodMoonBanner className="mb-6" />}</>;
  else if (st.k === 'call') body = <LockView key={'call' + st.i} title="Eyes closed" sub="Listen to the narrator." />;
  else if (st.k === 'unlock') {
    body = (
      <div className="flex flex-1 flex-col items-center justify-center gap-6 text-center">
        <LockView key={'u' + st.i} title={roleLabel(roles[st.i])} sub="Only this role may look. Everyone else, eyes closed." />
        <Btn className="max-w-xs" onClick={() => setSt({ k: 'act', i: st.i })}>Tap to Unlock Secretly</Btn>
      </div>
    );
  } else if (st.k === 'act') {
    const role = roles[st.i];
    body = <NightActPP key={'a' + st.i} role={role} players={players} actor={actorOf(role)} choices={ch.current} deferSeer={deferSeer} bloodMoon={bloodMoon}
      onDone={(c) => { Object.assign(ch.current, c); setSt({ k: 'sleep', i: st.i }); }} />;
  } else if (st.k === 'sleep' || st.k === 'dark') body = <LockView key={'s' + st.i} title="Keep your eyes closed..." sub="The night is not over." />;
  else if (st.k === 'dawnSay') { body = <LockView key="ds" fadeMoon title="Morning has broken" />; dawn = true; shake = true; flash = true; }
  else if (st.k === 'dawn' && res) {
    dawn = true;
    body = (
      <div className="flex flex-1 flex-col items-center justify-center gap-5 py-6 text-center">
        <p className="cap-in text-[11px] font-bold uppercase tracking-[0.3em] text-amber-300">Morning of day {night}</p>
        {res.lines.map((t, i) => <p key={i} className="font-display cap-in text-2xl font-bold leading-snug text-slate-50" style={{ animationDelay: `${0.2 + i * 1.1}s` }}>{t}</p>)}
        {res.dead.length > 0 && reveal && (
          <div className="flex flex-wrap items-start justify-center gap-4">
            {res.dead.map((id) => { const p = players.find((x) => x.id === id); return <NightCard key={id} player={p} line={`${p.name} was the ${ROLES_DATA[p.role].name}`} />; })}
          </div>
        )}
        <Btn className="mt-2 max-w-xs" disabled={!spoken} onClick={() => onFinish(res)}>{spoken ? 'Continue to the Day' : 'The narrator speaks...'}</Btn>
      </div>
    );
  }
  return (
    <NightStage dawn={dawn} day={st.k === 'dawn'} shake={shake} flash={flash} blood={bloodMoon} soundOffset onExit={() => setConfirmExit(true)}>
      {body}
      {confirmExit && (
        <ConfirmExit confirmLabel="Leave night" body="The night's choices so far are discarded. You can start the night again from the Grimoire."
          onCancel={() => setConfirmExit(false)} onConfirm={() => { Narrator.stop(); onExit(); }} />
      )}
    </NightStage>
  );
}

      {!Narrator.ok() && <p className="mt-2 text-xs text-amber-300">Spoken narration is not available on this device. The screens still guide each role, with timed pauses.</p>}

const ShotBadge = () => <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-sky-100" style={{ background: 'rgba(37,99,235,0.45)', border: '1px solid rgba(96,165,250,0.75)' }}>NO VOTE</span>;

}

function DayTrial({ players, setPlayers, night, info, onNight, onAgain, onHome }) {
  const reveal = useSettings().revealDead;
  const [phase, setPhase] = useState('talk'); // talk | vote (group) | ballots (secret, with a Mayor) | result
  const [pick, setPick] = useState(null);
  const [bi, setBi] = useState(0);
  const [hold, setHold] = useState(true);
  const [ballots, setBallots] = useState({});
  const [cands, setCands] = useState(null);
  const [roles, setRoles] = useState(false);
  const [res, setRes] = useState(null);
  const [out, setOut] = useState(null);
  const [hunter, setHunter] = useState(null);
  const [shot, setShot] = useState(null);
  const [broken, setBroken] = useState([]);
  const alive = players.filter((p) => p.alive);
  const voters = alive.filter((p) => !p.silencedTag && !p.stoneTag && !p.shotTag);
  const silenced = alive.filter((p) => p.silencedTag);
  const stoneds = alive.filter((p) => p.stoneTag);
  const targets = alive; // a stoned player cannot vote, but can still be voted out
  const wolves = alive.filter((p) => p.role === 'werewolf').length; // the Shadow Figure loses with the last Werewolf
  const evil = alive.filter((p) => ROLES_DATA[p.role].team === 'werewolf').length;
  const village = alive.length - evil;
  const sideItems = players.map((p) => ({ role: p.role, alive: p.alive, side: pdSide(p.pdCures, p.pdInfects, p.pdLast) }));
  const tw = threeWay(sideItems);
  const hadZ = players.some((p) => p.role === 'zombie' || p.role === 'infector');
  const over = loversFaction(players) ? { ...LOVERS_WIN, kind: 'lovers' } : tw ? { text: winText(tw, hadZ) + plagueLine(sideItems, tw), color: WIN_UI[tw].color, kind: tw } : null;
  const sung = useRef('');
  useEffect(() => { if (over && sung.current !== over.kind) { sung.current = over.kind; Sfx.win(over.kind); } if (!over) sung.current = ''; }, [over && over.kind]);
  // Eliminates players; a Lover's partner dies of heartbreak with them. Returns the heartbroken players.
  const kill = (ids) => {
    const all = [...ids], hb = [];
    ids.forEach((id) => { const me = players.find((x) => x.id === id); const q = me && hasV(me.lover) ? players.find((x) => x.id === me.lover) : null; if (q && q.alive && !all.includes(q.id)) { all.push(q.id); hb.push(q); } });
    setPlayers(players.map((p) => (all.includes(p.id) ? { ...p, alive: false, protectedTag: false, silencedTag: false, stoneTag: false } : p)));
    return hb;
  };
  const opts = (list) => list.map((p) => ({ id: p.id, n: p.name }));
  const nm = (id) => (players.find((p) => p.id === id) || {}).name || '?';
  const mayorAlive = alive.some((p) => p.role === 'mayor' && !p.stoneTag);
  const voter = phase === 'ballots' ? voters[bi] : null;
  const tallyUp = (all) => {
    const tally = {};
    voters.forEach((v) => { const t = all[v.id]; if (t !== null && t !== undefined) tally[t] = (tally[t] || 0) + (v.role === 'mayor' ? 2 : 1); });
    const ranked = Object.keys(tally).map(Number).sort((x, y) => tally[y] - tally[x]);
    const top = ranked.length ? ranked[0] : null;
    const tie = ranked.length > 1 && tally[ranked[1]] === tally[top];
    setRes({ tally, ranked, top, tie, skipped: ranked.length === 0, tied: tie ? ranked.filter((id) => tally[id] === tally[top]) : [] });
    if (top !== null && !tie) { const p = players.find((x) => x.id === top); const hb = kill([top]); setOut(p); setBroken(hb); const hh = [p, ...hb].find((x) => x.role === 'hunter'); if (hh) setHunter(hh); }
    setPhase('result');
  };
  const cast = () => {
    const all = { ...ballots, [voter.id]: pick === 'skip' ? null : pick };
    setBallots(all); setPick(null);
    if (bi + 1 < voters.length) { setBi(bi + 1); setHold(true); } else tallyUp(all);
  };
  const startVote = (tiedIds) => {
    setPick(null); setOut(null); setRes(null); setBroken([]);
    if (mayorAlive) {
      setCands(Array.isArray(tiedIds) ? tiedIds : null); setBallots({}); setBi(0); setHold(true);
      if (voters.length === 0) { setRes({ tally: {}, ranked: [], top: null, tie: false, skipped: true }); setPhase('result'); } else setPhase('ballots');
    } else setPhase('vote');
  };
  const eliminate = () => {
    const p = players.find((x) => x.id === pick); if (!p) return;
    const hb = kill([p.id]); setOut(p); setBroken(hb); setRes({ tally: {}, ranked: [], top: p.id, tie: false, skipped: false });
    const hh = [p, ...hb].find((x) => x.role === 'hunter'); if (hh) setHunter(hh);
    setPhase('result');
  };
  const skipVote = () => { setOut(null); setRes({ tally: {}, ranked: [], top: null, tie: false, skipped: true }); setPhase('result'); };
  const fire = () => { const t = players.find((x) => x.id === shot); if (!t) return; const hb = kill([t.id]); setOut(t); setBroken(hb); setHunter(null); setShot(null); };

  return (
    <DayStage>
      <header className="pb-3">
        <p className="text-[11px] font-bold uppercase tracking-[0.28em] text-amber-300">Day {night}</p>
        <h1 className="font-display text-3xl font-bold tracking-wide text-slate-50">{phase === 'vote' || phase === 'ballots' ? 'The Vote' : 'The Village Wakes'}</h1>
      </header>
      {phase === 'talk' && (
        <>
          {info && (
            <Panel className="text-center" style={{ border: '1px solid rgba(251,191,36,0.4)', background: 'rgba(21,26,36,0.82)' }}>
              {info.lines.map((t, i) => <p key={i} className="font-display text-lg font-bold leading-snug text-slate-50">{t}</p>)}
              {reveal && info.dead.length > 0 && <p className="mt-2 text-sm text-slate-300">{info.dead.map((id) => `${nm(id)}: ${ROLES_DATA[players.find((x) => x.id === id).role].name}`).join(' · ')}</p>}
            </Panel>
          )}
          {silenced.length > 0 && (
            <p role="alert" className="mt-3 rounded-xl px-4 py-2.5 text-center text-sm font-semibold text-violet-100" style={{ background: 'rgba(109,40,217,0.3)', border: '1px solid rgba(167,139,250,0.6)' }}>
              {silenced.map((p) => p.name).join(', ')} {silenced.length > 1 ? 'have' : 'has'} been silenced by the Spellcaster and cannot speak or vote today.
            </p>
          )}
          {stoneds.length > 0 && (
            <p role="alert" className="mt-3 rounded-xl px-4 py-2.5 text-center text-sm font-semibold text-teal-100" style={{ background: 'rgba(45,212,191,0.16)', border: '1px solid rgba(45,212,191,0.6)' }}>
              {stoneds.map((p) => p.name).join(', ')} {stoneds.length > 1 ? 'have' : 'has'} been turned to stone by Medusa until dusk. They cannot speak or vote today.
            </p>
          )}
          {over && <p role="status" className="mt-3 rounded-xl px-4 py-3 text-center text-sm font-bold" style={{ color: over.color, background: 'rgba(10,10,18,0.8)', border: `1px solid ${over.color}66` }}>{over.text}</p>}
          <div className="mt-3"><DayTimer disabled={!!over} onEnd={over ? undefined : () => startVote()} /></div>
          <Panel className="mt-3" style={{ background: 'rgba(21,26,36,0.82)' }}>
            <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Players still alive</h2>
            <ul className="flex flex-col gap-1.5">
              {alive.map((p) => <li key={p.id} className="flex items-center justify-between gap-2 text-[15px] font-semibold text-slate-100"><span>{p.name}</span><span className="flex gap-1.5">{p.silencedTag && <SilencedBadge />}{p.stoneTag && <StonedBadge />}{p.shotTag && <ShotBadge />}</span></li>)}
            </ul>
          </Panel>
        </>
      )}
      {phase === 'ballots' && voter && (
        <div className="flex flex-1 flex-col">
          <p className="text-center text-xs tabular-nums text-slate-300">Ballot {bi + 1} of {voters.length}{silenced.length > 0 ? ` · ${silenced.map((p) => p.name).join(', ')} silenced, skipped` : ''}{stoneds.length > 0 ? ` · ${stoneds.map((p) => p.name).join(', ')} stoned, skipped` : ''}</p>
          {hold ? (
            <div className="flex flex-1 flex-col items-center justify-center gap-6 text-center">
              <ShieldIcon width="64" height="64" className="text-slate-200" />
              <p className="font-display text-2xl font-bold text-slate-50">Pass the phone to {voter.name} &mdash; Eyes only!</p>
              <p className="max-w-xs text-sm text-slate-300">Everyone else look away while {voter.name} votes.</p>
              <Btn className="max-w-xs" onClick={() => setHold(false)}>I&rsquo;m {voter.name}. Show my ballot</Btn>
            </div>
          ) : (
            <div className="mt-4 flex flex-1 flex-col">
              {voter.role === 'mayor' && <MayorNote className="mb-3" />}
              <h2 className="font-display mb-3 text-center text-xl font-bold text-slate-50">{voter.name}, who do you vote to eliminate?</h2>
              <PickList players={opts((cands ? targets.filter((p) => cands.includes(p.id)) : targets).filter((p) => p.id !== voter.id))} value={pick === null ? '' : pick} onChange={(v) => setPick(v === '' ? null : v)} />
              <Btn className="mt-3" variant="secondary" onClick={() => setPick('skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip (no vote)'}</Btn>
              <Btn className="mt-3" disabled={pick === null} onClick={cast}>{pick === null ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Vote: Skip' : `Confirm Vote: ${nm(pick)}`}</Btn>
            </div>
          )}
        </div>
      )}
      {phase === 'vote' && (
        <div className="flex flex-1 flex-col">
          <p className="rounded-xl px-4 py-3 text-center text-sm leading-relaxed text-slate-100" style={{ background: 'rgba(21,26,36,0.85)', border: '1px solid rgba(251,191,36,0.4)' }}>
            Discuss and vote out loud together. Select the player with the most votes, or tap Skip Vote if the vote is tied.
          </p>
          <ul className="mt-3 flex flex-col gap-2" role="listbox" aria-label="Players still alive">
            {targets.map((p) => {
              const sel = pick === p.id;
              return (
                <li key={p.id}>
                  <button role="option" aria-selected={sel} onClick={() => setPick(sel ? null : p.id)}
                    className="flex min-h-[52px] w-full items-center justify-between gap-2 rounded-xl px-4 text-left text-[15px] font-semibold text-slate-50 transition active:scale-[0.99]"
                    style={{ background: sel ? 'rgba(109,40,217,0.45)' : 'rgba(21,26,36,0.85)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none' }}>
                    <span>{p.name}</span>
                    <span className="flex items-center gap-2">{p.silencedTag && <SilencedBadge />}{sel && <span aria-hidden="true" className="text-lg">✓</span>}</span>
                  </button>
                </li>
              );
            })}
          </ul>
          <Btn className="mt-4" disabled={pick === null} onClick={eliminate}>{pick === null ? 'Select a player' : `Confirm Elimination: ${nm(pick)}`}</Btn>
          <Btn className="mt-2.5" variant="secondary" onClick={skipVote}>Skip Vote (Tie / No Elimination)</Btn>
        </div>
      )}
      {phase === 'result' && res && (
        <>
          <Panel className="text-center" style={{ border: '1px solid rgba(251,191,36,0.4)', background: 'rgba(21,26,36,0.85)' }}>
            <p className="font-display text-xl font-bold text-slate-50">{out ? `${out.name} was voted out by the village.` : res.tie ? 'The vote is tied. No one is eliminated yet.' : 'The vote was skipped. No one is eliminated.'}</p>
            {false && <ul className="mt-3 flex flex-col gap-1 text-sm text-slate-200">{res.ranked.map((id) => <li key={id} className="flex justify-between"><span>{nm(id)}</span><span className="tabular-nums text-slate-400">{res.tally[id]}</span></li>)}</ul>}
            {out && reveal && <div className="mt-3"><NightCard player={out} line={`${out.name} was the ${ROLES_DATA[out.role].name}`} /></div>}
            {out && broken.map((b) => <p key={b.id} className="font-display mt-3 text-lg font-bold text-pink-300">{`${b.name} died of heartbreak.`}</p>)}
          </Panel>
          {over && <p role="status" className="mt-3 rounded-xl px-4 py-3 text-center text-sm font-bold" style={{ color: over.color, background: 'rgba(10,10,18,0.8)', border: `1px solid ${over.color}66` }}>{over.text}</p>}
          {hunter && (
            <Panel className="mt-3" style={{ border: '1px solid rgba(245,158,11,0.6)', background: 'rgba(21,26,36,0.85)' }}>
              <h3 className="font-display text-lg font-bold text-amber-300">{hunter.name}, take your last shot</h3>
              <p className="mb-3 mt-1 text-xs text-slate-300">The Hunter chooses one player to take down.</p>
              <PickList players={opts(players.filter((p) => p.alive))} value={shot === null ? '' : shot} onChange={(v) => setShot(v === '' ? null : v)} />
              <Btn className="mt-3" disabled={shot === null} onClick={fire}>Fire</Btn>
            </Panel>
          )}
        </>
      )}
      {roles && (
        <Panel className="mt-3" style={{ background: 'rgba(21,26,36,0.88)' }}>
          <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Every role</h2>
          <ul className="flex flex-col gap-2">
            {players.map((p) => { const r = ROLES_DATA[p.role]; return (
              <li key={p.id} className="flex items-center gap-3 rounded-lg p-2" style={{ background: r.color + '14', border: `1px solid ${r.color}55` }}>
                <RoleEmblem role={p.role} size={24} />
                <span className={`min-w-0 flex-1 truncate text-[15px] font-semibold ${p.alive ? '' : 'line-through'}`}>{p.name}</span>
                <span className="font-display text-sm font-bold" style={{ color: r.color }}>{r.name}</span>
              </li>
            ); })}
          </ul>
        </Panel>
      )}
      <div className="mt-auto flex flex-col gap-2.5 pt-6">
        {phase === 'talk' && !over && <Btn onClick={startVote}>Start Voting</Btn>}
        {over && phase !== 'vote' && <>
          <Btn variant="secondary" disabled={!!hunter} onClick={() => setRoles(!roles)}>{roles ? 'Hide All Roles' : 'Reveal All Roles'}</Btn>
          <Btn disabled={!!hunter} onClick={onAgain}>Play Again</Btn>
          <Btn variant="ghost" disabled={!!hunter} onClick={onHome}>Home</Btn>
        </>}
        {!over && phase === 'result' && res && res.tie && <Btn variant="secondary" onClick={() => startVote(res.tied)}>Revote (tied players)</Btn>}
        {!over && phase === 'result' && res && res.tie && <Btn variant="ghost" onClick={() => setRes({ ...res, tie: false, skipped: true })}>Skip (no elimination)</Btn>}
        {!over && phase === 'result' && !(res && res.tie) && <Btn disabled={!!hunter} onClick={onNight}>Start Night {night + 1}</Btn>}
      </div>
    </DayStage>
  );
}

// Human-moderator tool: record which two players Cupid bound.
function LoversPanel({ players, onBind }) {
  const [a, setA] = useState('');
  const [b, setB] = useState('');
  const cur = players.find((p) => hasV(p.lover));
  const curB = cur ? players.find((p) => p.id === cur.lover) : null;
  const sel = (v, set, label) => (
    <select aria-label={label} value={v} onChange={(e) => set(e.target.value === '' ? '' : Number(e.target.value))} className="min-h-[44px] flex-1 rounded-lg px-2 text-sm text-slate-100" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>
      <option value="">{label}</option>
      {players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
    </select>
  );
  return (
    <section className="mt-5 rounded-2xl p-4" style={{ background: 'var(--card)', border: '1px solid rgba(244,114,182,0.4)' }}>
      <h2 className="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-pink-300"><HeartIcon width="14" height="14" />Cupid&rsquo;s Lovers</h2>
      {cur && curB && <p className="mt-2 text-sm text-slate-200">{cur.name} &hearts; {curB.name}. If one dies, the other dies of heartbreak.</p>}
      <div className="mt-3 flex gap-2">{sel(a, setA, 'First Lover')}{sel(b, setB, 'Second Lover')}</div>
      <Btn className="mt-3" variant="secondary" disabled={a === '' || b === '' || a === b} onClick={() => { onBind(a, b); setA(''); setB(''); }}>{cur ? 'Change Lovers' : 'Bind Lovers'}</Btn>
    </section>
  );
}

function Moderator({ players, setPlayers, narrator, autoNight, onAgain, onNew, onHome }) {
  const [peek, setPeek] = useState(false); // Grimoire overlay during a running night or day
  const [warn, setWarn] = useState(false);
  const [mode, setMode] = useState(autoNight ? 'night' : 'grimoire'); // grimoire | night | day
  const [night, setNight] = useState(() => players.reduce((m, p) => Math.max(m, p.nn || 0), 0) + 1);
  const [info, setInfo] = useState(null);
  // Dusk: tags wear off, and anyone bitten the night before turns into a Zombie (nn = the night that is about to start).
  const clearSilence = (nn) => {
    const conv = (p) => !!nn && p.alive && ((p.bitten && !p.incub && p.bitten < nn) || p.incub === 1); // slow bites count down 2 -> 1 -> turn
    const tick = (p) => !!nn && p.alive && p.incub === 2;
    if (players.some((p) => p.silencedTag || p.stoneTag || p.shotTag || conv(p) || tick(p))) setPlayers(players.map((p) => ({ ...p, silencedTag: false, stoneTag: false, shotTag: false, ...(conv(p) ? { role: 'zombie', former: p.role, bitten: 0, incub: 0, justTurned: true } : tick(p) ? { incub: 1 } : {}) })));
  };
  useEffect(() => { if (autoNight) clearSilence(); }, []);
  const [checked, setChecked] = useState({});
  const [confirmExit, setConfirmExit] = useState(false);
  const [confirm, setConfirm] = useState(null); // 'again' | 'new' | null

  useEffect(() => {
    if (!confirm) return;
    const t = setTimeout(() => setConfirm(null), 3500);
    return () => clearTimeout(t);
  }, [confirm]);

  const update = (id, patch) => setPlayers(players.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  // Eliminating a Lover also eliminates their partner (heartbreak).
  const toggleAlive = (p) => {
    if (!p.alive) return update(p.id, { alive: true });
    const partner = hasV(p.lover) ? players.find((x) => x.id === p.lover && x.alive) : null;
    setPlayers(players.map((x) => (x.id === p.id || (partner && x.id === partner.id) ? { ...x, alive: false, protectedTag: false, silencedTag: false, stoneTag: false } : x)));
  };
  const bind = (a, b) => setPlayers(players.map((x) => (x.id === a ? { ...x, lover: b } : x.id === b ? { ...x, lover: a } : { ...x, lover: null })));

  const wolvesAlive = players.filter((p) => p.alive && p.role === 'werewolf').length;
  const evilAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'werewolf').length;
  const villageAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'village').length;

  const nightRoles = useMemo(() => {
    const present = ROLE_IDS.filter((id) => ROLES_DATA[id].nightOrder && players.some((p) => p.role === id));
    return present.sort((a, b) => ROLES_DATA[a].nightOrder - ROLES_DATA[b].nightOrder);
  }, [players]);
  const hasHunter = players.some((p) => p.role === 'hunter');

  let status = null;
  if (loversFaction(players)) status = { text: 'The Lovers win! Only the bound pair is left.', color: '#F472B6' };
  else {
    const tw3 = threeWay(players.map((p) => ({ role: p.role, alive: p.alive, side: pdSide(p.pdCures, p.pdInfects, p.pdLast) })));
    if (tw3 === 'village') status = { text: 'No Werewolves left. The Village wins.', color: '#34D399' };
    else if (tw3 === 'werewolf') status = { text: 'Werewolves match or outnumber the Village.', color: '#F87171' };
    else if (tw3 === 'zombie') status = { text: 'The Zombie horde holds the majority. The Zombies win.', color: '#2DD4BF' };
  }

  const body = (mode === 'night') ? (
    <NightLoopPP key={night} players={players} night={night}
      onExit={() => setMode('grimoire')}
      onFinish={(r) => { setPlayers(r.next); setInfo(r); setMode('day'); }} />
  ) : (mode === 'day') ? (
    <DayTrial players={players} setPlayers={setPlayers} night={night} info={info}
      onAgain={onAgain} onHome={() => { setPeek(false); onHome(); }}
      onNight={() => { clearSilence(night + 1); setNight(night + 1); setInfo(null); setMode('night'); }} />
  ) : null;
  if (body) {
    return (
      <>
        {body}
        <button onClick={() => setWarn(true)} aria-label="Open Grimoire"
          className="fixed right-3 z-[45] flex h-10 w-10 items-center justify-center rounded-full text-slate-300/80 hover:text-slate-100"
          style={{ top: 'max(14px, env(safe-area-inset-top))', background: 'rgba(10,10,18,0.55)', border: '1px solid rgba(203,213,225,0.25)' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z" /><path d="M4 21.5A2.5 2.5 0 0 0 6.5 24" opacity="0" /><circle cx="11.5" cy="10.5" r="2.2" /><path d="M7.5 10.5c1.2-2 2.7-3 4-3s2.8 1 4 3c-1.2 2-2.7 3-4 3s-2.8-1-4-3z" /></svg>
        </button>
        {warn && ReactDOM.createPortal(
          <div className="fixed inset-0 z-[60] flex items-end justify-center sm:items-center" role="alertdialog" aria-modal="true" aria-label="Spoiler Warning">
            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setWarn(false)} />
            <div className="screen-in relative w-full max-w-md rounded-t-3xl p-6 text-center sm:rounded-3xl"
              style={{ background: 'var(--card)', border: '1px solid var(--line)', paddingBottom: 'max(24px, env(safe-area-inset-bottom))' }}>
              <h2 className="font-display text-2xl font-bold text-amber-300">Spoiler Warning</h2>
              <p className="mt-3 text-sm leading-relaxed text-slate-300">Opening the Grimoire reveals every player&rsquo;s secret role.{narrator ? ' The Narrator is running the game, so you may not need it.' : ''}</p>
              <div className="mt-6 flex flex-col gap-3">
                <Btn variant="secondary" onClick={() => setWarn(false)}>Cancel</Btn>
                <HoldButton aria="Press and hold for one and a half seconds to open the Grimoire" onComplete={() => { setWarn(false); setPeek(true); }}>Press &amp; Hold to View</HoldButton>
              </div>
            </div>
          </div>, document.body)}
        {peek && (
          <div className="fixed inset-0 z-[55] overflow-y-auto" style={{ background: 'var(--bg)' }}>
            {GrimoireView()}
          </div>
        )}
      </>
    );
  }
  return GrimoireView();

//  ph: lobby | reveal | night | day | over     k: night number     lk: 1 while the host picks cards

//  an: { k, l:{0:'text'}, sv, si, x:{ts:'text'} }   morning announcement
//  pl[pid]: { n name, o join order, r roleId, a alive 1/0, d ready 1/0, t night target pid, nd night action done,
//             ws witch save this night, wsu / wpu potion used, lp bodyguard (or Medusa) last target, hs hunter shot used, s silenced, x stoned until dusk, sa Shadow Figure's chosen action, lv Lovers partner pid, t2 Cupid's second pick, la Lover has seen their partner, rd Seer saw the final vision, lf left }
const SESSION_KEY = 'nightfall.mp.v1';

function normalizeDbUrl(u) {

  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  return s.replace(/\/+$/, '').replace(/\.json$/i, '').replace(/\/+$/, '');

// Local stand-in for Firebase, used when the browser blocks the network (for example the Claude preview sandbox).
// It keeps the same path / PATCH / null-deletes rules, and lives in localStorage so tabs on one device can talk.
const LOCAL_KEY = 'nightfall.mp.local.v1';
let memDb = {};
const localRead = () => { try { const v = localStorage.getItem(LOCAL_KEY); if (v !== null) return JSON.parse(v) || {}; } catch (e) { /* fall back to memory */ } return memDb; };
const localWrite = (db) => { memDb = db; try { localStorage.setItem(LOCAL_KEY, JSON.stringify(db)); } catch (e) { /* memory only */ } };
const localPrune = (o) => {
  if (o && typeof o === 'object') {
    Object.keys(o).forEach((k) => { o[k] = localPrune(o[k]); if (o[k] === null || o[k] === undefined) delete o[k]; });
    if (!Object.keys(o).length) return null;
  }
  return o;
};
function localReq(method, path, body) {
  const parts = path.split('/').filter(Boolean);
  const db = localRead();
  const setAt = (ps, val) => {
    let n = db;
    ps.slice(0, -1).forEach((x) => { if (n[x] == null || typeof n[x] !== 'object') n[x] = {}; n = n[x]; });
    if (val === undefined) delete n[ps[ps.length - 1]]; else n[ps[ps.length - 1]] = val;
  };
  if (method === 'GET') {
    let n = db;
    for (const x of parts) { if (n == null || typeof n !== 'object') return null; n = n[x]; }
    return n === undefined ? null : JSON.parse(JSON.stringify(n));
  }
  const clone = (v) => (v === null || v === undefined ? undefined : localPrune(JSON.parse(JSON.stringify(v))));
  if (method === 'PUT') setAt(parts, clone(body));
  else if (method === 'PATCH') Object.keys(body).forEach((k) => setAt(parts.concat(k.split('/').filter(Boolean)), clone(body[k])));
  else if (method === 'DELETE') setAt(parts, undefined);
  localPrune(db);
  localWrite(db);
  return method === 'DELETE' ? null : body;
}

const Mp = {
  local: false,
  async req(method, path, body) {
    if (Mp.local) return localReq(method, path, body);
    const base = getDbUrl();
    if (!base) throw new Error('no-url');
    // No custom headers: a plain request avoids a CORS preflight and Firebase reads the JSON body anyway.
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 10000) : 0;
    let res;
    try { res = await fetch(`${base}/${path}.json`, { method, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store', signal: ctl ? ctl.signal : undefined }); }
    catch (e) { throw new Error('network'); } // Failed to fetch / Load failed / blocked by the page's CSP
    finally { clearTimeout(timer); }

    return res.status === 204 ? null : res.json();

  get: (p) => Mp.req('GET', p),
  put: (p, b) => Mp.req('PUT', p, b),
  patch: (p, b) => Mp.req('PATCH', p, b),
  del: (p) => Mp.req('DELETE', p)

function mpErrorText(e) {
  const m = e && e.message;
  if (m === 'no-url') return 'No multiplayer server is set up yet.';
  if (m === 'denied') return 'The database refused access. In Firebase, set the Realtime Database rules to allow read and write.';
  if (/^http-/.test(m || '')) return `The server answered with an error (${m.slice(5)}). Check the database URL in Settings.`;
  return 'Could not reach the server. Check your connection and the database URL in Settings.';
}

const randId = () => 'p' + Math.random().toString(36).slice(2, 8);
const randLetters = () => Array.from({ length: 4 }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');
const cleanCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

// Try the real server first; if the browser blocks the network, redo the same step against the local stand-in.
async function mpWithFallback(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.message === 'network' && !Mp.local) { Mp.local = true; return fn(); }
    throw e;
  }
}
const mpCreateRoom = (name, hostPlays, roomName, isPublic, cfg) => mpWithFallback(() => mpCreateRoomImpl(name, hostPlays, roomName, isPublic, cfg));
const mpJoinRoom = (codeIn, name) => mpWithFallback(() => mpJoinRoomImpl(codeIn, name));

async function mpCreateRoomImpl(name, hostPlays, roomName, isPublic, cfg) {
  const pid = randId();
  let code = '';
  const words = shuffle(CODE_WORDS);
  for (let i = 0; i < 12; i++) {
    const c = i < words.length ? words[i] : randLetters();
    const existing = await Mp.get(`rooms/${c}`);
    if (!existing) { code = c; break; }
  }
  if (!code) throw new Error('no-code');
  const room = { v: 1, host: pid, hp: hostPlays ? 1 : 0, rn: (roomName || '').trim() || 'Nightfall Village', hn: hostPlays ? name : 'Moderator', md: getGameMode(), ph: 'lobby', k: 0, lk: 0, w: '', ts: Date.now(), pub: isPublic ? 1 : 0, st: 'waiting' };
  if (cfg && cfg.mx) { room.mx = cfg.mx; room.dk = cfg.dk; } // the deck is built first: mx = exact player count, dk = the locked deck // pub: listed publicly; st: waiting | in_game | closed
  if (hostPlays) room.pl = { [pid]: { n: name, o: 1, a: 1, d: 0 } };
  await Mp.put(`rooms/${code}`, room);
  if (isPublic) { try { await Mp.put(`publicRooms/${code}`, { rn: room.rn, hn: room.hn, ts: room.ts }); } catch (e) { /* the room still works with its code */ } } // small index so the public list needs one read
  return { code, pid, host: true, local: Mp.local };
}

async function mpJoinRoomImpl(codeIn, name) {
  const code = cleanCode(codeIn);
  if (code.length !== 4) throw new Error('bad-code');
  const room = await Mp.get(`rooms/${code}`);
  if (!room) throw new Error('not-found');
  if (room.ph !== 'lobby') throw new Error('started');
  if (room.lk) throw new Error('locked');
  const pl = roomPlayers(room);
  if (pl.length >= (room.mx || MP_MAX)) throw new Error('full');
  if (pl.some((p) => p.n.toLowerCase() === name.toLowerCase())) throw new Error('name-taken');
  const pid = randId();
  const o = pl.reduce((m, p) => Math.max(m, p.o || 0), 0) + 1;
  await Mp.patch(`rooms/${code}/pl/${pid}`, { n: name, o, a: 1, d: 0 });
  return { code, pid, host: false, local: Mp.local };
}
function mpJoinErrorText(e) {
  const m = e && e.message;
  return ({
    'bad-code': 'Enter the 4-letter room code.',
    'not-found': 'No room with that code. Check the letters and try again.',
    started: 'That game has already started.',
    locked: 'The host is choosing cards, so the room is closed to new players.',
    full: 'That room is full.',
    'name-taken': 'Someone in that room already uses this name. Add an initial.'

    spellcaster: pick('spellcaster'), sniper: pick('sniper'), doctor: pick('doctor'), zombie: pick('zombie'), infector: pick('infector'),
    plaguedoctor: pick('plaguedoctor'),
    plagueAct: (() => { const q = alive.find((x) => x.r === 'plaguedoctor' && x.t && byId[x.t]); return q ? (q.ws === 1 ? 'cure' : q.ws === 2 ? 'infect' : null) : null; })(), // ws: 1 cure, 2 infect, 0 leave alone
    sniperShot: alive.some((x) => x.r === 'sniper' && x.t && byId[x.t] && x.ws === 1)
  };
}
function mpShadowRedirect(ps) {
  const sh = ps.find((p) => p.a === 1 && p.r === 'shadow');
  if (!sh || sh.nd !== 1 || !sh.sa || !sh.t) return null;
  return ps.some((p) => p.id === sh.t && p.a === 1) ? { key: sh.sa, to: sh.t } : null;
}
// What this Seer finally learns: { target, stoned } once any Shadow Figure redirect is applied.
function mpSeerView(ps, seerId) {
  const sh = ps.find((p) => p.a === 1 && p.r === 'shadow');
  return seerVision(mpChoices(ps), mpShadowRedirect(ps), sh ? sh.id : null, seerId, ps.map((p) => ({ id: p.id, role: p.r, alive: p.a === 1 })));
}

// Works out the night from everyone's secret choices and returns the patch that opens the day.
function mpResolveNight(room) {
  const ps = roomPlayers(room);
  const byId = Object.fromEntries(ps.map((p) => [p.id, p]));
  const alive = ps.filter((p) => p.a === 1);
  const c0 = mpChoices(ps);
  const shadow = alive.find((p) => p.r === 'shadow');
  const c = applyShadow(c0, mpShadowRedirect(ps), shadow ? shadow.id : null); // the Shadow Figure's swap comes first
  // Medusa's gaze lands next: whoever she stones loses their action for the night.
  const stoneId = c.medusa && byId[c.medusa] && byId[c.medusa].a === 1 ? c.medusa : '';
  const stoneRole = stoneId ? byId[stoneId].r : '';
  const blocked = (role) => stoneRole === role && !ps.some((p) => p.a === 1 && p.r === role && p.id !== stoneId);
  const victim = blocked('werewolf') ? '' : (c.werewolf || '');
  const victim2 = blocked('werewolf') || c.werewolf2 === victim ? '' : (c.werewolf2 || '');
  const bgs = alive.filter((p) => p.r === 'bodyguard' && p.t && byId[p.t]);
  const guarded = c.bodyguard && !blocked('bodyguard') ? c.bodyguard : '';
  const witches = alive.filter((p) => p.r === 'witch');
  const witchSaves = !!(c.witchSave && !blocked('witch') && victim);
  const saveTarget = witchSaves ? (c.witchSaveTo || victim) : '';
  const poison = c.witchPoison && !blocked('witch') ? c.witchPoison : '';
  const silenced = c.spellcaster && !blocked('spellcaster') ? c.spellcaster : '';

  const dead = [];
  let saved = false;
  [victim, victim2].forEach((v) => { if (!v) return; if (v === guarded || (saveTarget && v === saveTarget)) saved = true; else if (!dead.includes(v)) dead.push(v); }); // each hunt is blocked on its own
  if (poison && !dead.includes(poison)) dead.push(poison); // the Bodyguard blocks hunts and bites, never the Witch's poison
  // Sniper: a shot taken at an infected player (Zombie or incubating) eliminates them unless guarded or healed this night.
  const shotP = c.sniper && c.sniperShot && !blocked('sniper') ? byId[c.sniper] : null;
  const shotHit = shotP && shotP.a === 1 && shotP.r === 'zombie' && shotP.id !== guarded && !(saveTarget && shotP.id === saveTarget) ? shotP.id : '';
  if (shotHit && !dead.includes(shotHit)) dead.push(shotHit);
  // Lovers: a partner dies of heartbreak with them, even if the Bodyguard guarded that partner.
  const brokenIds = [];
  dead.slice().forEach((id) => { const pid = byId[id] && byId[id].lv; if (pid && byId[pid] && byId[pid].a === 1 && !dead.includes(pid)) { dead.push(pid); brokenIds.push(pid); } });
  // Doctor: cures a Zombie (back to the old role, or Villager if they began as a Zombie); anyone uninfected sleeps through the next night.
  const docT = c.doctor && !blocked('doctor') ? c.doctor : '';
  const docP = docT ? byId[docT] : null;
  const docLive = !!docP && docP.a === 1 && !dead.includes(docT);
  const docCure = docLive && (docP.r === 'zombie' || docP.r === 'infector' || !!docP.bt || !!docP.ic) ? docT : '';
  const sedateId = docLive && !docCure ? docT : '';
  // Plague Doctor: the serum matches the target's real status (a Shadow redirect can waste it). An infection is stopped by the Bodyguard or a Witch heal.
  const pdT = c.plaguedoctor && !blocked('plaguedoctor') ? c.plaguedoctor : '';
  const pdAct = pdT && (c.plagueAct === 'cure' || c.plagueAct === 'infect') ? c.plagueAct : '';
  const pdP = pdT ? byId[pdT] : null;
  const pdLive = !!pdP && pdP.a === 1 && !dead.includes(pdT);
  const pdIsInf = !!pdP && (pdP.r === 'zombie' || pdP.r === 'infector' || !!pdP.bt || !!pdP.ic);
  const pdCure = pdLive && pdAct === 'cure' && pdIsInf ? pdT : '';
  const pdInfect = pdLive && pdAct === 'infect' && !pdIsInf && !(pdP && (pdP.role === 'infector' || pdP.r === 'infector')) && pdT !== guarded && !(saveTarget && pdT === saveTarget) ? pdT : '';
  const cureId = docCure || pdCure;
  // Infected: one slow bite. The victim stays human for two more nights; the Plague Doctor is immune.
  const infT = c.infector && !blocked('infector') ? c.infector : '';
  const infP = infT ? byId[infT] : null;
  const infBite = !!infP && infP.a === 1 && !dead.includes(infT) && infT !== guarded && !(saveTarget && infT === saveTarget) && !['zombie', 'infector', 'plaguedoctor'].includes(infP.r) && !infP.bt ? infT : '';
  const hordeCured = !!cureId && byId[cureId].r === 'zombie' && !alive.some((p) => p.r === 'zombie' && p.id !== cureId);

  // Outbreak: the horde's single bite lands unless the target died, was guarded or was healed; the Sniper hits an active Zombie.
  const biteT = c.zombie && !blocked('zombie') && !hordeCured ? c.zombie : '';
  const biteP = biteT ? byId[biteT] : null;
  const bitten = biteP && biteP.a === 1 && !dead.includes(biteT) && biteT !== guarded && !(saveTarget && biteT === saveTarget) && biteP.r !== 'zombie' && biteP.r !== 'infector' ? biteT : '';
  const lines = dawnLines(saved, dead.filter((id) => !brokenIds.includes(id)).map((id) => byId[id].n), '', '', brokenIds.map((id) => byId[id].n), !!shotHit);
  const silencedAlive = silenced && !dead.includes(silenced) ? silenced : '';
  const stonedAlive = stoneId && !dead.includes(stoneId) ? stoneId : '';
  const an = { k: room.k || 0, t: Date.now(), l: Object.fromEntries(lines.map((t, i) => [i, t])), sv: saved ? 1 : 0, si: silencedAlive, st: stonedAlive };
  if (dead.length && getSettings().revealDead) an.rv = Object.fromEntries(dead.map((id) => [id, byId[id].r]));
  const patch = { ph: 'day', an, ns: null, nk: null, bd: nextBgIdx('day', room.bd) };
  ps.forEach((p) => { patch[`pl/${p.id}/s`] = silencedAlive && p.id === silencedAlive ? 1 : 0; patch[`pl/${p.id}/x`] = stonedAlive && p.id === stonedAlive ? 1 : 0; patch[`pl/${p.id}/sn`] = shotHit && p.id === shotHit ? 1 : 0; });
  if (infBite) { patch[`pl/${infBite}/bt`] = room.k || 1; patch[`pl/${infBite}/ic`] = 2; }
  if (bitten) { patch[`pl/${bitten}/bt`] = room.k || 1; patch[`pl/${bitten}/ic`] = 0; }
  if (pdInfect) { patch[`pl/${pdInfect}/bt`] = room.k || 1; patch[`pl/${pdInfect}/ic`] = 0; }
  if (pdAct) alive.filter((p) => p.r === 'plaguedoctor').forEach((d) => { if (pdAct === 'cure') patch[`pl/${d.id}/pdc`] = (d.pdc || 0) + 1; else patch[`pl/${d.id}/pdi`] = (d.pdi || 0) + 1; patch[`pl/${d.id}/pdl`] = pdAct; });
  if (cureId) { const fr = byId[cureId].fr; patch[`pl/${cureId}/r`] = fr && fr !== 'zombie' && ROLES_DATA[fr] ? fr : 'villager'; patch[`pl/${cureId}/fr`] = ''; patch[`pl/${cureId}/bt`] = 0; patch[`pl/${cureId}/ic`] = 0; patch[`pl/${cureId}/cu`] = room.k || 1; }
  if (sedateId) patch[`pl/${sedateId}/sd`] = (room.k || 1) + 1;
  dead.forEach((id) => { patch[`pl/${id}/a`] = 0; });
  witches.forEach((w) => { if (witchSaves) patch[`pl/${w.id}/wsu`] = 1; if (poison) patch[`pl/${w.id}/wpu`] = 1; }); // teammates share the potions
  // Bodyguard and Medusa remember what they picked themselves, even when the Shadow Figure moved it.
  bgs.forEach((b) => { if (!blocked('bodyguard')) patch[`pl/${b.id}/lp`] = b.t; });
  alive.filter((p) => p.r === 'medusa').forEach((m) => { patch[`pl/${m.id}/lp`] = c0.medusa || ''; });
  return { patch, dead, saved, victim, guarded, bitten, shotHit, silenced: silencedAlive, stoned: stonedAlive, lines, silencedLine: silencedAlive ? `${byId[silencedAlive].n} has been silenced for the day. They cannot speak or vote.` : '', stonedLine: stonedAlive ? stoneLine(byId[stonedAlive].n) : '' };
}

function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text); } catch (e) { /* fall through */ }
  return new Promise((ok, no) => {
    try {
      const t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      const done = document.execCommand('copy'); document.body.removeChild(t);
      done ? ok() : no(new Error('copy'));
    } catch (e) { no(e); }
  });
}

// Polls the room every 1.5 seconds and cleans up when the screen goes away.
function useRoom(code) {
  const [room, setRoom] = useState(undefined); // undefined = loading, null = room is gone
  const [err, setErr] = useState('');
  const busy = useRef(false);
  const again = useRef(false);
  const live = useRef(true);
  const refresh = useCallback(async () => {
    if (busy.current) { again.current = true; return; }
    busy.current = true;
    try {
      const r = await Mp.get(`rooms/${code}`);
      if (live.current) { setRoom(r); setErr(''); }
    } catch (e) { if (live.current) setErr(mpErrorText(e)); }
    busy.current = false;
    if (again.current && live.current) { again.current = false; refresh(); }
  }, [code]);
  useEffect(() => {
    live.current = true;
    refresh();
    const t = setInterval(() => { if (!document.hidden) refresh(); }, 1500);
    const vis = () => { if (!document.hidden) refresh(); };
    document.addEventListener('visibilitychange', vis);
    return () => { live.current = false; clearInterval(t); document.removeEventListener('visibilitychange', vis); };
  }, [refresh]);
  return { room, err, refresh };
}

function MpHostForm({ onBack, onCreated, cfg }) {
  const [name, setName] = useState(loadName);
  const [roomName, setRoomName] = useState('');
  const [plays, setPlays] = useState(true);
  const [isPublic, setIsPublic] = useState(false);
  const [busy, setBusy] = useState(false);

    const n = name.trim();

    try { if (plays) saveName(n); onCreated(await mpCreateRoom(plays ? n : 'Moderator', plays, roomName, isPublic, { mx: cfg.n, dk: cfg.deck }), n); }
    catch (e) { setErr(e.message === 'no-code' ? 'Could not find a free room code. Try again.' : mpErrorText(e)); setBusy(false); }
  };
  const opt = (val, title, sub) => (
    <button type="button" role="radio" aria-checked={plays === val} onClick={() => setPlays(val)} className="flex-1 rounded-xl p-3 text-left transition"
      style={{ background: plays === val ? 'rgba(109,40,217,0.3)' : 'var(--card)', border: `1px solid ${plays === val ? '#A78BFA' : 'var(--line)'}` }}>
      <span className="block text-sm font-bold text-slate-50">{title}</span><span className="mt-0.5 block text-xs leading-snug text-slate-400">{sub}</span>

    <div className="flex flex-col gap-4">
      <h2 className="font-display text-2xl font-bold">Host a Room</h2>
      <div className="flex items-center justify-between gap-2 rounded-xl px-3.5 py-2.5" style={{ background: 'rgba(109,40,217,0.25)', border: '1px solid rgba(167,139,250,0.55)' }}>
        <span className="text-xs font-bold uppercase tracking-[0.14em] text-violet-100">{getGameMode() === 'outbreak' ? 'Outbreak' : 'Classic'} mode &bull; {cfg.n} players</span>

      </div>
      <MpField label="Room name">
        <input value={roomName} maxLength={28} onChange={(e) => setRoomName(e.target.value)} placeholder="e.g., Blood Moon Village" autoComplete="off"
          className="h-14 w-full rounded-xl px-4 text-lg text-slate-100 placeholder-slate-500" style={mpInputStyle} />
      </MpField>
      <div role="radiogroup" aria-label="Host role" className="flex gap-2.5">
        {opt(true, 'Playing + Hosting', 'You get a card and run the game.')}
        {opt(false, 'Moderator Only', 'You run the game without a card.')}
      </div>
      <div role="radiogroup" aria-label="Room visibility" className="flex gap-2.5">
        {[[false, 'Private', 'Friends join with the 4-letter code.'], [true, 'Public', 'Also listed so anyone can join.']].map(([v, t, sub]) => (
          <button key={t} type="button" role="radio" aria-checked={isPublic === v} onClick={() => setIsPublic(v)} className="flex-1 rounded-xl p-3 text-left transition"
            style={{ background: isPublic === v ? 'rgba(109,40,217,0.3)' : 'var(--card)', border: `1px solid ${isPublic === v ? '#A78BFA' : 'var(--line)'}` }}>
            <span className="block text-sm font-bold text-slate-50">{t}</span><span className="mt-0.5 block text-xs leading-snug text-slate-400">{sub}</span>
          </button>))}
      </div>
      {plays && (
        <MpField label="Your name">
          <input value={name} maxLength={14} onChange={(e) => setName(e.target.value)} placeholder="Enter your name..." autoComplete="off"

        </MpField>
      )}
      {err && <p role="alert" className="text-sm text-amber-300">{err}</p>}

/* ---------- player-side views ---------- */
function MpReveal({ me, ready, readyCount, total, onReady }) {
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const [sent, setSent] = useState(false);
  const [showAbility, setShowAbility] = useState(false);
  const timers = useRef([]);
  useEffect(() => { Sfx.preload(); return () => timers.current.forEach(clearTimeout); }, []);
  const hasImg = !!useCardImage(me.r);
  const reveal = () => {
    if (phase !== 'idle') return;
    Sfx.flip();
    setPhase('lift');
    timers.current.push(setTimeout(() => setPhase('flipping'), 300));
    timers.current.push(setTimeout(() => setPhase('open'), 1500));
  };
  const done = ready || sent;
  if (done) {
    return (
      <div className="flex flex-1 flex-col items-center justify-center gap-4 text-center">
        <RoleChip role={me.r} />
        <p className="font-display text-2xl font-bold">You&rsquo;re ready</p>
        <p className="text-sm text-slate-300">Waiting for the others to look at their cards.</p>
        <p className="text-sm font-semibold tabular-nums text-violet-200">{readyCount} of {total} ready</p>
        <button onClick={() => setShowAbility(true)} className="min-h-[44px] rounded-xl px-5 text-sm font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>View my role</button>
        {showAbility && <AbilityModal role={me.r} onClose={() => setShowAbility(false)} />}
      </div>
    );
  }
  return (
    <div className="flex flex-1 flex-col items-center">
      <div role="note" className="mt-1 flex w-full items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
        style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
        <span><strong className="font-bold text-amber-200">Eyes only!</strong> Make sure nobody can see your screen before you reveal your card.</span>
      </div>
      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <div role="button" tabIndex={phase === 'idle' ? 0 : -1} onClick={reveal} aria-label="Tap the card to reveal your role"
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } }}
          className={phase === 'idle' ? 'cursor-pointer' : ''}>
          <RoleCard role={me.r} phase={phase} />
        </div>
        <div className="relative w-full text-center" style={{ minHeight: '3.5rem' }}>
          {phase === 'idle' && <p className="hint-pulse pt-1 text-sm font-semibold tracking-wide text-slate-300">Tap the card to reveal</p>}
          <div className={`absolute inset-x-0 top-0 mx-auto text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`} style={{ width: 'min(19rem, 86vw)' }}>
            <TeamBadge team={ROLES_DATA[me.r].team} />
            {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[me.r].ability}</p>}
          </div>
        </div>
      </div>
      <div className={`flex w-full flex-col gap-3 pb-2 ${phase === 'open' ? '' : 'invisible'}`}>
        <button onClick={() => setShowAbility(true)} disabled={phase !== 'open'}
          className="flex min-h-[48px] w-full items-center justify-center rounded-xl text-sm font-semibold text-slate-200 hover:bg-white/5" style={{ border: '1px solid var(--line)' }}>View Ability</button>
        <Btn disabled={phase !== 'open'} onClick={() => { setSent(true); onReady(); }}>I&rsquo;m Ready</Btn>
      </div>
      {showAbility && <AbilityModal role={me.r} onClose={() => setShowAbility(false)} />}
    </div>
  );
}

function MultiPickList({ players, value, onChange, max = 2, team = [], teamLabel = 'Werewolf team', TeamIcon = WolfIcon, badges = [], locked }) {
  const has = (id) => value.some((v) => String(v) === String(id));
  return (
    <ul className="flex flex-col gap-2" role="listbox" aria-multiselectable="true">
      {players.map((p) => {
        const mate = team.includes(p.id);
        const sel = !mate && has(p.id);
        const toggle = () => onChange(sel ? value.filter((x) => String(x) !== String(p.id)) : value.length < max ? [...value, p.id] : [value[value.length - 1], p.id]);
        return (
          <li key={p.id}>
            <button role="option" aria-selected={sel} disabled={locked || mate} onClick={toggle}
              className={`flex min-h-[52px] w-full items-center gap-3 rounded-xl px-4 text-left text-[15px] font-semibold transition active:scale-[0.99] ${mate ? '' : 'disabled:opacity-60'}`}
              style={mate ? { background: 'rgba(127,29,29,0.25)', border: '1px solid rgba(239,68,68,0.55)', color: '#FCA5A5' }
                : { background: sel ? 'rgba(185,28,28,0.62)' : 'var(--card-2)', border: `2px solid ${sel ? '#FCA5A5' : 'var(--line)'}`, boxShadow: sel ? '0 0 20px -3px rgba(248,113,113,0.9)' : 'none', color: '#F8FAFC' }}>
              {mate ? <><span className="flex-1">{p.n}</span><span className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider"><TeamIcon width="18" height="18" aria-hidden="true" />{teamLabel}</span></>
                : <>
                  <span aria-hidden="true" className="flex h-6 w-6 shrink-0 items-center justify-center rounded-md text-sm font-black" style={{ background: sel ? '#FCA5A5' : 'transparent', border: `2px solid ${sel ? '#FCA5A5' : '#64748B'}`, color: '#450A0A' }}>{sel ? '✓' : ''}</span>
                  <span className="flex flex-1 items-center gap-2">{p.n}{badges.includes(p.id) && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-200" style={{ background: 'rgba(127,29,29,0.5)', border: '1px solid rgba(239,68,68,0.75)' }}>Werewolf</span>}</span>
                  {sel && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-950" style={{ background: '#FCA5A5' }}>Target</span>}
                </>}
            </button>
          </li>
        );
      })}
    </ul>
  );
}

function BloodMoonBanner({ className = '' }) {

      <div className="font-display text-sm font-black tracking-[0.14em] text-red-100 md:text-base" style={{ textShadow: '0 0 14px rgba(220,38,38,0.9)' }}>BLOOD MOON RISES — THE PACK HUNTS TWICE TONIGHT</div>
    </div>

function PickList({ players, value, onChange, disabled = [], locked, team = [], teamLabel = 'Werewolf team', TeamIcon = WolfIcon, badges = [] }) {
  return (
    <ul className="flex flex-col gap-2" role="listbox">
      {players.map((p) => {
        const mate = team.includes(p.id);
        const off = locked || mate || disabled.includes(p.id);
        const sel = value === p.id;
        return (
          <li key={p.id}>
            <button role="option" aria-selected={sel} disabled={off} onClick={() => onChange(sel ? '' : p.id)}
              className={`flex min-h-[52px] w-full items-center justify-between rounded-xl px-4 text-left text-[15px] font-semibold transition active:scale-[0.99] ${mate ? '' : 'disabled:opacity-40'}`}
              style={mate ? { background: 'rgba(127,29,29,0.25)', border: '1px solid rgba(239,68,68,0.55)', color: '#FCA5A5' }
                : { background: sel ? 'rgba(109,40,217,0.4)' : 'var(--card-2)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none', color: '#E6EAF2' }}>
              {mate ? <><span>{p.n}</span><span className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider"><TeamIcon width="18" height="18" aria-hidden="true" />{teamLabel}</span></>
                : <><span className="flex items-center gap-2">{p.n}{badges.includes(p.id) && <span className="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-red-200" style={{ background: 'rgba(127,29,29,0.5)', border: '1px solid rgba(239,68,68,0.75)' }}>Werewolf</span>}</span>{sel && <span aria-hidden="true" className="text-lg">✓</span>}</>}

}

      <MoonIcon width="88" height="88" className="hint-pulse text-slate-300" />
      <div>
        <p className="font-display text-2xl font-bold">Night falls</p>
        <p className="mt-2 max-w-xs text-sm leading-relaxed text-slate-300">{text}</p>
      </div>
      {r && <RoleChip role={me.r} />}
