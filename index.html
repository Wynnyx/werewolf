/* Decoded-image cache: keeps decoded images referenced so mobile browsers don't drop them. */
const imageCache = new Map();
function preloadImage(src) {
  const hit = imageCache.get(src);
  if (hit) return Promise.resolve(hit);
  return new Promise((resolve) => {
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
    const done = () => {
      if (img.naturalWidth > 0) imageCache.set(src, img);
      resolve(img);
    };
    if (typeof img.decode === 'function') img.decode().then(done, done);
    else { img.onload = done; img.onerror = done; }
  });
}

function makeBgStore(key, fallback) {
  let custom = (() => { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } })();
  const listeners = new Set();

    fallback,
    get: () => custom || fallback,
    isCustom: () => !!custom,
    set: (dataUrl) => {
      custom = dataUrl || '';

      listeners.forEach((fn) => fn());

    },
    use: function () { return React.useSyncExternalStore((fn) => { listeners.add(fn); return () => listeners.delete(fn); }, this.get); }
  };
}

const POOL_MAX = 12;
// A pool of background images (data URLs or file paths). Custom pools live in localStorage; with none saved, the built-in defaults are used.
function makePool(key, legacyKey, defaults) {
  let custom = null;
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const a = JSON.parse(raw); if (Array.isArray(a) && a.length) custom = a.filter((x) => typeof x === 'string'); }
    else if (legacyKey) {

    }
  } catch (e) { custom = null; }
  if (custom && !custom.length) custom = null;
  let cur = custom || defaults;
  const listeners = new Set();
  const commit = (arr) => {
    try { if (arr) localStorage.setItem(key, JSON.stringify(arr)); else localStorage.removeItem(key); } catch (e) { return false; }
    custom = arr; cur = arr || defaults; listeners.forEach((fn) => fn()); return true;
  };

    defaults,
    get: () => cur,
    isCustom: () => !!custom,
    add: (url) => { if (cur.length >= POOL_MAX) return 'full'; const ok = commit([...cur, url]); if (ok) preloadImage(url); return ok; },
    remove: (i) => cur.length > 1 && commit(cur.filter((_, k) => k !== i)),
    reset: () => commit(null),
    use: function () { return React.useSyncExternalStore((fn) => { listeners.add(fn); return () => listeners.delete(fn); }, this.get); }
  };
}

  const i = randInt(n - 1);

// Downscale a chosen photo (max 1080 x 1920) to JPEG so it fits comfortably in localStorage.
function fileToBg(file, maxW = 1080, maxH = 1920, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

  if (!items.some((i) => i.role)) return '';
  const wolves = live.filter((i) => i.role === 'werewolf').length; // the Shadow Figure loses with the last Werewolf
  const evil = live.filter((i) => ROLES_DATA[i.role] && ROLES_DATA[i.role].team === 'werewolf').length;
  const realZ = live.filter((i) => i.role === 'zombie' || i.role === 'infector').length; // the Infected belong to the Zombie faction
  const zombies = realZ + live.filter((i) => i.role === 'plaguedoctor' && i.side === 'zombie').length; // a Horde-aligned Plague Doctor counts toward the majority
  const rest = live.length - evil - zombies;
  if (zombies > 0 && zombies > live.length - zombies) return 'zombie'; // strict majority of the living
  if (realZ > 0) return '';
  if (wolves === 0) return 'village';

function emptyDeck() {

function deckTotal(deck) {

}
// Balanced preset. Every role has a `balance` value (Werewolf -6 each, Village roles positive).
// Aims for a deck total inside -1..+3, closest to +1. Uses 1 Werewolf whenever that can land in the
// window, and 2 only when it cannot. Ties prefer more special roles.
const BALANCE_MIN = -1, BALANCE_MAX = 3, BALANCE_TARGET = 1;
const FILL_PRIORITY = ['seer', 'witch', 'bodyguard', 'hunter', 'spellcaster', 'villager'];
function deckBalance(deck) {
  return ROLE_IDS.reduce((n, id) => n + (deck[id] || 0) * (ROLES_DATA[id].balance || 0), 0);
}
function bestVillageFill(count, wolves) {
  const wolfScore = wolves * ROLES_DATA.werewolf.balance;
  const need = count - wolves;
  const pool = FILL_PRIORITY.filter((id) => ROLES_DATA[id] && ROLES_DATA[id].team === 'village');
  let best = null;
  const counts = {};
  const consider = () => {
    let score = wolfScore, fun = 0;
    pool.forEach((id, i) => { const n = counts[id] || 0; score += n * ROLES_DATA[id].balance; fun += n * (pool.length - i); });
    const dist = score < BALANCE_MIN ? BALANCE_MIN - score : score > BALANCE_MAX ? score - BALANCE_MAX : 0;
    const off = Math.abs(score - BALANCE_TARGET);
    if (!best || dist < best.dist || (dist === best.dist && (off < best.off || (off === best.off && fun > best.fun)))) {
      best = { dist, fun, off, score, wolves, counts: { ...counts } };

    if (left === 0) { consider(); return; }
    if (i >= pool.length) return;
    const id = pool[i];
    for (let n = Math.min(ROLES_DATA[id].max, left); n >= 0; n--) { counts[id] = n; walk(i + 1, left - n); }
    counts[id] = 0;

}
function autoFill(count, mode = getGameMode()) {
  // 1 Werewolf (2 only when the table is too big to fill with one of each Village role),
  // then Village roles strictly by priority: Seer first, Villager last.
  const village = FILL_PRIORITY.filter((id) => ROLES_DATA[id] && ROLES_DATA[id].team === 'village');
  const wolves = count <= 7 ? 1 : Math.min(ROLES_DATA.werewolf.max, Math.floor((count - 2) / 3)); // 8-10: 2, 11-13: 3, 14-15: 4
  const deck = emptyDeck();
  deck.werewolf = wolves;
  let left = count - wolves;
  village.forEach((id) => { if (id === 'villager') return; const n = Math.min(1, left); deck[id] = n; left -= n; }); // one of each special role first
  const v = Math.min(ROLES_DATA.villager.max, left); deck.villager = v; left -= v;
  village.forEach((id) => { if (id === 'villager') return; const n = Math.min(ROLES_DATA[id].max - deck[id], left); deck[id] += n; left -= n; }); // then second copies
  if (mode === 'outbreak' && count >= 6) { // Outbreak: one Zombie and one Sniper (plus a Doctor from 8 players) take the slots (plain Villagers first)

    ['villager', 'spellcaster', 'hunter'].forEach((id) => { const t = Math.min(need, deck[id]); deck[id] -= t; need -= t; });

// Fisher-Yates

function randInt(n) {

  const cards = [];
  ROLE_IDS.forEach((id) => { for (let i = 0; i < deck[id]; i++) cards.push(id); });
  const shuffled = shuffle(cards);
  return names.slice(0, count).map((n, i) => ({
    id: i,
    name: n.trim() || `Player ${i + 1}`,
    role: shuffled[i],
    alive: true,
    protectedTag: false,
    silencedTag: false,
    stoneTag: false

  ['LEVEL 1 — The First Howl', 'ด่าน 1 — เสียงหอนแรก'], ['Harbor Cottage', 'กระท่อมท่าเรือ'], ['Your Role: Bodyguard', 'บทบาทของคุณ: บอดี้การ์ด'], ['Play Level 1', 'เล่นด่าน 1'], ['Unlocked', 'ปลดล็อกแล้ว'], ['Cleared ★', 'ผ่านแล้ว ★'], ['House #1', 'บ้านหลังที่ 1'], ['Back to map', 'กลับไปแผนที่'],
  ['Tip: As Bodyguard, protect someone each night. Guess who the Werewolf will attack!', 'เคล็ดลับ: ในฐานะบอดี้การ์ด ให้ปกป้องใครสักคนทุกคืน ลองเดาว่ามนุษย์หมาป่าจะโจมตีใคร!'], ['Tip: Read the Village Chat, work out who the Werewolf is, and vote together!', 'เคล็ดลับ: อ่านแชตหมู่บ้าน หาว่าใครคือมนุษย์หมาป่า แล้วโหวตไปด้วยกัน!'],
  ['Solo Campaign · Night {#}', 'แคมเปญเดี่ยว · คืนที่ {1}'], ['🛡️ Choose Who to Protect', '🛡️ เลือกคนที่จะปกป้อง'], ['Slipped out to the bathroom earlier', 'แอบออกไปห้องน้ำเมื่อกี้'], ['Hid under the blankets, silent', 'ซ่อนใต้ผ้าห่ม เงียบกริบ'], ['Watched from the window', 'เฝ้ามองจากหน้าต่าง'], ["Tip: Remember everyone's alibi before the lantern went out...", 'เคล็ดลับ: จำคำแก้ตัวของทุกคนก่อนตะเกียงจะดับไว้...'],
  ["We barred the cottage doors, yet I can't shake the feeling the beast is already inside...", 'เราขัดประตูกระท่อมไว้แล้ว แต่ฉันยังรู้สึกว่าสัตว์ร้ายอยู่ในนี้กับเราแล้ว...'],
  ["Stacy slipped outside earlier claiming she needed the bathroom before hurrying back.", 'เมื่อกี้สเตซี่แอบออกไปข้างนอกอ้างว่าต้องเข้าห้องน้ำ แล้วรีบกลับมา'],
  ["And across the room, Jenna pulled the blankets over her head\u2014fear, or hiding something?", 'ส่วนอีกฟากของห้อง เจนนาดึงผ้าห่มคลุมหัว\u2014กลัว หรือปิดบังอะไรอยู่?'],
  ["I watched Stacy go outside from the window... there's something off about her.", 'ฉันเห็นสเตซี่เดินออกไปข้างนอกจากหน้าต่าง... เธอดูแปลก ๆ'],
  ["Come on, what's wrong with you? I really just needed to go, I can't exactly help that.", 'เอาจริงดิ เป็นอะไรของนาย? ฉันแค่ปวดจริง ๆ ห้ามกันไม่ได้นี่'],
  ["Convenient timing right before dark. Nobody else needed to step outside.", 'จังหวะสะดวกจังก่อนมืดพอดี ไม่เห็นมีใครต้องออกไปข้างนอกเลย'],
  ["Come on, I just ate dinner.", 'เอาน่า ฉันเพิ่งกินข้าวเย็นเสร็จเองนะ'],
  ["If anything, are we sure about Jenna? She wouldn't say a single word when I asked her.", 'ถ้าจะสงสัยใคร แน่ใจเหรอว่าเจนนาไม่มีพิรุธ? ตอนฉันถามเธอไม่ยอมพูดสักคำ'],
  ["The last lantern dies out. Everyone is pointing fingers\u2014I have to choose who to protect tonight.", 'ตะเกียงดวงสุดท้ายดับลง ทุกคนต่างชี้นิ้วใส่กัน\u2014ฉันต้องเลือกว่าคืนนี้จะปกป้องใคร'],
  ['Skip', 'ข้าม'], ['\u21BB Reset Progress', '\u21BB รีเซ็ตความคืบหน้า'], ['Tap again to confirm', 'แตะอีกครั้งเพื่อยืนยัน'], ['Continue to Level {#}', 'ไปต่อด่าน {1}'], ['Retry Level {#}', 'ลองด่าน {1} อีกครั้ง'], ['Back to Map', 'กลับไปแผนที่'], ['Campaign \u00B7 Level {#}', 'แคมเปญ \u00B7 ด่าน {1}'], ['Level 2 \u2014 Unlocked (Coming Soon)', 'ด่าน 2 \u2014 ปลดล็อกแล้ว (เร็ว ๆ นี้)'], ['Level 2 \u2014 Unlocked', 'ด่าน 2 \u2014 ปลดล็อกแล้ว'], ['Pick your players and cards against bots', 'เลือกผู้เล่นและไพ่เพื่อสู้กับบอท'], ["Wait\u2014nobody died? Then whoever tried to attack froze up. Look at Jenna, she's been hiding under her blankets the whole time.", "เดี๋ยวนะ—ไม่มีใครตายเหรอ? งั้นคนที่ตั้งใจจะลงมือก็คงขวัญเสีย ดูเจนนาสิ เธอซ่อนตัวอยู่ใต้ผ้าห่มตลอดเลย"], ["Honestly... Charlie might have a point. Why else wouldn't she say a single word all night?", "พูดตามตรง... ชาร์ลีอาจจะพูดถูกนะ ไม่งั้นทำไมเธอถึงไม่ยอมพูดสักคำทั้งคืน?"], ["(sniffling) I didn't do anything! I was terrified\u2014please, I'm not a werewolf!", "(สะอื้น) ฉันไม่ได้ทำอะไรนะ! ฉันกลัวมาก—ได้โปรด ฉันไม่ใช่มนุษย์หมาป่า!"], ["...Hold on. Look at her\u2014maybe it really wasn't her.", "...เดี๋ยวก่อน ดูเธอสิ—บางทีอาจไม่ใช่เธอจริง ๆ"], ["Yeah, maybe you're right... no point rushing into a mistake yet.", "อืม บางทีเธอก็พูดถูก... ไม่ต้องรีบทำพลาดตอนนี้หรอก"], ["I'm voting Jenna", "ฉันโหวตเจนนา"], ["I'm voting Charlie", "ฉันโหวตชาร์ลี"], ["I'm voting Stacy", "ฉันโหวตสเตซี่"], ["I'm skipping", "ฉันข้ามการโหวต"], ["Sorry, Jenna\u2014we can't take chances. I'm voting Jenna.", "ขอโทษนะ เจนนา—เราเสี่ยงไม่ได้ ฉันโหวตเจนนา"], ["Agreed. Better safe than sorry\u2014I'm voting Jenna too.", "เห็นด้วย ปลอดภัยไว้ก่อน—ฉันก็โหวตเจนนาเหมือนกัน"], ["If both of you are sure... alright, I'll follow the majority and vote Jenna.", "ถ้าพวกนายมั่นใจกันทั้งคู่... ก็ได้ ฉันจะตามเสียงส่วนใหญ่แล้วโหวตเจนนา"], ["Wait a second\u2014Charlie's been pushing blame since last night. I'm voting Charlie.", "เดี๋ยวก่อน—ชาร์ลีโยนความผิดมาตั้งแต่เมื่อคืน ฉันโหวตชาร์ลี"], ["Me?! I didn't touch anyone\u2014you're guessing with zero proof!", "ฉันเหรอ?! ฉันไม่ได้แตะต้องใครเลย—นายแค่เดาโดยไม่มีหลักฐานสักอย่าง!"], ["Hold on, Pooh\u2014Charlie has a point, we don't have real proof yet. I'm not voting him today.", "เดี๋ยวก่อน พูห์—ชาร์ลีพูดมีเหตุผล เรายังไม่มีหลักฐานจริง ๆ ฉันไม่โหวตเขาวันนี้"], ["Stacy was the one who snuck outside before dark. I'm voting Stacy.", "สเตซี่คือคนที่แอบออกไปข้างนอกก่อนมืด ฉันโหวตสเตซี่"], ["Finally someone sees it! I'm voting Stacy too.", "ในที่สุดก็มีคนเห็น! ฉันก็โหวตสเตซี่เหมือนกัน"], ["Are you serious?! You're falling for his bluff\u2014I'm innocent!", "จริงเหรอเนี่ย?! นายหลงกลเขาแล้ว—ฉันบริสุทธิ์นะ!"], ["Nobody died last night. Voting blind is too risky\u2014I'm skipping.", "เมื่อคืนไม่มีใครตาย การโหวตแบบมั่ว ๆ เสี่ยงเกินไป—ฉันขอข้าม"], ["Smart move. I'm skipping too.", "ตัดสินใจฉลาด ฉันก็ข้ามเหมือนกัน"], ["Same here\u2014let's wait until we actually know something. Skip.", "ฉันก็เหมือนกัน—รอจนกว่าจะรู้อะไรจริง ๆ ก่อนเถอะ ข้าม"], ['(guarded last night)', '(เพิ่งถูกปกป้องเมื่อคืน)'], ['🛡️ Cooldown', '🛡️ พักฟื้น'],
  ["They struck overnight, and my shield held\u2014the Werewolf came straight after {} last night!", 'พวกมันลงมือเมื่อคืน แต่โล่ของฉันยังต้านไว้ได้\u2014มนุษย์หมาป่าพุ่งตรงไปหา {1} เมื่อคืนนี้!'], ["Oh no... I guarded {}, and the beast went after {} instead!", 'ตายแล้ว... ฉันปกป้อง {1} แต่เจ้าอสูรกลับไปหา {2} แทน!'], ['🗳️ Cast Your Vote', '🗳️ ลงคะแนนโหวต'], ['Agree to Skip', 'เห็นด้วย ข้ามไปก่อน'], ['Stay Silent', 'เงียบไว้'], ['Question Someone', 'ซักถามใครสักคน'], ['You stay silent.', 'คุณเลือกที่จะเงียบ'], ["Let's skip the vote and wait for more clues.", 'ข้ามการโหวตก่อน แล้วรอเบาะแสเพิ่มเถอะ'], ['{}, what are you hiding? Explain yourself.', '{1} เธอปิดบังอะไรอยู่? อธิบายมาซะ'], ['Back', 'กลับ'], ['Day Discussion', 'การอภิปรายตอนกลางวัน'],
  ['(yourself)', '(ตัวคุณเอง)'],

  ["Same here. One wrong vote and we kill a villager. I'm skipping too.", 'ฉันก็เหมือนกัน โหวตผิดครั้งเดียวเราก็ฆ่าชาวบ้านเอง ฉันข้ามด้วย'],
  ["She hid crying under her blankets all night\u2014she couldn't face what she did to Stacy!", 'เธอซ่อนร้องไห้อยู่ใต้ผ้าห่มทั้งคืน\u2014เธอทนเผชิญสิ่งที่ทำกับสเตซี่ไม่ได้!'],
  ["That's a lie! Charlie is pointing fingers to hide something!", 'โกหก! ชาร์ลีชี้นิ้วใส่คนอื่นเพื่อปิดบังอะไรบางอย่าง!'],

  };

    const th = false;
    const vs = window.speechSynthesis.getVoices().filter((v) => (th ? /^th/i.test(v.lang) : /^en/i.test(v.lang)));
    if (th) return vs[0] || null;

// Browsers only allow sound after a tap: the first tap anywhere on the home screen starts it,
// and the speaker button mutes / unmutes.
// Screens where the tension music plays instead of the forest ambience (set by AppInner).
let tensionScreen = false;
// Ambient forest sound starts on the very first tap, click or key press anywhere (loading screen, Classic / Outbreak, any button).
// Browsers refuse audio before a gesture, so this one-time starter runs in the capture phase and stays armed until the sound really plays.
(() => {
  const arm = (e) => {
    if (e && e.target && e.target.closest && e.target.closest('[data-sound-toggle]')) return; // the speaker button handles itself
    Sfx.unlock();
    const st = getSettings();
    if (st.sound && !Ambience.unlocked() && !Ambience.isRunning() && !(tensionScreen && st.music)) Ambience.start();
    if (st.music) Tension.prime();
  };
  ['touchend', 'pointerup', 'click', 'keydown'].forEach((n) => window.addEventListener(n, arm, { capture: true, passive: true }));
  if (getSettings().sound) { try { Ambience.start(); } catch (e) { /* needs a tap first */ } } // desktop browsers may allow this straight away
})();

  const cur = getSettings().sound;
  if (cur && !Ambience.isRunning() && !Tension.isRunning()) { if (tensionScreen && getSettings().music) Tension.start(); else Ambience.start(); return; }
  updateSettings({ sound: !cur });
  // Sound covers the forest ambience and effects. Game Music is its own switch and keeps playing.
  if (!cur) { Sfx.chime(); if (!(tensionScreen && getSettings().music)) Ambience.start(); } else Ambience.stop();
}

// Step 2 (mode lobby) background: its own art per mode, with a gradient that shows until the image loads (or if it is missing).
const LOBBY_BG = {
  classic: { src: 'images/classic-bg.png', fallback: 'linear-gradient(180deg,#070B1E 0%,#16204F 48%,#0B0E14 100%)' },
  outbreak: { src: 'images/outbreak-bg.png', fallback: 'linear-gradient(180deg,#03100D 0%,#0B3B2E 48%,#050B09 100%)' }
};
// Falling leaves and embers/spores for the Step 2 screens, tinted per mode (same motion as the Step 1 Home Screen).
const LOBBY_TINT = {
  classic: { leaves: ['#94A3B8', '#A5B4FC', '#6366F1', '#CBD5E1'], embers: ['#FBBF24', '#F59E0B', '#FB923C'] },
  outbreak: { leaves: ['#6EE7B7', '#34D399', '#86EFAC', '#4D7C0F'], embers: ['#A7F3D0', '#4ADE80', '#BEF264'] }
};
function LobbyParticles({ mode }) {
  const atmos = useMemo(() => {
    const t = LOBBY_TINT[mode] || LOBBY_TINT.classic;
    const r = (a, b) => a + Math.random() * (b - a);
    const leaves = Array.from({ length: 8 }, (_, i) => ({
      left: r(3, 95), size: r(9, 16), dur: r(10, 17), delay: -r(0, 15), dx: r(30, 90), sway: r(3, 5.5), color: t.leaves[i % t.leaves.length]
    }));
    const embers = Array.from({ length: 8 }, () => ({
      left: r(5, 95), size: r(3, 5.5), dur: r(8, 14), delay: -r(0, 12), dx: r(-30, 30), color: t.embers[Math.floor(Math.random() * t.embers.length)]
    }));
    return { leaves, embers };
  }, [mode]);
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden">
      {atmos.leaves.map((l, i) => (
        <span key={'l' + i} className="leaf absolute" style={{ left: l.left + '%', top: '-4vh', animationDuration: l.dur + 's', animationDelay: l.delay + 's', '--dx': l.dx + 'px', opacity: 0.8 }}>
          <span className="leaf-shape block" style={{ width: l.size, height: l.size * 0.8, background: l.color, animationDuration: l.sway + 's' }} />
        </span>
      ))}
      {atmos.embers.map((e, i) => (
        <span key={'e' + i} className="ember absolute" style={{ left: e.left + '%', bottom: '-2vh', width: e.size, height: e.size, background: e.color, boxShadow: `0 0 8px 2px ${e.color}99`, animationDuration: e.dur + 's', animationDelay: e.delay + 's', '--dx': e.dx + 'px' }} />
      ))}
    </div>
  );
}
function LobbyBackdrop({ mode }) {
  const bg = LOBBY_BG[mode] || LOBBY_BG.classic;
  const [ok, setOk] = useState(true);
  useEffect(() => setOk(true), [bg.src]);
  return (
    <div className="fixed inset-0 z-0 overflow-hidden" style={{ background: bg.fallback }} aria-hidden="true">

}

  useEffect(() => {

    return () => clearInterval(t);
  }, []);
  const src = homeBgs[bgI];
  const st = useSettings();
  const atmos = useMemo(() => {
    const r = (a, b) => a + Math.random() * (b - a);
    const leaves = Array.from({ length: 7 }, (_, i) => ({
      left: r(3, 42), size: r(9, 16), dur: r(10, 17), delay: -r(0, 15), dx: r(30, 90), sway: r(3, 5.5), color: ['#7F1D1D', '#991B1B', '#5B1016'][i % 3]
    }));
    const embers = Array.from({ length: 6 }, () => ({

    }));
    return { leaves, embers };
  }, []);
  const [imgOk, setImgOk] = useState(true);

  const [settingsOpen, setSettingsOpen] = useState(false);
  useEffect(() => setImgOk(true), [src]);
  useEffect(() => { Ambience.preload(); Tension.preload(); Sfx.preload(); }, []);
  useEffect(() => {
    if (!st.sound) Ambience.stop();

    const go = (e) => {

      Sfx.unlock();
      if (getSettings().sound) Ambience.start();
      if (getSettings().music) Tension.prime();

function summarizeDeck(deck) {
  return ROLE_IDS.filter((id) => deck[id] > 0).map((id) => {
    if (id === 'werewolf') return `${deck[id]} ${deck[id] === 1 ? 'Wolf' : 'Wolves'}`;
    return deck[id] > 1 ? `${deck[id]} ${ROLES_DATA[id].name}s` : ROLES_DATA[id].name;
  }).join(', ');
}

function GameSheet({ game, onClose, onResume, onRedeal, onEdit }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const active = game.status === 'active' && game.players;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={game.name}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />

function ChooseCards({ count, deck, setDeck, onBack, onStart, startLabel = 'Start & Deal Cards', showBalance = false, adv = null }) {
  const [q, setQ] = useState('');
  useEffect(() => { Sfx.preload(); }, []);
  const [notice, setNotice] = useState('');
  const noticeT = useRef(null);
  useEffect(() => () => clearTimeout(noticeT.current), []);
  const warn = (msg) => {
    setNotice(msg + '\u200B'.repeat(Math.floor(Math.random() * 3)));
    clearTimeout(noticeT.current);
    noticeT.current = setTimeout(() => setNotice(''), 2600);
  };
  const total = deckTotal(deck);
  const slotsLeft = count - total;
  const wolves = deck.werewolf;
  const canStart = slotsLeft === 0 && wolves >= 1;

  const medLocked = !!adv && adv.locked; // Adventure: Medusa stays locked until Level 1 is cleared
  const rareMsg = 'Locked \u2014 Clear Adventure Level 1';
  const change = (id, d) => {
    if (d > 0 && medLocked && id === 'medusa') { warn(rareMsg); return; }
    const next = deck[id] + d;
    if (next < 0 || next > ROLES_DATA[id].max) return;
    if (d > 0 && slotsLeft <= 0) return;
    setDeck({ ...deck, [id]: next });
    if (d > 0) Sfx.select(); else Sfx.deselect();
  };
  const gmode = useGameMode();
  const needle = q.trim().toLowerCase();
  const visible = ROLE_IDS.filter((id) => {
    if (!roleInMode(id, gmode)) return false; // Classic hides the Outbreak roles
    if (!needle) return true;
    const r = ROLES_DATA[id];
    return [r.name, r.ability, r.short, r.blurb, TEAM_LABEL[r.team]].join(' ').toLowerCase().includes(needle);
  });

  const ruleOk = wolves >= 1;
  const ruleColor = ruleOk ? '#34D399' : '#F59E0B';

  return (
    <Screen wide>
      <div className="sticky top-0 z-10 -mx-4 px-4 pb-3 pt-1 md:-mx-8 md:px-8" style={{ background: 'linear-gradient(180deg, var(--bg) 85%, rgba(11,14,20,0))' }}>
        <header className="flex items-center gap-2">
          <button onClick={onBack} aria-label="Back to game setup" className="flex h-11 w-11 items-center justify-center rounded-full text-slate-300 hover:bg-white/10">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 5 L8 12 L15 19" /></svg>
          </button>
          <h1 className="font-display text-lg font-bold tracking-wide">Choose Cards</h1>
        </header>
        <div className="mt-2 flex items-end justify-between gap-3">
          <div aria-live="polite">
            <div className="font-display text-2xl font-black leading-none tabular-nums text-white">{slotsLeft} {slotsLeft === 1 ? 'slot' : 'slots'} left</div>
            <div className="mt-1 text-sm tabular-nums text-slate-400">{total} / {count} selected</div>
          </div>
          <div className="flex gap-1.5">

function Reveal({ players, onName, onDone, onExit }) {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('idle'); // idle | lift | flipping | open
  const flipped = phase !== 'idle';
  const [busy, setBusy] = useState(false);

  const [entered, setEntered] = useState([]);
  const [nudge, setNudge] = useState(false);
  const [confirmExit, setConfirmExit] = useState(false);
  const [showAbility, setShowAbility] = useState(false);
  useEffect(() => { Sfx.preload(); }, []);
  const timer = useRef(null);
  const timers = useRef([]);
  useEffect(() => () => { clearTimeout(timer.current); timers.current.forEach(clearTimeout); }, []);

  const p = players[idx];
  const last = idx === players.length - 1;
  const hasImg = !!useCardImage(p.role);
  const name = input.trim();
  const taken = name !== '' && entered.some((n) => n.toLowerCase() === name.toLowerCase());
  const canReveal = name !== '' && !taken && !busy;

  const reveal = () => {
    if (phase !== 'idle' || busy) return;
    if (!canReveal) {
      if (name === '') {
        setNudge(true); timers.current.push(setTimeout(() => setNudge(false), 1800));
        const el = document.getElementById('player-name'); if (el) el.focus();
      }
      return;
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Sfx.flip();
    setPhase('lift'); // 0.3s anticipation lift and glow
    timers.current.push(setTimeout(() => setPhase('flipping'), 300)); // 1.2s turn
    timers.current.push(setTimeout(() => setPhase('open'), 1500)); // flip finished
  };
  const hideAndPass = () => {
    if (busy || phase !== 'open') return;
    setBusy(true);
    setShowAbility(false);
    setPhase('idle');
    onName(idx, name);
    setEntered((e) => [...e, name]);
    setInput('');
    timer.current = setTimeout(() => {
      setBusy(false);
      if (last) onDone();
      else setIdx((i) => i + 1);
    }, 700);
  };

  return (
    <Screen className="items-center">
      <div className="relative flex w-full flex-col items-center gap-2.5">
        <ExitButton onClick={() => setConfirmExit(true)} className="absolute -top-1.5 left-0" />

          {players.map((_, i) => (
            <div key={i} className="h-1 flex-1 rounded-full" style={{ background: i <= idx ? '#CBD5E1' : 'rgba(203,213,225,0.15)' }} />
          ))}
        </div>
      </div>

      <div className="mt-5 min-h-[84px] w-full" aria-live="polite">
        {flipped ? (
          <div className="pt-1 text-center">
            <p className="text-sm text-slate-400">This card belongs to</p>
            <p className="font-display mt-1 break-words text-3xl font-bold leading-tight">{name}</p>
          </div>
        ) : (
          <div role="note" className="flex items-start gap-3 rounded-xl px-4 py-3 text-left text-sm leading-snug"
            style={{ color: '#FDE68A', background: 'linear-gradient(135deg, rgba(220,38,38,0.16), rgba(245,158,11,0.12))', border: '1px solid rgba(245,158,11,0.55)' }}>
            <svg className="mt-0.5 shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3 L22 20 H2 Z" /><path d="M12 10 V14 M12 17 V17.5" /></svg>
            <span><strong className="font-bold text-amber-200">Eyes only!</strong> Shield your screen and make sure no other players are looking before you reveal your card.</span>
          </div>
        )}
      </div>

      <div className="flex flex-1 flex-col items-center justify-center gap-3 py-3">
        <div role="button" tabIndex={phase === 'idle' ? 0 : -1} onClick={reveal}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } }}
          aria-label="Tap the card to reveal your role" aria-disabled={phase !== 'idle'}
          className={`${phase === 'idle' ? 'cursor-pointer' : ''} ${nudge ? 'nudge' : ''}`}>
          <RoleCard role={p.role} phase={phase} />
        </div>
        <div className="relative w-full text-center" style={{ minHeight: '5.5rem' }}>
          {phase === 'idle' && (
            <p className={`hint-pulse pt-1 text-sm font-semibold tracking-wide ${nudge ? 'text-amber-300' : 'text-slate-300'}`}>
              {name === '' ? 'Enter your name, then tap the card' : 'Tap the card to reveal'}
            </p>
          )}
          <div className={`absolute inset-x-0 top-0 mx-auto text-center transition-opacity duration-500 ${phase === 'open' ? 'opacity-100' : 'opacity-0'}`}
            style={{ width: 'min(19rem, 86vw)' }} aria-hidden={phase !== 'open'}>
            <TeamBadge team={ROLES_DATA[p.role].team} />
            {!hasImg && <p className="mt-2 text-xs leading-snug text-slate-300">{ROLES_DATA[p.role].ability}</p>}
          </div>
        </div>
      </div>

      <div className="flex w-full flex-col justify-end pt-2" style={{ minHeight: '10rem', paddingBottom: '2rem' }}>
        {phase === 'idle' ? (
          <div className="w-full">
            <label htmlFor="player-name" className="sr-only">Your name</label>
            <input id="player-name" type="text" value={input} maxLength={18} autoComplete="off" placeholder="Enter your name..."
              onChange={(e) => { setInput(e.target.value); setNudge(false); }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
              className="h-14 w-full rounded-xl px-4 text-center text-lg text-slate-100 placeholder-slate-500"

            <p role="alert" className="mt-2 min-h-[18px] text-center text-xs text-amber-300">

          </div>
        ) : (
          <div className={`flex flex-col gap-3 ${phase === 'open' ? '' : 'invisible'}`} aria-hidden={phase !== 'open'}>
            <button onClick={() => setShowAbility(true)} disabled={phase !== 'open'}
              className="flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl text-sm font-semibold text-slate-200 hover:bg-white/5"
              style={{ background: 'transparent', border: '1px solid var(--line)' }}>

              View Ability

              {last ? 'Hide & Finish' : 'Hide & Pass to Next Player'}

          </div>
        )}
      </div>
      {showAbility && <AbilityModal role={p.role} onClose={() => setShowAbility(false)} />}
      {confirmExit && (
        <ConfirmExit body="The cards dealt so far will be discarded. You can deal again any time from My Games."
          onCancel={() => setConfirmExit(false)} onConfirm={onExit} />
      )}
    </Screen>
  );
}

function HoldButton({ onComplete, ms = 1500, aria = 'Press and hold for one and a half seconds to unlock the Moderator view', children }) {
  const [p, setP] = useState(0);
  const raf = useRef(0);
  const start = useRef(0);
  const done = useRef(false);

  const tick = useCallback(() => {
    const v = Math.min(1, (performance.now() - start.current) / ms);
    setP(v);
    if (v >= 1) {
      if (!done.current) { done.current = true; onComplete(); }
      return;
    }
    raf.current = requestAnimationFrame(tick);
  }, [ms, onComplete]);

  const begin = () => {
    cancelAnimationFrame(raf.current);
    done.current = false;
    start.current = performance.now();
    raf.current = requestAnimationFrame(tick);
  };
  const cancel = () => {
    cancelAnimationFrame(raf.current);
    if (!done.current) setP(0);
  };
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  return (
    <button
      className="no-select relative min-h-[72px] w-full overflow-hidden rounded-2xl text-base font-semibold text-white"
      style={{ background: 'var(--card-2)', border: '1px solid rgba(203,213,225,0.3)' }}
      onPointerDown={begin} onPointerUp={cancel} onPointerLeave={cancel} onPointerCancel={cancel}
      onContextMenu={(e) => e.preventDefault()}
      onKeyDown={(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } }}
      onKeyUp={(e) => { if (e.key === ' ' || e.key === 'Enter') cancel(); }}
      aria-label={aria}>
      <span className="absolute inset-y-0 left-0" style={{ width: `${p * 100}%`, background: 'linear-gradient(90deg, #991B1B, #DC2626)' }} />
      <span className="relative">{p > 0 && p < 1 ? 'Keep holding…' : children}</span>
    </button>
  );
}

const NIGHT_ORDER = ['werewolf', 'seer', 'cupid', 'medusa', 'bodyguard', 'witch', 'sniper', 'doctor', 'plaguedoctor', 'spellcaster', 'zombie', 'infector', 'shadow'];
const NIGHT_WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];

const NIGHT_PROMPT = {

  seerResult: 'Seer, here is your vision.',

  doctor: 'Doctor, choose who to treat.',
  plaguedoctor: 'Plague Doctor, choose who to inspect.',

};
const PROTECTED_LINE = 'The Werewolves attacked overnight, but the victim was protected!';
const SAVED_LINE = 'The Werewolves attacked overnight, but the victim was saved!'; // the Witch's potion (the Bodyguard protects)
const stoneLine = (name) => `${name} has been turned to stone until dusk. They cannot speak or vote.`;
function dawnLines(saved, deadNames, silencedName, stonedName, brokenNames = [], sniperHit = false, savedBy = 'g') {
  const out = [];
  if (saved) {
    const kinds = savedBy === 'both' ? [SAVED_LINE, PROTECTED_LINE] : [savedBy === 'w' ? SAVED_LINE : PROTECTED_LINE];
    kinds.forEach((l, i) => out.push(i === kinds.length - 1 && !deadNames.length && !brokenNames.length ? l + ' No one was eliminated.' : l));
  }
  deadNames.forEach((n) => out.push(`${n} was found dead this morning.`));
  brokenNames.forEach((n) => out.push(`${n} died of heartbreak.`));
  if (!out.length) out.push('The night passed quietly. No one was eliminated.');
  if (silencedName) out.push(`${silencedName} has been silenced for the day. They cannot speak or vote.`);
  if (stonedName) out.push(stoneLine(stonedName));
  if (sniperHit) out.push('A sniper shot echoed through the night!');
  return out;
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* Shadow Figure helpers (shared by Pass & Play and Multi-Device) */
const hasV = (v) => v !== null && v !== undefined && v !== '';
// The night's pending non-wolf actions as { key, target }. `c` = { medusa, werewolf, seer, bodyguard, witchSave, witchPoison, spellcaster }.
function nightActions(c) {
  const out = [];
  if (hasV(c.medusa)) out.push({ key: 'medusa', target: c.medusa });
  if (hasV(c.bodyguard)) out.push({ key: 'bodyguard', target: c.bodyguard });

// Local discussion timer: tap to start or pause, add a minute, reset.
// Starts by itself. At 0:00 it rings a bell and calls onEnd (which opens the vote). startAt (ms) syncs devices to one clock.
function DayTimer({ minutes = 3, startAt = 0, onEnd, disabled = false, extra = null }) {
  const [left, setLeft] = useState(() => (startAt ? Math.max(0, minutes * 60 - Math.floor((Date.now() - startAt) / 1000)) : minutes * 60));
  const [on, setOn] = useState(!disabled);
  const prev = useRef(left);
  const endRef = useRef(onEnd); endRef.current = onEnd;
  useEffect(() => {
    if (!on) return;
    const t = setInterval(() => setLeft((v) => Math.max(0, v - 1)), 1000);
    return () => clearInterval(t);
  }, [on]);
  useEffect(() => {
    if (prev.current > 0 && left === 0) { Sfx.bell(); if (endRef.current) endRef.current(); }
    prev.current = left;
    if (left === 0) setOn(false);
  }, [left]);
  const mm = String(Math.floor(left / 60)).padStart(1, '0'), ss = String(left % 60).padStart(2, '0');

    <Panel className="relative text-center">

      <div className="text-[11px] font-bold uppercase tracking-[0.24em] text-slate-300">Discussion</div>
      <div className={`font-display mt-1 text-5xl font-black tabular-nums ${left === 0 ? 'hint-pulse text-red-300' : 'text-slate-50'}`} role="timer" aria-live="off">{mm}:{ss}</div>

        <button onClick={() => setOn(!on)} disabled={left === 0} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-100 disabled:opacity-40" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>{on ? 'Pause' : 'Resume'}</button>

        <button onClick={() => { setOn(false); setLeft(minutes * 60); }} className="min-h-[44px] flex-1 rounded-xl text-sm font-semibold text-slate-300" style={{ border: '1px solid var(--line)' }}>Reset</button>

function resolveNightPP(players, c0, night) {
  const has = hasV;
  const byId = new Map(players.map((p) => [p.id, p]));
  const shadowP = players.find((p) => p.alive && p.role === 'shadow');
  const c = applyShadow(c0, c0.shadow, shadowP ? shadowP.id : null); // the Shadow Figure's swap comes before anything resolves
  // Medusa's gaze lands first: whoever she stones loses their action for the night.
  const stoneId = has(c.medusa) && byId.get(c.medusa) && byId.get(c.medusa).alive ? c.medusa : null;
  const stoned = stoneId !== null ? byId.get(stoneId) : null;
  const blocked = (role) => !!stoned && stoned.role === role && !players.some((p) => p.alive && p.role === role && p.id !== stoneId); // a role with a free teammate still acts
  const victim = has(c.werewolf) && !blocked('werewolf') ? c.werewolf : null;
  const victim2 = has(c.werewolf2) && !blocked('werewolf') && c.werewolf2 !== victim ? c.werewolf2 : null; // Blood Moon: a second hunt target
  const guarded = has(c.bodyguard) && !blocked('bodyguard') ? c.bodyguard : null;
  const poison = has(c.witchPoison) && !blocked('witch') ? c.witchPoison : null;
  const witchSave = !!c.witchSave && !blocked('witch');
  const silenced = has(c.spellcaster) && !blocked('spellcaster') ? c.spellcaster : null;
  const saveTarget = witchSave ? (has(c.witchSaveTo) ? c.witchSaveTo : victim) : null;
  const protectedV = (v) => v === guarded || (saveTarget !== null && v === saveTarget);
  const saved = [victim, victim2].some((v) => v !== null && protectedV(v));
  const byGuard = [victim, victim2].some((v) => v !== null && v === guarded);
  const bySave = [victim, victim2].some((v) => v !== null && saveTarget !== null && v === saveTarget && v !== guarded);
  const savedBy = byGuard && bySave ? 'both' : bySave ? 'w' : 'g'; // who stopped the hunt: the Witch (w) or the Bodyguard (g)
  const dead = [];
  [victim, victim2].forEach((v) => { if (v !== null && !protectedV(v) && !dead.includes(v)) dead.push(v); }); // each hunt is blocked on its own
  if (poison !== null && !dead.includes(poison)) dead.push(poison); // the Bodyguard blocks hunts and bites, never the Witch's poison
  // Sniper: a shot taken at an infected player (Zombie or incubating) eliminates them unless guarded or healed this night.
  const shotP = has(c.sniper) && c.sniperShot && !blocked('sniper') ? byId.get(c.sniper) : null;
  const shotHit = shotP && shotP.alive && shotP.role === 'zombie' && shotP.id !== guarded && !(saveTarget !== null && shotP.id === saveTarget) ? shotP.id : null;
  if (shotHit !== null && !dead.includes(shotHit)) dead.push(shotHit);
  // Cupid's Lovers: when one dies from any cause the other dies of heartbreak (even if the Bodyguard guarded them).
  const pair = Array.isArray(c0.cupid) && c0.cupid.length === 2 ? c0.cupid : null;
  const partnerOf = (id) => { if (pair) { if (pair[0] === id) return pair[1]; if (pair[1] === id) return pair[0]; } const q = byId.get(id); return q && has(q.lover) ? q.lover : null; };
  const brokenIds = [];
  dead.slice().forEach((id) => { const pid = partnerOf(id); if (pid !== null && byId.get(pid) && byId.get(pid).alive && !dead.includes(pid)) { dead.push(pid); brokenIds.push(pid); } });
  // Doctor: cures a Zombie (back to the old role, or Villager if they began as a Zombie); anyone uninfected sleeps through the next night.
  const docT = has(c.doctor) && !blocked('doctor') ? c.doctor : null;
  const docP = docT !== null ? byId.get(docT) : null;
  const docLive = !!docP && docP.alive && !dead.includes(docT);
  const docCure = docLive && (docP.role === 'zombie' || docP.role === 'infector' || !!docP.bitten || !!docP.incub) ? docT : null;
  const sedateId = docLive && docCure === null ? docT : null;
  // Plague Doctor: the serum matches the target's real status (a Shadow redirect can waste it). Cure beats the bite; an infection is stopped by the Bodyguard or a Witch heal.
  const pdT = has(c.plaguedoctor) && !blocked('plaguedoctor') ? c.plaguedoctor : null;
  const pdAct = pdT !== null && (c.plagueAct === 'cure' || c.plagueAct === 'infect') ? c.plagueAct : null;

// Pass & Play: the narrator runs the whole night by voice. One device, passed to each role in turn.

    if (turned) {
      const key = NIGHT_ORDER.indexOf(turned.former) < 0 ? NIGHT_ORDER.indexOf('zombie') : NIGHT_ORDER.indexOf(turned.former);
      const strict = NIGHT_ORDER.indexOf(turned.former) >= 0; // no night power: wake just before the Zombie Horde

  }, []);

  useState(() => rollBg('night'));

  const ch = useRef({});
  const reveal = useSettings().revealDead;

  useEffect(() => () => Narrator.stop(), []);
  const after = (i) => (i + 1 < roles.length ? { k: 'call', i: i + 1 } : { k: 'dawnSay' });

  const morningP = useRef(null);
  useEffect(() => {
    let off = false;
    (async () => {
      if (st.k === 'title') {

        if (!off) setSt({ k: 'close' });

        for (let n = 5; n > 0; n--) { setCount(n); await wait(1000); if (off) return; }
        setSt(roles.length ? { k: 'call', i: 0 } : { k: 'dawnSay' });
      } else if (st.k === 'call') {
        await Narrator.say(`${roleLabel(roles[st.i])}, open your eyes.`);
        if (!off) setSt({ k: 'unlock', i: st.i });
      } else if (st.k === 'sleep') {
        await Narrator.say(`${roleLabel(roles[st.i])}, close your eyes.`);
        if (off) return;
        setSt({ k: 'dark', i: st.i });
      } else if (st.k === 'dark') {
        await wait(2600);
        if (!off) setSt(after(st.i));
      } else if (st.k === 'dawnSay') {
        const r = resolveNightPP(players, ch.current, night);
        await Narrator.say('Everyone, open your eyes. Morning has broken.');
        if (off) return;
        rollBg('day');
        setRes(r); setSpoken(true); setSt({ k: 'dawn' });
      } else if (st.k === 'dawn') {
        // the casualty screen is silent: players can read it themselves
      }
    })();
    return () => { off = true; };
  }, [st]);

  const actorOf = (role) => (role === 'infected' ? players.find((p) => p.alive && p.justTurned) : role === 'cured' ? players.find((p) => p.alive && p.justCured) : (players.find((p) => p.alive && !p.sedatedTag && p.role === (role === 'seerResult' ? 'seer' : role)) || players.find((p) => p.alive && p.role === (role === 'seerResult' ? 'seer' : role))));
  let body = null, dawn = false, shake = false, flash = false;

              <PickList players={opts((cands ? targets.filter((p) => cands.includes(p.id)) : targets).filter((p) => p.id !== voter.id))} value={pick === null ? '' : pick} onChange={(v) => setPick(v === '' ? null : v)} />
              <Btn className="mt-3" variant="secondary" onClick={() => setPick('skip')}>{pick === 'skip' ? 'Skip selected ✓' : 'Skip (no vote)'}</Btn>
              <Btn className="mt-3" disabled={pick === null} onClick={cast}>{pick === null ? 'Select a player or Skip' : pick === 'skip' ? 'Confirm Vote: Skip' : `Confirm Vote: ${nm(pick)}`}</Btn>
            </div>
          )}
        </div>
      )}
      {phase === 'vote' && (
        <div className="flex flex-1 flex-col">
          <p className="rounded-xl px-4 py-3 text-center text-sm leading-relaxed text-slate-100" style={{ background: 'rgba(21,26,36,0.85)', border: '1px solid rgba(251,191,36,0.4)' }}>
            Discuss and vote out loud together. Select the player with the most votes, or tap Skip Vote if the vote is tied.
          </p>
          <ul className="mt-3 flex flex-col gap-2" role="listbox" aria-label="Players still alive">
            {targets.map((p) => {
              const sel = pick === p.id;
              return (
                <li key={p.id}>
                  <button role="option" aria-selected={sel} onClick={() => setPick(sel ? null : p.id)}
                    className="flex min-h-[52px] w-full items-center justify-between gap-2 rounded-xl px-4 text-left text-[15px] font-semibold text-slate-50 transition active:scale-[0.99]"
                    style={{ background: sel ? 'rgba(109,40,217,0.45)' : 'rgba(21,26,36,0.85)', border: `${sel ? 2 : 1}px solid ${sel ? '#C4B5FD' : 'var(--line)'}`, boxShadow: sel ? '0 0 18px -4px rgba(167,139,250,0.7)' : 'none' }}>
                    <span>{p.name}</span>
                    <span className="flex items-center gap-2">{p.silencedTag && <SilencedBadge />}{sel && <span aria-hidden="true" className="text-lg">✓</span>}</span>
                  </button>
                </li>
              );
            })}
          </ul>
          <Btn className="mt-4" disabled={pick === null} onClick={eliminate}>{pick === null ? 'Select a player' : `Confirm Elimination: ${nm(pick)}`}</Btn>
          <Btn className="mt-2.5" variant="secondary" onClick={skipVote}>Skip Vote (Tie / No Elimination)</Btn>
        </div>
      )}
      {phase === 'result' && res && (
        <>
          <Panel className="text-center" style={{ border: '1px solid rgba(251,191,36,0.4)', background: 'rgba(21,26,36,0.85)' }}>
            <p className="font-display text-xl font-bold text-slate-50">{out ? `${out.name} was voted out by the village.` : res.tie ? 'The vote is tied. No one is eliminated yet.' : 'The vote was skipped. No one is eliminated.'}</p>
            {false && <ul className="mt-3 flex flex-col gap-1 text-sm text-slate-200">{res.ranked.map((id) => <li key={id} className="flex justify-between"><span>{nm(id)}</span><span className="tabular-nums text-slate-400">{res.tally[id]}</span></li>)}</ul>}
            {out && reveal && <div className="mt-3"><NightCard player={out} line={`${out.name} was the ${ROLES_DATA[out.role].name}`} /></div>}
            {out && broken.map((b) => <p key={b.id} className="font-display mt-3 text-lg font-bold text-pink-300">{`${b.name} died of heartbreak.`}</p>)}
          </Panel>
          {over && <p role="status" className="mt-3 rounded-xl px-4 py-3 text-center text-sm font-bold" style={{ color: over.color, background: 'rgba(10,10,18,0.8)', border: `1px solid ${over.color}66` }}>{over.text}</p>}
          {hunter && (
            <Panel className="mt-3" style={{ border: '1px solid rgba(245,158,11,0.6)', background: 'rgba(21,26,36,0.85)' }}>
              <h3 className="font-display text-lg font-bold text-amber-300">{hunter.name}, take your last shot</h3>
              <p className="mb-3 mt-1 text-xs text-slate-300">The Hunter chooses one player to take down.</p>
              <PickList players={opts(players.filter((p) => p.alive))} value={shot === null ? '' : shot} onChange={(v) => setShot(v === '' ? null : v)} />
              <Btn className="mt-3" disabled={shot === null} onClick={fire}>Fire</Btn>
            </Panel>
          )}
        </>
      )}
      {roles && (
        <Panel className="mt-3" style={{ background: 'rgba(21,26,36,0.88)' }}>
          <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Every role</h2>
          <ul className="flex flex-col gap-2">
            {players.map((p) => { const r = ROLES_DATA[p.role]; return (
              <li key={p.id} className="flex items-center gap-3 rounded-lg p-2" style={{ background: r.color + '14', border: `1px solid ${r.color}55` }}>
                <RoleEmblem role={p.role} size={24} />
                <span className={`min-w-0 flex-1 truncate text-[15px] font-semibold ${p.alive ? '' : 'line-through'}`}>{p.name}</span>
                <span className="font-display text-sm font-bold" style={{ color: r.color }}>{r.name}</span>
              </li>
            ); })}
          </ul>
        </Panel>
      )}
      <div className="mt-auto flex flex-col gap-2.5 pt-6">
        {phase === 'talk' && !over && <Btn onClick={startVote}>Start Voting</Btn>}
        {over && phase !== 'vote' && <>
          <Btn variant="secondary" disabled={!!hunter} onClick={() => setRoles(!roles)}>{roles ? 'Hide All Roles' : 'Reveal All Roles'}</Btn>
          <Btn disabled={!!hunter} onClick={onAgain}>Play Again</Btn>
          <Btn variant="ghost" disabled={!!hunter} onClick={onHome}>Home</Btn>
        </>}
        {!over && phase === 'result' && res && res.tie && <Btn variant="secondary" onClick={() => startVote(res.tied)}>Revote (tied players)</Btn>}
        {!over && phase === 'result' && res && res.tie && <Btn variant="ghost" onClick={() => setRes({ ...res, tie: false, skipped: true })}>Skip (no elimination)</Btn>}
        {!over && phase === 'result' && !(res && res.tie) && <Btn disabled={!!hunter} onClick={onNight}>Start Night {night + 1}</Btn>}
      </div>
    </DayStage>
  );
}

// Human-moderator tool: record which two players Cupid bound.
function LoversPanel({ players, onBind }) {
  const [a, setA] = useState('');
  const [b, setB] = useState('');
  const cur = players.find((p) => hasV(p.lover));
  const curB = cur ? players.find((p) => p.id === cur.lover) : null;
  const sel = (v, set, label) => (
    <select aria-label={label} value={v} onChange={(e) => set(e.target.value === '' ? '' : Number(e.target.value))} className="min-h-[44px] flex-1 rounded-lg px-2 text-sm text-slate-100" style={{ background: 'var(--card-2)', border: '1px solid var(--line)' }}>
      <option value="">{label}</option>
      {players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
    </select>
  );
  return (
    <section className="mt-5 rounded-2xl p-4" style={{ background: 'var(--card)', border: '1px solid rgba(244,114,182,0.4)' }}>
      <h2 className="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-pink-300"><HeartIcon width="14" height="14" />Cupid&rsquo;s Lovers</h2>
      {cur && curB && <p className="mt-2 text-sm text-slate-200">{cur.name} &hearts; {curB.name}. If one dies, the other dies of heartbreak.</p>}
      <div className="mt-3 flex gap-2">{sel(a, setA, 'First Lover')}{sel(b, setB, 'Second Lover')}</div>
      <Btn className="mt-3" variant="secondary" disabled={a === '' || b === '' || a === b} onClick={() => { onBind(a, b); setA(''); setB(''); }}>{cur ? 'Change Lovers' : 'Bind Lovers'}</Btn>
    </section>
  );
}

function Moderator({ players, setPlayers, narrator, autoNight, onAgain, onNew, onHome }) {
  const [peek, setPeek] = useState(false); // Grimoire overlay during a running night or day
  const [warn, setWarn] = useState(false);
  const [mode, setMode] = useState(autoNight ? 'night' : 'grimoire'); // grimoire | night | day
  const [night, setNight] = useState(() => players.reduce((m, p) => Math.max(m, p.nn || 0), 0) + 1);
  const [info, setInfo] = useState(null);
  // Dusk: tags wear off, and anyone bitten the night before turns into a Zombie (nn = the night that is about to start).
  const clearSilence = (nn) => {
    const conv = (p) => !!nn && p.alive && ((p.bitten && !p.incub && p.bitten < nn) || p.incub === 1); // slow bites count down 2 -> 1 -> turn
    const tick = (p) => !!nn && p.alive && p.incub === 2;
    if (players.some((p) => p.silencedTag || p.stoneTag || p.shotTag || conv(p) || tick(p))) setPlayers(players.map((p) => ({ ...p, silencedTag: false, stoneTag: false, shotTag: false, ...(conv(p) ? { role: 'zombie', former: p.role, bitten: 0, incub: 0, justTurned: true } : tick(p) ? { incub: 1 } : {}) })));
  };
  useEffect(() => { if (autoNight) clearSilence(); }, []);
  const [checked, setChecked] = useState({});
  const [confirmExit, setConfirmExit] = useState(false);
  const [confirm, setConfirm] = useState(null); // 'again' | 'new' | null

  useEffect(() => {
    if (!confirm) return;
    const t = setTimeout(() => setConfirm(null), 3500);
    return () => clearTimeout(t);
  }, [confirm]);

  const update = (id, patch) => setPlayers(players.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  // Eliminating a Lover also eliminates their partner (heartbreak).
  const toggleAlive = (p) => {
    if (!p.alive) return update(p.id, { alive: true });
    const partner = hasV(p.lover) ? players.find((x) => x.id === p.lover && x.alive) : null;
    setPlayers(players.map((x) => (x.id === p.id || (partner && x.id === partner.id) ? { ...x, alive: false, protectedTag: false, silencedTag: false, stoneTag: false } : x)));
  };
  const bind = (a, b) => setPlayers(players.map((x) => (x.id === a ? { ...x, lover: b } : x.id === b ? { ...x, lover: a } : { ...x, lover: null })));

  const wolvesAlive = players.filter((p) => p.alive && p.role === 'werewolf').length;
  const evilAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'werewolf').length;
  const villageAlive = players.filter((p) => p.alive && ROLES_DATA[p.role].team === 'village').length;

  const nightRoles = useMemo(() => {
    const present = ROLE_IDS.filter((id) => ROLES_DATA[id].nightOrder && players.some((p) => p.role === id));
    return present.sort((a, b) => ROLES_DATA[a].nightOrder - ROLES_DATA[b].nightOrder);
  }, [players]);
  const hasHunter = players.some((p) => p.role === 'hunter');

  let status = null;
  if (loversFaction(players)) status = { text: 'The Lovers win! Only the bound pair is left.', color: '#F472B6' };
  else {
    const tw3 = threeWay(players.map((p) => ({ role: p.role, alive: p.alive, side: pdSide(p.pdCures, p.pdInfects, p.pdLast) })));
    if (tw3 === 'village') status = { text: 'No Werewolves left. The Village wins.', color: '#34D399' };
    else if (tw3 === 'werewolf') status = { text: 'Werewolves outnumber the Village, or it is one against one.', color: '#F87171' };
    else if (tw3 === 'zombie') status = { text: 'The Zombie horde holds the majority. The Zombies win.', color: '#2DD4BF' };
  }

  const body = (mode === 'night') ? (
    <NightLoopPP key={night} players={players} night={night}
      onExit={() => setMode('grimoire')}
      onFinish={(r) => { setPlayers(r.next); setInfo(r); setMode('day'); }} />
  ) : (mode === 'day') ? (
    <DayTrial players={players} setPlayers={setPlayers} night={night} info={info}
      onAgain={onAgain} onHome={() => { setPeek(false); onHome(); }}
      onNight={() => { clearSilence(night + 1); setNight(night + 1); setInfo(null); setMode('night'); }} />
  ) : null;
  if (body) {
    return (
      <>
        {body}
        <button onClick={() => setWarn(true)} aria-label="Open Grimoire"
          className="fixed right-3 z-[45] flex h-10 w-10 items-center justify-center rounded-full text-slate-300/80 hover:text-slate-100"
          style={{ top: 'max(14px, env(safe-area-inset-top))', background: 'rgba(10,10,18,0.55)', border: '1px solid rgba(203,213,225,0.25)' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z" /><path d="M4 21.5A2.5 2.5 0 0 0 6.5 24" opacity="0" /><circle cx="11.5" cy="10.5" r="2.2" /><path d="M7.5 10.5c1.2-2 2.7-3 4-3s2.8 1 4 3c-1.2 2-2.7 3-4 3s-2.8-1-4-3z" /></svg>
        </button>
        {warn && ReactDOM.createPortal(
          <div className="fixed inset-0 z-[60] flex items-end justify-center sm:items-center" role="alertdialog" aria-modal="true" aria-label="Spoiler Warning">
            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setWarn(false)} />
            <div className="screen-in relative w-full max-w-md rounded-t-3xl p-6 text-center sm:rounded-3xl"
              style={{ background: 'var(--card)', border: '1px solid var(--line)', paddingBottom: 'max(24px, env(safe-area-inset-bottom))' }}>
              <h2 className="font-display text-2xl font-bold text-amber-300">Spoiler Warning</h2>
              <p className="mt-3 text-sm leading-relaxed text-slate-300">Opening the Grimoire reveals every player&rsquo;s secret role.{narrator ? ' The Narrator is running the game, so you may not need it.' : ''}</p>
              <div className="mt-6 flex flex-col gap-3">
                <Btn variant="secondary" onClick={() => setWarn(false)}>Cancel</Btn>
                <HoldButton aria="Press and hold for one and a half seconds to open the Grimoire" onComplete={() => { setWarn(false); setPeek(true); }}>Press &amp; Hold to View</HoldButton>
              </div>
            </div>
          </div>, document.body)}
        {peek && (
          <div className="fixed inset-0 z-[55] overflow-y-auto" style={{ background: 'var(--bg)' }}>
            {GrimoireView()}
          </div>
        )}
      </>
    );
  }
  return GrimoireView();

  function GrimoireView() { return (
    <Screen wide>
      <header className="flex items-start justify-between gap-3 pb-4">
        <div>
          <h1 className="font-display text-3xl font-bold tracking-wide">Grimoire</h1>
          <p className="text-sm text-slate-400">Moderator view. Keep the screen turned away from players.</p>
        </div>
        <div className="flex shrink-0 gap-2">
          {peek && <button onClick={() => setPeek(false)} className="min-h-[44px] rounded-xl px-3.5 text-sm font-semibold text-slate-50"
            style={{ background: 'rgba(109,40,217,0.45)', border: '1px solid #C4B5FD' }}>Back to Game</button>}
          <button onClick={() => setConfirmExit(true)} className="min-h-[44px] rounded-xl px-3.5 text-sm font-semibold text-slate-200 hover:bg-white/5"
            style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>Exit</button>
        </div>
      </header>

      {/* Tally */}
      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-xl p-3" style={{ background: '#DC262614', border: '1px solid #DC262655' }}>
          <div className="text-[11px] font-semibold uppercase tracking-wider text-red-300">Werewolves alive</div>
          <div className="font-display text-3xl font-bold tabular-nums text-red-400">{wolvesAlive}</div>
        </div>
        <div className="rounded-xl p-3" style={{ background: '#34D39912', border: '1px solid #34D39955' }}>
          <div className="text-[11px] font-semibold uppercase tracking-wider text-emerald-300">Village alive</div>
          <div className="font-display text-3xl font-bold tabular-nums text-emerald-400">{villageAlive}</div>
        </div>
      </div>
      {status && (
        <p role="status" className="mt-3 rounded-xl px-4 py-3 text-sm font-medium" style={{ color: status.color, background: status.color + '18', border: `1px solid ${status.color}55` }}>
          {status.text}
        </p>
      )}

      {players.some((p) => p.role === 'cupid') && <LoversPanel players={players} onBind={bind} />}

      {/* Roster */}
      <section className="mt-5">
        <h2 className="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Player Roster</h2>
        <ul className="flex flex-col gap-2 md:grid md:grid-cols-2 md:items-start md:gap-3">
          {players.map((p) => {
            const r = ROLES_DATA[p.role];
            return (
              <li key={p.id} className="rounded-xl p-3 transition-opacity"
                style={{ background: 'var(--card)', border: `1px solid ${p.alive ? r.color + '55' : 'var(--line)'}`, opacity: p.alive ? 1 : 0.55 }}>
                <div className="flex items-center gap-3">
                  <div className="relative h-14 w-[42px] shrink-0 overflow-hidden rounded-md" style={{ border: `1px solid ${r.color}88` }}>
                    <PlayingCard role={p.role} />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className={`truncate text-[15px] font-semibold ${p.alive ? '' : 'line-through'}`}>{p.name}</div>
                    <div className="flex items-center gap-2">
                      <span className="font-display text-sm font-bold" style={{ color: r.color }}>{r.name}</span>
                      <TeamBadge team={r.team} />
                      {hasV(p.lover) && <span className="flex items-center gap-1 text-[11px] font-bold text-pink-300"><HeartIcon width="12" height="12" />{(players.find((x) => x.id === p.lover) || {}).name}</span>}
                    </div>
                  </div>
                  <button onClick={() => toggleAlive(p)}
                    aria-pressed={!p.alive}
                    aria-label={`${p.name} is ${p.alive ? 'alive. Mark as eliminated' : 'eliminated. Mark as alive'}`}
                    className="min-h-[44px] shrink-0 rounded-lg px-3 text-xs font-bold uppercase tracking-wider"
                    style={p.alive
                      ? { color: '#34D399', background: '#34D3991A', border: '1px solid #34D39966' }
                      : { color: '#F87171', background: '#DC26261A', border: '1px solid #DC262677' }}>
                    {p.alive ? 'Alive' : 'Eliminated'}
                  </button>
                </div>
                {p.alive && (
                  <div className="mt-2.5 flex gap-2 pl-14">
                    <StatusChip color="#34D399" active={p.protectedTag} onClick={() => update(p.id, { protectedTag: !p.protectedTag })}>Protected</StatusChip>
                    <StatusChip color="#818CF8" active={p.silencedTag} onClick={() => update(p.id, { silencedTag: !p.silencedTag })}>Silenced</StatusChip>
                    <StatusChip color="#2DD4BF" active={p.stoneTag} onClick={() => update(p.id, { stoneTag: !p.stoneTag })}>Stoned</StatusChip>
                  </div>
                )}
                {p.role === 'hunter' && !p.alive && (
                  <p className="mt-2 pl-14 text-xs text-amber-400">The Hunter chooses one player to take down now.</p>
                )}
              </li>
            );
          })}
        </ul>
      </section>

      {narrator && <NightStartCard night={night} over={!!status} onStart={() => { clearSilence(night); setInfo(null); setMode('night'); }} />}

      {/* Night guide */}
      <section className="mt-6 rounded-2xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
        <div className="flex items-center justify-between">
          <h2 className="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Night Wake-Up Order</h2>
          <button onClick={() => setChecked({})} className="min-h-[36px] rounded-lg px-2 text-xs font-semibold text-slate-400 hover:text-slate-200">Reset night</button>
        </div>
        <ol className="mt-3 flex flex-col gap-2">
          {nightRoles.map((id, i) => {
            const r = ROLES_DATA[id];
            const holders = players.filter((p) => p.role === id);
            const done = !!checked[id];
            return (
              <li key={id}>
                <button onClick={() => setChecked({ ...checked, [id]: !done })} aria-pressed={done}
                  className="flex w-full items-start gap-3 rounded-xl p-3 text-left"
                  style={{ background: done ? 'transparent' : 'var(--card-2)', border: `1px solid ${done ? 'var(--line)' : r.color + '55'}`, opacity: done ? 0.55 : 1 }}>
                  <span className="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-md text-xs font-bold"
                    style={done ? { background: r.color, color: '#0B0E14' } : { border: `1.5px solid ${r.color}`, color: r.color }}>
                    {done ? '✓' : i + 1}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className={`font-display block text-[15px] font-bold ${done ? 'line-through' : ''}`} style={{ color: r.color }}>
                      {id === 'werewolf' ? 'Werewolves' : r.name}
                    </span>
                    <span className="block text-sm leading-snug text-slate-300">{r.nightPrompt}</span>
                    <span className="mt-1 block text-xs text-slate-500">
                      {holders.map((h, k) => (
                        <span key={h.id} className={h.alive ? '' : 'line-through'}>{k > 0 ? ', ' : ''}{h.name}</span>
                      ))}
                    </span>
                  </span>
                </button>
              </li>
            );
          })}
        </ol>
        {nightRoles.length === 0 && <p className="mt-3 text-sm text-slate-400">No night roles in this deck.</p>}
        {hasHunter && <p className="mt-3 text-xs text-slate-500">The Hunter has no night action. Watch for their elimination during the day.</p>}
      </section>

      <div className="mt-6 flex flex-col gap-3">
        <Btn variant="secondary" onClick={() => (confirm === 'again' ? onAgain() : setConfirm('again'))}>
          {confirm === 'again' ? 'Tap again to re-deal' : 'Play Again (Same Setup)'}
        </Btn>
        <Btn variant="ghost" onClick={() => (confirm === 'new' ? onNew() : setConfirm('new'))}>
          {confirm === 'new' ? 'Tap again to start over' : 'New Game'}
        </Btn>
      </div>
      {confirmExit && (
        <ConfirmExit title="Exit game and return Home?" body="The current match ends and you go back to the Home screen."
          confirmLabel="Exit to Home" cancelLabel="Stay"
          onCancel={() => setConfirmExit(false)} onConfirm={() => { setConfirmExit(false); setPeek(false); onHome(); }} />
      )}
    </Screen>
  ); }
}

const STORE_KEY = 'nightfall.games.v1';
/* ------------------------------------------------------------------ */
/* Multi-Device: Firebase Realtime Database over plain REST + room logic */
/* ------------------------------------------------------------------ */
// Room shape (kept tiny so it syncs fast on mobile data):
//  { v, host, hp, rn room name, hn host label, ph, k, lk, w, an, pl }
//  ph: lobby | reveal | night | day | over     k: night number     lk: 1 while the host picks cards
//  w: winner ('village' | 'werewolf')          hp: 1 when the host also plays
//  an: { k, l:{0:'text'}, sv, si, x:{ts:'text'} }   morning announcement
//  pl[pid]: { n name, o join order, r roleId, a alive 1/0, d ready 1/0, t night target pid, nd night action done,
//             ws witch save this night, wsu / wpu potion used, lp bodyguard (or Medusa) last target, hs hunter shot used, s silenced, x stoned until dusk, sa Shadow Figure's chosen action, lv Lovers partner pid, t2 Cupid's second pick, la Lover has seen their partner, rd Seer saw the final vision, lf left }
const SESSION_KEY = 'nightfall.mp.v1';
const MP_ACTIVE = ['werewolf', 'seer', 'cupid', 'medusa', 'bodyguard', 'witch', 'sniper', 'doctor', 'plaguedoctor', 'spellcaster', 'zombie', 'infector', 'shadow'];

const Mp = {

    finally { clearTimeout(timer); }

const randId = () => 'p' + Math.random().toString(36).slice(2, 8);
const randLetters = () => Array.from({ length: 4 }, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');

// Try the real server first; if the browser blocks the network, redo the same step against the local stand-in.
async function mpWithFallback(fn) {

async function mpCreateRoomImpl(name, hostPlays, roomName, isPublic, cfg) {
  const pid = randId();
  let code = '';
  const words = shuffle(CODE_WORDS);
  for (let i = 0; i < 12; i++) {
    const c = i < words.length ? words[i] : randLetters();
    const existing = await Mp.get(`rooms/${c}`);
    if (!existing) { code = c; break; }
  }
  if (!code) throw new Error('no-code');
  const room = { v: 1, host: pid, hp: hostPlays ? 1 : 0, rn: (roomName || '').trim() || 'Nightfall Village', hn: hostPlays ? name : 'Moderator', md: getGameMode(), ph: 'lobby', k: 0, lk: 0, w: '', ts: Date.now(), pub: isPublic ? 1 : 0, st: 'waiting' };
  if (cfg && cfg.nightStyle) room.nightStyle = cfg.nightStyle; // eyes_closed | eyes_open
  if (cfg && cfg.mx) { room.mx = cfg.mx; room.dk = cfg.dk; } // the deck is built first: mx = exact player count, dk = the locked deck // pub: listed publicly; st: waiting | in_game | closed
  if (hostPlays) room.pl = { [pid]: { n: name, o: 1, a: 1, d: 0 } };
  await Mp.put(`rooms/${code}`, room);
  if (isPublic) { try { await Mp.put(`publicRooms/${code}`, { rn: room.rn, hn: room.hn, ts: room.ts }); } catch (e) { /* the room still works with its code */ } } // small index so the public list needs one read
  return { code, pid, host: true, local: Mp.local };
}

async function mpJoinRoomImpl(codeIn, name) {
  const code = cleanCode(codeIn);
  if (code.length !== 4) throw new Error('bad-code');
  const room = await Mp.get(`rooms/${code}`);
  if (!room) throw new Error('not-found');
  if (room.ph !== 'lobby') throw new Error('started');
  if (room.lk) throw new Error('locked');
  const pl = roomPlayers(room);
  if (pl.length >= (room.mx || MP_MAX)) throw new Error('full');
  if (pl.some((p) => p.n.toLowerCase() === name.toLowerCase())) throw new Error('name-taken');
  const pid = randId();
  const o = pl.reduce((m, p) => Math.max(m, p.o || 0), 0) + 1;
  await Mp.patch(`rooms/${code}/pl/${pid}`, { n: name, o, a: 1, d: 0 });
  return { code, pid, host: false, local: Mp.local };
}
function mpJoinErrorText(e) {

    'not-found': 'No room with that code. Check the letters and try again.',
    started: 'That game has already started.',
    locked: 'The host is choosing cards, so the room is closed to new players.',

// Works out the night from everyone's secret choices and returns the patch that opens the day.

function copyText(text) {

// Polls the room every second and cleans up when the screen goes away.

    if (busy.current) { again.current = true; return; }

      const r = await Mp.get(`rooms/${code}`);
      if (live.current) { setRoom(r); setErr(''); }
    } catch (e) { if (live.current) setErr(mpErrorText(e)); }
    busy.current = false;
    if (again.current && live.current) { again.current = false; refresh(); }

    live.current = true;
    refresh();

    const vis = () => { if (!document.hidden) refresh(); };
    document.addEventListener('visibilitychange', vis);
    window.addEventListener('focus', vis); window.addEventListener('pageshow', vis); window.addEventListener('online', vis);
    return () => { live.current = false; clearInterval(t); document.removeEventListener('visibilitychange', vis); window.removeEventListener('focus', vis); window.removeEventListener('pageshow', vis); window.removeEventListener('online', vis); };
  }, [refresh]);
  return { room, err, refresh };
}

// Live list of open public rooms (polled every 3 seconds). Only rooms that are still waiting in the lobby are shown.
function MpPublicRooms({ onPick }) {
  const [rooms, setRooms] = useState(null);
  const [fMode, setFMode] = useState('all'); // all | Classic | Outbreak
  const [minP, setMinP] = useState(0); // only rooms built for at least this many players
  const [menu, setMenu] = useState(false);
  useEffect(() => {
    let live = true;
    const load = async () => {
      try {
        const idx = (await Mp.get('publicRooms')) || {};
        const codes = Object.keys(idx).slice(0, 20);
        const rows = await Promise.all(codes.map(async (c) => {
          const r = await Mp.get(`rooms/${c}`);
          if (!r || Date.now() - (idx[c].ts || 0) > 3 * 3600 * 1000) { try { await Mp.del(`publicRooms/${c}`); } catch (e) { /* ignore */ } return null; } // closed or abandoned
          if (!r.pub || r.st !== 'waiting' || r.ph !== 'lobby' || r.lk) return null;
          return { code: c, rn: r.rn, hn: r.hn, md: r.md === 'outbreak' ? 'Outbreak' : 'Classic', n: roomPlayers(r).length, mx: r.mx || MP_MAX };
        }));
        if (live) setRooms(rows.filter(Boolean));
      } catch (e) { if (live) setRooms((x) => x || []); }
    };
    load();
    const t = setInterval(() => { if (!document.hidden) load(); }, 3000);
    return () => { live = false; clearInterval(t); };
  }, []);
  const shown = (rooms || []).filter((r) => (fMode === 'all' || r.md === fMode) && r.mx >= minP);
  return (
    <section aria-label="Public rooms" className="mt-2">
      <div className="relative mb-2 flex items-center justify-between gap-2">
        <h2 className="font-display text-sm font-bold uppercase tracking-[0.2em] text-slate-300">Public Rooms</h2>
        <div className="flex items-center gap-2">
          <div role="radiogroup" aria-label="Filter by mode" className="flex overflow-hidden rounded-full text-[11px] font-bold uppercase tracking-wide" style={{ border: '1px solid rgba(167,139,250,0.5)' }}>
            {[['all', 'All'], ['Classic', 'Classic'], ['Outbreak', 'Outbreak']].map(([v, t]) => (
              <button key={v} role="radio" aria-checked={fMode === v} onClick={() => setFMode(v)} className="min-h-[32px] px-2.5"
                style={{ background: fMode === v ? 'rgba(109,40,217,0.6)' : 'transparent', color: fMode === v ? '#F5F3FF' : '#94A3B8' }}>{t}</button>))}
          </div>
          <button aria-label="Filter by number of players" aria-expanded={menu} onClick={() => setMenu(!menu)} className="flex h-8 items-center gap-1 rounded-full px-2.5 text-[11px] font-bold text-violet-100"
            style={{ background: minP ? 'rgba(109,40,217,0.6)' : 'transparent', border: '1px solid rgba(167,139,250,0.5)' }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" aria-hidden="true"><path d="M4 7 H20 M7 12 H17 M10 17 H14" /></svg>{minP ? `${minP}+` : ''}
          </button>
        </div>
        {menu && (
          <div role="menu" className="absolute right-0 top-9 z-20 w-40 rounded-xl p-1.5" style={{ background: 'var(--card)', border: '1px solid rgba(139,92,246,0.55)', boxShadow: '0 12px 30px -8px rgba(0,0,0,0.8)' }}>
            <div className="px-2 pb-1 pt-0.5 text-[10px] font-bold uppercase tracking-widest text-slate-400">Players in room</div>
            {[0, 6, 8, 10, 12, 15].map((n) => (
              <button key={n} role="menuitemradio" aria-checked={minP === n} onClick={() => { setMinP(n); setMenu(false); }} className="flex min-h-[38px] w-full items-center justify-between rounded-lg px-2.5 text-sm font-semibold text-slate-100 hover:bg-white/10">
                {n === 0 ? 'Any size' : `${n}+ players`}{minP === n && <span aria-hidden="true">✓</span>}
              </button>))}
          </div>
        )}
      </div>
      {rooms === null ? <p className="hint-pulse py-4 text-center text-sm text-slate-400">Looking for rooms...</p>
        : shown.length === 0 ? <p className="py-4 text-center text-sm text-slate-500">{rooms.length ? 'No public rooms match these filters.' : 'No public rooms open right now.'}</p>
        : <ul className="flex flex-col gap-2.5">{shown.map((r) => { const full = r.n >= r.mx; return (
          <li key={r.code} className="flex items-center gap-3 rounded-2xl p-3.5" style={{ background: 'rgba(21,26,36,0.92)', border: '1px solid rgba(139,92,246,0.45)' }}>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2"><span className="truncate text-[15px] font-bold text-slate-50">{r.rn}</span><span className="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-black uppercase tracking-wider" style={r.md === 'Outbreak' ? { color: '#6EE7B7', background: 'rgba(16,185,129,0.18)', border: '1px solid rgba(52,211,153,0.6)' } : { color: '#C7D2FE', background: 'rgba(99,102,241,0.2)', border: '1px solid rgba(165,180,252,0.6)' }}>{r.md}</span></div>
              <div className="mt-0.5 truncate text-xs text-slate-400"><span className="font-bold tracking-widest text-violet-300">{r.code}</span> · Host: {r.hn}</div>
              <div className="mt-0.5 text-xs font-semibold tabular-nums text-slate-300">{r.n} / {r.mx} players</div>
            </div>
            <button disabled={full} onClick={() => onPick(r.code)} className="min-h-[44px] rounded-xl px-5 text-sm font-bold text-white disabled:opacity-40" style={{ background: full ? '#334155' : 'linear-gradient(180deg, #7C3AED, #5B21B6)' }}>{full ? 'Full' : 'Join'}</button>
          </li>); })}</ul>}
    </section>
  );
}
